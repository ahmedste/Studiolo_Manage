<title>Studiolo Commonplace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: Studiolo's Library shell (rail + stage). One stage, two arrangements of the same records: a masonry wall and shelves by collection. Tokens are Studiolo's own (src/styles/tokens.css). */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --s1: #c9d4f1; --s2: #6e86d0; --on-s2: #0f1a3d;
  --accent: #1e3e9e; --accent-soft: #e6ebf8; --on-accent: #ffffff;
  --quote-paper: #faf8f2; --quote-rule: #eae5d9; --note-paper: #faf9f5;
  --cover: #202e38; --cover-ink: #edeff6; --shelf: #22303a;
  --scrim: rgba(34, 48, 58, 0.28);
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, 0.07), 0 8px 22px rgba(34, 48, 58, 0.09);
  --shadow-lift: 0 2px 4px rgba(34, 48, 58, 0.08), 0 16px 36px rgba(34, 48, 58, 0.15);
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --s1: #34447a; --s2: #7189d8; --on-s2: #0f1a3d;
  --accent: #9db0f3; --accent-soft: #263156; --on-accent: #131a20;
  --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
  --cover: #0e151b; --cover-ink: #edeff6; --shelf: #6b7984;
  --scrim: rgba(0, 0, 0, 0.5);
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, 0.32), 0 8px 22px rgba(0, 0, 0, 0.26);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.34), 0 16px 36px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --s1: #34447a; --s2: #7189d8; --on-s2: #0f1a3d;
  --accent: #9db0f3; --accent-soft: #263156; --on-accent: #131a20;
  --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
  --cover: #0e151b; --cover-ink: #edeff6; --shelf: #6b7984;
  --scrim: rgba(0, 0, 0, 0.5);
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, 0.32), 0 8px 22px rgba(0, 0, 0, 0.26);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.34), 0 16px 36px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 14px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Shell */
.app { display: flex; min-height: 100vh; }
.rail { flex: none; width: 58px; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.rail .mark { width: 30px; height: 30px; border-radius: 7px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--read); font-size: 17px; margin-bottom: 18px; }
.rail .ri { width: 44px; height: 40px; display: grid; place-items: center; color: var(--ink-2); border-radius: 8px; }
.rail .ri.on { background: var(--panel); box-shadow: 0 0 0 1px var(--line); color: var(--ink); }
.rail .ri.cap { color: var(--accent); }
.rail .foot { margin-top: auto; }
.stage { flex: 1 1 auto; min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 30px 120px; padding-inline: 28px; }

.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.crumb .here { color: var(--ink); }
.crumb .area { color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
.tabs button { padding: 10px 12px; color: var(--ink-2); }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 500; box-shadow: inset 0 -2px 0 var(--accent); }

.tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; margin-top: 20px; }
.search { flex: 1 1 380px; min-width: 0; max-width: 680px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; font-family: var(--read); font-size: 25px; color: var(--ink); background: none; border: 0; outline: none; padding: 6px 0 8px; }
.search input::placeholder { color: var(--ink-3); }
.tools-r { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.count { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--board); }
.seg button { height: 34px; padding: 0 12px; border-radius: 6px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(34, 48, 58, 0.08); font-weight: 500; }

.row2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-top: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; font-size: 13.5px; }
.chips button { padding: 6px 10px; border-radius: 4px; color: var(--ink-2); }
.chips button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.bays { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.bays a { padding: 6px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); color: var(--ink); text-decoration: none; }
.bays a span { color: var(--ink-2); }
.bays a.lpill { box-shadow: none; border: 1px dashed var(--ink-3); background: none; color: var(--ink-2); }
.sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.sort select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }

#banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.banner { margin-top: 16px; box-shadow: 0 0 0 4px var(--paper); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 13.5px; }
.banner b { color: var(--accent); font-weight: 600; }
.banner span { color: var(--ink-2); }
.banner button { margin-left: auto; color: var(--accent); font-size: 13px; padding: 4px 0; }

/* Wall */
.mason { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); grid-auto-rows: 8px; column-gap: 20px; row-gap: 12px; align-items: start; margin-top: 18px; }
.card { display: block; width: 100%; min-width: 0; color: var(--ink); }
.card .ci { display: block; transition: transform 130ms var(--ease), box-shadow 130ms var(--ease); }
.card:hover .ci { transform: translateY(-2px); }
.paper { display: flex; flex-direction: column; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); border-radius: 2px; }
.paper .pb { padding: 14px 15px 12px; display: block; }
.paper .ft { display: flex; align-items: center; gap: 6px; padding: 8px 15px 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-2); }
.tp { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); }
.tp i, .paper .ft i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); flex: none; }
.kick { display: block; font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 5px; }
.ttl { display: block; font-size: 14px; font-weight: 500; line-height: 1.35; }
.meta { display: block; font-size: 12px; color: var(--ink-2); margin-top: 3px; line-height: 1.4; }
.note-c { background: var(--note-paper); border-left: 3px solid var(--s2); }
.note-c .nt { display: block; font-family: var(--read); font-size: 16px; line-height: 1.45; }
.quote-c { background: var(--quote-paper); box-shadow: inset 0 0 0 1px var(--quote-rule); border-radius: 3px; position: relative; }
.quote-c .qt { display: block; font-family: var(--read); font-style: italic; font-size: 19px; line-height: 1.35; padding: 18px 34px 12px 18px; }
.quote-c .qa { display: block; margin: 0 18px; padding: 8px 0 10px; border-top: 1px solid var(--quote-rule); font-size: 12px; color: var(--ink-2); }
.quote-c::after { content: "\201C"; position: absolute; right: 12px; top: 2px; font-family: var(--read); font-size: 40px; color: var(--quote-rule); }
.cover { display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 2 / 3; max-width: 100%; padding: 22px 20px 18px; border-radius: 6px; background: var(--cover); color: var(--cover-ink); box-shadow: inset 4px 0 0 rgba(255, 255, 255, 0.11), inset 6px 0 2px rgba(0, 0, 0, 0.38), var(--shadow-pic); }
.cover .cvt { font-family: var(--read); font-size: 21px; line-height: 1.22; }
.cover .cvb { font-size: 11.5px; opacity: 0.75; }
.cap { display: block; padding: 9px 2px 0; }
.cap .ttl { font-size: 13.5px; }
.cap .meta { font-style: normal; }
.cap .tp { margin-top: 4px; }
.person-h { display: flex; gap: 12px; align-items: center; }
.pm { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--board); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--read); font-size: 16px; color: var(--ink-2); }
.pn { font-family: var(--read); font-size: 19px; line-height: 1.2; }
.prog { display: block; height: 2px; background: var(--line); margin-top: 10px; }
.prog i { display: block; height: 2px; background: var(--accent); }
.capbox { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); border-radius: 2px; }
.capbox textarea { font-family: var(--read); font-size: 17px; line-height: 1.45; color: var(--ink); background: none; border: 0; outline: none; resize: none; min-height: 150px; }
.capbox textarea::placeholder { color: var(--ink-2); }
.capbox .cb-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); }
.capbox select { font: inherit; font-size: 12.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 5px 6px; max-width: 150px; }
.btn { font-size: 13px; font-weight: 500; height: 34px; padding: 0 14px; border-radius: 6px; background: var(--accent); color: var(--on-accent); }
.btn.q { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 400; }
kbd { font: inherit; font-size: 11px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; }
.empty { font-family: var(--read); font-size: 17px; color: var(--ink-2); margin: 28px 0 0; }

/* Pictures: drawn stand-ins for photos, like the app's dev specimens */
.pic { position: relative; display: block; overflow: hidden; border-radius: 6px; box-shadow: var(--shadow-pic); }
.pic .gr { position: absolute; left: 0; right: 0; bottom: 0; height: 18%; }
.pic .ar { position: absolute; bottom: 18%; width: 12%; height: 40%; border-radius: 999px 999px 0 0; }
.pic .ar:nth-of-type(2) { left: 10%; } .pic .ar:nth-of-type(3) { left: 30%; } .pic .ar:nth-of-type(4) { left: 50%; } .pic .ar:nth-of-type(5) { left: 70%; }
.pic .sun { position: absolute; right: 8%; top: 10%; width: 14%; aspect-ratio: 1; border-radius: 50%; background: #f2cf5b; }
.pic .play { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: rgba(20, 24, 28, 0.85); display: grid; place-items: center; }
.pic .dur { position: absolute; right: 6px; bottom: 7px; font-size: 10.5px; font-weight: 600; padding: 2px 5px; border-radius: 3px; background: rgba(0, 0, 0, 0.72); color: #fff; font-variant-numeric: tabular-nums; }
.pic .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--s2); }
.sky0 { background: #e9b7c9; } .sky0 .gr { background: #7a5560; } .sky0 .ar { background: #4a2f3a; }
.sky1 { background: #bcd3ea; } .sky1 .gr { background: #56637e; } .sky1 .ar { background: #273248; }
.sky2 { background: #bfe3cf; } .sky2 .gr { background: #4f7a6a; } .sky2 .ar { background: #2c4f45; }
.sky3 { background: #f0d3b0; } .sky3 .gr { background: #9b7a55; } .sky3 .ar { background: #5a3e2a; }

/* Shelves */
.desk { margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px 20px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; transition: opacity 220ms var(--ease); }
.desk-h { flex: 0 0 200px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.desk-h h2 { margin: 6px 0 4px; font-family: var(--read); font-weight: 500; font-size: 20px; }
.desk-h p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.desk-list { flex: 999 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.dcard { display: flex; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); min-width: 0; }
.dcard .dt { flex: none; width: 40px; height: 56px; border-radius: 3px; }
.dcard .db { min-width: 0; flex: 1; }
.dcard .dk { font-size: 11.5px; color: var(--ink-2); }
.dcard .dn { font-family: var(--read); font-size: 16px; line-height: 1.25; margin: 2px 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dcard .dm { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

.bay { padding-top: 40px; }
.bay-h { display: flex; align-items: baseline; gap: 14px; padding-bottom: 4px; }
.bay-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.bay-h .rule { flex: 1; height: 1px; background: var(--line); }
.bay-h .n { font-size: 12px; color: var(--ink-2); }
.shelf { display: flex; flex-wrap: wrap; gap: 0 32px; padding-top: 14px; transition: opacity 220ms var(--ease); }
.shelf.faded { opacity: 0.4; }
.slabel { flex: 0 0 200px; padding-top: 40px; min-width: 0; }
.slabel .sk { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); }
.slabel .sk i { width: 9px; height: 9px; border-radius: 2px; }
.slabel h3 { margin: 6px 0; font-family: var(--read); font-weight: 500; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.slabel .sm { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.linkb { margin-top: 10px; font-size: 13px; font-weight: 500; color: var(--accent); padding: 4px 0; display: inline-flex; align-items: center; gap: 4px; }
.linkb:hover { color: var(--ink); }
.sbody { flex: 999 1 520px; min-width: 0; }
.srow { position: relative; border-bottom: 2px solid var(--shelf); }
.track { display: flex; align-items: flex-end; gap: 6px; min-height: 206px; padding: 34px 4px 0; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scroll-padding-inline: 4px; overscroll-behavior-x: contain; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.track > * { scroll-snap-align: start; }
.track.wrapped { overflow: visible; scroll-snap-type: none; }
.sbody { position: relative; }
.sbody[data-left] .track { -webkit-mask-image: linear-gradient(to right, transparent, #000 64px); mask-image: linear-gradient(to right, transparent, #000 64px); }
.sbody[data-right] .track { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 64px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 64px), transparent); }
.sbody[data-left][data-right] .track { -webkit-mask-image: linear-gradient(to right, transparent, #000 64px, #000 calc(100% - 64px), transparent); mask-image: linear-gradient(to right, transparent, #000 64px, #000 calc(100% - 64px), transparent); }
.cbtn { position: absolute; top: 116px; z-index: 3; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; background: var(--panel); box-shadow: 0 0 0 1px var(--line), var(--shadow-pic); display: grid; place-items: center; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity 130ms var(--ease); }
.cbtn.prev { left: -10px; } .cbtn.next { right: -10px; }
.cbtn:hover { color: var(--accent); }
.sbody[data-left] .cbtn.prev, .sbody[data-right] .cbtn.next { opacity: 1; pointer-events: auto; }
.sfoot { display: flex; justify-content: flex-end; align-items: center; gap: 12px; min-height: 22px; padding-top: 6px; font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sfoot button { color: var(--accent); font-size: 12px; font-weight: 500; padding: 4px 0; }
.board + .srow { margin-top: 6px; }
.board + .srow .track { min-height: 0; padding-top: 30px; }
.board { height: 9px; background: var(--board); border-bottom: 1px solid var(--line); border-radius: 0 0 3px 3px; transform-origin: left center; }
.slot { position: relative; flex: none; display: flex; flex-direction: column; justify-content: flex-end; transition: opacity 220ms var(--ease); }
.slot.dim { opacity: 0.2; }
.slot.narrow .since { opacity: 0; transition: opacity 130ms var(--ease); z-index: 2; }
.slot.narrow:hover .since, .slot.narrow:focus-within .since { opacity: 1; }
.slot.narrow.marked::before { content: ""; position: absolute; left: 50%; top: -14px; width: 7px; height: 7px; margin-left: -4px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.slot.narrow.marked:hover::before, .slot.narrow.marked:focus-within::before { opacity: 0; }
.since { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); white-space: nowrap; font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 999px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); pointer-events: none; }
.sh { display: block; color: var(--ink); transition: transform 130ms var(--ease); }
.sh:hover { transform: translateY(-6px); }
.sh.lit { outline: 2px solid var(--accent); outline-offset: 3px; }
.sh.lit.sel { outline-width: 3px; }
.spine { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 0; border-radius: 2px 2px 0 0; overflow: hidden; box-shadow: inset -2px 0 0 rgba(0, 0, 0, 0.07); }
.spine .st { writing-mode: vertical-rl; font-family: var(--read); font-size: 13px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-height: 0; }
.spine .sb { writing-mode: vertical-rl; font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.75; white-space: nowrap; margin-top: 10px; }
.cA { background: var(--accent); color: var(--on-accent); }
.cB { background: var(--s2); color: var(--on-s2); }
.cC { background: var(--s1); color: var(--ink); }
.cD { background: var(--cover); color: var(--cover-ink); }
.cE { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.cF { background: var(--quote-paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--quote-rule); }
.fo { width: 116px; height: 174px; margin-right: 6px; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 12px 12px 15px; border-radius: 2px 4px 4px 2px; background: var(--cover); color: var(--cover-ink); box-shadow: inset 3px 0 0 rgba(255, 255, 255, 0.11), inset 5px 0 2px rgba(0, 0, 0, 0.38); }
.fo .ft1 { font-family: var(--read); font-size: 16px; line-height: 1.15; }
.fo .fb1 { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.8; }

      '<label for="adBy">' + (col.shape === "quote" ? "Said by (optional)" : col.shape === "person" ? "What they do, and where" : col.shape === "thing" ? "Architect · year" : isNote ? "Topic (optional)" : "By (optional)") + '<input id="adBy"></label>' +
      '<div class="acts"><button type="button" class="btn q" data-cmd="close">Cancel</button><button class="btn" type="submit">Add to shelf</button></div></form>', "#adTitle");
  }

  function shelveMenu(btn) {
    var it = BY[btn.dataset.shelve], type = TYPE_OF[it.k];
    var opts = COLS.filter(function (c) { return c.bay === type; });
    var r = btn.getBoundingClientRect();
    var m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu");
    m.style.left = Math.min(r.left + window.scrollX, window.scrollX + innerWidth - 216) + "px"; m.style.top = (r.bottom + window.scrollY + 6) + "px";
    m.innerHTML = '<p>Put “' + esc(it.title.slice(0, 40)) + '” on</p>' + opts.map(function (c) { return '<button role="menuitem" data-to="' + c.id + '" data-item="' + it.id + '">' + esc(c.name) + '</button>'; }).join("");
    document.body.appendChild(m); m.querySelector("button").focus();
    var close = function (e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("pointerdown", close, true); } };
    setTimeout(function () { document.addEventListener("pointerdown", close, true); }, 0);
    m.addEventListener("keydown", function (e) { if (e.key === "Escape") { m.remove(); btn.focus(); } });
  }

  /* ---------- Events ---------- */
  $("#vWall").addEventListener("click", function () { setView("wall"); });
  $("#vShelves").addEventListener("click", function () { state.chip = null; setView("shelves"); });
  $("#sort").addEventListener("change", function (e) { local(function () { state.sort = e.target.value; store.set("sort", state.sort); }); });
  $("#slow").addEventListener("change", function (e) { state.slow = e.target.checked; store.set("slow", state.slow); });
  $("#tomorrow").addEventListener("click", function () {
    if (state.view !== "shelves") { state.chip = null; setView("shelves", function () { state.day++; store.set("day", state.day); }); }
    else local(function () { state.day++; store.set("day", state.day); });
    if (state.sort !== "mix") toast("Rotation only changes the shelves in “A rotating mix”.");
    else toast("A new day: each shelf brings two different buried items forward.");
  });
  $("#reset").addEventListener("click", function () { store.clear(); items = seed(); index(); state.sort = "mix"; state.day = 0; state.query = ""; state.thread = null; state.chip = null; $("#q").value = ""; renderAll(); toast("Back to the sample library."); });

  var qT;
  $("#q").addEventListener("input", function (e) {
    var v = e.target.value.trim();
    clearTimeout(qT);
    if (state.view === "wall") { state.query = v; state.thread = null; renderWall(); return; }
    qT = setTimeout(function () { local(function () { state.query = v; state.thread = null; }); }, 260);
  });

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, a, [data-cmd]"); if (!t) return;
    if (t.dataset.cmd === "close") { closeOverlay(); return; }
    if (t.dataset.cmd === "clear") { local(function () { state.thread = null; state.query = ""; $("#q").value = ""; }); return; }
    if (t.dataset.cmd === "elsewhere") { toast("This prototype only has the Library’s Everything page."); return; }
    if (t.dataset.cmd === "theme") { var root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; store.set("theme", root.dataset.theme); return; }
    if (t.dataset.cmd === "capture") { if (state.view !== "wall") setView("wall", function () { state.chip = null; state.query = ""; $("#q").value = ""; }); setTimeout(function () { var c = $("#capText"); if (c) c.focus(); }, 30); return; }
    if (t.dataset.chip !== undefined) { state.chip = t.dataset.chip || null; renderWall(); return; }
    if (t.dataset.openshelf) { var cid = t.dataset.openshelf; setView("wall", function () { state.chip = cid; state.query = ""; state.thread = null; $("#q").value = ""; }); return; }
    if (t.dataset.add) { addDialog(t.dataset.add); return; }
    if (t.dataset.expand) { var ec = t.dataset.expand; morph(function () { if (state.open[ec]) delete state.open[ec]; else state.open[ec] = 1; renderShelves(); }, { mode: "expand" }); return; }
    if (t.dataset.carStep) { var tk = $(".track", t.closest(".sbody")); tk.scrollBy({ left: (+t.dataset.carStep) * tk.clientWidth * 0.8, behavior: reduced ? "auto" : "smooth" }); return; }
    if (t.dataset.shelve) { shelveMenu(t); return; }
    if (t.dataset.to) {
      var it = BY[t.dataset.item], to = t.dataset.to; t.closest(".menu").remove();
      local(function () { it.c = to; if (it.k === "link") { it.k = COL[to].shape; it.by = COL[to].shape === "video" ? "12:00" : COL[to].shape === "pdf" ? "8 pages" : "From " + it.by; } persist(); });
      toast("Shelved on " + COL[to].name + "."); return;
    }
    if (t.dataset.thread) {
      var id = t.dataset.thread; closeOverlay();
      if (state.view !== "shelves") setView("shelves", function () { state.thread = id; state.query = ""; $("#q").value = ""; });
      else local(function () { state.thread = id; state.query = ""; $("#q").value = ""; });
      return;
    }
    if (t.dataset.qv) { closeOverlay(); quickView(t.dataset.qv); return; }
    if (t.dataset.open) { quickView(t.dataset.open); return; }
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "capForm") {
      var txt = $("#capText").value.trim(); if (!txt) { $("#capText").focus(); return; }
      var col = $("#capCol").value || null, isQ = /^["“]/.test(txt), isL = /^https?:\/\//.test(txt);
      var it = { id: "u" + Date.now(), c: isL ? null : col, k: isL ? "link" : isQ ? "quote" : "note", title: txt.replace(/^["“]|["”]$/g, ""), by: isL ? txt.replace(/^https?:\/\//, "").split("/")[0] : isQ ? "Quote" : "Note", saved: 0, opened: 0, topic: "Architecture" };
      if (isL) it.title = "Saved link";
      var origin = { id: it.id, rect: f.getBoundingClientRect() };
      local(function () { items.unshift(it); index(); persist(); }, origin);
      toast(it.c ? "Saved to " + COL[it.c].name + "." : "Saved. It’s on the “Not on a shelf” table until you shelve it.");
      return;
    }
    if (f.id === "addForm") {
      var cid = f.dataset.col, c = COL[cid], title = $("#adTitle").value.trim(), by = $("#adBy").value.trim(); if (!title) return;
      var kmap = { book: "book", video: "video", pdf: "pdf", quote: "quote", note: "note", photo: "photo", person: "person", thing: "thing" };
      var n = { id: "u" + Date.now(), c: cid, k: kmap[c.shape], title: title, by: by || (c.shape === "video" ? "12:00" : c.shape === "pdf" ? "10 pages" : c.shape === "quote" ? "Unknown" : c.shape === "note" ? "Note" : c.shape === "photo" ? "Photo" : "Added just now"), saved: 0, opened: 0, topic: c.shape === "note" && by ? by : "Architecture", sky: hash(title) % 4, ratio: 0.7 };
      var addBtn = $('[data-add="' + cid + '"]'); var origin2 = addBtn ? { id: n.id, rect: addBtn.getBoundingClientRect() } : null;
      closeOverlay();
      local(function () { items.unshift(n); index(); persist(); }, origin2);
      toast("Added to " + c.name + ".");
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "c" && !e.metaKey && !e.ctrlKey && !e.altKey && !/input|textarea|select/i.test(document.activeElement.tagName) && !$("#overlay").innerHTML) {
      e.preventDefault(); $('[data-cmd="capture"]').click();
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement && document.activeElement.id === "capText") { $("#capForm").requestSubmit(); }
  });

  var ro = new ResizeObserver(function () { if (!running.length) layoutMasonry(); });
  ro.observe($("#mason"));
  var th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
  renderAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMasonry);
})();
</script>
