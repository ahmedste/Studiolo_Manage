<title>Lumen Pictures</title>
<meta name="description" content="A Studiolo Lumen built with the learner's own Commonplace photos, drawings and notes, with a generated picture only where nothing of theirs fits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Studiolo's tokens (src/styles/tokens.css, via the Commonplace photos prototype). Layout: the app's shell, Learn's Lumen page, and the proposed picture blocks. */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --accent: #1e3e9e; --accent-soft: #e6ebf8; --accent-strong: #142b73; --hl: #dfe6f7;
  --hover: #ecece6; --mat: #e4e4de; --slide: #fbfbf9; --cap: #ebebe6;
  --quote-paper: #faf8f2; --quote-rule: #eae5d9;
  --warn: #9a3b2e; --warn-soft: #f6e4df; --ok: #2f6b4a; --ok-soft: #e2efe7;
  --pick: #b7791f; --pick-soft: #fbf3df; --gen: #6b4fa0; --gen-soft: #efeaf8;
  --on-media: #ffffff; --media-badge: rgba(0, 0, 0, .64);
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, .07), 0 8px 22px rgba(34, 48, 58, .09);
  --shadow-float: 0 1px 2px rgba(34, 48, 58, .06), 0 18px 48px rgba(34, 48, 58, .16);
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --dur-s: 220ms; --dur-m: 380ms; --dur-l: 900ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --accent: #9db0f3; --accent-soft: #263156; --accent-strong: #c3cff8; --hl: #2a3657;
    --hover: #2a353f; --mat: #0d1317; --slide: #1a232a; --cap: #222c34;
    --quote-paper: #29271f; --quote-rule: #3f3a2e;
    --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a; --gen: #c4b0f0; --gen-soft: #2c2540;
    --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
    --shadow-float: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 48px rgba(0, 0, 0, .42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --accent: #9db0f3; --accent-soft: #263156; --accent-strong: #c3cff8; --hl: #2a3657;
  --hover: #2a353f; --mat: #0d1317; --slide: #1a232a; --cap: #222c34;
  --quote-paper: #29271f; --quote-rule: #3f3a2e;
  --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a; --gen: #c4b0f0; --gen-soft: #2c2540;
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
  --shadow-float: 0 1px 2px rgba(0, 0, 0, .3), 0 18px 48px rgba(0, 0, 0, .42);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-s: 1ms; --dur-m: 1ms; --dur-l: 1ms; } }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
img { display: block; }

/* shell */
.rail { position: fixed; inset: 0 auto 0 0; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0; border-right: 1px solid var(--line); background: var(--paper); z-index: 20; }
.rail .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 500 17px var(--read); margin-bottom: 20px; }
.rail button { all: unset; width: 40px; height: 36px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-2); cursor: pointer; }
.rail button:hover { background: var(--hover); color: var(--ink); }
.rail button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.rail button:focus-visible { outline: 2px solid var(--accent); }
.rail svg { width: 18px; height: 18px; }
.rail .grow { flex: 1; }
.stage { margin-left: 58px; padding: 28px 44px 80px; min-width: 0; }
@media (max-width: 980px) { .stage { padding: 24px 24px 80px; } }
@media (max-width: 699px) {
  .rail { inset: auto 0 0 0; width: auto; height: 56px; flex-direction: row; justify-content: space-around; padding: 0 8px; border-right: 0; border-top: 1px solid var(--line); }
  .rail .logo, .rail .grow, .rail .rail-extra { display: none; }
  .stage { margin-left: 0; padding: 16px 16px 120px; }
}

/* prototype bar */
.proto { position: sticky; top: 0; z-index: 15; margin: -28px -44px 22px; padding: 10px 44px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
@media (max-width: 980px) { .proto { margin: -24px -24px 20px; padding: 10px 24px; } }
@media (max-width: 699px) { .proto { margin: -16px -16px 16px; padding: 8px 16px; } }
.proto .tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.proto nav { display: flex; gap: 2px; flex-wrap: wrap; }
.proto nav button { all: unset; cursor: pointer; padding: 5px 10px; border-radius: 4px; font-size: 13px; color: var(--ink-2); }
.proto nav button:hover { background: var(--hover); color: var(--ink); }
.proto nav button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.proto nav button:focus-visible { outline: 2px solid var(--accent); }
.proto .grow { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 6px; background: var(--board); }
.seg button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 4px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.seg button:focus-visible { outline: 2px solid var(--accent); }

/* buttons, chips */
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 4px; font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:focus-visible { outline: 2px solid var(--accent); }
.btn.line { box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.btn.primary { background: var(--accent); color: var(--paper); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn svg { width: 14px; height: 14px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 4px; font-size: 12px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); white-space: nowrap; }
.chip b { color: var(--ink); font-weight: 500; }
.chip.gen { color: var(--gen); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gen) 40%, transparent); background: var(--gen-soft); }
.chip.yours { color: var(--ok); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 35%, transparent); background: var(--ok-soft); }
.chip.pick { color: var(--pick); background: var(--pick-soft); box-shadow: none; }

/* Lumen page head */
.crumb { font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
.crumb a { color: var(--ink-2); }
.crumb b { color: var(--ink); font-weight: 500; }
.lhead { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; padding: 10px 0 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.lhead h1 { margin: 0; font: 400 24px/1.2 var(--read); flex: 1 1 280px; min-width: 0; }
@media (max-width: 1023px) { .lhead h1 { font-size: 20px; flex-basis: 100%; } }
.switch { max-width: 100%; overflow-x: auto; scrollbar-width: none; display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--board); }
.switch button { all: unset; flex: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.switch button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.switch button:focus-visible { outline: 2px solid var(--accent); }
.switch .n { color: var(--ink-3); font-size: 12px; font-weight: 400; }
.switch .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
.switch .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); opacity: .7; }
.switch svg { width: 14px; height: 14px; }
.lsub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0 18px; }
.lsub .q { font: italic 16px/1.4 var(--read); color: var(--ink-2); flex-basis: 100%; }

/* player layout */
.player { display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 30vw, 400px); gap: 20px; align-items: start; }
@media (max-width: 1023px) { .player { grid-template-columns: minmax(0, 1fr); } }
.screen { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--slide); box-shadow: var(--shadow-pic), 0 0 0 1px var(--line); }
.screen .fit { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.play { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--paper); display: grid; place-items: center; flex: none; }
.play:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.play svg { width: 14px; height: 14px; }
.bar { flex: 1; display: flex; gap: 3px; }
.bar button { all: unset; cursor: pointer; flex: 1; height: 16px; display: grid; align-items: center; }
.bar button::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
.bar button[data-done="true"]::before { background: var(--accent); }
.bar button[data-now="true"]::before { background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
.bar button:focus-visible { outline: 2px solid var(--accent); }
.count { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.voice { all: unset; cursor: pointer; font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; padding: 4px 6px; border-radius: 4px; }
.voice:hover { background: var(--hover); }
.voice:focus-visible { outline: 2px solid var(--accent); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-top: 14px; }
.thumbs button { all: unset; cursor: pointer; display: block; }
.thumbs .tv { aspect-ratio: 16/9; border-radius: 4px; overflow: hidden; position: relative; background: var(--slide); box-shadow: 0 0 0 1px var(--line); }
.thumbs .tv .fit { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; }
.thumbs button[aria-current="true"] .tv { box-shadow: 0 0 0 2px var(--accent); }
.thumbs button:focus-visible .tv { outline: 2px solid var(--accent); outline-offset: 2px; }
.thumbs .tl { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* side panel */
.side { background: var(--panel); border-radius: 6px; box-shadow: 0 0 0 1px var(--line); min-width: 0; }
.side .tabs { display: flex; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.side .tabs button { all: unset; cursor: pointer; padding: 11px 8px 10px; font-size: 13.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; }
.side .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--accent); }
.side .tabs button:focus-visible { outline: 2px solid var(--accent); }
.side .tabs .n { font-size: 11.5px; color: var(--ink-3); }
.side .body { padding: 14px; max-height: 620px; overflow: auto; }
.tr p { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-2); }
.tr p.now { color: var(--ink); }
.tr p b { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-3); margin-bottom: 2px; }
.pl { display: grid; gap: 14px; }
.pl .it { display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
.pl .it.off { opacity: .55; }
.pl .ph { width: 76px; height: 76px; border-radius: 3px; overflow: hidden; background: var(--mat); position: relative; }
.pl .ph img { width: 100%; height: 100%; object-fit: cover; }
.pl h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 500; }
.pl .meta { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
.pl .why { font-size: 12.5px; color: var(--ink-2); margin: 0 0 6px; }
.pl .acts { display: flex; gap: 4px; flex-wrap: wrap; margin-left: -10px; }
.pl .sum { font-size: 12.5px; color: var(--ink-2); padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.src { display: grid; gap: 10px; }
.src .s { padding: 10px 12px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); }
.src .s h4 { margin: 0 0 3px; font-size: 13.5px; font-weight: 500; }
.src .s p { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.src .s q { font-family: var(--read); font-size: 14.5px; color: var(--ink); }

/* ============ slides (1280 × 720 design space) ============ */
.sl { position: absolute; inset: 0; background: var(--slide); color: var(--ink); overflow: hidden; }
.sl h2 { position: absolute; left: 72px; top: 54px; right: 72px; margin: 0; font: 400 50px/1.1 var(--read); letter-spacing: -.005em; }
.sl ul, .sl ol { margin: 0; padding: 0; list-style: none; }
.sl .items { position: absolute; left: 72px; top: 170px; display: grid; gap: 14px; }
.sl .items li { position: relative; font-size: 25px; line-height: 1.3; padding: 6px 12px 6px 34px; margin-left: -12px; border-radius: 3px; transition: background var(--dur-m) var(--ease); }
.sl .items li::before { content: ""; position: absolute; left: 14px; top: 19px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.sl .items.ol { counter-reset: n; }
.sl .items.ol li { counter-increment: n; padding-left: 46px; }
.sl .items.ol li::before { content: counter(n); width: 24px; height: 24px; left: 10px; top: 9px; background: var(--accent-soft); color: var(--accent-strong); font-size: 15px; font-weight: 600; display: grid; place-items: center; }
.sl .items li.lit { background: var(--hl); }
.sl .cap { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); width: 900px; max-width: calc(100% - 120px); background: var(--cap); padding: 10px 20px; font-size: 21px; line-height: 1.35; text-align: center; color: var(--ink-3); border-radius: 2px; }
.sl .cap span.on { color: var(--ink); }
.sl .cap:empty { display: none; }
.sl .brand { position: absolute; right: 22px; top: 18px; width: 22px; height: 22px; border-radius: 4px; background: var(--ink-3); color: var(--paper); display: grid; place-items: center; font: 500 13px var(--read); opacity: .6; }

/* the picture frame: sized in JS to the picture's own ratio, so marks sit in picture coordinates */
.frame { position: absolute; overflow: hidden; border-radius: 3px; background: var(--dom, var(--mat)); box-shadow: var(--shadow-pic); }
.frame .zoom { position: absolute; inset: 0; transform-origin: 50% 50%; transition: transform var(--dur-l) var(--ease); }
.frame img { width: 100%; height: 100%; object-fit: cover; }
.credit { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 3px; background: var(--media-badge); color: var(--on-media); font-size: 14px; line-height: 1.2; max-width: calc(100% - 20px); }
.credit .dot { width: 7px; height: 7px; border-radius: 50%; background: #8fd1ad; flex: none; }
.sl.cover .credit { top: 14px; bottom: auto; left: 14px; }
.credit.gen .dot { background: #c7b3f4; }
.mark { position: absolute; border: 2.5px solid #fff; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 0 9999px rgba(0,0,0,0); opacity: 0; transition: opacity var(--dur-m) var(--ease), box-shadow var(--dur-l) var(--ease); }
.mark.on { opacity: 1; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 0 9999px rgba(10,14,18,.38); }
.mark .lab { position: absolute; left: -2px; top: calc(100% + 8px); width: max-content; max-width: 330px; background: #fff; color: #1d2830; font-size: 18px; line-height: 1.3; padding: 7px 11px; border-radius: 3px; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.mark .lab small { display: block; font-size: 13px; color: #5d6c77; margin-top: 2px; }
.mark.r .lab { left: auto; right: -2px; }
.mark.low .lab { top: auto; bottom: calc(100% + 8px); }
.mark.quiet.on { box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.mark .num { position: absolute; left: -13px; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #1d2830; font-size: 14px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
.trace path { fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke-dashoffset var(--dur-l) var(--ease), opacity var(--dur-m); }
.trace .cool { stroke: #1e5fd6; stroke-width: 7; }
.trace .warm { stroke: #c2412d; stroke-width: 7; }
.trace .step { opacity: 0; transition: opacity var(--dur-m); }
.trace .step.on { opacity: 1; }
.trace .step circle { fill: #fff; stroke: #1d2830; stroke-width: 1.5; }
.trace .step text { font: 600 15px var(--ui); fill: #1d2830; text-anchor: middle; dominant-baseline: central; }

/* cover */
.sl.cover .txt { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.sl.cover .kick { display: flex; align-items: center; gap: 10px; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.sl.cover .kick i { font-style: normal; width: 26px; height: 26px; border-radius: 5px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 500 16px var(--read); letter-spacing: 0; }
.sl.cover h1 { margin: 0; font: 400 66px/1.04 var(--read); letter-spacing: -.01em; }
.sl.cover .qq { margin: 0; font: italic 27px/1.3 var(--read); color: var(--ink-2); }
.sl.cover .meta { font-size: 17px; color: var(--ink-3); }

/* quote */
.sl.quote { background: var(--quote-paper); }
.sl.quote blockquote { position: absolute; left: 140px; right: 140px; top: 180px; margin: 0; padding-left: 36px; border-left: 4px solid var(--quote-rule); font: 400 64px/1.12 var(--read); }
.sl.quote .from { position: absolute; left: 176px; top: 420px; display: flex; gap: 12px; align-items: center; font-size: 19px; color: var(--ink-2); }
.sl.quote .from .doc { width: 34px; height: 42px; border-radius: 2px; background: var(--panel); box-shadow: 0 0 0 1px var(--line), 2px 2px 0 var(--line); }

/* pair */
.pair-lab { position: absolute; font-size: 21px; line-height: 1.3; padding: 6px 10px; margin-left: -10px; border-radius: 3px; transition: background var(--dur-m); }
.pair-lab b { display: block; font-weight: 600; font-size: 15px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.pair-lab.lit { background: var(--hl); }
.frame.dim { opacity: .45; transition: opacity var(--dur-m); }
.frame.undim { opacity: 1; transition: opacity var(--dur-m); }

/* table */
.sl table { position: absolute; left: 72px; top: 178px; width: 600px; border-collapse: collapse; font-size: 22px; }
.sl th { text-align: left; font-weight: 500; color: var(--ink-2); font-size: 17px; padding: 0 12px 10px; border-bottom: 1.5px solid var(--ink); }
.sl td { padding: 13px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sl tr.lit td { background: var(--hl); }
.ask { position: absolute; border-radius: 4px; border: 1.5px dashed var(--line); background: var(--board); display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 14px; padding: 36px; }
.ask h3 { margin: 0; font: 400 30px/1.2 var(--read); }
.ask p { margin: 0; font-size: 19px; color: var(--ink-2); }
.ask .acts { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ================= state ================= */
  const S = {

  /* ================= which picture a beat shows ================= */
  function picFor(bi) {
    const b = BEATS[bi];

      const ids = (S.swaps[bi] || b.pics).map((id, k) => S.shelf[id] === "out" ? (b.alts[k] || []).find((a) => S.shelf[a] !== "out") : id);

    }
    if (S.swaps[bi]) return S.swaps[bi];
    if (!b.pic) return null;
    if (S.shelf[b.pic] !== "out") return b.pic;
    return (b.alts || []).find((a) => S.shelf[a] !== "out") || null;
  }
  function sayFor(bi) {
    const b = BEATS[bi];
    if (S.mode === "words") return b.plainSay;

    if (b.gap) return b.say + (p && PICS[p]?.gen ? b.sayGen : "");
    if (b.kind === "end" || b.kind === "quote") return b.say;
    if (b.kind === "pair") return p ? b.say : b.plainSay;

  /* ================= picture frame ================= */
  // Fit a picture of w×h into a box (contain), returning the frame's rect in the box's coordinates.
  function fit(p, bx, by, bw, bh, mode = "contain") {
    const r = p.w / p.h, br = bw / bh;

        return `<section class="sl"><h2>${esc(b.title)}</h2>${clip(a, ra, 72, "L")}${clip(c, rc, 660, "R")}
          <div class="pair-lab" data-cue="L" style="left:72px;top:526px;width:548px"><b>${esc(b.labels[0][0])}</b>${esc(b.labels[0][1])}</div>

          <div class="tally"><span class="chip yours">${yours} from your Commonplace</span>${gen ? `<span class="chip gen">${gen} generated</span>` : ""}<span class="chip">1 quote from your lecture notes</span></div></section>`;

  /* ================= which pictures the Lumen uses ================= */

  /* ================= Watch ================= */

  function drawSlide() {

  function guide(v) {
    const g = {
      watch: "<b>Press play.</b> The cover and slide 2 are your Yazd photo, and your note on the slots lights up when it's mentioned. Slide 3 traces the air over your own section drawing, and slide 4 quotes your lecture notes. Slide 6 has no picture of yours, so it asks before generating one. Open the <b>Pictures</b> tab to see why each was chosen, or to swap one. Use <b>Today: words only</b> to compare.",
      read: "The same Lumen as a long read: your pictures become figures with your own captions, and the section keeps its traced path.",
      make: "Before making, the brief shows the <b>picture shelf</b>: the pictures the writer will look at, ranked, each with why. Set any to Use or Leave out, choose what happens when nothing fits, then press <b>Make a Lumen</b>.",
      commonplace: "The other direction. A photo's panel says which Lumens use it, and opens the Lumen at that slide. Select a few photos and <b>Make a Lumen from these</b>.",
    }[v];
    return `<p class="guide">${g}</p>`;
  }
  function go(v) {
    S.view = v; if (v !== "watch") pause();
    $$(".rail [data-go]").forEach((b) => b.toggleAttribute("aria-current", false));
    (v === "commonplace" ? $("#nav-cp") : $("#nav-learn")).setAttribute("aria-current", "page");
    rerender(); scrollTo(0, 0);
  }
  function rerender() {
    if (S.view === "watch") renderWatch();
    else if (S.view === "read") renderRead();
    else if (S.view === "make") renderMake();
    else renderCp();
  }
  let toastT;
  function toast(title, body = "") { const t = $("#toast"); t.innerHTML = `<b>${esc(title)}</b>${esc(body)}`; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3600); }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a"); if (!t) return;
    const d = t.dataset;
    if (d.go) { e.preventDefault(); return go(d.go); }
    if (d.toast) return toast(d.toast);
    if (d.mode) { S.mode = d.mode; pause(); S.w = 0; return rerender(); }
    if (d.seek !== undefined && t.closest("#bar, #thumbs")) return seek(+d.seek);
    if (d.tab) { S.tab = d.tab; return drawSide(); }
    if (d.shelf) { S.shelf[d.shelf] = d.v; return renderMake(); }
    if (d.policy) { S.policy = d.policy; return renderMake(); }
    if (d.cp) {
      if (e.target.closest("[data-sel]") || S.sel.size) { S.sel.has(d.cp) ? S.sel.delete(d.cp) : S.sel.add(d.cp); }
      else S.cpOpen = d.cp;
      return renderCp();
    }
    switch (d.act) {
      case "theme": { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; return; }
      case "make": return make();
      case "gen": S.gen = "making"; rerender(); setTimeout(() => { S.gen = "made"; S.w = 0; rerender(); toast("Picture generated", "Marked Generated on the slide, in Pictures and when shared."); }, reduced ? 400 : 1800); return;
      case "ungen": S.gen = "removed"; rerender(); return toast("Generated picture removed", "Slide 6 shows its table alone.");
      case "keep": return toast("Kept in Commonplace", "Saved as a Generated picture under Wind towers, with the Lumen it came from.");
      case "find": return openFind(+d.beat, d.pic);
      case "seek": S.view = "watch"; S.i = +d.beat; S.w = 0; go("watch"); return;
      case "openCp": S.cpOpen = d.pic; return go("commonplace");
      case "share": return openShare();
      case "trace": S.trace = !S.trace; $$(".article .trace").forEach((s) => (s.style.display = S.trace ? "" : "none")); t.textContent = S.trace ? "Hide the path" : "Show the path"; t.setAttribute("aria-pressed", String(S.trace)); return;
      case "clearSel": S.sel.clear(); return renderCp();
      case "makeFrom": case "makeFromSel": {
        const ids = d.act === "makeFrom" ? [d.pic] : [...S.sel];
        Object.keys(S.shelf).forEach((k) => { if (S.shelf[k] === "must") S.shelf[k] = "auto"; });
        ids.forEach((id) => { if (id in S.shelf) S.shelf[id] = "must"; });
        S.sel.clear(); go("make");
        return toast(`${ids.length} picture${ids.length > 1 ? "s" : ""} set to Use`, "They're in the brief; the question is yours to change.");
      }
      case "quiz": return;
    }
  });
  // quiz taps: picture coordinates
  document.addEventListener("pointerdown", (e) => {
    const hit = e.target.closest('[data-act="quiz"]'); if (!hit) return;
    const r = hit.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    const z = BEATS[S.i].zone, pad = 0.04;
    S.quiz = { x, y, ok: x > z[0] - pad && x < z[0] + z[2] + pad && y > z[1] - pad && y < z[1] + z[3] + pad };
    const f = $("#fit"); f.innerHTML = slideHtml(S.i) + `<span class="brand">S</span>`; const cap = document.createElement("div"); cap.className = "cap"; cap.id = "cap"; $(".sl", f).appendChild(cap); S.w = words(sayFor(S.i)).length; drawCap();
    if (S.quiz.ok) setTimeout(() => { if (S.view === "watch" && S.i === BEATS.length - 2) { S.i++; drawSlide(); S.playing ? tick() : play(); } }, 2200);
  });
  document.addEventListener("click", (e) => {
    if (e.target.closest("#play")) { S.playing ? pause() : (S.i === BEATS.length - 1 && S.w >= words(sayFor(S.i)).length ? (S.i = 0, S.quiz = null, drawSlide(), play()) : play()); }
    if (e.target.closest("#voice")) {
      S.voice = !S.voice && "speechSynthesis" in window; const v = $("#voice"); v.setAttribute("aria-pressed", String(S.voice)); $("span", v).textContent = S.voice ? "Voice on" : "Voice off";
      if (!("speechSynthesis" in window)) toast("No browser voice here", "The captions still play.");
      if (S.playing) { pause(); S.w = 0; play(); }
    }
  });
  document.addEventListener("keydown", (e) => {
    if (S.view !== "watch" || e.target.closest("input, .dlg")) return;
    if (e.key === " " && !e.target.closest("button")) { e.preventDefault(); S.playing ? pause() : play(); }
    if (e.key === "ArrowRight" && S.i < BEATS.length - 1) seek(S.i + 1);
    if (e.key === "ArrowLeft" && S.i > 0) seek(S.i - 1);
  });

  go("watch");
  // show slide 1 settled until play
  S.w = 0; drawCap();
})();
</script>
