<meta charset="utf-8">
<title>Objects, Boards and Questions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">

</style>
<style>
/* Layout: studiolo's own Commonplace (the CSS above is the app's, main @ 7c0e8732), with the programme's end state drawn
   in it: questions and goals inside items, Objects with richer fields and views, and boards. Additions use the app's tokens;
   questions take the attention (My Focus) amber and goals the accent, as the Boards and Questions designs chose. */
:root { --font-instrument-sans: "Instrument Sans"; --font-newsreader: "Newsreader"; --pick: light-dark(#8a5a00, #e8c27a); --pick-soft: light-dark(#fbf3df, #33291a); --pick-rule: light-dark(#ecd9a8, #5a4824); }
body { background: var(--surface-page); }
[hidden] { display: none !important; }

/* prototype dock (not app UI) */
.proto { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; align-items: center; padding: 6px 8px; border-radius: 12px; background: var(--surface-float); box-shadow: var(--shadow-float); font-size: 12.5px; max-width: calc(100vw - 32px); }
.proto b { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 0 4px; }
.proto .seg { display: inline-flex; gap: 2px; background: var(--board); border-radius: 8px; padding: 2px; }
.proto .seg button { border: 0; background: none; border-radius: 6px; padding: 4px 9px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.proto .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-pic); font-weight: 500; }
.proto label { display: inline-flex; gap: 5px; align-items: center; color: var(--ink-2); cursor: pointer; }
.main-stage { padding-bottom: 90px; }
.phases [data-ph] { position: relative; }
.phases [data-ph]::after { content: attr(data-ph); position: absolute; top: -8px; right: -6px; z-index: 6; font: 600 9.5px/1 var(--ui); letter-spacing: .04em; padding: 3px 5px; border-radius: 3px; background: var(--myfocus-paper); color: var(--myfocus-ink); box-shadow: inset 0 0 0 1px var(--myfocus-rule); pointer-events: none; white-space: nowrap; }

/* questions and goals inside items */
.ft-in { display: inline-flex; gap: 6px; margin-left: 4px; white-space: nowrap; }
.ft-in .cq { color: var(--pick); } .ft-in .cg { color: var(--accent); }
.inl { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 8px; align-items: baseline; margin: 8px 0; padding: 7px 10px; border-radius: 3px; }
.inl.q { background: var(--pick-soft); } .inl.g { background: var(--accent-soft); }
.inl .gl { font: 600 14px/1 var(--ui); text-align: center; }
.inl.q .gl { color: var(--pick); } .inl.g .gl { color: var(--accent); }
.inl .tx { font-family: var(--read); font-size: 16.5px; line-height: 1.45; color: var(--ink); }
.inl.g .tx { font-size: 18px; color: var(--accent-strong); }
.inl .ans { grid-column: 2 / -1; font: 13px/1.45 var(--ui); color: var(--ink-2); }
.inl .ans button, .qgrow .host button, .ans-it small button { all: unset; cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); }
.inl .ans button:hover, .qgrow .host button:hover, .ans-it small button:hover { color: var(--accent); }
.inl.child { margin-left: 26px; }
.inl.done .tx { color: var(--ink-2); }
.st { all: unset; cursor: pointer; font: 500 11.5px/1 var(--ui); padding: 4px 8px; border-radius: 10px; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); color: var(--ink-2); }
.st:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }
.st.open { color: var(--pick); box-shadow: inset 0 0 0 1px var(--pick-rule); }
.st.answered, .st.reached { color: var(--ok); }
.st.active { color: var(--accent); box-shadow: inset 0 0 0 1px var(--status-1); }
.st:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.mdedit { width: 100%; min-height: 200px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); font: 14px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); resize: vertical; }
.edrow { display: flex; gap: 8px; align-items: center; margin: 8px 0 0; flex-wrap: wrap; }
.edrow .hint { font-size: 12px; color: var(--ink-2); }
.atmenu { position: fixed; z-index: 70; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 6px; padding: 5px; min-width: 250px; }
.atmenu button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; width: 100%; padding: 7px 9px; border-radius: 4px; }
.atmenu button:hover, .atmenu button.on { background: var(--hover-fill); }
.atmenu b { font-weight: 500; font-size: 13px; } .atmenu small { grid-column: 2; font-size: 11.5px; color: var(--ink-2); }
.atmenu .gl { grid-row: span 2; font-weight: 600; }
.cc { display: inline-flex; align-items: center; padding: 0 8px; border-radius: 9px; font-size: 12px; line-height: 20px; white-space: nowrap; background: var(--accent-soft); color: var(--accent-strong); margin: 0 4px 2px 0; }
.cc.c1 { background: var(--myfocus-paper); color: var(--myfocus-ink); } .cc.c2 { background: var(--hover-fill); color: var(--ink-2); }
.prop .rel-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.entity-pill.obj { all: unset; cursor: pointer; display: inline-block; padding: 2px 7px; border-radius: 2px; background: var(--accent-soft); color: var(--accent-strong); font-size: 13px; }
.entity-pill.obj:hover { text-decoration: underline; }
.addv { all: unset; cursor: pointer; font-size: 12.5px; color: var(--accent); }
.answers .ans-it { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; padding: 10px 12px; background: var(--pick-soft); border-radius: 3px; margin-bottom: 8px; max-width: 64ch; }
.answers .ans-it .gl { color: var(--ok); font-weight: 600; }
.answers .ans-it .tx { font: 15.5px/1.45 var(--read); } .answers .ans-it small { grid-column: 2; font-size: 12px; color: var(--ink-2); }
.mn-add { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0 0; }
.note-time { margin-right: 6px; }

/* collection views: Table, Columns, Timeline */
.cph-views { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--board); margin-left: 8px; }
.cph-views button { border: 0; background: none; border-radius: 6px; padding: 3px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.cph-views button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-pic); }
.ctbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); margin-top: 6px; }
.ctbl table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
.ctbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-2); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ctbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ctbl tr:last-child td { border-bottom: 0; }
.ctbl td .tt { all: unset; cursor: pointer; font-weight: 500; } .ctbl td .tt:hover { color: var(--accent); text-decoration: underline; }
.ccols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 14px; overflow-x: auto; padding: 6px 0; }
.ccol { background: var(--board); border-radius: 3px; padding: 10px; display: grid; gap: 10px; align-content: start; min-height: 220px; }
.ccol.over { box-shadow: inset 0 0 0 2px var(--status-2); }
.ccol h3 { margin: 0; display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; }
.ccol h3 b { font-weight: 400; color: var(--ink-3); }
.ccol .mcard { cursor: grab; }
.ctl { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); margin-top: 6px; }
.ctlin { min-width: 680px; padding: 10px 0 14px; }
.tlrow { display: grid; grid-template-columns: 240px minmax(0, 1fr); align-items: center; min-height: 32px; }
.tlrow .lab { padding: 0 14px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tlrow .lab button { all: unset; cursor: pointer; } .tlrow .lab button:hover { color: var(--accent); }
.track { position: relative; height: 32px; margin-right: 24px; }
.axis { height: 24px; border-bottom: 1px solid var(--line); }
.tick-l { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); padding-bottom: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.grid-l { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .6; }
.pt { position: absolute; top: 10px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); background: var(--status-2); box-shadow: 0 0 0 2px var(--panel); }

/* board */
.bhead { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; justify-content: space-between; margin: 0 0 14px; }
.bhead h2 { margin: 0; font: 400 clamp(26px, 3.4vw, 36px)/1.1 var(--read); letter-spacing: -.01em; }
.place { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); padding: 3px 10px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); margin-top: 8px; }
.place::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--status-3); }
.bwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: calc(100dvh - 300px); min-height: 480px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--board); position: relative; }
.viewport { position: relative; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--board); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 22px 22px; }
.viewport.panning { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; width: 2200px; height: 1400px; transform-origin: 0 0; }
.arrows { position: absolute; inset: 0; width: 2200px; height: 1400px; overflow: visible; pointer-events: none; }
.arrows .a { stroke: var(--ink-3); stroke-width: 1.6; fill: none; pointer-events: stroke; cursor: pointer; }
.arrows .a:hover, .arrows .a.sel { stroke: var(--accent); stroke-width: 2.4; }
.arrows .hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
.arrows .fl { stroke: var(--status-2); stroke-width: 1.2; stroke-dasharray: 4 5; fill: none; opacity: .8; }
.arrows text { font: 500 11px var(--ui); fill: var(--ink-2); paint-order: stroke; stroke: var(--board); stroke-width: 4px; }
.arrows text.flt { fill: var(--status-2); font-weight: 400; font-style: italic; }
.arrows .ghost { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.bpl { position: absolute; width: 240px; }
.bpl.g { width: 320px; }
.bpl .mcard { cursor: default; user-select: none; }
.bpl.sel .mcard .ci, .bpl.sel .mcard[data-frame="picture"] .pic { box-shadow: inset 0 0 0 1.5px var(--accent), var(--shadow-lift); }
.bpl .mcard[data-frame="picture"] .cap-line { background: var(--board); border-radius: 0 0 4px 4px; }
.mcard.qcard > .ci { background: var(--pick-soft); box-shadow: inset 0 0 0 1px var(--pick-rule); border-left: 3px solid var(--pick); }
.mcard.qcard .kicker { color: var(--pick); }
.mcard.qcard .nt { font-family: var(--read); font-size: 16px; line-height: 1.4; margin: 0; color: var(--ink); }
.mcard.gcard > .ci { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--status-1); }
.mcard.gcard .kicker { color: var(--accent-strong); }
.mcard.gcard .nt { font-family: var(--read); font-size: 19px; line-height: 1.35; color: var(--accent-strong); margin: 0; }
.mcard .ans-l { margin: 6px 0 0; font-size: 12px; color: var(--ok); }
.bpl textarea { width: 100%; min-height: 70px; border: 1px solid var(--status-1); border-radius: 2px; padding: 6px 8px; background: var(--panel); font: 14px/1.5 var(--ui); color: var(--ink); resize: vertical; }
.bpl .mcard .inl { margin: 6px 0 0; padding: 4px 6px; grid-template-columns: 14px minmax(0, 1fr); }
.bpl .mcard .inl .tx { font-size: 13.5px; } .bpl .mcard .inl .st, .bpl .mcard .inl .ans { display: none; }
.dot-c { position: absolute; right: -8px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 2px var(--accent); cursor: crosshair; opacity: 0; transition: opacity var(--dur-quick); z-index: 2; }
.dot-c::before { content: ""; position: absolute; inset: -10px; }
.bpl:hover .dot-c, .bpl.sel .dot-c { opacity: 1; }
.btools { position: absolute; left: 12px; top: 12px; z-index: 5; display: grid; gap: 2px; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 8px; padding: 4px; }
.btools button { all: unset; cursor: pointer; width: 34px; height: 32px; display: grid; place-items: center; border-radius: 5px; font: 600 13px var(--ui); color: var(--ink-2); }
.btools button:hover { background: var(--hover-fill); color: var(--ink); }
.btools button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.bzoom { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; gap: 2px; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 8px; padding: 4px; font-size: 12px; align-items: center; }
.bzoom button { all: unset; cursor: pointer; min-width: 28px; height: 28px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-2); padding: 0 4px; }
.bzoom button:hover { background: var(--hover-fill); color: var(--ink); }
.bhint { position: absolute; left: 160px; right: 12px; bottom: 14px; z-index: 4; pointer-events: none; display: flex; justify-content: center; }
.bhint span { background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 14px; padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); }
.inside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 14px 20px; display: grid; gap: 12px; align-content: start; }
.inside h3 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; }
.inside .row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px 8px; align-items: start; padding: 7px 8px; border-radius: 3px; cursor: pointer; }
.inside .row:hover { background: var(--hover-fill); }
.inside .row .gl { font-weight: 600; font-size: 12px; padding-top: 2px; }
.inside .row.q .gl { color: var(--pick); } .inside .row.g .gl { color: var(--accent); }
.inside .row .tx { font: 14px/1.4 var(--read); color: var(--ink); }
.inside .row .meta { grid-column: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }
.inside .row.done .tx { color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.inside .prog { font-size: 12px; color: var(--ink-2); margin: 0; }
.bdrawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 100%); z-index: 8; background: var(--surface-float); box-shadow: var(--shadow-float); display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.bdrawer .dh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; }
.bdrawer .dh b { font: 400 18px var(--read); }
.bdrawer .shelf-tabs { margin: 0 14px; }
.bdrawer .list { overflow: auto; padding: 8px 14px 16px; display: grid; gap: 6px; align-content: start; }
.bdrawer .grp { margin: 10px 0 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.bdrawer .it { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 1px; padding: 8px 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.bdrawer .it:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.bdrawer .it b { font-weight: 500; font-size: 13px; } .bdrawer .it small { font-size: 11.5px; color: var(--ink-2); }
.bdrawer .it.on { opacity: .5; }
.apop { position: fixed; z-index: 72; width: min(330px, calc(100vw - 32px)); background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.apop .words { display: flex; flex-wrap: wrap; gap: 4px; }
.apop .words button { all: unset; cursor: pointer; font-size: 12px; padding: 3px 9px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }
.apop .words button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.apop input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); color: var(--ink); }
.apop .sent { font: 14px/1.45 var(--read); color: var(--ink); }
.offer { display: grid; gap: 6px; padding: 9px 10px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-strong); font-size: 12.5px; }
.offer .row2, .apop .row2 { display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-between; }
.bcover { aspect-ratio: 4 / 3; background-color: var(--board); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 10px 10px; position: relative; overflow: hidden; border-radius: 6px; box-shadow: var(--shadow-pic); }
.bcover i { position: absolute; background: var(--panel); box-shadow: inset 0 0 0 1px var(--rule); border-radius: 1px; }
.bcover i.q { background: var(--pick-soft); } .bcover i.g { background: var(--accent-soft); }
.bcover svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Questions and goals page */
.qglist { display: grid; gap: 26px; max-width: 900px; }
.qgsec h2 { margin: 0 0 8px; font: 400 21px/1.2 var(--read); }
.qgrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; padding: 10px 12px; border-top: 1px solid var(--line); }
.qgrow .gl { font-weight: 600; } .qgrow.q .gl { color: var(--pick); } .qgrow.g .gl { color: var(--accent); }
.qgrow .tx { font: 16px/1.45 var(--read); }
.qgrow.g .tx { font-size: 18px; }
.qgrow .host { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.qgrow.child { margin-left: 28px; }
.qgrow.done .tx { color: var(--ink-2); }
.qgprog { margin: -2px 0 4px 40px; font-size: 12.5px; color: var(--ink-2); }

/* customizer additions */
.field-row select { width: 100%; }
.field-cfg { margin: 0 0 6px 38px; padding: 10px 12px; background: var(--board); border-radius: 2px; display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.field-cfg label { display: grid; gap: 4px; }
.field-cfg input[type="text"], .field-cfg select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; border-radius: 2px; color: var(--ink); }
.field-cfg .rowl { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.field-cfg .rowl label { display: flex; gap: 6px; align-items: center; }
.cf-pills { display: flex; gap: 6px; flex-wrap: wrap; }

/* the long note page and the block editor (N1–N4): Craft's calm column, on the app's tokens and faces */
.np .ip-top { align-items: center; }
.np-dbtn[aria-pressed="true"] { background: var(--hover-fill); }
.np-grid { display: grid; grid-template-columns: 190px minmax(0, 700px) minmax(0, 1fr); gap: 0 48px; margin-top: 18px; }
.np.with-details .np-grid { grid-template-columns: 170px minmax(0, 660px) 300px; }
.np-outline { position: sticky; top: 24px; align-self: start; padding-top: 96px; display: grid; gap: 1px; }
.np-outline button { all: unset; cursor: pointer; font-size: 13px; line-height: 1.35; color: var(--ink-2); padding: 4px 0 4px 10px; border-left: 1px solid var(--line); }
.np-outline button.h3 { padding-left: 22px; font-size: 12.5px; }
.np-outline button:hover { color: var(--accent); border-left-color: var(--accent); }
.np-ol-h { margin: 0 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.np-details { display: none; }
.np.with-details .np-details { display: block; }
.np-doc { min-width: 0; }
.np-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 8px 0 26px; padding-bottom: 18px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.np-about { display: inline-flex; gap: 6px; align-items: center; }
.np-topic { display: inline-flex; gap: 6px; align-items: center; }
.np-count { color: var(--ink-3); margin-left: auto; }
.np-tail { min-height: 90px; cursor: text; }
.nbs > .nb:first-child .nb-h2, .nbs > .nb:first-child .nb-h3 { margin-top: 0; }
body:has(#kbar:not([hidden])) .proto { display: none; }
.ip-writing .nbs { margin-top: 4px; }
.nbs { display: grid; gap: 1px; }
.nb { position: relative; border-radius: 3px; }

    if (it.kind === "book") return `<article class="mcard" data-frame="picture" data-kind="source"><div class="ci"><div class="cover"><b><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></b><span>${esc(it.creator)}</span></div><div class="cap-line"><div class="t"><div class="ft"><div class="ft-meta">${topicFt(it)}${ftIn(it)}</div></div></div>${more}</div></div></article>`;
    const lk = it.kind === "pdf" ? `<i class="pdf"></i>` : it.kind === "video" ? `<i class="yt"></i>` : `<i></i>`;
    return `<article class="mcard" data-frame="paper" data-kind="source"><div class="ci"><div class="body"><p class="lk">${lk}${esc(it.meta)}</p><h2 class="mcard-title"><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></h2>${collKicker(it)}<p class="why">${esc(it.desc)}</p></div>${ft()}</div></article>`;
  }
  if (it.type === "board") {
    const pc = it.pl.map(p => { const r = refOf(p.ref, it); const k = r?.type === "inline" ? (r.kind === "goal" ? "g" : "q") : ""; return `<i class="${k}" style="left:${p.x / 15}%;top:${p.y / 7}%;width:${(k === "g" ? 320 : 240) / 15}%;height:16%"></i>`; }).join("");
    return `<article class="mcard" data-frame="picture" data-kind="board" data-ph="B1"><div class="ci"><div class="pic bcover" data-act="openboard" data-id="${it.id}">${pc}</div><div class="cap-line"><div class="t"><div class="body"><p class="kicker">Board · ${it.pl.length} entries · ${it.arrows.length} arrows</p><h2 class="mcard-title"><a class="mcard-link" href="#" data-act="openboard" data-id="${it.id}">${esc(it.title)}</a></h2><p>${esc(it.inl[0].text)}</p></div><div class="ft"><div class="ft-meta">${topicFt(it)}${ftIn(it)}</div></div></div>${more}</div></div></article>`;
  }
  const c = COL(it.col);
  if (c.layout === "portrait") {
    const t = c.card.map(id => fieldText(FLD(c, id), it.v[id])).filter(Boolean);
    return `<article class="mcard" data-frame="paper" data-kind="person"><div class="ci"><div class="body"><div class="person-head"><div class="person-mark">${it.media ? `<img alt="" src="${MEDIA[it.media]}">` : esc(initials(it.title))}</div><div class="person-name"><h2 class="mcard-title per"><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></h2>${t.length ? `<p>${esc(t.slice(0, 2).join(" · "))}</p>` : ""}</div></div>${t[2] ? `<p>${esc(t[2])}</p>` : ""}${it.desc ? `<p>${esc(it.desc)}</p>` : ""}</div>${ft()}</div></article>`;
  }
  const kind = `${c.label}${cardLine(it) ? " · " + cardLine(it) : ""}`;
  const chips = c.fields.filter(f => f.t === "choice" && !c.card.includes(f.id)).flatMap(f => arr(it.v[f.id]).map(v => `<span class="cc" data-ph="F1">${esc(v)}</span>`)).join("");
  if (c.layout === "picture" && it.media) return `<article class="mcard" data-frame="picture" data-kind="thing"><div class="ci"><div class="im pic t"><img alt="" src="${MEDIA[it.media]}"></div><div class="cap-line"><div class="t"><div class="body"><h2 class="mcard-title"><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></h2><p class="mcard-kind">${esc(kind)}</p>${it.desc ? `<p>${esc(it.desc)}</p>` : ""}</div><div class="ft"><div class="ft-meta">${topicFt(it)}${notesFt(it)}${ftIn(it)}</div></div></div>${more}</div></div></article>`;
  return `<article class="mcard" data-frame="paper" data-kind="thing"><div class="ci"><div class="body"><p class="kicker">${esc(c.name)}${c.clinical ? ` · <span style="color:var(--warn)">Clinical</span>` : ""}</p><h2 class="mcard-title"><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></h2><p class="mcard-kind">${esc(kind)}</p>${it.desc ? `<p>${esc(it.desc)}</p>` : ""}${chips ? `<p>${chips}</p>` : ""}</div>${ft()}</div></article>`;
}

/* ---------- header: destination-header.tsx and the CP header ---------- */
function header(active, sub) {
  const n = D().items.length, cols = D().cols.length;
  const tabs = [["wall", "Everything"], ["cols", "Collections"], ["read", "To read"], ["qg", "Questions and goals"], ["tpl", "Templates"]];
  return `<h1 class="visually-hidden">Commonplace</h1><header class="destination-header"><div class="destination-crumb"><strong>Commonplace</strong><i>/</i><span>${sub || `${n} entries, ${cols} collections`}</span></div>
    <div class="destination-tabrow"><nav class="destination-tabs" aria-label="Commonplace sections">${tabs.map(([k, t]) => `<a class="destination-tab" href="#" data-act="go" data-k="${k}" ${k === active ? 'aria-current="page"' : ""}${k === "qg" ? ' data-ph="Q2"' : ""}>${t}</a>`).join("")}</nav>
    <div class="destination-tail"><button class="cph-select" type="button">${SVG.select}Select</button></div></div></header>`;
}
const TYPES = [["all", "All"], ["note", "Notes"], ["source", "Sources"], ["image", "Photos"], ["object", "Objects"], ["board", "Boards"]];
const typeOf = it => it.type === "quote" ? "note" : it.type;
function wallItems() {
  const q = S.q.trim().toLowerCase();
  return D().items.filter(it => S.type === "all" || typeOf(it) === S.type)
    .filter(it => !S.col || it.col === S.col)
    .filter(it => !S.has || allInlines().some(r => r.item === it && r.kind === S.has && !done(st(r.key, r.kind).status)))
    .filter(it => !q || [it.title, it.body, it.desc, ...it.margin.map(m => m.body), ...(it.v ? Object.values(it.v).flat() : [])].join(" ").toLowerCase().includes(q));
}
function renderWall() {
  const items = wallItems(), c = S.col ? COL(S.col) : null, isObj = c && c.shape === "object";
  const colls = S.type === "all" ? [] : D().cols.filter(x => x.shape === (S.type === "image" ? "image" : S.type));
  const view = isObj ? c.view : "cards";
  let body;
  if (view === "table") body = table(c, items);
  else if (view === "columns") body = columns(c, items);
  else if (view === "timeline") body = timeline(c, items);
  else body = `<section class="mason" id="mason">${S.type === "all" && !S.col && !S.has && !S.q ? `<div class="mcard cap-card"><div class="cap-box"><button class="cap-idle-prompt" type="button" data-act="capture"><span class="cap-idle-main"><span class="prompt-text">Capture a thought, quote or link…</span></span><span class="cap-foot"><span>Note · Quote · Link · <b style="font-weight:500;color:var(--accent)">@ for a question</b></span><span class="kbd-hint">Press <kbd>C</kbd></span></span></button></div></div>` : ""}${items.map(it => card(it)).join("")}</section>${items.length ? "" : `<p class="small" style="margin-top:12px">Nothing matches. Clear a filter to see more.</p>`}`;
  const hasLabel = S.has === "question" ? "Open questions" : S.has === "goal" ? "Goals" : "Has";
  return `${header("wall")}
    <div class="library-wall"><div class="cph">
      <div class="cph-search"><div class="cph-scope"><button class="area-picker" type="button"><span>All areas</span></button></div>
        <label class="cph-field">${SVG.search}<input id="q" type="search" maxlength="200" placeholder="Search everything: titles, text, topics, notes…" value="${esc(S.q)}" aria-label="Search your Commonplace"></label><kbd class="cph-slash">/</kbd><span class="cph-div"></span>
        <div class="shv-seg"><button type="button" aria-pressed="true">${SVG.wall}Wall</button><button type="button" aria-pressed="false">${SVG.shelves}Shelves</button></div></div>
      <nav class="cph-types" aria-label="Types">${TYPES.map(([k, t]) => { const cnt = k === "all" ? D().items.length : D().items.filter(x => typeOf(x) === k).length; return `<button class="cph-type" type="button" data-act="type" data-k="${k}" data-type="${k}" ${S.type === k ? 'aria-current="true"' : ""}${k === "board" ? ' data-ph="B1"' : ""}>${SVG[k]}${t}<span class="n">${cnt}</span></button>${S.type === k && colls.length ? `<span class="cph-colls" role="group"><span aria-hidden="true" class="cph-chev">›</span>${colls.map(x => `<button class="cph-coll" type="button" data-act="col" data-id="${x.id}" aria-pressed="${S.col === x.id}">${esc(x.name)}<span class="n">${D().items.filter(i => i.col === x.id).length}</span></button>`).join("")}</span>` : ""}`; }).join("")}</nav>
      <div class="cph-bar"><div class="cph-seg"><button type="button" aria-pressed="true">All <span class="n">${items.length}</span></button><button class="cph-unsorted" type="button">Unsorted <span class="n">0</span></button></div>
        <span class="cph-fbtn"><button type="button">Topic ▾</button></span>
        <span class="cph-fbtn" data-ph="Q1"><button type="button" data-act="hasmenu" ${S.has ? 'aria-pressed="true"' : ""}>${hasLabel} ▾</button></span>
        ${isObj ? `<span class="cph-views" role="group" aria-label="View" data-ph="V1 · V2">${[["cards", "Cards"], ["table", "Table"], ["columns", "Columns"], ["timeline", "Timeline"]].map(([k, t]) => `<button type="button" data-act="view" data-k="${k}" aria-pressed="${view === k}">${t}</button>`).join("")}</span>` : ""}
        <span class="cph-grow"></span><span class="cph-count">${items.length} entries · newest first</span>${isObj ? `<button class="cph-display" type="button" data-act="customize">Edit collection</button>` : `<button class="cph-display" type="button">Display ▾</button>`}</div>
    </div>${isObj && c.desc ? `<p class="small" style="margin:0 0 12px;max-width:70ch">${esc(c.desc)}</p>` : ""}${body}</div>`;
}
function table(c, items) {
  const cols = c.fields.filter(f => f.t !== "long").slice(0, 7);
  return `<div class="ctbl" data-ph="V1"><table><thead><tr><th>${esc(c.label)}</th>${cols.map(f => `<th>${esc(f.label)}</th>`).join("")}<th>Inside</th></tr></thead><tbody>${items.map(o => `<tr><td><button class="tt" data-act="open" data-id="${o.id}">${esc(o.title)}</button></td>${cols.map(f => `<td>${f.t === "choice" ? arr(o.v[f.id]).map(v => `<span class="cc">${esc(v)}</span>`).join("") : f.t === "rel" ? arr(o.v[f.id]).map(I).filter(Boolean).map(x => `<button class="entity-pill obj" data-act="open" data-id="${x.id}">${esc(x.title)}</button>`).join(" ") : esc(fieldText(f, o.v[f.id])) || `<span style="color:var(--ink-3)">—</span>`}</td>`).join("")}<td>${ftIn(o) || ""}</td></tr>`).join("")}</tbody></table></div>`;
}
function columns(c, items) {
  const f = c.fields.find(x => x.t === "choice");
  if (!f) return `<p class="small">Add a Choice field to group this collection into columns.</p>`;
  const groups = f.o.opts.map(v => ({ v, items: items.filter(o => arr(o.v[f.id])[0] === v) }));
  const none = items.filter(o => !arr(o.v[f.id]).length); if (none.length) groups.push({ v: "", items: none });
  return `<div class="ccols" data-ph="V2">${groups.map(g => `<div class="ccol" data-drop="${esc(g.v)}" data-f="${f.id}"><h3>${g.v ? `<span class="cc">${esc(g.v)}</span>` : `<span style="color:var(--ink-3)">No ${esc(lower(f.label))}</span>`}<b>${g.items.length}</b></h3>${g.items.map(o => `<div draggable="true" data-drag="${o.id}">${card(o, { noMore: true })}</div>`).join("")}</div>`).join("")}</div><p class="small" style="margin-top:8px">Drag a card to another column to change its ${esc(lower(f.label))}.</p>`;
}
function timeline(c, items) {
  const f = c.fields.find(x => x.o.year);
  const rows = items.map(o => ({ o, y: parseInt(String(o.v[f?.id] || "").match(/\d{3,4}/)?.[0] || "", 10) })).filter(x => !isNaN(x.y)).sort((a, b) => a.y - b.y);
  if (!f || !rows.length) return `<p class="small">Nothing here has a year yet.</p>`;
  let lo = rows[0].y, hi = rows.at(-1).y; const step = [1, 2, 5, 10, 20, 25, 50, 100, 200].find(s => Math.max(1, hi - lo) / s <= 7) || 500;
  lo = Math.floor(lo / step) * step; hi = Math.ceil((hi === lo ? hi + 1 : hi) / step) * step;
  const ticks = []; for (let y = lo; y <= hi; y += step) ticks.push(y);
  const pct = y => ((y - lo) / (hi - lo)) * 100, grid = ticks.map(t => `<span class="grid-l" style="left:${pct(t)}%"></span>`).join("");
  return `<div class="ctl" data-ph="V2"><div class="ctlin"><div class="tlrow"><span></span><div class="track axis">${ticks.map(t => `<span class="tick-l" style="left:${pct(t)}%">${t}</span>`).join("")}</div></div>${rows.map(({ o, y }) => `<div class="tlrow"><span class="lab"><button data-act="open" data-id="${o.id}" title="${esc(o.title)}">${esc(o.title)}</button></span><div class="track">${grid}<span class="pt" style="left:${pct(y)}%" title="${y}"></span></div></div>`).join("")}</div></div>`;
}

const ipTitle = t => `<div class="ip-title" data-page-title=""><div class="inline-edit-wrap"><h1 class="inline-heading"><textarea aria-label="Title" class="inline-edit ip-title-field" maxlength="300" rows="1">${esc(t)}</textarea></h1></div></div>`;

  const ob = onBoards(it);
  const rail = `<p class="ip-rh">Properties</p>
    ${prop(person ? "Template" : "Type", esc(c ? c.label : kindLabel(it)))}
    ${c ? c.fields.filter(f => f.t !== "long").map(f => prop(f.label, f.t === "rel" ? `<div class="rel-row">${arr(it.v[f.id]).map(I).filter(Boolean).map(x => `<button class="entity-pill obj" type="button" data-act="open" data-id="${x.id}">${esc(x.title)}</button>`).join("") || `<span style="color:var(--ink-3)">Not recorded</span>`} <button class="addv" type="button" data-act="relpick" data-f="${f.id}">${f.o.many ? "+ Link" : arr(it.v[f.id]).length ? "Change" : "+ Link"}</button></div>`

  return `<div class="ipage"><div class="ip-top"><a class="ip-back" href="#" data-act="back"><span aria-hidden="true" class="ip-arrow">←</span><span class="visually-hidden">Back to </span>${esc(backLabel())}</a><span class="ip-crumb">${esc(c ? c.label : kindLabel(it))}</span><span class="ip-saved" id="saved" aria-live="polite"></span><button class="ip-more" type="button" aria-label="Actions for this item">${SVG.ipmore}</button></div>

    <div class="ip-grid"><article class="ip-main"><div class="ip-hero">${hero}${lead}</div>${writing}${longs}${connections(it)}</article><aside class="props ip-rail" aria-label="Properties">${rail}</aside></div></div>`;

function hostLink(r) {

/* ---------- writing: one block editor for long notes, notes and Object writing (N1–N4) ----------

    else if ((m = /^@(question|goal)\s+([\s\S]*)$/i.exec(p))) out.push({ t: m[1].toLowerCase(), text: m[2].replace(/\s+/g, " ").trim() });
    else if ((m = /^(#{1,3})\s+(.*)$/.exec(p))) out.push({ t: m[1].length === 3 ? "h3" : "h2", text: m[2] });
    else if (/^>\s?/.test(p)) out.push({ t: "quote", text: p.replace(/^>\s?/gm, "").replace(/\n/g, " ") });

$("#atmenu").addEventListener("mousedown", e => { const b = e.target.closest("[data-at]"); if (b && atState) { e.preventDefault(); chooseAt(b.dataset.at); } });
document.addEventListener("keydown", e => {
  if (atState && !$("#atmenu").hidden) {
    const items = [...document.querySelectorAll("#atmenu [data-at]")], i = items.findIndex(x => x.classList.contains("on"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[i].classList.remove("on"); items[(i + 1) % items.length].classList.add("on"); return; }
    if (e.key === "Enter") { e.preventDefault(); chooseAt(items[i].dataset.at); return; }
    if (e.key === "q" || e.key === "g") { e.preventDefault(); chooseAt(e.key === "q" ? "question" : "goal"); return; }
    if (e.key === "Escape") { hideAt(); return; }
  }
  const t = e.target, nbt = t.closest?.(".nb-t");
  if (nbt) { edKey(e, nbt); return; }
  if (t.classList?.contains("ip-title-field") && e.key === "Enter" && S.screen === "note") { e.preventDefault(); focusBlock(0, "start"); return; }
  if (t.id === "mdedit" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveBody(); return; }
  if (t.dataset?.qedit && e.key === "Enter") { e.preventDefault(); t.blur(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
  if (e.key === "Escape") { closeMenu(); if (!$("#apop").hidden) closeApop(); if (S.drawer) { S.drawer = false; render(); } }
  if (e.key === "/" && S.screen === "wall") { e.preventDefault(); $("#q")?.focus(); }
  if (S.screen === "board") {
    const k = e.key.toLowerCase();
    if (k === "v") { S.tool = "select"; render(); } else if (k === "n") { S.tool = "note"; render(); } else if (k === "q") { S.tool = "question"; render(); }
    else if (e.key === "+") { S.drawer = !S.drawer; render(); } else if (k === "0") fit();
    else if ((e.key === "Delete" || e.key === "Backspace") && S.sel) { const b = I(S.board); b.pl = b.pl.filter(p => p.id !== S.sel); b.arrows = b.arrows.filter(a => a.from !== S.sel && a.to !== S.sel); S.sel = null; render(); toast("Removed from the board. It's still in your Commonplace."); }
  }
});
/* drag cards between columns (V2) */
document.addEventListener("dragstart", e => { const c = e.target.closest?.("[data-drag]"); if (c) { S.drag = c.dataset.drag; e.dataTransfer.setData("text/plain", S.drag); } });
document.addEventListener("dragover", e => { const col = e.target.closest?.(".ccol"); if (!col || !S.drag) return; e.preventDefault(); document.querySelectorAll(".ccol.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e => { const col = e.target.closest?.(".ccol"); if (!col || !S.drag) return; e.preventDefault(); const o = I(S.drag); o.v[col.dataset.f] = col.dataset.drop ? [col.dataset.drop] : []; S.drag = null; render(); toast(`${o.title} → ${col.dataset.drop || "none"}`); });
document.addEventListener("dragend", () => { S.drag = null; document.querySelectorAll(".ccol.over").forEach(x => x.classList.remove("over")); });

/* ---------- moving between entries: one history, so ← always names where it goes ---------- */
function pushHist() { S.hist.push({ screen: S.screen, item: S.item, board: S.board }); }
function openEntry(id) { const it = I(id); if (!it) return; closeMenu(); pushHist(); if (it.type === "board") { S.board = it.id; go("board", true); return; } S.item = id; S.ed = null; S.editing = null; go(isLong(it) ? "note" : "item", true); }
function mentionPop(el) {
  const x = I(el.dataset.mention), bi = el.closest(".nb-t")?.dataset.bi;
  menuKey = { bi: bi == null ? null : +bi, id: el.dataset.mention };
  openMenu(el, x ? `<div class="mpop">${card(x, { noMore: true })}</div>` + mItem("open", "Open ↗", false, `data-id="${x.id}"`) + (bi != null ? mItem("mentioncard", "Show it as a card below", false) + mItem("unmention", "Unlink, keep the words", false) : "") : mHead("This entry was deleted") + (bi != null ? mItem("unmention", "Keep the words, remove the link", false) : ""));
}
function addMargin(b, q) {
  const it = I(S.ed.id), t = plainText(b?.text || b?.cap || "");
  it.margin.push({ at: "¶ " + t.slice(0, 26) + (t.length > 26 ? "…" : ""), block: t.slice(0, 40), body: q ? `On “${q.slice(0, 80)}”: check this against the section drawing.` : "Check this against the section drawing." });
  $("#selbar").hidden = true; edRender(); toast("Margin note added beside this block (✎). It's listed under Notes about it.");
}
function writeAbout(x) {
  if (!x) return;
  const c = x.type === "object" ? COL(x.col) : null, heads = c?.write?.length ? c.write : ["Notes"];
  const nid = "w" + Date.now(), body = [`::card[](item:${x.id})`, ...heads.map(h => `## ${h}`)].join("\n\n");
  D().items.unshift(note(nid, "essays", `On ${x.title}`, body, { about: x.id, topics: x.topics }));
  pushHist(); S.item = nid; S.ed = { id: nid, blocks: toBlocks(body).flatMap(b => b.t === "h2" ? [b, { t: "p", text: "" }] : [b]) };
  go("note", true); focusBlock(2, "start");
  toast(`A long note about ${x.title}${c ? `, started from the ${c.name} template` : ""}. It's listed on its page under Notes about it.`);
}
/* blocks: drag by ⋮⋮ */
document.addEventListener("dragstart", e => { const g = e.target.closest?.(".nb-grip"); if (!g) return; S.dragB = +g.dataset.i; e.dataTransfer.setData("text/plain", "block"); e.dataTransfer.effectAllowed = "move"; const nb = g.closest(".nb"); e.dataTransfer.setDragImage(nb, 20, 12); nb.classList.add("dragging"); });
document.addEventListener("dragover", e => { if (S.dragB == null) return; const nb = e.target.closest?.(".nb"); if (!nb) return; e.preventDefault(); const r = nb.getBoundingClientRect(), below = e.clientY > r.top + r.height / 2; document.querySelectorAll(".nb.drop-above,.nb.drop-below").forEach(x => x.classList.remove("drop-above", "drop-below")); nb.classList.add(below ? "drop-below" : "drop-above"); });
document.addEventListener("drop", e => { if (S.dragB == null) return; e.preventDefault(); const nb = e.target.closest?.(".nb"); if (nb) { const bl = S.ed.blocks, from = S.dragB, to = +nb.dataset.i + (nb.classList.contains("drop-below") ? 1 : 0), [b] = bl.splice(from, 1); bl.splice(to > from ? to - 1 : to, 0, b); commit(); } S.dragB = null; edRender(); });
document.addEventListener("dragend", () => { if (S.dragB != null) { S.dragB = null; edRender(); } });
document.addEventListener("paste", e => { const el = e.target.closest?.(".nb-t"); if (!el) return; e.preventDefault(); document.execCommand("insertText", false, (e.clipboardData.getData("text/plain") || "").replace(/\s*\n\s*/g, " ")); });
$("#pick").addEventListener("mousedown", e => { e.preventDefault(); const b = e.target.closest("[data-pk]"); if (b && pick) choosePick(+b.dataset.pk); });
$("#selbar").addEventListener("mousedown", e => e.preventDefault());
document.addEventListener("selectionchange", () => {
  const bar = $("#selbar"), sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed) { if (!bar.matches(":hover")) bar.hidden = true; return; }
  const n = sel.anchorNode, el = (n?.nodeType === 1 ? n : n?.parentElement)?.closest(".nb-t:not(.nb-cap)");
  if (!el || !el.contains(sel.focusNode)) { bar.hidden = true; return; }
  const r = sel.getRangeAt(0).getBoundingClientRect(); S.selRange = sel.getRangeAt(0).cloneRange(); S.selBi = +el.dataset.bi;
  bar.hidden = false; bar.style.left = Math.max(16, Math.min(r.left + r.width / 2 - bar.offsetWidth / 2, innerWidth - bar.offsetWidth - 16)) + "px"; bar.style.top = Math.max(8, r.top - bar.offsetHeight - 10) + "px";
});
/* phones: a writing bar above the keyboard instead of the hover handles */
document.addEventListener("focusin", e => { const el = e.target.closest?.(".nb-t"); if (el && innerWidth < 700) { $("#kbar").hidden = false; S.kbEl = el; } });
document.addEventListener("focusout", e => { if (e.target.closest?.(".nb-t")) setTimeout(() => { if (!document.activeElement?.closest?.(".nb-t")) $("#kbar").hidden = true; }, 200); });
$("#kbar").addEventListener("mousedown", e => e.preventDefault());
function kb(k) {
  const el = document.activeElement?.closest?.(".nb-t") || S.kbEl; if (!el || !S.ed) return;
  const i = +el.dataset.bi, b = S.ed.blocks[i];
  if (k === "done") { el.blur(); $("#kbar").hidden = true; return; }
  if (k === "menu") { menuKey = i; openMenu(el, blockMenu(i)); return; }

  if (k === "slash") { S.ed.blocks.splice(i + 1, 0, { t: "p", text: "" }); edRender(i + 1, "start"); showPick("slash", i + 1, "", document.querySelector(`.nb[data-i="${i + 1}"] .nb-t`)); return; }
  if (k === "at") { const before = el.textContent.slice(0, caretOff(el)); document.execCommand("insertText", false, (before && !/\s$/.test(before) ? " " : "") + "@"); }
}

S.board = DB[S.field].start;
render();
