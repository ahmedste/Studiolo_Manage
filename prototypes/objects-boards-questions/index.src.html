<style>
/* Layout: studiolo's own Commonplace (the CSS above is the app's, main @ 7c0e8732), with the programme's end state drawn

   questions take the attention (My Focus) amber and goals the accent, as the Boards and Questions designs chose. */
:root { --font-instrument-sans: "Instrument Sans"; --font-newsreader: "Newsreader"; --pick: light-dark(#8a5a00, #e8c27a); --pick-soft: light-dark(#fbf3df, #33291a); --pick-rule: light-dark(#ecd9a8, #5a4824); }

.proto b { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 0 4px; }

.proto .seg button { border: 0; background: none; border-radius: 6px; padding: 4px 9px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.proto .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-pic); font-weight: 500; }

.main-stage { padding-bottom: 90px; }

/* collection views: Table, Columns, Timeline */

.ctbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); margin-top: 6px; }
.ctbl table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
.ctbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-2); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }

.ctbl tr:last-child td { border-bottom: 0; }
.ctbl td .tt { all: unset; cursor: pointer; font-weight: 500; } .ctbl td .tt:hover { color: var(--accent); text-decoration: underline; }
.ccols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 14px; overflow-x: auto; padding: 6px 0; }
.ccol { background: var(--board); border-radius: 3px; padding: 10px; display: grid; gap: 10px; align-content: start; min-height: 220px; }
.ccol.over { box-shadow: inset 0 0 0 2px var(--status-2); }
.ccol h3 { margin: 0; display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; }
.ccol h3 b { font-weight: 400; color: var(--ink-3); }
.ccol .mcard { cursor: grab; }
.ctl { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); margin-top: 6px; }
.ctlin { min-width: 680px; padding: 10px 0 14px; }
.tlrow { display: grid; grid-template-columns: 240px minmax(0, 1fr); align-items: center; min-height: 32px; }
.tlrow .lab { padding: 0 14px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tlrow .lab button { all: unset; cursor: pointer; } .tlrow .lab button:hover { color: var(--accent); }
.track { position: relative; height: 32px; margin-right: 24px; }
.axis { height: 24px; border-bottom: 1px solid var(--line); }
.tick-l { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); padding-bottom: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.grid-l { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .6; }
.pt { position: absolute; top: 10px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); background: var(--status-2); box-shadow: 0 0 0 2px var(--panel); }

/* board */
.bhead { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; justify-content: space-between; margin: 0 0 14px; }

.place { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); padding: 3px 10px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); margin-top: 8px; }
.place::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--status-3); }
.bwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: calc(100dvh - 300px); min-height: 480px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--board); position: relative; }
.viewport { position: relative; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--board); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 22px 22px; }
.viewport.panning { cursor: grabbing; }
.canvas { position: absolute; left: 0; top: 0; width: 2200px; height: 1400px; transform-origin: 0 0; }
.arrows { position: absolute; inset: 0; width: 2200px; height: 1400px; overflow: visible; pointer-events: none; }
.arrows .a { stroke: var(--ink-3); stroke-width: 1.6; fill: none; pointer-events: stroke; cursor: pointer; }

.arrows text { font: 500 11px var(--ui); fill: var(--ink-2); paint-order: stroke; stroke: var(--board); stroke-width: 4px; }
.arrows text.flt { fill: var(--status-2); font-weight: 400; font-style: italic; }
.arrows .ghost { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.bpl { position: absolute; width: 240px; }
.bpl.g { width: 320px; }
.bpl .mcard { cursor: default; user-select: none; }
.bpl.sel .mcard .ci, .bpl.sel .mcard[data-frame="picture"] .pic { box-shadow: inset 0 0 0 1.5px var(--accent), var(--shadow-lift); }
.bpl .mcard[data-frame="picture"] .cap-line { background: var(--board); border-radius: 0 0 4px 4px; }
.mcard.qcard > .ci { background: var(--pick-soft); box-shadow: inset 0 0 0 1px var(--pick-rule); border-left: 3px solid var(--pick); }
.mcard.qcard .kicker { color: var(--pick); }
.mcard.qcard .nt { font-family: var(--read); font-size: 16px; line-height: 1.4; margin: 0; color: var(--ink); }
.mcard.gcard > .ci { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--status-1); }
.mcard.gcard .kicker { color: var(--accent-strong); }
.mcard.gcard .nt { font-family: var(--read); font-size: 19px; line-height: 1.35; color: var(--accent-strong); margin: 0; }
.mcard .ans-l { margin: 6px 0 0; font-size: 12px; color: var(--ok); }
.bpl textarea { width: 100%; min-height: 70px; border: 1px solid var(--status-1); border-radius: 2px; padding: 6px 8px; background: var(--panel); font: 14px/1.5 var(--ui); color: var(--ink); resize: vertical; }
.bpl .mcard .inl { margin: 6px 0 0; padding: 4px 6px; grid-template-columns: 14px minmax(0, 1fr); }
.bpl .mcard .inl .tx { font-size: 13.5px; } .bpl .mcard .inl .st, .bpl .mcard .inl .ans { display: none; }
.dot-c { position: absolute; right: -8px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 2px var(--accent); cursor: crosshair; opacity: 0; transition: opacity var(--dur-quick); z-index: 2; }
.dot-c::before { content: ""; position: absolute; inset: -10px; }
.bpl:hover .dot-c, .bpl.sel .dot-c { opacity: 1; }
.btools { position: absolute; left: 12px; top: 12px; z-index: 5; display: grid; gap: 2px; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 8px; padding: 4px; }
.btools button { all: unset; cursor: pointer; width: 34px; height: 32px; display: grid; place-items: center; border-radius: 5px; font: 600 13px var(--ui); color: var(--ink-2); }
.btools button:hover { background: var(--hover-fill); color: var(--ink); }
.btools button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.bzoom { position: absolute; left: 12px; bottom: 12px; z-index: 5; display: flex; gap: 2px; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 8px; padding: 4px; font-size: 12px; align-items: center; }
.bzoom button { all: unset; cursor: pointer; min-width: 28px; height: 28px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-2); padding: 0 4px; }
.bzoom button:hover { background: var(--hover-fill); color: var(--ink); }
.bhint { position: absolute; left: 160px; right: 12px; bottom: 14px; z-index: 4; pointer-events: none; display: flex; justify-content: center; }
.bhint span { background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 14px; padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); }
.inside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 14px 20px; display: grid; gap: 12px; align-content: start; }
.inside h3 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; }
.inside .row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px 8px; align-items: start; padding: 7px 8px; border-radius: 3px; cursor: pointer; }
.inside .row:hover { background: var(--hover-fill); }
.inside .row .gl { font-weight: 600; font-size: 12px; padding-top: 2px; }
.inside .row.q .gl { color: var(--pick); } .inside .row.g .gl { color: var(--accent); }

.inside .row .meta { grid-column: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2); }

.bdrawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 100%); z-index: 8; background: var(--surface-float); box-shadow: var(--shadow-float); display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.bdrawer .dh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; }
.bdrawer .dh b { font: 400 18px var(--read); }
.bdrawer .shelf-tabs { margin: 0 14px; }
.bdrawer .list { overflow: auto; padding: 8px 14px 16px; display: grid; gap: 6px; align-content: start; }
.bdrawer .grp { margin: 10px 0 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.bdrawer .it { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 1px; padding: 8px 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }

.apop { position: fixed; z-index: 72; width: min(330px, calc(100vw - 32px)); background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }

.bcover { aspect-ratio: 4 / 3; background-color: var(--board); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 10px 10px; position: relative; overflow: hidden; border-radius: 6px; box-shadow: var(--shadow-pic); }

.bcover svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Questions and goals page */
.qglist { display: grid; gap: 26px; max-width: 900px; }
.qgsec h2 { margin: 0 0 8px; font: 400 21px/1.2 var(--read); }

}

}

  let lo = rows[0].y, hi = rows.at(-1).y; const step = [1, 2, 5, 10, 20, 25, 50, 100, 200].find(s => Math.max(1, hi - lo) / s <= 7) || 500;
  lo = Math.floor(lo / step) * step; hi = Math.ceil((hi === lo ? hi + 1 : hi) / step) * step;
  const ticks = []; for (let y = lo; y <= hi; y += step) ticks.push(y);
  const pct = y => ((y - lo) / (hi - lo)) * 100, grid = ticks.map(t => `<span class="grid-l" style="left:${pct(t)}%"></span>`).join("");
  return `<div class="ctl" data-ph="V2"><div class="ctlin"><div class="tlrow"><span></span><div class="track axis">${ticks.map(t => `<span class="tick-l" style="left:${pct(t)}%">${t}</span>`).join("")}</div></div>${rows.map(({ o, y }) => `<div class="tlrow"><span class="lab"><button data-act="open" data-id="${o.id}" title="${esc(o.title)}">${esc(o.title)}</button></span><div class="track">${grid}<span class="pt" style="left:${pct(y)}%" title="${y}"></span></div></div>`).join("")}</div></div>`;
}

/* ---------- Questions and goals page ---------- */
function hostLink(r) {
  const it = r.item, what = it.type === "board" ? `board <button data-act="openboard" data-id="${it.id}">${esc(it.title)}</button>` : r.at ? `margin note on <button data-act="open" data-id="${it.id}">${esc(it.title)}</button>, ${esc(r.at)}` : `${lower(kindLabel(it))} <button data-act="open" data-id="${it.id}">${esc(it.title || plainBody(it).slice(0, 40))}</button>`;
  const placed = boards().filter(b => b.pl.some(p => p.ref === "q:" + r.key));
  return `<span>in ${what}</span>${placed.map(b => `<span>· placed on <button data-act="openboard" data-id="${b.id}">${esc(b.title)}</button></span>`).join("")}`;
}
function qgRow(r, child) {
  const s = st(r.key, r.kind);
  return `<div class="qgrow ${r.kind === "goal" ? "g" : "q"}${child ? " child" : ""}${done(s.status) ? " done" : ""}"><span class="gl">${r.kind === "goal" ? "◎" : "?"}</span><span class="tx">${esc(r.text)}</span>${stBtn(r)}<div class="host">${hostLink(r)}</div>${s.answer || s.ans.length ? `<div class="host" style="color:var(--ok)">${ansLine(r).replace(/^<div class="ans">|<\/div>$/g, "")}</div>` : ""}</div>`;
}
function renderQG() {
  const all = allInlines(), want = s => S.qf === "all" || (S.qf === "open" ? ["open", "active"].includes(s) : S.qf === "answered" ? ["answered", "reached"].includes(s) : ["parked", "paused", "dropped"].includes(s));
  const goals = all.filter(r => r.kind === "goal"), loose = all.filter(r => r.kind === "question" && !r.goalKey && want(st(r.key, r.kind).status));
  return `${header("qg", "Questions and goals")}
    <p class="small" style="max-width:70ch;margin:-10px 0 16px">Everything you're asking and aiming for, wherever you wrote it: in notes, in Objects, in margin notes and on boards. Each one stays in the thing it was written in.</p>
    <div class="cph-bar" style="margin-bottom:18px"><div class="cph-seg">${[["open", "Open"], ["answered", "Answered"], ["parked", "Parked"], ["all", "All"]].map(([k, t]) => `<button type="button" data-act="qf" data-k="${k}" aria-pressed="${S.qf === k}">${t}</button>`).join("")}</div><span class="cph-fbtn"><button type="button">Topic ▾</button></span><span class="cph-grow"></span><span class="cph-count">${all.filter(r => r.kind === "question" && st(r.key, "question").status === "open").length} open questions · ${goals.filter(g => st(g.key, "goal").status === "active").length} active goals</span></div>
    <div class="qglist">
      <section class="qgsec"><h2>Goals</h2>${goals.map(g => { const qs = all.filter(r => r.goalKey === g.key), d = qs.filter(r => st(r.key, r.kind).status === "answered").length, shown = qs.filter(r => want(st(r.key, r.kind).status)); return (want(st(g.key, "goal").status) || shown.length) ? qgRow(g) + `<p class="qgprog">${d} of ${qs.length} answered</p>` + shown.map(r => qgRow(r, true)).join("") : ""; }).join("") || `<p class="small">No goals here.</p>`}</section>
      <section class="qgsec"><h2>Other questions</h2>${loose.map(r => qgRow(r)).join("") || `<p class="small">Nothing here.</p>`}</section>
    </div>`;
}
