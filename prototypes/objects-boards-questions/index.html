/* ---- touch.css ---- */
/* Touch targets (mobile P7, tablet T-3): on a screen driven by a finger, every control is at least 44 px tall (chips 36 px),
   made with padding or min-height so the visual design stays. Inline text links are exempt (WCAG 2.5.8). Loaded last so
   it wins over the screens' own sizes; measured by docs/superpowers/2026-10-16-mobile-responsive-mockups/tools/touch-sweep.mjs. */
@media (pointer: coarse) {
  /* Library and Graph section tabs, buttons and the search fields. */
  .destination-tab { min-height: var(--m-hit); box-sizing: border-box; display: inline-flex; align-items: center; }
  .button:not(.button-link) { min-height: var(--m-hit); }
  /* A link-style button keeps its drawn size (a 44 px box spaced the item pages' properties apart); its press area grows
     to 44 px around it instead. */
  .button-link { position: relative; }
  .button-link::after { content: ""; position: absolute; inset: -5px -4px; }
  .collection-more { min-width: var(--m-hit); }
  .lsearch input, .lx-search, .gtree-search input, .coll-form-card input[type="text"] { min-height: var(--m-hit); box-sizing: border-box; }

  /* Chips: 36 px. */
  .colls button { display: inline-flex; align-items: center; min-height: 36px; box-sizing: border-box; }

  /* Crumb links and the crumb's collections menu. */
  .library-crumb a { display: inline-block; padding: 13px 0; margin: -13px 0; }
  .cf-crumb-button { padding: 13px 2px; margin: -13px 0; }

  /* A card's ⋯ and the links inside it (topic tag, collection kicker). */
  .card-more { width: var(--m-hit); height: var(--m-hit); margin: -12px -12px -8px 0; }
  .mcard .topic-tag { display: inline-block; padding: 16px 0; margin: -16px 0; }
  .mcard .coll-kicker a { padding: 15px 0; margin: -15px 0; }

  /* The List: each row is a 44 px target, its toggle too. */
  .gtree-title { min-height: var(--m-hit); }
  .gtree-toggle { width: var(--m-hit); height: var(--m-hit); margin: 0 -15px; }

  /* Learn 1.5a details: the pencil shows without a hover, and it, the Lives in pill, the dialog's fields and the
     picker's rows are 44 px. */
  .xd-pencil { opacity: 1; width: var(--m-hit); height: var(--m-hit); }
  .xd-lives:not(.is-plain), .xd-place-btn, .xd-dialog .field-control, .xd-title-input { min-height: var(--m-hit); }
  .xd-place .library-picker input, .xd-place .library-picker li button, .xd-pop input, .xd-pop li button { min-height: var(--m-hit); }

  /* The sheet's grab handle: 20 px drawn, 44 px to a finger (its hit area reaches above the sheet's top edge). */
  .cp-grip { position: relative; }
  .cp-grip::before { content: ""; position: absolute; inset: -24px 0 0; }
}
/* ---- phone.css ---- */
/* The phone shell (spec phone-loci-bar): everything here sits under the phone shell's marker and the compact media
   query, so on iPad and desktop none of it applies. The marker is
   `.app-shell[data-phone-shell]`, which the server renders (so it holds from the first paint), or `html[data-phone-shell]`,
   set after hydration, which also reaches portalled layers (menus, toasts). Values are the prototype's (behaviour.md §0,
   §1.1, §2, §3.7, §4.4, §4.5, §4.8, §9.1), on the app's tokens. */

/* The phone shell's own parts exist only on phones. */
.phone-tb, .phone-drawer-root, .phone-dock { display: none; }

@media (max-width: 699.98px) {
  /* The material: the paper at 80% over a blur; solid when transparency or contrast is reduced (beh §0). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) {
    --phone-material: color-mix(in srgb, var(--paper) 80%, transparent);
  }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    :is(html[data-phone-shell], .app-shell[data-phone-shell]) { --phone-material: var(--paper); }
  }

  /* ---------- Over the Palace: the place pill, the Whole map / Key column, the key and the hint ---------- */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .palace .phone-chrome,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .graph-stage .phone-chrome { position: absolute; inset: 0; pointer-events: none; z-index: 12; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-chrome > * { pointer-events: auto; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-place,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-fabs,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-key,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-hint {
    background: var(--phone-material);
    -webkit-backdrop-filter: blur(20px) saturate(1.5);
    backdrop-filter: blur(20px) saturate(1.5);
    box-shadow: var(--shadow-float);
  }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-place,
    :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-fabs,
    :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-key,
    :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-hint { -webkit-backdrop-filter: none; backdrop-filter: none; }
  }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-place {
    position: absolute; top: 10px; left: 10px; height: 38px; max-width: calc(100% - 90px); box-sizing: border-box;
    padding: 0 14px; border: 0; border-radius: 19px; font: 600 14.5px var(--ui); color: var(--accent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; touch-action: manipulation;
    -webkit-touch-callout: none; user-select: none;
    transition: opacity var(--dur-standard), transform var(--dur-move) var(--ease-entrance);
  }
  /* An extra 4 px of invisible hit margin round the pill. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-place::before { content: ""; position: absolute; inset: -4px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-place:active { transform: scale(0.97); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-place.is-hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-place:focus-visible,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-fabs button:focus-visible { outline: var(--focus-ring); outline-offset: -2px; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-fabs { position: absolute; top: 10px; right: 10px; border-radius: 19px; overflow: hidden; display: grid; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-fabs button {
    width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-2);
    cursor: pointer; touch-action: manipulation;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-fabs button + button { border-top: 1px solid var(--rule); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-fabs button[aria-pressed="true"] { color: var(--accent); }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-key {
    position: absolute; left: 10px; top: 56px; z-index: 11; padding: 10px 12px; border-radius: 14px; font-size: 12.5px;
    display: grid; gap: 6px;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-key[hidden] { display: none; }
  /* The legend's spans stack in the panel instead of sitting in the Map's bottom row. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-key .legend { display: grid; gap: 6px; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-hint {
    position: absolute; left: 50%; bottom: 76px; z-index: 11; margin: 0; transform: translateX(-50%); padding: 7px 14px;
    border-radius: 99px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; pointer-events: none;
    transition: opacity var(--dur-standard);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-hint.is-gone { opacity: 0; }

  /* The things the pill, the column and the Key replace: the trail, the key row and the Map's hint (the bar's find replaces
     the Palace's search box, which is not drawn on the phone). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .palace .palace-hint,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .palace .gtop .legend,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .graph .gtop .legend { display: none; }

  /* ---------- Hold menus (beh §4.4, §4.8) ---------- */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .point-menu-lift {
    position: fixed; inset: 0; z-index: 89; background: color-mix(in srgb, var(--paper) 40%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: phone-fade var(--dur-standard) both;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point {
    z-index: 90; width: auto; min-width: 230px; max-width: calc(100vw - 16px); padding: 0; border-radius: 16px; overflow-x: hidden;
    animation: phone-pop var(--dur-move) var(--ease-spring);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .phead { padding: 12px 16px 10px; border-bottom: 1px solid var(--rule); display: grid; gap: 2px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .phead b { font: 700 19px/1.2 var(--read); color: var(--ink); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .phead small { font-size: 12.5px; color: var(--ink-2); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .mi { min-height: 46px; padding: 0 16px; border-radius: 0; font-size: 16px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .mi + .mi { border-top: 1px solid var(--rule); }
  /* The icon sits at the row's right end, plain (no tile). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .mi .ic { order: 2; width: auto; height: auto; border: 0; background: none; color: var(--ink-2); font-size: 16px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .mi.danger .ic { color: var(--warn); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .cmenu.is-point .msep { height: 7px; margin: 0; background: color-mix(in srgb, var(--ink) 6%, transparent); }
  @media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
    :is(html[data-phone-shell], .app-shell[data-phone-shell]) .point-menu-lift { -webkit-backdrop-filter: none; backdrop-filter: none; background: color-mix(in srgb, var(--paper) 70%, transparent); }
  }

  /* ---------- The place card (beh §3, spec §5.1): in the dock above the bar; the canvas is laid out round its spot ---------- */
  /* The canvas runs down to the bar under the card; the Map and the Palace are told how much of it the card covers. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .main-stage:has(> .graph > .ph-card-spot),
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .main-stage:has(> .palace > .ph-card-spot) {
    display: flex; flex-direction: column; height: calc(100dvh - var(--m-bar)); min-height: 0; overflow: hidden; padding-bottom: 0;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .graph:has(> .ph-card-spot) {
    flex: 1 1 auto; height: auto; min-height: 0; margin: 0 calc(-1 * var(--m-gutter)); padding-bottom: var(--m-tabs);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .graph:has(> .ph-card-spot) .graph-canvas { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .graph:has(> .ph-card-spot) .graph-stage { flex: 1 1 auto; min-height: 0; }
  /* Under the card: the Whole map button stands in for Fit, pinch for zoom, and the Key for the legend (beh §4.5). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .graph:has(> .ph-card-spot) .gtop,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .palace:has(> .ph-card-spot) .palace-row { display: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .palace:has(> .ph-card-spot) { flex: 1 1 auto; height: auto; min-height: 0; margin-bottom: var(--m-tabs); }
  /* The List under the card: its rows scroll clear of it (beh §4.7's 300 px foot). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .graph-list:has(> .ph-card-spot) { padding-bottom: 300px; }

  /* The card sits in the dock's card slot, between the panel and the bar (spec §4.4); it is scoped to the dock because
     Commonplace's loading placeholders also use `.ph-card`. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-dock .ph-card {
    position: relative; box-sizing: border-box; margin: 0; flex: 0 0 auto;
    display: flex; flex-direction: column; overflow: hidden; border-radius: 24px;
    background: var(--surface-float); box-shadow: var(--shadow-float); color: var(--ink);
    transition: height var(--dur-move) var(--ease-entrance), border-radius var(--dur-move) var(--ease-entrance);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card.is-dragging { transition: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] { border-radius: 20px; }
  /* With the keyboard up the card steps aside: hidden, and out of the dock's flow so the bar sits on the keyboard. It keeps
     the dock's width (its 10 px gutters), so its heights are measured as they will be drawn. The same while find or the
     thread sheet is open (beh §1.4). */
  html[data-keyboard][data-phone-shell] .phone-dock .ph-card,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-dock > .phone-dock-card[data-hidden] > .ph-card { visibility: hidden; position: absolute; left: 10px; right: 10px; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-grab {
    position: absolute; top: 0; left: 0; right: 56px; height: 24px; z-index: 1; padding: 0; border: 0; background: none;
    display: grid; place-items: center; cursor: grab; touch-action: none;
  }
  /* The pill sits at the card's centre; the strip stops short of the close button. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-grab > span {
    display: block; width: 36px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 22%, transparent);
    transform: translateX(28px);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-grab:focus-visible { outline: var(--focus-ring); outline-offset: -4px; border-radius: 12px; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-body { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="full"] .ph-card-body { overflow-y: auto; overscroll-behavior: contain; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-head {
    display: flex; align-items: flex-start; gap: 10px; padding: 18px 14px 0 16px; touch-action: none; user-select: none;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-titles { flex: 1 1 auto; min-width: 0; }
  /* Small text is --ink-2, not the prototype's --ink-3 (kicker, peek text, chip counts): --ink-3 fails AA contrast
     (2.5:1), and the tokens rule keeps it off text. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-kicker {
    margin: 0; font: 600 11px var(--ui); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-title {
    margin: 0; display: flex; align-items: baseline; gap: 8px; min-width: 0; font: 500 24px/1.15 var(--read); color: var(--ink);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-title > .ph-dot,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-peek { display: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-peek { flex: 0 0 auto; font: 400 13px var(--ui); color: var(--ink-2); white-space: nowrap; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-close {
    position: relative; flex: 0 0 auto; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 16px;
    display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink-2);
    cursor: pointer; touch-action: manipulation;
  }
  /* A 44 × 44 hit area round the 32 px button. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-close::before { content: ""; position: absolute; inset: -6px; }

  /* Peek: one line; the kicker goes, the dot and the small text show, and the rest keeps its space below the clip. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] .ph-card-head { padding: 17px 10px 0 16px; align-items: center; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] .ph-card-kicker { display: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] .ph-card-title { font-size: 18.5px; align-items: center; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] .ph-card-title > .ph-dot,
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] .ph-card-peek { display: inline-block; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] .ph-card-close { width: 28px; height: 28px; border-radius: 14px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] .ph-card-close::before { inset: -8px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card[data-detent="peek"] :is(.ph-card-meta, .ph-card-making, .ph-acts, .ph-rail) { visibility: hidden; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-dot {
    flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; box-sizing: border-box;
    border: 1px solid var(--ink-3); background: var(--paper);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-dot.s1 { background: var(--status-1); border-color: var(--status-1); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-dot.s2 { background: var(--status-2); border-color: var(--status-2); }
  /* My Focus: a ring round the dot. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-dot.is-focus { box-shadow: 0 0 0 2px var(--surface-float), 0 0 0 3.5px var(--accent); }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-meta {
    margin: 0; padding: 3px 16px 0; min-height: 22px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font: 13.5px var(--ui); color: var(--ink-2);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-status {
    height: 26px; padding: 0 10px; border: 0; border-radius: 13px; display: inline-flex; align-items: center; gap: 6px;
    background: color-mix(in srgb, var(--ink) 6%, transparent); font: 600 12.5px var(--ui); color: var(--ink); cursor: pointer;
  }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-making {
    margin: 12px 14px 0; padding: 10px 12px; border-radius: 14px; background: var(--accent-soft); display: grid; gap: 6px;
    font: 13px var(--ui); color: var(--ink);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-making p { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-making small { color: var(--ink-2); font-size: 12px; }
  /* Jobs carry no percentage (B-6): an indeterminate bar, never a timer. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-making-bar {
    position: relative; display: block; height: 4px; border-radius: 2px; overflow: hidden;
    background: color-mix(in srgb, var(--accent) 22%, transparent);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-making-bar i {
    position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px; background: var(--accent);
    animation: phone-making var(--dur-calm) var(--ease-standard) infinite;
  }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 14px 0; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-act {
    height: 58px; padding: 0; border: 0; border-radius: 14px; display: grid; place-items: center; align-content: center; gap: 3px;
    background: color-mix(in srgb, var(--ink) 5.5%, transparent); color: var(--accent); font: 600 12.5px var(--ui);
    cursor: pointer; touch-action: manipulation; transition: transform var(--dur-quick) var(--ease-spring);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-act:active { transform: scale(0.96); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-act:disabled { color: var(--ink-2); opacity: 0.5; cursor: default; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-rail {
    display: flex; gap: 8px; padding: 12px 14px 14px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-rail::-webkit-scrollbar { display: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-chip {
    height: 38px; padding: 0 12px 0 10px; border: 0; border-radius: 18px; display: inline-flex; align-items: center; gap: 7px;
    white-space: nowrap; background: color-mix(in srgb, var(--ink) 5%, transparent); font: 500 14px var(--ui); color: var(--ink);
    cursor: pointer; touch-action: manipulation; -webkit-touch-callout: none; user-select: none;
  }
  /* A List row takes the hold on the phone: no iOS callout or text selection under the finger (as the chips and the pill). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .gtree-title { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-chip-count { font-size: 12.5px; color: var(--ink-2); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-chip.is-ghost { background: none; border: 1.5px dashed color-mix(in srgb, var(--ink) 28%, transparent); color: var(--ink-2); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-chip.is-accent { color: var(--accent); font-weight: 600; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) :is(.ph-act, .ph-chip, .ph-status, .ph-card-close):focus-visible { outline: var(--focus-ring); outline-offset: 2px; }

  /* Full: the details beneath, in the card's own sections (beh §3.1 "More"). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-more { padding: 6px 2px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-more .dsheet { position: static; width: auto; max-height: none; box-shadow: none; background: none; animation: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-more .backconv { display: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-card-more .cp-sec { padding: 6px 14px 4px; }
}

@media (max-width: 699.98px) and (prefers-reduced-motion: reduce) {
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-dock .ph-card { transition: none; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .ph-making-bar i { animation: none; left: 0; width: 100%; opacity: 0.5; }
}

/* ---------- The top bar and the drawer (spec §4.1-4.3, beh §1.1, §2) ---------- */
@media (max-width: 699.98px) {
  /* The rail's compact bar (brand, capture ring, inline account) goes; the destinations move to the drawer. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .navigation-rail { display: none; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb {
    position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center;
    height: var(--m-bar); padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box;
    border-bottom: 0.5px solid transparent; transition: border-color var(--dur-standard);
  }
  /* The material is painted on a pseudo-element, so the bar is not a backdrop root for its menus. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: var(--phone-material);
    -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb.is-edge { border-bottom-color: color-mix(in srgb, var(--line) 80%, transparent); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-ib {
    width: 44px; height: 44px; justify-self: center; display: grid; place-items: center; padding: 0; border: 0; border-radius: 22px;
    background: none; color: var(--ink); cursor: pointer; touch-action: manipulation;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-ib:active { background: var(--hover-fill); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) :is(.phone-ib, .phone-title):focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-centre { min-width: 0; display: grid; place-items: center; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-slot { display: contents; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-plain {
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 16.5px var(--ui); color: var(--ink);
    opacity: 0; pointer-events: none; transition: opacity var(--dur-standard);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-plain.is-shown { opacity: 1; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-title {
    min-height: 44px; max-width: 100%; padding: 2px 12px; border: 0; border-radius: 14px; display: grid; justify-items: center;
    align-content: center; background: none; color: var(--ink); cursor: pointer; touch-action: manipulation;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-title:active { background: var(--hover-fill); }
  /* The small "Loci" line: --ink-2, not the prototype's --ink-3, which fails AA contrast on text. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-title small { font: 600 10.5px/1.2 var(--ui); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-title b { display: inline-flex; align-items: center; gap: 3px; font: 600 16.5px/1.2 var(--ui); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-right { display: grid; place-items: center; }

  /* ⋯ Options in the top bar: the Palace's Slow turn and Rearrange, opening downward (beh §1.1, §4.8). */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-right .palace-bar-more { width: 44px; height: 44px; border-radius: 22px; font-size: 20px; color: var(--ink); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-right .palace-options .palace-bar-menu {
    top: calc(100% + 8px); bottom: auto; right: 0; z-index: 90; min-width: 230px; max-width: calc(100vw - 16px); gap: 0; padding: 0;
    overflow: hidden; border: 0; border-radius: 16px; background: var(--surface-float); box-shadow: var(--shadow-float);
    animation: phone-pop var(--dur-move) var(--ease-spring); transform-origin: top right;
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-right .palace-bar-menu :is(label, button) { min-height: 46px; padding: 0 16px; border-radius: 0; font: 16px var(--ui); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-tb-right .palace-bar-menu :is(label, button) + :is(label, button) { border-top: 1px solid var(--rule); }

  /* The view menu (beh §4.9): a ✓ slot, the name, the view's icon at the right. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-view-menu .mi { gap: 10px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-view-menu .phone-view-check { width: 18px; height: 18px; display: inline-grid; place-items: center; color: var(--accent); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-view-menu .lbl { flex: 1 1 auto; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-drawer-root { display: block; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-scrim {
    position: fixed; inset: 0; z-index: 50; background: var(--scrim-dialog); opacity: 0; pointer-events: none;
    transition: opacity var(--dur-standard);
  }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-drawer-root.is-open .phone-scrim { opacity: 1; pointer-events: auto; }

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-drawer-h { margin: 18px 22px 6px; font: 600 11.5px var(--ui); letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-drawer-recent ul { margin: 0; padding: 0 10px; list-style: none; display: grid; gap: 2px; }

  /* ---------- The dock and the Loci bar (spec §4.4, beh §1.4-1.5) ---------- */
  /* The dock stands on the keyboard (--m-kb) and over the safe area; the bar's 54 px and its 8 px gaps are --m-tabs, which
     pages and the place card clear. Only its children take pointers, so the canvas under its gaps stays live. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-dock {
    position: fixed; left: 0; right: 0; bottom: max(var(--m-kb), 0px); z-index: 40; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 8px; padding: 0 10px calc(env(safe-area-inset-bottom, 0px) + 8px); pointer-events: none;
  }
  /* With the keyboard up the bar sits right on it (beh §1.3). The marker pair outranks the `:is()` rule above. */
  html[data-keyboard][data-phone-shell] .phone-dock { padding-bottom: 8px; }
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-dock > * { pointer-events: auto; }
  /* The card slot adds no box (and so no gap) of its own: the card is the dock's item. */
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-dock > .phone-dock-card { display: contents; }

  /* The mini player (spec §7.2, beh §7.3): the graph player's dock while minimised, in the dock above the bar; hidden while
     finding or naming (its surface stays mounted, so the audio carries on). */

    border-radius: 18px; background: var(--phone-material); -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5);
    box-shadow: var(--shadow-float); color: var(--ink);

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-mini-poster * { max-width: none; }

  /* A 2 px progress line along the foot, inset 14 px each side: accent on accent at 15%. */

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-field { flex: 1 1 auto; min-width: 0; height: 42px; display: flex; align-items: center; gap: 6px; padding-left: 6px; }
  /* 16 px, so iOS never zooms (beh §1.5). The placeholder is --ink-2: the prototype's --ink-3 fails AA contrast. */

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-finds {

  :is(html[data-phone-shell], .app-shell[data-phone-shell]) .phone-reply {

  /* A 28 px ✕ with a 44 px hit area. */

@keyframes phone-making { from { left: -40%; } to { left: 100%; } }

@keyframes phone-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes phone-rise { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes phone-sheet-in { from { transform: translateY(105%); } to { transform: none; } }
@keyframes phone-ring { from { transform: scale(1); opacity: 0.7; } to { transform: scale(1.5); opacity: 0; } }
@keyframes phone-wave { 0%, 100% { height: 5px; } 50% { height: 18px; } }
@keyframes phone-pop { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: scale(1); } }

/* ---- photo-viewer.css ---- */
/* Phase 2, the photo viewer (spec docs/superpowers/specs/2026-10-24-photo-viewer-design.md): the zoom
   bar, the zoomed photo, full screen on a dark mat (PH-D1), the facts block and the keys line. Its own file, imported
   after library.css, so it stays clear of the header work (Phase 1). Every class is prefixed `pz-`, or keyed on
   `data-zoom` / `data-fs`, which only the viewer sets. Prototype: `.qv-hud`, `.facts`, `.qv.fs`, `.fs-info`, `.keys`. */

/* The zoom window: the quick view's frame or the Image page's canvas. At fit a finger still scrolls the view (and the
   quick view's swipe still steps or closes); zoomed, every touch belongs to the photo. */
[data-zoom] { touch-action: pan-y; }
[data-zoom="zoomed"] { touch-action: none; cursor: grab; }
[data-zoom="zoomed"][data-zoom-panning] { cursor: grabbing; }
[data-zoom] img { -webkit-user-drag: none; user-select: none; }
/* Buttons and keys animate the zoom; the wheel, a pinch and a drag follow the hand. Reduced motion: --dur-* are 1 ms. */
.pz-smooth { transition: transform var(--dur-standard) var(--ease-standard); }

/* The zoom bar (the prototype's .qv-hud): light in both themes, over the photo. */
.pz-bar { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; align-items: center;
  max-width: calc(100% - 20px); box-sizing: border-box; padding: 4px; border-radius: 8px; background: var(--media-control); box-shadow: var(--shadow-media-control);
  color: var(--media-control-ink); font-family: var(--ui); cursor: default; touch-action: manipulation; }
.pz-bar button { all: unset; box-sizing: border-box; cursor: pointer; height: 28px; min-width: 28px; padding: 0 6px; display: grid; place-items: center; border-radius: 5px; font-size: 12.5px; font-weight: 500; }
.pz-bar button:hover { background: var(--media-control-hover); }
.pz-bar button[aria-pressed="true"] { background: var(--media-control-ink); color: var(--on-media); }
.pz-bar button:focus-visible { outline: 2px solid var(--media-control-focus); }
.pz-readout { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--media-control-ink-2); }
.pz-sep { width: 1px; height: 18px; background: var(--media-control-rule); }
/* The bar shows on hover and focus with a pointer, always on touch. */
@media (hover: hover) {
  .qv-media .pz-bar, .pz-canvas .pz-bar { opacity: 0; transition: opacity var(--dur-quick) var(--ease-standard); }
  .qv-media:hover .pz-bar, .qv-media:focus-within .pz-bar, .qv-media[data-zoom="zoomed"] .pz-bar,
  .pz-canvas:hover .pz-bar, .pz-canvas:focus-within .pz-bar, .pz-canvas[data-zoom="zoomed"] .pz-bar { opacity: 1; }
}

/* The Image page's canvas zooms in place: zoom-in at fit, zoom-out when zoomed (a click goes back). */
.ipage .image-canvas.pz-canvas { position: relative; cursor: zoom-in; }
.ipage .image-canvas.pz-canvas[data-zoom="zoomed"] { cursor: zoom-out; }
.ipage .image-canvas.pz-canvas[data-zoom][data-zoom-panning] { cursor: grabbing; }
.ipage .image-canvas.pz-canvas .pz-bar button { cursor: pointer; }

/* Full screen (PH-D1): a dark mat, the panel hidden, the photo as large as the screen. */
.qv[data-fs] { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); gap: 0; padding: 0; overflow: hidden; background: var(--fs-mat); --qv-max-h: 100vh; --qv-max-h: 100dvh; }
.qv[data-fs] .qv-panel, .qv[data-fs] .qv-thumbs { display: none; }
.qv[data-fs] .qv-media { border-radius: 0; box-shadow: none; background: transparent; }
/* The photo takes focus in full screen (so the keys keep working); the dark mat is its own indicator. */
.qv-media[data-zoom]:focus { outline: none; }
.pz-fs-info { position: absolute; left: 16px; top: 14px; z-index: 3; margin: 0; color: var(--fs-ink); font-size: 13px; text-shadow: var(--fs-text-shadow); pointer-events: none; }
.pz-fs-info b { display: block; font: 400 18px var(--read); }

/* The facts block (the prototype's dl.facts). */
.qv .pz-facts { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 12.5px; align-items: baseline; }
.qv .pz-facts div { display: contents; }
.qv .pz-facts dt { color: var(--text-muted); }
.qv .pz-facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.qv .pz-keys { margin: 0; font-size: 11.5px; line-height: 1.8; color: var(--text-muted); }
.qv .pz-keys kbd { font: 11px var(--ui); padding: 0 4px; border: 1px solid var(--rule); border-radius: 3px; background: var(--surface-panel); color: var(--text-muted); }
/* No keys on a touch screen. */
@media (hover: none) { .qv .pz-keys { display: none; } }
/* ---- photo-wall.css ---- */
/* ======================================================================================================== */
/* The photo wall (photo wall spec §6, slice 3B; the photos prototype's `.pwall`, `.ph`, `.pp`, `.caps-hover`,        */
/* `.seg.icons` and the display popover), on Studiolo's tokens. photo-wall.tsx positions every tile from the stored   */
/* sizes, so nothing here sizes a picture; it only paints.                                                            */
/* ======================================================================================================== */

/* `data-photo-wall` is set by LibraryWall: a `:has(> .pw)` here made every page of photos restyle the whole wall (the
   2,000-photo speed check). Under the photo wall the section stacks the capture box above the wall, as the one-line bar phones and touch screens
   already show (L-1, T-6), instead of a masonry cell; open, it spreads across the wall in place, as on touch screens. */
.library-wall .mason[data-photo-wall] { display: flex; flex-direction: column; align-items: stretch; gap: 20px; }
.library-wall .mason[data-photo-wall] > .cap-card { width: 100%; aspect-ratio: auto; height: 52px; min-height: 0; }
.library-wall .mason[data-photo-wall] > .cap-card .cap-box:not([data-phase="open"]) { height: 52px; }
.library-wall .mason[data-photo-wall] > .cap-card .cap-box:not([data-phase="open"]) .cap-idle-prompt {
  flex-direction: row; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px 0 14px;
}
.library-wall .mason[data-photo-wall] > .cap-card .cap-idle-main { font-size: 17px; }
.library-wall .mason[data-photo-wall] > .cap-card .cap-box:not([data-phase="open"]) .cap-foot { display: none; }
.library-wall .mason[data-photo-wall] > .cap-card .cap-box:not([data-phase="open"]) .cap-idle-prompt::after {
  content: "+"; flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-size: 18px;
}
@media (min-width: 700px) {
  .library-wall .mason[data-photo-wall] > .cap-card:has(.cap-box[data-phase="open"]) { height: auto; }
  .library-wall .mason[data-photo-wall] .cap-box[data-phase="open"] { width: 100%; height: min(var(--cap-h, 560px), 48dvh); }
}

/* A first visit is laid out at 1,184 px on the server, so a phone's page must not scroll sideways before hydration lays it
   out at its own width: the wall clips what passes 16 px beyond it (the page's gutter), which leaves room for a tile's

/* ---------- questions and goals: one parser, every host ---------- */
function parse(body) {
  const out = [], n = { question: 0, goal: 0 };
  String(body || "").split(/\n\s*\n/).forEach(p => { const m = /^@(question|goal)\s+([\s\S]+)$/i.exec(p.trim()); if (m) { const kind = m[1].toLowerCase(); out.push({ kind, text: m[2].replace(/\s+/g, " ").trim(), n: n[kind]++ }); } });
  return out;
}
function allInlines() {
  const out = [];
  for (const it of D().items) {
    const add = (list, hk, at) => { let goal = null; list.forEach(x => { const key = `${hk}:${x.kind}:${x.n ?? x.id}`; out.push({ key, kind: x.kind, text: x.text, item: it, at, goalKey: x.kind === "question" ? goal : null }); if (x.kind === "goal") goal = key; }); };
    if (it.type === "board") add(it.inl.map(x => ({ ...x, n: x.id })), it.id, null);
    else { add(parse(it.body), it.id, null); it.margin.forEach((m, i) => add(parse(m.body), `${it.id}/m${i}`, m.at)); }
  }
  return out;
}
const INL = key => allInlines().find(x => x.key === key);
function st(key, kind) { if (!ST[key]) ST[key] = { status: kind === "goal" ? "active" : "open", answer: "", ans: [] }; return ST[key]; }
const done = s => ["answered", "reached", "parked", "dropped"].includes(s);
function inCount(it) { const l = allInlines().filter(x => x.item === it); return { q: l.filter(x => x.kind === "question" && st(x.key, x.kind).status === "open").length, g: l.filter(x => x.kind === "goal" && st(x.key, x.kind).status === "active").length }; }
function ftIn(it) { const c = inCount(it); return c.q || c.g ? `<span class="ft-in" data-ph="Q1">${c.q ? `<span class="cq">? ${c.q}</span>` : ""}${c.g ? `<span class="cg">◎ ${c.g}</span>` : ""}</span>` : ""; }
function stBtn(r) { const s = st(r.key, r.kind); return `<button class="st ${s.status}" data-act="stmenu" data-k="${esc(r.key)}" data-ph="Q2">${cap(s.status)} ▾</button>`; }
function ansLine(r) {
  const s = st(r.key, r.kind);
  if (r.kind !== "question" || (!s.answer && !s.ans.length)) return "";

function card(it, opts = {}) {

  const open = `data-act="open" data-id="${it.id}"`;
  const ft = (extra = "") => `<div class="ft"><div class="ft-meta">${extra}${topicFt(it)}${notesFt(it)}${ftIn(it)}</div>${more}</div>`;
  if (it.type === "quote") return `<article class="mcard q" data-frame="paper" data-kind="quote"><div class="ci"><div class="body"><div class="quote-glyph" aria-hidden="true">“</div><p class="qt"><a class="mcard-link" href="#" ${open}>${esc(it.body)}</a></p>${collKicker(it)}<p class="src"><b>${esc(it.src.b)}</b> · <em>${esc(it.src.em)}</em><span class="loc-tag">${esc(it.src.loc)}</span></p></div>${ft(it.topics.length ? "" : `<span class="ft-shape">Quote</span>`)}</div></article>`;
  if (it.type === "note") {

    return `<article class="mcard note" data-frame="paper" data-kind="note"><div class="ci"><div class="body"><p class="nt"><a class="mcard-link" href="#" ${open}>${esc(plainBody(it))}</a></p>${collKicker(it)}</div>${ft()}</div></article>`;

  if (it.type === "image") return `<article class="mcard" data-frame="picture" data-kind="image"><div class="ci"><div class="im pic w"><img alt="" src="${MEDIA[it.media]}"></div><div class="cap-line"><div class="t"><div class="body"><h2 class="mcard-title"><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></h2>${collKicker(it)}<p>${esc(it.desc)}</p></div><div class="ft"><div class="ft-meta">${topicFt(it)}${ftIn(it)}</div></div></div>${more}</div></div></article>`;

    return `<article class="mcard" data-frame="paper" data-kind="source"><div class="ci"><div class="body"><p class="lk">${lk}${esc(it.meta)}</p><h2 class="mcard-title"><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></h2>${collKicker(it)}<p class="why">${esc(it.desc)}</p></div>${ft()}</div></article>`;

    return `<article class="mcard" data-frame="picture" data-kind="board" data-ph="B1"><div class="ci"><div class="pic bcover" data-act="openboard" data-id="${it.id}">${pc}</div><div class="cap-line"><div class="t"><div class="body"><p class="kicker">Board · ${it.pl.length} entries · ${it.arrows.length} arrows</p><h2 class="mcard-title"><a class="mcard-link" href="#" data-act="openboard" data-id="${it.id}">${esc(it.title)}</a></h2><p>${esc(it.inl[0].text)}</p></div><div class="ft"><div class="ft-meta">${topicFt(it)}${ftIn(it)}</div></div></div>${more}</div></div></article>`;
  }
  const c = COL(it.col);
  if (c.layout === "portrait") {
    const t = c.card.map(id => fieldText(FLD(c, id), it.v[id])).filter(Boolean);

  }
  const kind = `${c.label}${cardLine(it) ? " · " + cardLine(it) : ""}`;
  const chips = c.fields.filter(f => f.t === "choice" && !c.card.includes(f.id)).flatMap(f => arr(it.v[f.id]).map(v => `<span class="cc" data-ph="F1">${esc(v)}</span>`)).join("");

  return `<article class="mcard" data-frame="paper" data-kind="thing"><div class="ci"><div class="body"><p class="kicker">${esc(c.name)}${c.clinical ? ` · <span style="color:var(--warn)">Clinical</span>` : ""}</p><h2 class="mcard-title"><a class="mcard-link" href="#" ${open}>${esc(it.title)}</a></h2><p class="mcard-kind">${esc(kind)}</p>${it.desc ? `<p>${esc(it.desc)}</p>` : ""}${chips ? `<p>${chips}</p>` : ""}</div>${ft()}</div></article>`;

function timeline(c, items) {
  const f = c.fields.find(x => x.o.year);

  lo = Math.floor(lo / step) * step; hi = Math.ceil((hi === lo ? hi + 1 : hi) / step) * step;
  const ticks = []; for (let y = lo; y <= hi; y += step) ticks.push(y);
  const pct = y => ((y - lo) / (hi - lo)) * 100, grid = ticks.map(t => `<span class="grid-l" style="left:${pct(t)}%"></span>`).join("");
  return `<div class="ctl" data-ph="V2"><div class="ctlin"><div class="tlrow"><span></span><div class="track axis">${ticks.map(t => `<span class="tick-l" style="left:${pct(t)}%">${t}</span>`).join("")}</div></div>${rows.map(({ o, y }) => `<div class="tlrow"><span class="lab"><button data-act="open" data-id="${o.id}" title="${esc(o.title)}">${esc(o.title)}</button></span><div class="track">${grid}<span class="pt" style="left:${pct(y)}%" title="${y}"></span></div></div>`).join("")}</div></div>`;

function hostLink(r) {

    <p class="small" style="max-width:70ch;margin:-10px 0 16px">Everything you're asking and aiming for, wherever you wrote it: in notes, in Objects, in margin notes and on boards. Each one stays in the thing it was written in.</p>

  const t = e.target;
  if (t.dataset?.qedit) { const [bid, , id] = t.dataset.qedit.split(":"), x = I(bid).inl.find(y => y.id === id); x.text = t.value.trim() || x.text; S.editing = null; setTimeout(render, 0); }

});

/* ---------- the @ menu (Q1) ---------- */
let atState = null;

    const k = e.key.toLowerCase();

    else if (e.key === "+") { S.drawer = !S.drawer; render(); } else if (k === "0") fit();
    else if ((e.key === "Delete" || e.key === "Backspace") && S.sel) { const b = I(S.board); b.pl = b.pl.filter(p => p.id !== S.sel); b.arrows = b.arrows.filter(a => a.from !== S.sel && a.to !== S.sel); S.sel = null; render(); toast("Removed from the board. It's still in your Commonplace."); }
  }

/* ---------- moving between entries: one history, so ← always names where it goes ---------- */
function pushHist() { S.hist.push({ screen: S.screen, item: S.item, board: S.board }); }
function openEntry(id) { const it = I(id); if (!it) return; closeMenu(); pushHist(); if (it.type === "board") { S.board = it.id; go("board", true); return; } S.item = id; S.ed = null; S.editing = null; go(isLong(it) ? "note" : "item", true); }
