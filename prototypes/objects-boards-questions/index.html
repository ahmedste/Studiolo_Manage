<style>
/* Layout: the real Commonplace (studiolo's own CSS at b5eeee2, as in prototypes/objects-phases) with three views that
   share one store: a board canvas with its Inside panel, an item page (Object, note, Source) and the Questions and
   goals list. Questions in --pick, goals in --accent-soft, as the Boards and Questions designs chose. */

:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --status-1: #c9d4f1; --status-2: #6e86d0; --status-3: #1e3e9e; --accent: #1e3e9e;
  --surface-float: #fbfbf9; --scrim-blur: rgba(243, 243, 239, 0.72); --shade: rgb(34, 48, 58);
  --accent-soft: #e6ebf8; --accent-strong: #142b73; --warn: #9a3b2e; --warn-soft: #f6e4df; --ok: #2f6b4a;
  --quote-paper: #faf8f2; --quote-rule: #eae5d9; --note-paper: #faf9f5; --hover-fill: #ecece6;
  --myfocus-ink: #8a5a00; --myfocus-paper: #fbf3df; --myfocus-rule: #ecd9a8;
  --on-ink: #ffffff; --on-accent: #ffffff; --surface-mat: #e4e4de;
  --cover-paper: #202e38; --cover-ink: #edeff6; --on-media: #ffffff; --media-badge: rgba(0, 0, 0, 0.68);
  /* Proposed (F1): three more choice accents beside s1–s3, in the same family. */
  --c0-bg: #e6ebf8; --c0-fg: #23408f; --c1-bg: #e2efe7; --c1-fg: #2d6544; --c2-bg: #fbf3df; --c2-fg: #8a5a00;
  --c3-bg: #f6e4df; --c3-fg: #93392f; --c4-bg: #ece5f5; --c4-fg: #5b3f8a; --c5-bg: #ebebe6; --c5-fg: #44535e;
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, 0.07), 0 8px 22px rgba(34, 48, 58, 0.09);
  --shadow-lift: 0 2px 4px rgba(34, 48, 58, 0.08), 0 16px 36px rgba(34, 48, 58, 0.15);
  --shadow-float: 0 0 0 1px transparent, 0 1px 2px rgba(34, 48, 58, 0.06), 0 18px 48px rgba(34, 48, 58, 0.16);
  --surface-panel: var(--panel); --surface-board: var(--board); --surface-page: var(--paper); --rule: var(--line);
  --text: var(--ink); --text-muted: var(--ink-2); --text-decor: var(--ink-3);
  --ui: "Instrument Sans", system-ui, sans-serif; --read: "Newsreader", Georgia, serif; --focus-ring: 2px solid var(--accent);
  --ease-standard: cubic-bezier(0.2, 0.8, 0.2, 1); --dur-instant: 80ms; --dur-quick: 130ms; --dur-standard: 220ms;
  --lift: 2px; --press-scale: 0.985; --rail-w: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
    --surface-float: #232e37; --scrim-blur: rgba(19, 26, 32, 0.8); --shade: rgb(0, 0, 0);
    --accent-soft: #263156; --accent-strong: #c3cff8; --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2;
    --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c; --hover-fill: #2a353f;
    --myfocus-ink: #e8c27a; --myfocus-paper: #33291a; --myfocus-rule: #5a4824;
    --on-ink: #131a20; --on-accent: #131a20; --surface-mat: #0d1317;
    --c0-bg: #263156; --c0-fg: #b7c6f7; --c1-bg: #1f3329; --c1-fg: #94d0ad; --c2-bg: #33291a; --c2-fg: #e8c27a;
    --c3-bg: #3a2521; --c3-fg: #eea597; --c4-bg: #2e2640; --c4-fg: #c7b2ec; --c5-bg: #2a353f; --c5-fg: #b3bec6;
    --shadow-pic: 0 1px 2px rgba(0, 0, 0, 0.32), 0 8px 22px rgba(0, 0, 0, 0.26);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.34), 0 16px 36px rgba(0, 0, 0, 0.4);
    --shadow-float: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 1px 2px transparent, 0 18px 48px rgba(0, 0, 0, 0.42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
  --surface-float: #232e37; --scrim-blur: rgba(19, 26, 32, 0.8); --shade: rgb(0, 0, 0);
  --accent-soft: #263156; --accent-strong: #c3cff8; --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2;
  --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c; --hover-fill: #2a353f;
  --myfocus-ink: #e8c27a; --myfocus-paper: #33291a; --myfocus-rule: #5a4824;
  --on-ink: #131a20; --on-accent: #131a20; --surface-mat: #0d1317;
  --c0-bg: #263156; --c0-fg: #b7c6f7; --c1-bg: #1f3329; --c1-fg: #94d0ad; --c2-bg: #33291a; --c2-fg: #e8c27a;
  --c3-bg: #3a2521; --c3-fg: #eea597; --c4-bg: #2e2640; --c4-fg: #c7b2ec; --c5-bg: #2a353f; --c5-fg: #b3bec6;
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, 0.32), 0 8px 22px rgba(0, 0, 0, 0.26);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, 0.34), 0 16px 36px rgba(0, 0, 0, 0.4);
  --shadow-float: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 1px 2px transparent, 0 18px 48px rgba(0, 0, 0, 0.42);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-instant: 1ms; --dur-quick: 1ms; --dur-standard: 1ms; } }

[hidden] { display: none !important; }
html, body { height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

/* ---- prototype band (not app UI) ---- */
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--board); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 12.5px; }
.band b.tag { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.seg { display: inline-flex; background: var(--paper); border-radius: 7px; padding: 2px; gap: 2px; box-shadow: inset 0 0 0 1px var(--line); }
.seg button { border: 0; background: transparent; border-radius: 5px; padding: 3px 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.band .adds { flex: 1 1 320px; color: var(--ink-2); min-width: 0; }
.band .adds b { color: var(--ink); font-weight: 500; }
.band label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
.new { position: relative; }
.marks .new::after { content: attr(data-new); position: absolute; top: -9px; right: -6px; z-index: 4; font: 600 9.5px/1 var(--ui); letter-spacing: .04em; text-transform: uppercase; padding: 3px 5px; border-radius: 3px; background: var(--myfocus-paper); color: var(--myfocus-ink); box-shadow: inset 0 0 0 1px var(--myfocus-rule); pointer-events: none; white-space: nowrap; }
.marks .new { box-shadow: 0 0 0 1.5px var(--myfocus-rule); border-radius: 3px; }

/* ---- shell (shell.css) ---- */
.app { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: calc(100% - var(--band-h, 46px)); }
.rail { border-right: 1px solid var(--line); background: var(--paper); padding: 14px 9px; display: flex; flex-direction: column; gap: 2px; padding-left: max(9px, env(safe-area-inset-left, 0px)); }
.rail .brand { width: 40px; height: 40px; display: grid; place-items: center; font: 500 21px/1 var(--read); color: var(--ink); margin-bottom: 10px; }
.rail a { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; color: var(--ink-2); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); }
.rail svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.stage { min-width: 0; padding: 30px max(16px, env(safe-area-inset-right, 0px)) 80px 36px; }
.wrap { max-width: 1180px; margin-inline: auto; }
.destination-header { margin: -4px 0 26px; border-bottom: 1px solid var(--line); }
.destination-crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; min-height: 16px; margin: 0 0 12px; color: var(--ink-2); font-size: 12.5px; }
.destination-crumb strong { color: var(--ink); font-weight: 500; }
.destination-crumb i { font-style: normal; font-size: 11px; color: var(--text-muted); }
.destination-crumb button { all: unset; cursor: pointer; } .destination-crumb button:hover { color: var(--accent); }
.destination-tabs { display: flex; align-items: flex-end; gap: 2px; overflow-x: auto; margin-bottom: -1px; }
.destination-tab { flex: 0 0 auto; padding: 7px 12px 9px; border-bottom: 2px solid transparent; color: var(--ink-2); font-size: 13.5px; text-decoration: none; white-space: nowrap; background: none; border-top: 0; border-left: 0; border-right: 0; cursor: pointer; }
.destination-tab[aria-current="page"] { border-bottom-color: var(--accent); color: var(--ink); font-weight: 500; }
.button { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; gap: 8px; padding: 8px 14px; border: 0; border-radius: 2px; background: var(--accent); color: var(--on-accent); font-weight: 500; cursor: pointer; white-space: nowrap; }
.button-quiet { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
.button-link { min-height: 0; padding: 8px 2px; background: transparent; color: var(--ink-2); font-weight: 400; }
.button.sm { min-height: 30px; padding: 4px 10px; font-size: 13px; }
.button:disabled { cursor: not-allowed; opacity: .56; }
.small { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

/* ---- header type row (library.css .cph) ---- */
.cph-types { display: flex; align-items: center; gap: 4px; min-width: 0; margin: 0 0 18px; padding: 2px; overflow-x: auto; scrollbar-width: none; }
.cph-type, .cph-coll { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 12px; border: 0; border-radius: 17px; background: none; font-size: 14px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.cph-type:hover, .cph-coll:hover { background: var(--hover-fill); color: var(--ink); }
.cph-type[aria-current="true"] { background: var(--ink); color: var(--paper); }
.cph-coll[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); }
.cph-type .n, .cph-coll .n { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cph-type[aria-current="true"] .n { color: inherit; opacity: .6; }
.cph-chev { color: var(--ink-3); padding: 0 2px; }
.cph-type svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.4; }

/* ---- collection head ---- */
.chead { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; margin: 0 0 18px; }
.chead .t { min-width: 0; flex: 1 1 380px; }
.ip-kicker, .kicker { margin: 0 0 6px; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.chead h1 { margin: 0; font: 400 clamp(30px, 4.2vw, 40px)/1.08 var(--read); letter-spacing: -0.012em; }
.chead p.lead { margin: 10px 0 0; max-width: 62ch; font: 17px/1.55 var(--read); color: var(--ink-2); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.shelf-tabs { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; border-bottom: 1px solid var(--line); padding-bottom: 8px; align-items: center; }
.shelf-tabs button { all: unset; font-size: 13px; cursor: pointer; color: var(--ink-2); padding: 4px 6px; }
.shelf-tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); }
.shelf-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; align-items: center; }
.chip { all: unset; font-size: 12.5px; padding: 4px 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.chip:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 3px; font-size: 13px; background: var(--warn-soft); color: var(--warn); margin: 0 0 18px; }
.banner.info { background: var(--accent-soft); color: var(--accent-strong); }

/* ---- cards (library.css .mcard) ---- */
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 22px 16px; align-items: start; }
.mcard { background: var(--surface-panel); box-shadow: inset 0 0 0 1px var(--rule); cursor: pointer; position: relative; margin: 0; display: block; width: 100%; min-width: 0; box-sizing: border-box; border-radius: 2px; transition: box-shadow var(--dur-quick) var(--ease-standard), transform var(--dur-quick) var(--ease-standard); text-align: left; border: 0; padding: 0; color: inherit; }
.mcard:hover { box-shadow: inset 0 0 0 1px var(--text-decor); }
.mcard .body { padding: 14px 15px 12px; }
.mcard .mcard-title { font-size: 14px; font-weight: 500; line-height: 1.35; margin: 0 0 4px; overflow-wrap: anywhere; }
.mcard p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; overflow-wrap: anywhere; }
.mcard .mcard-kind { font-size: 11.5px; color: var(--ink-2); margin: 0 0 6px; }
.mcard .ft { display: flex; align-items: center; gap: 6px; padding: 8px 14px 10px; font-size: 11.5px; color: var(--ink-2); line-height: 1; border-top: 1px solid color-mix(in srgb, var(--rule) 50%, transparent); }
.mcard .ft .dot, .tdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--ink-3); background: var(--paper); display: inline-block; }
.dot.s1, .tdot.s1 { background: var(--status-1); border-color: var(--status-1); }
.dot.s2, .tdot.s2 { background: var(--status-2); border-color: var(--status-2); }
.mcard[data-frame="paper"] { background: none; box-shadow: none; }
.mcard[data-frame="paper"] > .ci { background: var(--surface-panel); box-shadow: inset 0 0 0 1px var(--rule); border-radius: 2px; transition: transform var(--dur-quick) var(--ease-standard), box-shadow var(--dur-quick) var(--ease-standard); }
.mcard[data-frame="paper"]:hover > .ci { transform: translateY(calc(var(--lift) * -1)); box-shadow: inset 0 0 0 1px var(--text-decor), var(--shadow-pic); }
.mcard[data-frame="picture"] { background: none; box-shadow: none; }
.mcard[data-frame="picture"] .pic { border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-pic); aspect-ratio: 4 / 3; background: var(--surface-mat); transition: transform var(--dur-quick) var(--ease-standard), box-shadow var(--dur-quick) var(--ease-standard); }
.mcard[data-frame="picture"]:hover .pic { transform: translateY(calc(var(--lift) * -1)); box-shadow: var(--shadow-lift); }
.mcard .pic svg { width: 100%; height: 100%; display: block; }
.mcard .cap-line { padding: 9px 2px 0; }
.mcard .cap-line .mcard-title { font-size: 13.5px; margin: 0; }
.mcard .cap-line p { margin: 3px 0 0; font-size: 12px; }
.mcard .person-head { display: flex; gap: 12px; align-items: center; margin: 0 0 6px; }
.mcard .person-name p { margin: 3px 0 0; }
.person-mark { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex: none; display: grid; place-items: center; background: var(--surface-board); box-shadow: inset 0 0 0 1px var(--rule); font-family: var(--read); font-size: 16px; color: var(--text-muted); }
.mcard .mcard-title.per { font-family: var(--read); font-size: 19px; font-weight: 400; line-height: 1.2; }
.mcard .kicker { margin: 0 0 5px; }
.mcard .cv { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 0; }

/* proposed: choice chips (F1) */
.cc { display: inline-flex; align-items: center; padding: 0 7px; border-radius: 9px; font-size: 11.5px; line-height: 19px; white-space: nowrap; }
.c0 { background: var(--c0-bg); color: var(--c0-fg); } .c1 { background: var(--c1-bg); color: var(--c1-fg); } .c2 { background: var(--c2-bg); color: var(--c2-fg); }
.c3 { background: var(--c3-bg); color: var(--c3-fg); } .c4 { background: var(--c4-bg); color: var(--c4-fg); } .c5 { background: var(--c5-bg); color: var(--c5-fg); }

/* ---- item page (library.css .ipage) ---- */
.ipage { width: 100%; max-width: 1180px; margin-inline: auto; }
.ip-top { position: sticky; top: calc(var(--band-h, 46px) + env(safe-area-inset-top, 0px)); z-index: 6; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 0; background: var(--surface-page); }
.ip-back { all: unset; cursor: pointer; display: inline-flex; align-items: center; padding: 6px 9px; margin-left: -9px; border-radius: 3px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.ip-back:hover { color: var(--ink); background: var(--hover-fill); }
.ip-crumb { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ip-saved { margin-left: auto; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.ip-more { all: unset; box-sizing: border-box; cursor: pointer; width: 30px; height: 28px; display: grid; place-items: center; border-radius: 3px; color: var(--ink-2); flex-shrink: 0; }
.ip-more:hover { background: var(--hover-fill); color: var(--ink); }
.ip-grid { display: grid; grid-template-columns: minmax(0, 820px) 290px; gap: 48px; justify-content: space-between; align-items: start; margin-top: 14px; }
.ip-grid.top { grid-template-columns: minmax(0, 820px); }
.ip-main { min-width: 0; }
.ip-rail { position: sticky; top: calc(var(--band-h, 46px) + 64px); align-self: start; min-width: 0; font-size: 13px; }
.ip-rh { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.prop { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.props .prop:last-of-type { border-bottom: 1px solid var(--line); }
.prop > span { color: var(--ink-2); }
.prop-value { color: var(--ink); line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.prop-group { margin: 14px 0 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.props.inline { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); column-gap: 28px; margin: 22px 0 0; }
.props.inline .prop { border-bottom: 0; }
.rail-actions { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn-open-graph { font-size: 12.5px; color: var(--accent); text-decoration: none; }
.chip-rel { all: unset; cursor: pointer; font-size: 12px; padding: 3px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; color: var(--ink-2); display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-rel:hover { background: var(--surface-panel); border-color: var(--accent); color: var(--accent); }
.rel-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.addv { all: unset; cursor: pointer; font-size: 12px; color: var(--ink-3); padding: 2px 6px; border: 1px dashed var(--line); border-radius: 2px; }
.addv:hover { color: var(--accent); border-color: var(--accent); }
.ed { outline: none; border-radius: 2px; display: inline-block; min-width: 30px; }
.ed:hover { background: var(--hover-fill); box-shadow: 0 0 0 3px var(--hover-fill); }
.ed:focus { background: transparent; box-shadow: 0 2px 0 var(--accent); }
.ed:empty::before { content: attr(data-ph); color: var(--ink-3); }
.muted { color: var(--ink-3); }
.tick { all: unset; cursor: pointer; width: 16px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--ink-3); display: inline-grid; place-items: center; font-size: 11px; color: var(--on-ink); }
.tick.y { background: var(--ok); box-shadow: none; }
.ip-title { margin: 0; font: 400 clamp(30px, 4.2vw, 42px)/1.08 var(--read); letter-spacing: -0.012em; outline: none; border-radius: 2px; }
.ip-title:hover { background: var(--hover-fill); box-shadow: 0 0 0 4px var(--hover-fill); }
.ip-title:focus { background: transparent; box-shadow: 0 2px 0 var(--accent); }
p.ip-line { margin: 10px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
.ip-lead { margin: 22px 0 0; max-width: 62ch; font: 18px/1.6 var(--read); color: var(--ink); outline: none; }
.ip-lead:empty::before { content: attr(data-ph); color: var(--ink-3); }
.ip-wide { max-width: 820px; margin: 0 0 22px; }
.ip-pic { display: block; width: 100%; overflow: hidden; border-radius: 2px; box-shadow: var(--shadow-pic); aspect-ratio: 3 / 2; background: var(--surface-mat); position: relative; }
.ip-pic svg { width: 100%; height: 100%; display: block; }
.ip-side { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 30px; align-items: end; }
.ip-portrait { aspect-ratio: 3 / 4; border-radius: 2px; background: var(--surface-board); box-shadow: inset 0 0 0 1px var(--rule); display: grid; place-items: center; font: 400 64px/1 var(--read); color: var(--ink-3); }
.ip-strip { display: flex; gap: 6px; margin: 8px 0 0; overflow-x: auto; }
.ip-strip button { flex: none; width: 70px; aspect-ratio: 4 / 3; padding: 0; border: 2px solid transparent; border-radius: 2px; overflow: hidden; background: var(--surface-mat); cursor: pointer; }
.ip-strip button[aria-pressed="true"] { border-color: var(--ink); }
.ip-strip svg { width: 100%; height: 100%; display: block; }
.ip-pic .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--media-badge); color: var(--on-media); font-size: 19px; display: grid; place-items: center; cursor: pointer; }
.ip-pic .nav.p { left: 12px; } .ip-pic .nav.n { right: 12px; }
.ip-pic .cnt { position: absolute; right: 12px; bottom: 12px; background: var(--media-badge); color: var(--on-media); font-size: 11.5px; padding: 2px 8px; border-radius: 9px; font-variant-numeric: tabular-nums; }
.dochead { background: var(--quote-paper); box-shadow: inset 0 0 0 1px var(--quote-rule); border-radius: 3px; padding: 28px 24px 24px; text-align: center; display: grid; gap: 10px; justify-items: center; margin: 0 0 22px; }
.dochead .court { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.dochead hr { width: 44px; border: 0; border-top: 1px solid var(--quote-rule); margin: 0; }
.dochead .t { font: italic 400 clamp(22px, 3vw, 30px)/1.2 var(--read); max-width: 30ch; }
.dochead .cit { font: 15px/1.4 var(--read); color: var(--ink-2); }
.ip-writing { margin-top: 30px; max-width: 64ch; position: relative; }
.ip-writing h2 { margin: 0 0 8px; font: 400 21px/1.2 var(--read); }
.ip-writing .md { font: 16.5px/1.62 var(--read); color: var(--ink); outline: none; border-radius: 2px; min-height: 1.6em; }
.ip-writing .md:hover { background: var(--hover-fill); box-shadow: 0 0 0 4px var(--hover-fill); }
.ip-writing .md:focus { background: transparent; box-shadow: 0 2px 0 var(--accent); }
.ip-writing .md:empty::before { content: attr(data-ph); color: var(--ink-3); }
.ip-shelf { margin-top: 38px; position: relative; }
.ip-shelf-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; }
.ip-shelf-h h2 { margin: 0; font: 400 21px/1.2 var(--read); }
.ip-shelf-h span { font-size: 12px; color: var(--ink-2); }
.ip-shelf-h small { font-size: 12px; color: var(--ink-3); }
.ip-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; align-items: start; }
.mnote { background: var(--note-paper); border-left: 3px solid var(--status-2); padding: 12px 14px; font: 15px/1.52 var(--read); }
.mnote small { display: block; font: 11.5px var(--ui); color: var(--ink-2); margin-top: 6px; }
.blk-ctl { position: absolute; top: -4px; right: 0; display: flex; gap: 2px; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 4px; padding: 2px; z-index: 3; }
.blk-ctl button { border: 0; background: none; border-radius: 3px; padding: 2px 7px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.blk-ctl button:hover { background: var(--hover-fill); color: var(--ink); }
.arr .blk { outline: 1px dashed var(--status-2); outline-offset: 8px; border-radius: 1px; }
.arr .blk.off > :not(.blk-ctl) { opacity: .38; }
.arrbar { position: sticky; top: calc(var(--band-h, 46px) + 52px + env(safe-area-inset-top, 0px)); z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 14px; margin: 6px 0 0; border-radius: 3px; background: var(--accent-soft); color: var(--accent-strong); box-shadow: var(--shadow-pic); font-size: 13px; }
.arrbar p { margin: 0; flex: 1 1 240px; }
.arrbar .g { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; }
.arrbar .seg button:disabled { opacity: .35; cursor: not-allowed; }
.emptyb { font-size: 13px; color: var(--ink-3); font-style: italic; margin: 0; }

/* ---- table, board, timeline (proposed V1, V2) ---- */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--ink-2); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 240px; }
tr:last-child td { border-bottom: 0; }
td .tt { all: unset; cursor: pointer; font-weight: 500; }
td .tt:hover { color: var(--accent); text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.bcol { background: var(--board); border-radius: 3px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 200px; }
.bcol.over { box-shadow: inset 0 0 0 2px var(--status-2); }
.bcol h3 { margin: 0 0 2px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; }
.bcol h3 b { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bcard { background: var(--panel); box-shadow: inset 0 0 0 1px var(--rule); border-radius: 2px; padding: 9px 11px; display: grid; gap: 2px; cursor: grab; }
.bcard b { font-weight: 500; font-size: 13px; } .bcard small { color: var(--ink-2); font-size: 12px; }
.tl { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.tlin { min-width: 680px; padding: 8px 0 14px; }
.tlrow { display: grid; grid-template-columns: 220px minmax(0, 1fr); align-items: center; min-height: 32px; }
.tlrow .lab { padding: 0 14px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tlrow .lab button { all: unset; cursor: pointer; } .tlrow .lab button:hover { color: var(--accent); }
.track { position: relative; height: 32px; margin-right: 24px; }
.axis { height: 26px; border-bottom: 1px solid var(--line); }
.tick-l { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-bottom: 5px; white-space: nowrap; }
.grid-l { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .6; }
.bar { position: absolute; top: 11px; height: 10px; border-radius: 5px; min-width: 10px; }
.bar.open { -webkit-mask-image: linear-gradient(90deg, #000 72%, transparent); mask-image: linear-gradient(90deg, #000 72%, transparent); }
.pt { position: absolute; top: 10px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); box-shadow: 0 0 0 2px var(--panel); }
.tlleg { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); padding: 0 14px 8px; }

/* ---- customizer (library.css) ---- */
.library-crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; }
.library-crumb button { all: unset; cursor: pointer; } .library-crumb button:hover { color: var(--accent); }
.library-crumb b { color: var(--ink); font-weight: 500; }
.customizer-layout { display: grid; grid-template-columns: minmax(0, 860px) minmax(300px, 400px); gap: clamp(28px, 3vw, 44px); align-items: start; }
.customizer-editor { background: var(--panel); border: 1px solid var(--line); padding: 24px 28px; border-radius: 3px; min-width: 0; }
.customizer-editor h2 { font: 400 26px/1.2 var(--read); margin: 0 0 6px; }
.coll-select-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin: 16px 0 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.coll-select-pills.inline { border: 0; padding: 0; margin: 0; }
.coll-select-pills button { all: unset; font-size: 12.5px; padding: 5px 11px; border-radius: 2px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; white-space: nowrap; color: var(--ink-2); position: relative; }
.coll-select-pills button.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 500; }
.coll-select-pills button.add-new { border-style: dashed; color: var(--accent); border-color: var(--accent); }
.coll-select-pills button:disabled { cursor: default; opacity: .55; }
.coll-select-pills .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; vertical-align: middle; margin-right: 4px; background: var(--status-2); }
.coll-select-pills .dot.s1 { background: var(--status-1); } .coll-select-pills .dot.s3 { background: var(--accent); }
.cf-section { padding: 18px 0 4px; border-top: 1px solid var(--line); position: relative; }
.cf-section:first-of-type { border-top: 0; padding-top: 4px; }
.cf-section-head { margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.form-row { margin-bottom: 16px; }
.form-row label, .form-row .form-label { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
.form-row input[type="text"], .form-row select, .form-row textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); background: var(--paper); font-size: 13.5px; border-radius: 2px; color: var(--ink); }
.cf-note { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-2); }
.customizer-section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 4px 0 8px; }
.customizer-section-head .form-label { margin: 0; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.preset-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.preset-chip { all: unset; font-size: 11.5px; padding: 3px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; color: var(--ink-2); }
.preset-chip:hover { color: var(--accent); border-color: var(--status-1); }
.fields-list { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.field-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) 150px auto 26px; gap: 8px; align-items: center; position: relative; }
.field-row input[type="text"], .field-row select { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; border-radius: 2px; color: var(--ink); }
.field-row.over { opacity: .5; }
.field-num { font-size: 11.5px; color: var(--ink-2); text-align: center; }
.field-card { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.field-del { all: unset; text-align: center; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.field-del:hover { color: var(--warn); }
.field-cfg { margin: 0 0 4px 34px; padding: 10px 12px; background: var(--board); border-radius: 2px; display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-2); position: relative; }
.field-cfg label { display: grid; gap: 4px; }
.field-cfg input[type="text"], .field-cfg select { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; border-radius: 2px; color: var(--ink); }
.field-cfg .rowl { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.customizer-note { font-size: 12px; color: var(--ink-2); margin: 10px 0 0; }
.over-note { margin: 10px 0 0; padding: 8px 10px; border-radius: 2px; background: var(--myfocus-paper); color: var(--myfocus-ink); font-size: 12.5px; }
.customizer-actions { margin-top: 22px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.preview-sticky { position: sticky; top: calc(var(--band-h, 46px) + 24px); }
.preview-sticky > h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0 0 12px; font-weight: 600; }
.preview-box { background: var(--panel); border: 1px solid var(--line); padding: 16px; border-radius: 3px; }
.preview-box + .preview-box { margin-top: 16px; }
.preview-box .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 0 0 10px; }
.props-preview { display: grid; gap: 8px; font-size: 13px; margin: 0; }
.prop-item { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
.prop-item dt { color: var(--ink-2); } .prop-item dd { margin: 0; font-weight: 500; color: var(--ink); text-align: right; overflow-wrap: anywhere; }
.loci { display: grid; gap: 10px; padding: 14px; border-radius: 3px; background: var(--accent-soft); color: var(--accent-strong); margin: 0 0 18px; position: relative; }
.loci b { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.loci form { display: flex; gap: 8px; flex-wrap: wrap; }
.loci input { flex: 1 1 220px; min-width: 0; padding: 8px 10px; border: 1px solid var(--status-1); background: var(--panel); border-radius: 2px; color: var(--ink); }
.loci .sugg { display: flex; gap: 6px; flex-wrap: wrap; }
.loci .sugg button { all: unset; cursor: pointer; font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--panel); color: var(--ink-2); }

/* menus, toast */
.menu { position: fixed; z-index: 60; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 6px; padding: 5px; min-width: 210px; max-width: min(300px, calc(100vw - 32px)); max-height: 340px; overflow: auto; display: grid; gap: 1px; }
.menu button { border: 0; background: none; border-radius: 4px; padding: 7px 9px; text-align: left; font-size: 13px; cursor: pointer; display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; align-items: center; color: var(--ink); }
.menu button:hover { background: var(--hover-fill); }
.menu button i { font-style: normal; color: var(--accent); font-size: 12px; }
.menu h5 { margin: 4px 9px; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.menu input { margin: 2px 4px 4px; padding: 6px 8px; border: 1px solid var(--line); background: var(--paper); border-radius: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 8px 14px; border-radius: 16px; font-size: 13px; z-index: 70; box-shadow: var(--shadow-float); max-width: calc(100% - 32px); }

@media (max-width: 1100px) { .customizer-layout { grid-template-columns: minmax(0, 1fr); } .preview-sticky { position: static; } }
@media (max-width: 900px) { .ip-grid { grid-template-columns: minmax(0, 1fr); gap: 30px; } .ip-rail { position: static; } }
@media (max-width: 640px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; justify-content: center; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; }
  .rail .brand { display: none; }
  .stage { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
  .ip-side { grid-template-columns: 120px minmax(0, 1fr); gap: 16px; }
  .ip-top { top: calc(var(--band-h, 46px) + env(safe-area-inset-top, 0px)); }
  .customizer-editor { padding: 18px 16px; }
  .field-row { grid-template-columns: 22px minmax(0, 1fr) 110px 22px; }
  .field-row .field-card { grid-column: 2 / -1; }
  .band .adds { flex-basis: 100%; }
}

:root { --pick: #b7791f; --pick-soft: #fbf3df; --pick-rule: #ecd9a8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --pick: #e8c27a; --pick-soft: #33291a; --pick-rule: #5a4824; } }
:root[data-theme="dark"] { --pick: #e8c27a; --pick-soft: #33291a; --pick-rule: #5a4824; }

/* phase labels (prototype only) */
.phases [data-ph] { position: relative; }
.phases [data-ph]::after { content: attr(data-ph); position: absolute; top: -8px; right: -6px; z-index: 4; font: 600 9.5px/1 var(--ui); letter-spacing: .04em; padding: 3px 5px; border-radius: 3px; background: var(--myfocus-paper); color: var(--myfocus-ink); box-shadow: inset 0 0 0 1px var(--myfocus-rule); pointer-events: none; white-space: nowrap; }

/* inline chips: a question or a goal written inside something */
.inl { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; margin: 8px 0; padding: 6px 8px; border-radius: 3px; }
.inl.q { background: var(--pick-soft); }
.inl.g { background: var(--accent-soft); }
.inl .gl { font: 600 14px/1 var(--ui); text-align: center; }
.inl.q .gl { color: var(--pick); } .inl.g .gl { color: var(--accent); }
.inl .tx { font-family: var(--read); font-size: 16.5px; line-height: 1.45; color: var(--ink); }
.inl.g .tx { font-size: 18px; }
.inl .ans { grid-column: 2 / -1; font: 13px/1.45 var(--ui); color: var(--ink-2); }
.inl .ans button { all: unset; cursor: pointer; color: var(--accent); }
.inl.child { margin-left: 26px; }
.inl.done .tx { color: var(--ink-2); }
.st { all: unset; cursor: pointer; font: 500 11.5px/1 var(--ui); padding: 4px 8px; border-radius: 10px; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); color: var(--ink-2); }
.st:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }
.st.open { color: var(--pick); box-shadow: inset 0 0 0 1px var(--pick-rule); }
.st.answered, .st.reached { color: var(--ok); }
.st.active { color: var(--accent); box-shadow: inset 0 0 0 1px var(--status-1); }
.counts { display: inline-flex; gap: 8px; margin-left: auto; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
.counts .cq { color: var(--pick); } .counts .cg { color: var(--accent); }
.prose-v { font: 16.5px/1.62 var(--read); color: var(--ink); max-width: 64ch; }
.prose-v p { margin: 0 0 10px; }
.mdedit { width: 100%; min-height: 200px; box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); font: 14px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); resize: vertical; }
.edrow { display: flex; gap: 8px; align-items: center; margin: 8px 0 0; flex-wrap: wrap; }
.edrow .hint { font-size: 12px; color: var(--ink-2); }
.atmenu { position: fixed; z-index: 65; background: var(--surface-float); box-shadow: var(--shadow-float); border-radius: 6px; padding: 5px; min-width: 240px; }
.atmenu button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; width: 100%; padding: 7px 9px; border-radius: 4px; }
.atmenu button:hover, .atmenu button.on { background: var(--hover-fill); }
.atmenu b { font-weight: 500; font-size: 13px; } .atmenu small { grid-column: 2; font-size: 11.5px; color: var(--ink-2); }
.atmenu .gl { grid-row: span 2; font-weight: 600; }

/* ---------- board ---------- */
.bwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 0; height: calc(100dvh - var(--band-h, 46px) - 150px); min-height: 520px; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--board); position: relative; }
.bhead { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; justify-content: space-between; margin: 0 0 14px; }
.bhead h1 { margin: 0; font: 400 clamp(26px, 3.4vw, 34px)/1.1 var(--read); }
.place { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); padding: 3px 9px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); margin-top: 8px; }
.place::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--status-3); }
.viewport { position: relative; overflow: hidden; touch-action: none; cursor: grab; background-color: var(--board); background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 22px 22px; }

/** Arrows and field links, measured from the cards as drawn. */

  if (S.screen !== "board" || !e.target.closest("#vp") || e.target.closest(".tools,.zoom,.drawer,.hintbar,button,textarea,input,.st")) return;
  const dot = e.target.closest("[data-dot]"), card = e.target.closest("[data-pid]"), line = e.target.closest("[data-arrow]");
  if (line) return;
  if (dot) { const p = I(S.board).pl.find(x => x.id === dot.dataset.dot), el = dot.parentElement; drag = { kind: "connect", from: p.id, sx: el.offsetLeft + el.offsetWidth, sy: el.offsetTop + el.offsetHeight / 2 }; e.preventDefault(); return; }

});
document.addEventListener("pointermove", e => {

  else if (drag.kind === "connect") { const c = toCanvas(e.clientX, e.clientY); S.ghost = { x1: drag.sx, y1: drag.sy, x2: c.x, y2: c.y }; drawArrows(); }
});

    const b = I(S.board);
    if (tgt && tgt.dataset.pid !== d.from) { const a = { id: "a" + Date.now(), from: d.from, to: tgt.dataset.pid, word: "leads to", why: "" }; b.arrows.push(a); drawArrows(); openArrow(a.id, e.clientX, e.clientY); }
    else drawArrows();
  } else if (d.kind === "move" && !d.moved) { S.sel = d.p.id; document.querySelectorAll(".bc.sel").forEach(x => x.classList.remove("sel")); d.el.classList.add("sel"); }
});
document.addEventListener("wheel", e => {

function zoomAt(f, cx, cy) {

  const z = Math.min(1.6, Math.max(.35, S.view.z * f)), px = cx - r.left, py = cy - r.top;
  S.view.x = px - (px - S.view.x) * z / S.view.z; S.view.y = py - (py - S.view.y) * z / S.view.z; S.view.z = z; applyView();

function fit() {

function addOnCanvas(tool, x, y) {
  const b = I(S.board);
  if (tool === "question") { const id = "q" + (b.inl.length + 1) + "x" + (Date.now() % 1000); b.inl.push({ id, kind: "question", text: "New question" }); b.pl.push({ id: "p" + Date.now(), ref: "b:" + id, x, y }); S.editing = `inl:${b.id}:question:${id}`; }
  else { const nid = "n" + Date.now(); D().items.push(note(nid, "", "")); b.pl.push({ id: "p" + Date.now(), ref: "i:" + nid, x, y }); S.editing = "note:" + nid; }
  S.tool = "select"; S.focusEdit = true; render();
}

/* ---------- clicks ---------- */
document.addEventListener("click", e => {
  if (S.skipClick) { S.skipClick = false; return; }
  const a = e.target.closest("[data-act]");
  if (!e.target.closest("#menu") && !(a && a.dataset.act === "stmenu")) closeMenu();

  if (!e.target.closest("#apop") && !$("#apop").hidden) closeApop();
  if (!a) return;
  const d = a.dataset;
  switch (d.act) {
    case "field": S.field = d.k; S.board = DB[d.k].start; S.screen = "board"; S.sel = null; S.drawer = false; S.view = { x: 20, y: 10, z: .82 }; render(); requestAnimationFrame(fit); break;
    case "go": S.screen = d.k; S.drawer = false; render(); if (d.k === "board") requestAnimationFrame(fit); window.scrollTo({ top: 0 }); break;
    case "type": S.type = d.k; render(); break;
    case "qf": S.qf = d.k; render(); break;
    case "open": S.from = S.screen === "board" ? "board" : S.screen === "qg" ? "qg" : "wall"; S.item = d.id; S.screen = "item"; S.editing = null; render(); window.scrollTo({ top: 0 }); break;
    case "openboard": S.board = d.id; S.screen = "board"; render(); requestAnimationFrame(fit); window.scrollTo({ top: 0 }); break;
    case "back": S.screen = S.from === "board" ? "board" : S.from === "qg" ? "qg" : "wall"; render(); break;
    case "stmenu": e.stopPropagation(); menuKey = d.k; openMenu(a, stMenu(d.k)); break;
    case "setst": { const r = INL(menuKey), s = st(menuKey, r.kind); s.status = d.v; closeMenu(); render(); toast(`${r.kind === "goal" ? "Goal" : "Question"} marked ${d.v}, everywhere it shows.`); break; }
    case "ansin": { const s = st(menuKey, "question"); s.ans = s.ans.includes(d.id) ? s.ans.filter(x => x !== d.id) : [...s.ans, d.id]; if (s.ans.length) s.status = "answered"; const k = menuKey; render(); menuKey = k; const anchor = document.querySelector(`[data-act="stmenu"][data-k="${CSS.escape(k)}"]`); if (anchor) openMenu(anchor, stMenu(k)); else closeMenu(); break; }
    case "toast": closeMenu(); toast(d.msg); break;
    case "edit": S.editing = S.item; S.focusEdit = true; render(); break;
    case "canceledit": S.editing = null; render(); break;
    case "saveedit": saveBody(); break;
    case "mq": { const it = I(d.id); it.margin.push({ at: it.kind.includes("PDF") ? "p. 22" : "18:20", body: `@${d.k} ${d.k === "goal" ? "Be able to explain the stack effect to a client" : "What sets the size of the opening at the top?"}` }); render(); toast(`A margin note at ${it.margin.at(-1).at}, with @${d.k} typed for you. It shows in Questions and goals.`); break; }
    case "tool": S.tool = d.k; render(); break;
    case "drawer": S.drawer = !S.drawer; render(); break;
    case "dtab": S.dtab = d.k; render(); break;
    case "place": { const b = I(S.board); if (b.pl.some(p => p.ref === d.ref)) { toast("Already on this board."); break; } const vp = $("#vp"), c = toCanvas(vp.getBoundingClientRect().left + vp.clientWidth / 2, vp.getBoundingClientRect().top + vp.clientHeight / 2); b.pl.push({ id: "p" + Date.now(), ref: d.ref, x: Math.round(c.x - 110 + (b.pl.length % 4) * 24), y: Math.round(c.y - 60) }); render(); toast(d.ref.startsWith("q:") ? "Placed. The question still belongs to its note; its status is the same everywhere." : "Placed, not copied: it's the same entry as in Commonplace."); break; }
    case "zoom": zoomAt(+d.d > 0 ? 1.15 : 1 / 1.15); break;
    case "fit": fit(); break;
    case "focuscard": { if (!d.pid) break; const p = I(S.board).pl.find(x => x.id === d.pid); if (!p) break; const vp = $("#vp"); S.view.x = vp.clientWidth / 2 - (p.x + 110) * S.view.z; S.view.y = vp.clientHeight / 2 - (p.y + 60) * S.view.z; S.sel = p.id; applyView(); document.querySelectorAll(".bc.sel").forEach(x => x.classList.remove("sel")); document.querySelector(`[data-pid="${p.id}"]`)?.classList.add("sel"); break; }
    case "aword": { const b = I(S.board), ar = b.arrows.find(z => z.id === $("#apop")._a); ar.why = $("#awhy").value.trim(); ar.word = d.w; const r = a.getBoundingClientRect(); const pop = $("#apop"); const x = pop.offsetLeft + pop.offsetWidth / 2, y = pop.offsetTop - 12; openArrow(ar.id, x, y); drawArrows(); break; }
    case "offer": { const o = $("#apop")._off[+d.i]; if (o.kind === "field") { const X = I(o.x), f = COL(X.col).fields.find(z => z.id === o.f); X.v[f.id] = f.o.many ? [...arr(X.v[f.id]), o.y] : [o.y]; toast(`${X.title}: ${f.label} is now ${I(o.y).title}. It shows on the Object's page and as a field link here.`); } else { const s = st(o.key, "question"); s.ans.push(o.id); s.status = "answered"; toast(`Answered in ${I(o.id).title}. The Object's page now lists it under Answers.`); } closeApop(); render(); break; }
    case "delarrow": { const b = I(S.board); b.arrows = b.arrows.filter(z => z.id !== $("#apop")._a); $("#apop").hidden = true; drawArrows(); break; }

  }
});
document.addEventListener("dblclick", e => {

  const b = I(S.board), p = b.pl.find(x => x.id === card.dataset.pid), r = refOf(p.ref, b);

  else if (r.type === "item" && r.it.type === "note") { S.editing = "note:" + r.it.id; S.focusEdit = true; render(); }
  else if (r.type === "item") { S.from = "board"; S.item = r.it.id; S.screen = "item"; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "phases") { S.phases = e.target.checked; renderBand(); }
  if (e.target.id === "fl") { S.fieldLinks = e.target.checked; drawArrows(); }

});
document.addEventListener("focusout", e => {
  const t = e.target;
  if (t.dataset?.qedit) { const [bid, , id] = t.dataset.qedit.split(":"); const b = I(bid), x = b.inl.find(y => y.id === id); x.text = t.value.trim() || x.text; S.editing = null; setTimeout(render, 0); }
  if (t.dataset?.nedit) { const it = I(t.dataset.nedit); it.body = t.value.trim(); S.editing = null; const n = parse(it.body); setTimeout(render, 0); if (n.length) toast(`Saved to Commonplace with ${n.length} ${n.length > 1 ? "questions and goals" : n[0].kind} inside.`); else toast("Saved to Commonplace as a note."); }
});
function saveBody() {
  const ta = $("#mdedit"), it = I(S.item); if (!ta) return;
  const before = parse(it.body).length; it.body = ta.value; S.editing = null; render();
  const after = parse(it.body).length; if (after !== before) toast(`${after} question${after === 1 ? "" : "s"} and goals inside. Each shows in Questions and goals.`);
}

/* ---------- the @ menu (Q1) ---------- */
let atState = null;
document.addEventListener("input", e => {
  const ta = e.target; if (!(ta.id === "mdedit" || ta.dataset?.nedit)) return;
  const pos = ta.selectionStart, before = ta.value.slice(0, pos);
  if (/(^|\s)@$/.test(before)) { atState = { ta, pos }; const r = ta.getBoundingClientRect(), m = $("#atmenu");
    m.innerHTML = `<button class="on" data-at="question"><span class="gl" style="color:var(--pick)">?</span><b>Question</b><small>Something you want to find out</small></button><button data-at="goal"><span class="gl" style="color:var(--accent)">◎</span><b>Learning goal</b><small>Something you want to be able to do or understand</small></button>`;
    m.hidden = false; m.style.left = Math.min(r.left + 20, innerWidth - 260) + "px"; m.style.top = Math.min(r.top + 40, innerHeight - 120) + "px"; }
  else hideAt();

function hideAt() { $("#atmenu").hidden = true; atState = null; }
function chooseAt(kind) {

}
$("#atmenu").addEventListener("mousedown", e => { const b = e.target.closest("[data-at]"); if (b && atState) { e.preventDefault(); chooseAt(b.dataset.at); } });
document.addEventListener("keydown", e => {

    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); items[i].classList.remove("on"); items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].classList.add("on"); return; }
    if (e.key === "Enter") { e.preventDefault(); chooseAt(items[i].dataset.at); return; }
    if (e.key === "q" || e.key === "g") { e.preventDefault(); chooseAt(e.key === "q" ? "question" : "goal"); return; }
    if (e.key === "Escape") { hideAt(); return; }
  }
  const t = e.target;
  if (t.id === "mdedit" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveBody(); return; }
  if (t.dataset?.qedit && e.key === "Enter") { e.preventDefault(); t.blur(); return; }
  if (/INPUT|TEXTAREA/.test(t.tagName)) return;
  if (e.key === "Escape") { closeMenu(); if (!$("#apop").hidden) closeApop(); if (S.drawer) { S.drawer = false; render(); } }
  if (S.screen === "board") {
    const k = e.key.toLowerCase();
    if (k === "v") { S.tool = "select"; render(); } else if (k === "n") { S.tool = "note"; render(); } else if (k === "q") { S.tool = "question"; render(); }
    else if (e.key === "+") { S.drawer = !S.drawer; render(); } else if (k === "0") fit();
    else if ((e.key === "Delete" || e.key === "Backspace") && S.sel) { const b = I(S.board); b.pl = b.pl.filter(p => p.id !== S.sel); b.arrows = b.arrows.filter(a => a.from !== S.sel && a.to !== S.sel); S.sel = null; render(); toast("Removed from the board. It's still in your Commonplace."); }
  }
});
window.addEventListener("resize", () => { if (S.screen === "board") drawArrows(); });

S.board = DB[S.field].start;
render();

</script>
