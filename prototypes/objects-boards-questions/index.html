  .qv[data-kind="web"] .web-preview-title { font-size: 22px; }
}
.player { position: relative; width: min(100%, 980px); }
.player .pic { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; box-shadow: var(--shadow-float); background: var(--surface-mat); transform-origin: top left; }
.player .pic img { display: block; width: 100%; height: 100%; object-fit: cover; }
.player .play { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: var(--surface-float); opacity: 0.9; display: grid; place-items: center; box-shadow: var(--shadow-pic); pointer-events: none; }
.player .play::before { content: ""; border-left: 13px solid var(--ink); border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 4px; }
/* The embedded player (D38): hidden over the card's thumbnail (and taking no clicks) until the player speaks, or a
   silent player's short grace has passed; then shown, with a timeline with note markers under it. */
.player .pic iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; pointer-events: none; }
.player .pic[data-frame-shown] iframe { opacity: 1; pointer-events: auto; transition: opacity var(--dur-standard) var(--ease-standard); }
.player .pic[data-frame-shown] img, .player .pic[data-frame-shown] .play { visibility: hidden; }
.player .tl { position: relative; height: 5px; border-radius: 3px; background: var(--line); margin: 12px 0 6px; }
.player .tl i { position: absolute; inset: 0; border-radius: 3px; background: var(--ink); transform-origin: left; }
.player .tl b { position: absolute; top: -4px; width: 4px; height: 13px; margin-left: -2px; border-radius: 2px; background: var(--status-2); }
@media (max-width: 980px) {
  .qv { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; padding: 54px 16px 16px; overflow: auto; }
  .qv-panel { max-height: 46vh; }
}
@media (max-width: 640px) {
  .qv { grid-template-rows: auto auto; padding: 50px 12px 24px; }
  .qv { --qv-max-h: 58vh; }
  .qv-panel { max-height: none; overflow: visible; }
}
/* G1: the watching room (watch-room.tsx). The player is as large as the stage allows (`--player-w`, measured); the
   980 px cap stays for players outside it. The panel folds like the PDF reading room's (⇥, Details, `/`): `data-panel`
   on `.qv` is "auto" (shown from 981 px and under the player on phones, folded between), "open" or "folded". */
.qv[data-kind="video"] .qv-stage { justify-content: center; }
.qv[data-kind="video"] .player { width: var(--player-w, min(100%, 980px)); }
.qv[data-kind="video"][data-panel="folded"] { grid-template-columns: minmax(0, 1fr) 0; gap: 0; }
.qv[data-kind="video"][data-panel="folded"] .qv-panel { visibility: hidden; opacity: 0; pointer-events: none; }
/* While folded, **Details** and ✕ sit together at the top right, outside the player: the stage reserves their row
   (`--room-top`, measured in watch-room.tsx) and the player is sized below it. */
.qv[data-kind="video"] .qv-stage { padding-top: var(--room-top, 0px); }
.qv-room-top { position: absolute; right: 28px; top: 54px; z-index: 2; display: flex; align-items: center; gap: 6px; }
.qv-room-top .reopen.button { position: static; }
.qv-room-top .qv-room-close { background: var(--surface-over-page); }
.qv[data-kind="video"]:not([data-panel="folded"]) .qv-room-top { display: none; }
/* G2: the resume chip, over the player's bottom-left corner in the time chip's style (`.note-time`). */
.resume-chip { position: absolute; left: 12px; bottom: 12px; z-index: 2; display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--surface-float); color: var(--ink-2); box-shadow: var(--shadow-float); font: 500 12px/1.4 var(--ui); font-variant-numeric: tabular-nums; animation: qvFadeIn var(--dur-standard) var(--ease-standard); }
.resume-chip button { all: unset; cursor: pointer; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.resume-chip button:focus-visible { outline: var(--focus-ring); outline-offset: 2px; border-radius: 3px; }
/* G3: the watch status at the top of the panel, as the PDF reading room's toolbar select. */
.qv-status { display: flex; align-items: center; gap: 8px; }
.qv-status .rail-select { font: inherit; font-size: 12.5px; color: var(--text); background: var(--surface-page); border: 0; box-shadow: inset 0 0 0 1px var(--rule); border-radius: 12px; padding: 3px 8px; cursor: pointer; }
.qv-status .rail-select:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.qv-status .rail-select:disabled { cursor: default; }
@media (min-width: 641px) and (max-width: 980px) {
  .qv[data-kind="video"][data-panel="auto"] { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .qv[data-kind="video"][data-panel="auto"] .qv-panel { display: none; }
  .qv[data-kind="video"][data-panel="auto"] .qv-room-top { display: flex; }
  .qv-room-top { right: 16px; }
}
@media (max-width: 640px) {
  /* Phones: the room is the full screen with the panel under the player, never folded. */
  .qv .qv-room-top, .qv[data-kind="video"][data-panel="auto"] .qv-room-top, .qv .qv-fold { display: none; }
  .qv[data-kind="video"][data-panel="folded"] { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .qv[data-kind="video"][data-panel="folded"] .qv-panel { visibility: visible; opacity: 1; pointer-events: auto; }
  /* The player and the panel keep their full heights and the room scrolls (J19): squeezed into the window, the panel's title lost lines. */
  .qv[data-kind="video"] .qv-stage, .qv[data-kind="video"] .qv-panel { min-height: auto; }
}
@media (prefers-reduced-motion: reduce) { .resume-chip { animation: none; } }
@media (prefers-reduced-motion: reduce) {
  .qv-scrim, .qv-panel, .qv .nitem, .qv-media .qv-swap { animation: none; }
  .qv-scrim[data-leaving], .qv[data-leaving] .qv-panel { animation: none; opacity: 0; }
}

/* Card ↔ page (Phase 2D D4; mock-up library-wall-and-capture.html `openItem`, `.mcard.flash`). The hero grows from its card from the top-left corner
   (page-transition.tsx); back on the wall the card that was opened glows once: a ring on a layer of its own fades over --dur-calm (opacity only). */
/* The ghost (mock-up `.ghost`): a fixed, aria-hidden copy of the card's picture or paper that flies to the page's picture. */
.page-ghost { position: fixed; z-index: 70; margin: 0; box-sizing: border-box; overflow: hidden; pointer-events: none; transform-origin: 0 0; }
.page-ghost > img { display: block; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
.mcard[data-glow]::after { content: ""; position: absolute; inset: -4px; z-index: 2; border-radius: 7px; box-shadow: 0 0 0 2px var(--accent), var(--shadow-lift); pointer-events: none; opacity: 0; animation: card-glow var(--dur-calm) var(--ease-standard); }
@keyframes card-glow { from { opacity: 1; } to { opacity: 0; } }
/* Reduced motion: the same marked card, as a still ring for the same moment. */
@media (prefers-reduced-motion: reduce) { .mcard[data-glow]::after { animation: none; opacity: 1; } }

/* The wall's content fades in over its loading placeholder (App-wide), opacity only. */
.library-wall { animation: wall-in var(--dur-standard) var(--ease-standard); }
@keyframes wall-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .library-wall { animation: none; } }

/* Loading placeholders (Phase 2D, App-wide): grey shapes of the cards and the page frame; the content replaces them. No spinners. */
.wall-placeholder, .page-placeholder { --ph: var(--surface-board); }
.ph-bar, .ph-line, .ph-pic, .ph-hero, .ph-title { background: var(--ph); border-radius: 3px; }
.ph-search { height: 38px; max-width: 520px; margin: 0 0 24px; }
.ph-wall { columns: 4 260px; column-gap: 20px; }
.ph-card { break-inside: avoid; margin: 0 0 18px; display: grid; gap: 8px; }
.ph-card[data-paper] { padding: 14px 15px 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--rule); background: var(--surface-panel); }
.ph-pic { height: var(--ph-h, 180px); border-radius: 6px; margin-bottom: 4px; }
.ph-line { height: 10px; width: 100%; }
.ph-line.is-short { width: 58%; }
.ph-line.is-crumb { width: 140px; height: 12px; }
.destination-crumb .ph-subtitle { display: inline-block; width: 150px; height: 10px; vertical-align: middle; background: var(--surface-board); border-radius: 3px; }
.ph-line.is-kicker { width: 90px; margin-top: 22px; }
.page-placeholder .ph-top { min-height: 52px; display: flex; align-items: center; }
.ph-main { display: grid; gap: 12px; align-content: start; }
.ph-hero { aspect-ratio: 16 / 9; max-height: 420px; border-radius: 2px; }
.ph-title { height: 40px; width: 70%; margin: 4px 0 10px; }
.ph-rail { display: grid; gap: 14px; padding-top: 4px; }
.panel-placeholder { display: grid; gap: 12px; max-width: 820px; }
.panel-placeholder .ph-row { height: 54px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--rule); background: var(--surface-panel); }
.ph-prop { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; }

/* Library areas: the header's area picker (spec 2026-10-12, mockup A). Tokens and the shared menu (.cmenu, .mi) only. */
.area-picker { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink); font: inherit; font-weight: 500; line-height: 1.2; cursor: pointer; }
.area-picker::after { content: ""; border: 4px solid transparent; border-top-color: var(--ink-2); margin-top: 4px; }
.area-picker:hover { border-color: var(--ink-3); }
.area-picker:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.area-picker[data-state="open"] { border-color: var(--ink-3); }
/* Many areas: the menu never runs past the window; it scrolls so No area yet stays reachable. */
.cmenu.area-menu { width: auto; min-width: 250px; max-width: min(320px, calc(100vw - 16px)); max-height: var(--radix-dropdown-menu-content-available-height, calc(100vh - 16px)); overflow-y: auto; }
.area-menu .area-row { padding: 6px 10px; }
.area-menu .area-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Counts use the menu's muted ink (the mockup's --ink-3 is below AA contrast on the menu); the chosen row's count takes its accent. */
.area-menu .area-row .area-count { margin-left: auto; padding-left: 18px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.area-menu .area-row[data-state="checked"] .area-count { color: var(--accent); }
.area-menu .area-row.is-none { color: var(--ink-2); }
.area-menu .area-row[data-state="checked"] { background: var(--accent-soft); color: var(--accent); }
.area-menu .area-row[data-state="checked"][data-highlighted] { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.area-menu .area-ring { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; flex-shrink: 0; box-sizing: border-box; }
@media (max-width: 600px) { .cmenu.area-menu { min-width: min(320px, calc(100vw - 16px)); } }

/* ======================================================================================================== */
/* The wall on phones and iPads (mobile spec L-1, M-D4, M-D5; tablet spec T-6, T-D5). The masonry measures each card's
   height into --masonry-span, so any column template works.                                                      */
/* ======================================================================================================== */
@media (max-width: 699.98px) {
  /* Search on one line at a readable size; the count and Select (or the Wall | Shelves switch) share the next line. */
  .library-wall .lsearch, .library-shelves .lsearch { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 8px; }
  .library-wall .lsearch input, .library-shelves .lsearch input { grid-column: 1 / -1; font-size: 20px; padding: 6px 0 8px; }
  .library-wall .lsearch .n, .library-shelves .lsearch .n { font-size: 12.5px; }
  /* Shape chips: one row that scrolls sideways. */
  .library-wall .colls { overflow-x: auto; scrollbar-width: none; margin-right: calc(-1 * var(--m-gutter)); padding-right: var(--m-gutter); }
  .library-wall .colls::-webkit-scrollbar { display: none; }
  .library-wall .colls > button { flex: none; min-height: 36px; }
  /* Two columns of compact cards from 340 px (M-D4); three in Split View from 560 px. */
  .library-wall .mason { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 10px; row-gap: 10px; }
  .library-wall .mason > .mcard { --card-pad: 11px 12px 10px; }
  .library-wall .mason > .mcard:not(.cap-card) { font-size: 13px; }
  .library-wall .mason > .mcard .mcard-title { font-size: 16px; line-height: 1.25; }
  /* Open, capture is a sheet across the foot of the screen, over the Loci bar and above the keyboard (M-D5). */
  .library-wall .cap-box[data-phase="open"] {
    position: fixed; left: 0; right: 0; top: auto; bottom: var(--m-kb); z-index: 61;
    width: auto; height: auto; max-height: calc(88dvh - var(--m-kb)); overflow: auto; transform: none;
    border-radius: var(--m-sheet-radius) var(--m-sheet-radius) 0 0; box-shadow: var(--shadow-float);
    padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface-float);
  }
  .library-wall .cap-box[data-phase="open"]::before { content: ""; display: block; flex: none; width: 36px; height: 4px; margin: 8px auto 2px; border-radius: 2px; background: var(--line); }
}
@media (max-width: 339.98px) { .library-wall .mason { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 560px) and (max-width: 699.98px) { .library-wall .mason { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
/* iPads in portrait and small windows: 196 px cards, three or four columns, instead of two of 330 px (T-6). */
@media (min-width: 700px) and (max-width: 1099.98px) {
  .library-wall .mason { grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); column-gap: 14px; }
}
/* The idle capture card is a one-line bar across the wall on phones and on touch screens (L-1, T-6). */
@media (max-width: 699.98px), (pointer: coarse) {
  .library-wall .mason > .cap-card { grid-column: 1 / -1; aspect-ratio: auto; height: 52px; min-height: 0; }
  .library-wall .mason > .cap-card:has(.cap-box[data-phase="open"]) { height: 52px; }
  .library-wall .mason > .cap-card .cap-box:not([data-phase="open"]) { height: 52px; }
  .library-wall .mason > .cap-card .cap-box:not([data-phase="open"]) .cap-idle-prompt {
    flex-direction: row; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px 0 14px;
  }
  .library-wall .mason > .cap-card .cap-idle-main { font-size: 17px; }
  .library-wall .mason > .cap-card .cap-box:not([data-phase="open"]) .cap-foot { display: none; }
  .library-wall .mason > .cap-card .cap-box:not([data-phase="open"]) .cap-idle-prompt::after {
    content: "+"; flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
    box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); font-size: 18px;
  }
}
/* On touch screens from 700 px the box opens in place across the wall, as the desktop box does. */
@media (min-width: 700px) and (pointer: coarse) {
  .library-wall .mason > .cap-card:has(.cap-box[data-phase="open"]) { height: auto; }
  .library-wall .cap-box[data-phase="open"] { width: 100%; height: min(var(--cap-h, 560px), 48dvh); }
}

/* Library secondary screens on phones (mobile slice 6). */
@media (max-width: 699.98px) {
  /* Item pages: the back link never truncates; the top row's targets reach 44 px. */
  .ip-top { gap: 10px; }
  .ip-back { flex: none; width: auto; max-width: none; min-height: var(--m-hit); display: inline-flex; align-items: center; overflow: visible; white-space: nowrap; }
  .ip-back * { overflow: visible; text-overflow: clip; max-width: none; }
  .ip-more { min-width: var(--m-hit); min-height: var(--m-hit); }
  /* Templates: the title owns the row and Back to Wall goes under it; the pills are one scrolling row. */
  .tpl-head { flex-direction: column-reverse; align-items: stretch; gap: 14px; }
  .tpl-head > div { width: auto; }
  .tpl-head > .button { align-self: flex-start; }
  .tpl-head h2 { font-size: 24px; line-height: 1.2; }
  .tpl-nav-pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-right: calc(-1 * var(--m-gutter)); padding-right: var(--m-gutter); }
  .tpl-nav-pills::-webkit-scrollbar { display: none; }
  .tpl-nav-pills button { flex: none; min-height: 36px; }
}
/* The PDF room on phones and iPads: Notes · N leaves the page's corner for the room's header row (P12, T-7). */
@media (max-width: 1099.98px) {
  .pdf-reader .reopen { top: 64px; bottom: auto; right: 12px; border-radius: 18px; box-shadow: var(--shadow-float); }
  .pdf-reader .rstage { padding-top: 52px; }
}
/* Touch screens: the PDF room's buttons are 44 px (T-7). */
@media (pointer: coarse) {
  .pdf-reader .rtool .icob, .pdf-reader .icob { width: var(--m-hit); height: var(--m-hit); }
}

/* The short create form (CO-2) in the shared dialog frame. */
.new-collection form { display: grid; gap: 12px; }
.nc-fieldset { display: grid; gap: 14px; margin: 0; padding: 0; border: 0; min-width: 0; }
.nc-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.nc-fields { margin: 0; }
.nc-field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.nc-field i { font-style: normal; color: var(--ink-2); }
.nc-field input, .nc-field textarea { box-sizing: border-box; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; }
.nc-field textarea { resize: vertical; }
.nc-choices { display: grid; gap: 4px; margin: 0; padding: 0; border: 0; min-width: 0; }
.nc-choices legend { padding: 0; margin-bottom: 4px; font-size: 13px; color: var(--ink-2); }
.nc-choices.is-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.nc-choices.is-row legend { grid-column: 1 / -1; }
.nc-choice { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; color: var(--ink-2); cursor: pointer; }
.nc-choice b { font-weight: 600; color: var(--ink); margin-right: 4px; }
.nc-choice:has(input:checked) { box-shadow: inset 0 0 0 1.5px var(--accent); background: var(--accent-soft); }
.nc-error { margin: 0; min-height: 0; color: var(--warn); font-size: 13px; }
.nc-error:empty { display: none; }
@media (max-width: 699.98px), (pointer: coarse) { .nc-choice { min-height: var(--m-hit); } }

/* Bulk move and Add items (CO-4). */
.move-many-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; max-height: 50dvh; overflow-y: auto; }
.move-many-row { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 10px; border-radius: 3px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.move-many-row i { font-style: normal; font-size: 12px; color: var(--ink-2); }
.move-many-row:hover, .move-many-row:focus-visible { background: var(--hover-fill); }
.move-many-row:focus-visible { outline: var(--focus-ring); }
.move-many-row:disabled { opacity: 0.5; cursor: default; }
.add-items-status { margin: 8px 0 0; min-height: 1.4em; font-size: 13px; color: var(--ink-2); }
@media (max-width: 699.98px), (pointer: coarse) { .move-many-row { min-height: var(--m-hit); } }

/* The item rail's Collection row: the collection's name, then **Move to collection** after a gap (they ran together). */
.button-link[data-move-to] { margin-inline-start: 12px; }

/* CP header (Phase 1; spec docs/superpowers/specs/2026-10-24-commonplace-header-design.md). The prototype
   Commonplace Photos v4: .searchbox, .typebar, .pbar and .selbtn, rebuilt on the app's tokens. Phase 2 appends its own block. */
.cph { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; min-width: 0; }
.cph-search { display: flex; align-items: center; min-width: 0; height: 50px; margin: 0 0 16px; padding-right: 7px; border-radius: 10px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow var(--dur-quick) var(--ease-standard); }
.cph-search:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px var(--accent-soft); }
.cph-scope { flex: none; display: flex; align-self: stretch; border-right: 1px solid var(--line); }
.cph-scope .area-picker { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; height: 100%; padding: 0 14px 0 16px; border-radius: 10px 0 0 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.cph-scope .area-picker::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--status-3); }
.cph-scope .area-picker::after { content: "\25BE"; border: 0; margin: 0; font-size: 10px; opacity: 0.7; }
.cph-scope .area-picker:hover, .cph-scope .area-picker[data-state="open"] { background: var(--hover-fill); color: var(--ink); }
.cph-scope .area-picker:focus-visible { outline: var(--focus-ring); outline-offset: -2px; }
.cph-field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--ink-2); cursor: text; }
.cph-field svg { flex: none; }
.cph-field input { flex: 1; min-width: 0; height: 44px; border: 0; padding: 0; background: transparent; font: 19px/1.2 var(--read); color: var(--ink); }
.cph-field input:focus { outline: none; }
.cph-field input::placeholder { color: var(--ink-2); }
.cph-field input::-webkit-search-cancel-button { display: none; }
.cph-slash { flex: none; margin-right: 12px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); font: 11px var(--ui); color: var(--ink-2); }
.cph-clear { flex: none; display: grid; place-items: center; width: 26px; height: 26px; margin-right: 10px; border: 0; border-radius: 50%; background: none; color: var(--ink-2); font-size: 12px; cursor: pointer; }
.cph-clear:hover { background: var(--hover-fill); color: var(--ink); }
.cph-clear:focus-visible { outline: var(--focus-ring); }
.cph-div { flex: none; width: 1px; height: 26px; margin-right: 6px; background: var(--line); }
.cph-search .shv-seg { padding: 3px; border-radius: 9px; }
.cph-search .shv-seg button { height: 30px; padding: 0 11px; border-radius: 7px; }

.cph-types { display: flex; align-items: center; gap: 4px; min-width: 0; margin: 0 0 12px; padding: 2px; overflow-x: auto; scrollbar-width: none; }
.cph-types::-webkit-scrollbar { display: none; }
.cph-type { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 12px; border: 0; border-radius: 17px; background: none; font: inherit; font-size: 14px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.cph-type:hover { background: var(--hover-fill); color: var(--ink); }
.cph-type[aria-current="true"] { background: var(--ink); color: var(--paper); }
.cph-type .n, .cph-coll .n { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cph-type[aria-current="true"] .n { color: inherit; opacity: 0.6; }
.cph-type:focus-visible, .cph-coll:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.cph-colls { flex: none; display: inline-flex; align-items: center; gap: 2px; margin: 0 8px 0 0; padding-right: 10px; border-right: 1px solid var(--line); }
.cph-colls:last-child { border-right: 0; }
.cph-chev { margin: 0 4px 0 6px; font-size: 16px; color: var(--ink-2); }
.cph-coll { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 15px; background: none; font: inherit; font-size: 13px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.cph-coll:hover { background: var(--hover-fill); color: var(--ink); }
.cph-coll[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); }
.cph-coll .n { font-size: 11.5px; }

.cph-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 0 0 20px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.cph-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--board); }
.cph-seg button { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.cph-seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px color-mix(in srgb, var(--shade) 8%, transparent); }
.cph-seg button:disabled { cursor: default; opacity: 0.55; }
.cph-seg button:focus-visible { outline: var(--focus-ring); outline-offset: 1px; }
.cph-seg .n { font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cph-seg .cph-unsorted[aria-pressed="false"]:not(:disabled) .n { color: var(--warn); font-weight: 600; }
.cph-fbtn { display: inline-flex; align-items: center; height: 30px; border-radius: 15px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.cph-fbtn > button, .cph-fbtn-label { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: none; font: inherit; font-size: 13px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.cph-fbtn-label { cursor: default; }
.cph-fbtn > button:hover { color: var(--ink); }
.cph-fbtn > button:focus-visible { outline: var(--focus-ring); }
.cph-fbtn[data-on] { background: var(--accent-soft); box-shadow: none; }
.cph-fbtn[data-on] > button, .cph-fbtn[data-on] .cph-fbtn-label { color: var(--accent-strong); }
.cph-fbtn > .x { padding: 0 10px 0 0; font-size: 11px; }
.cph-grow { flex: 1; }
.cph-count { margin-right: 2px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cph-display { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 0; border-radius: 4px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font: inherit; font-size: 12.5px; font-weight: 500; color: var(--ink); white-space: nowrap; cursor: pointer; }
.cph-display:hover { background: var(--hover-fill); }
.cph-display:focus-visible { outline: var(--focus-ring); }
.cmenu.cph-menu .mi .ic { width: 14px; display: inline-flex; color: var(--accent); }
.cmenu.cph-topic-menu { width: auto; min-width: 220px; max-width: min(320px, calc(100vw - 16px)); }
.cph-select { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; margin-bottom: 4px; padding: 0 12px 0 10px; border: 0; border-radius: 6px; background: none; font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
.cph-select:hover { background: var(--hover-fill); color: var(--ink); }
.cph-select[data-on] { background: var(--accent); color: var(--paper); }
.cph-select:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
@media (max-width: 699.98px) {
  .cph-scope .area-picker { padding: 0 10px; }
  .cph-scope .area-picker::after { display: none; }
  .cph-field { padding: 0 8px; gap: 8px; }
  .cph-field input { font-size: 17px; }
  .cph-slash { display: none; }
  /* The phone shell's bar is the search (phone-loci-bar §6.2): the page's own field and its clear button step aside. */
  html[data-phone-shell] .cph-field, html[data-phone-shell] .cph-clear { display: none; }
  html[data-phone-shell] .library-wall .lsearch input { display: none; }
  .cph-search .shv-seg button { padding: 0 8px; font-size: 0; gap: 0; }
  .cph-bar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .cph-bar::-webkit-scrollbar { display: none; }
  .cph-bar > * { flex: none; }
  .cph-grow { display: none; }
}
/* ---- shelves.css ---- */
/* Commonplace Shelves (spec docs/superpowers/specs/2026-10-21-library-shelves-design.md §4, §5, §9). Ported from the
   owner's reference page (2026-10-21-library-shelves-mockups/commonplace-reference.html, its Shelves block) and the
   companion faces page beside it (shelf-faces.html). Sizes, type and spacing are the reference's; its colours are the
   app's role tokens (§9: --s1/--s2 are --status-1/--status-2, --cover is --cover-paper, --on-s2 is --on-status-2,
   --shelf is --shelf-edge). Every class is prefixed `shv-`: library.css already has `.shelf`. Only transform and opacity
   move. */

/* The reference names a line height only where it wants one; elsewhere its text runs at the font's normal height, where
   the app's body sets 1.45. Shelves' own text takes the reference's (the loose panel's wall cards keep the wall's).
   Shared blocks drawn inside a face or the desk (LinkCover, PhotoBlock, YoutubeThumb, PersonMark) inherit it too, except
   where they name their own (the cover's title, the photo's label). */
.shv-row2, .shv-banner, .shv-desk, .shv-bay-h, .shv-label, .shv-sfoot, .shv-face, .shv-end, .shv-loose-h { line-height: normal; }

/* A shelf (reference `.shelf`, `.slabel`, `.sbody`): the label column (200 px) beside the shelf body. The body comes
   first in the DOM so Tab reaches the faces before Open shelf (C-20); `order` puts the label first on screen. */
.shv-shelf { display: flex; flex-wrap: wrap; gap: 0 32px; padding-top: 14px; transition: opacity var(--dur-standard) var(--ease-standard); }
/* `contain: inline-size`: a long track never widens the page (a grid or flex parent would size to its faces otherwise). */
.shv-sbody { position: relative; flex: 999 1 520px; min-width: 0; contain: inline-size; transition: opacity var(--dur-standard) var(--ease-standard); }
.shv-label { order: -1; flex: 0 0 200px; min-width: 0; padding-top: 40px; }
.shv-kicker { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); }
.shv-kicker i { flex: none; width: 9px; height: 9px; border-radius: 2px; }
.shv-name { margin: 6px 0; font-family: var(--read); font-weight: 500; font-size: 22px; line-height: 1.2; text-wrap: balance; }
.shv-meta { margin: 0; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.shv-linkb { margin-top: 10px; padding: 4px 0; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--accent); background: none; border: 0; cursor: pointer; }
.shv-linkb:hover { color: var(--ink); }
/* Empty in the chosen area (C-4, after CO-6): the shelf at 60 %, its name in --ink-2; the label keeps full contrast. */
.shv-shelf[data-faded] > .shv-sbody { opacity: 0.6; }
.shv-shelf[data-faded] .shv-name { color: var(--ink-2); }
/* A search or thread with no match on this shelf (§7.1). */
.shv-shelf[data-unlit] { opacity: 0.4; }

/* A shelf row: the faces stand on a 2 px edge over a board (reference `.srow`, `.track`, `.board`). The track reaches
   10 px below the edge and 6 px past each end (negative margins, the faces where the reference puts them), so a lit
   outline or the focus halo is not clipped by the sideways scroll. */
.shv-srow { position: relative; border-bottom: 2px solid var(--shelf-edge); }
.shv-track { list-style: none; margin: 0 -6px -10px; display: flex; align-items: flex-end; gap: 6px; min-height: 216px; padding: 34px 10px 10px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scroll-padding-inline: 10px; overscroll-behavior-x: contain; scrollbar-width: none; }
.shv-track::-webkit-scrollbar { display: none; }
.shv-track > * { scroll-snap-align: start; }
/* While the keyboard moves along the row (C-20) snap is off, so a focused face stops clear of the 64 px edge fade. */
.shv-track[data-keys] { scroll-snap-type: none; }
.shv-track[data-keys] .shv-face { scroll-margin-inline: 64px; }
/* An open shelf's rows never scroll (reference `.track.wrapped`). */
.shv-track.is-wrapped { overflow: visible; scroll-snap-type: none; }
.shv-board { height: 9px; background: var(--board); border-bottom: 1px solid var(--line); border-radius: 0 0 3px 3px; transform-origin: left center; }
.shv-board + .shv-srow { margin-top: 6px; }
.shv-board + .shv-srow .shv-track { min-height: 0; padding-top: 30px; }

/* The closed carousel's edge fade where there is more (reference `.sbody[data-left]`), and its ‹ › (`.cbtn`), shown
   only where there is more that way and never on touch screens, where the row swipes. */
.shv-carousel { position: relative; }
.shv-carousel[data-left] .shv-track { -webkit-mask-image: linear-gradient(to right, transparent, #000 64px); mask-image: linear-gradient(to right, transparent, #000 64px); }
.shv-carousel[data-right] .shv-track { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 64px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 64px), transparent); }
.shv-carousel[data-left][data-right] .shv-track { -webkit-mask-image: linear-gradient(to right, transparent, #000 64px, #000 calc(100% - 64px), transparent); mask-image: linear-gradient(to right, transparent, #000 64px, #000 calc(100% - 64px), transparent); }
.shv-carbtn { position: absolute; top: 116px; z-index: 3; width: 40px; height: 40px; margin-top: -20px; padding: 0; border: 0; border-radius: 50%; background: var(--panel); box-shadow: 0 0 0 1px var(--line), var(--shadow-pic); display: grid; place-items: center; color: var(--ink); cursor: pointer; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity var(--dur-quick) var(--ease-standard), visibility 0s linear var(--dur-quick); }
.shv-carbtn.is-prev { left: -10px; }
.shv-carbtn.is-next { right: -10px; }
.shv-carbtn:hover { color: var(--accent); }
/* Shown at once and faded in; on the way out it fades, then hides (visibility waits for the fade). */
.shv-carousel[data-left] > .shv-carbtn.is-prev, .shv-carousel[data-right] > .shv-carbtn.is-next { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
@media (pointer: coarse) { .shv-carbtn { display: none; } }
/* The position line and the open shelf's foot (reference `.sfoot`). */
.shv-sfoot { display: flex; justify-content: flex-end; align-items: center; gap: 12px; min-height: 22px; padding-top: 6px; font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.shv-seeall { padding: 4px 0; font-size: 12px; font-weight: 500; color: var(--accent); text-decoration: none; }
.shv-seeall:hover { color: var(--ink); }

/* The end of a shelf: the stub (`.stub`) for what it does not show, and + (`.add`). */
.shv-end { flex: none; display: flex; align-items: flex-end; }
.shv-stub { margin-left: 10px; width: 92px; height: 132px; padding: 8px; border: 1px dashed var(--ink-3); border-bottom: 0; border-radius: 4px 4px 0 0; display: grid; place-items: center; text-align: center; font-size: 12.5px; line-height: 1.35; color: var(--ink-2); text-decoration: none; }
.shv-stub:hover { color: var(--accent); border-color: var(--accent); }
.shv-add { width: 44px; height: 44px; margin: 0 4px 4px 8px; padding: 0; border: 0; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); color: var(--accent); display: grid; place-items: center; cursor: pointer; }
.shv-add:hover { box-shadow: inset 0 0 0 1px var(--accent); }

/* Phones (the reference's 700 px query): the label above its shelf with the toggle at its right; a lower track. */
@media (max-width: 699.98px) {
  .shv-label { flex-basis: 100%; padding-top: 4px; display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 12px; }
  .shv-kicker, .shv-name, .shv-meta { grid-column: 1; }
  .shv-name { font-size: 19px; margin: 2px 0; }
  .shv-linkb { grid-column: 2; grid-row: 1 / span 3; margin: 0; }
  .shv-track { min-height: 200px; }
}
@media (prefers-reduced-motion: reduce) {
  .shv-shelf, .shv-sbody, .shv-carbtn { transition: none; }
}

/* A face in its slot (reference `.slot`, `.sh`). The slot is the hover target and never moves; the face lifts 6 px on
   hover and dips to the press scale (§5), so the pointer never loses it at the bottom edge. */
.shv-slot { position: relative; flex: none; display: flex; flex-direction: column; justify-content: flex-end; scroll-snap-align: start; }
.shv-face { position: relative; display: block; color: var(--ink); text-decoration: none; transition: transform var(--dur-quick) var(--ease-standard), opacity var(--dur-standard) var(--ease-standard); }
.shv-slot:hover > .shv-face { transform: translateY(-6px); }
.shv-slot > .shv-face:active { transform: scale(var(--press-scale)); transition-duration: var(--dur-instant); }
.shv-slot:hover > .shv-face:active { transform: translateY(-6px) scale(var(--press-scale)); }
/* A face's own inset edges (fills, papers, the cover's spine shading) live in --shv-inset, so the focus halo can add to them. */
.shv-face { --shv-inset: 0 0 0 0 transparent; box-shadow: var(--shv-inset); }
/* A search or thread match is outlined (the selected thread item heavier); the rest of the shelf dims (§7). */
.shv-face[data-lit] { outline: 2px solid var(--accent); outline-offset: 3px; }
.shv-face[data-lit="thread"] { outline-width: 3px; }
.shv-face[data-dim] { opacity: 0.2; }
/* Coming back from its page (§6.1): the face, or the desk card, glows once, as a wall card does (library.css
   `.mcard[data-glow]`, `card-glow`). Faces clip their content, so the ring is drawn inside the edge. */
.shv-dcard[data-glow] { position: relative; }
.shv-face[data-glow]::after, .shv-dcard[data-glow]::after { content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; box-shadow: inset 0 0 0 2px var(--accent); pointer-events: none; opacity: 0; animation: card-glow var(--dur-calm) var(--ease-standard); }
/* Focus is the ring plus a halo outside it, so a focused face still reads as focused when it is also lit (the same ring). */
.shv-face:focus-visible { outline: var(--focus-ring); outline-offset: 3px; box-shadow: var(--shv-inset), 0 0 0 6px var(--surface-page), 0 0 0 8px var(--accent); }
/* The thread's own item keeps its heavier ring while focused (§7.2). */
.shv-face[data-lit="thread"]:focus-visible { outline-width: 3px; }
/* The face's `⋯` (C-18) sits above its top right corner, in the track's headroom, shown on hover or focus. It is out of
   the Tab order (the shelf is one Tab stop, C-20); touch screens open the menu by press-and-hold instead. */
.shv-slot > .card-more { position: absolute; top: -34px; right: -3px; margin: 0; z-index: 2; }
.shv-slot:hover > .card-more, .shv-slot:focus-within > .card-more { opacity: 1; }
@media (hover: none) { .shv-slot > .card-more { display: none; } }

/* Pictures inside faces (card-media.tsx's blocks, sized by their face): the wall's grid paper while empty or preparing. */
.shv-face .im { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--surface-mat); background-image: linear-gradient(color-mix(in srgb, var(--ink) 5.5%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--ink) 5.5%, transparent) 1px, transparent 1px); background-size: 34px 34px; }
.shv-face .im > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.shv-face .im .im-label { position: absolute; left: 8px; right: 8px; bottom: 7px; font-size: 10.5px; line-height: 1.25; color: var(--ink-2); }
.shv-pic { position: relative; display: block; overflow: hidden; }

/* Spine (`.spine`): its size and one of six fills come from its id (`spineDims`). */
.shv-spine { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 12px 0; border-radius: 2px 2px 0 0; overflow: hidden; --shv-inset: inset -2px 0 0 color-mix(in srgb, var(--shade) 7%, transparent); }
.shv-spine .shv-st, .shv-binder .shv-st, .shv-notebook .shv-st { writing-mode: vertical-rl; font-family: var(--read); font-size: 13px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-height: 0; }
.shv-spine .shv-sb { writing-mode: vertical-rl; font-size: 9.5px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.75; white-space: nowrap; margin-top: 10px; }
/* Fills A–F (`.cA`…`.cF`): accent, status-2, status-1, cover paper, panel, quote paper. */
.shv-fill-a { background: var(--accent); color: var(--on-accent); }
.shv-fill-b { background: var(--status-2); color: var(--on-status-2); }
/* Text on --status-1 (fill C and the portrait tile): --ink in light; in dark --ink reaches only 4.48:1 on it (Axe), so
   the cover ink (4.96:1). */
.shv-fill-c, .shv-portrait { background: var(--status-1); color: light-dark(var(--ink), var(--cover-ink)); }
/* The creator line is muted by opacity (the reference's 0.75) only where the result still reads at 4.5:1 (D31). */
.shv-fill-b .shv-sb, .shv-fill-c .shv-sb { opacity: 1; }
.shv-fill-d { background: var(--cover-paper); color: var(--cover-ink); }
.shv-fill-e { background: var(--panel); color: var(--ink); --shv-inset: inset 0 0 0 1px var(--line); }
.shv-fill-f { background: var(--quote-paper); color: var(--ink); --shv-inset: inset 0 0 0 1px var(--quote-rule); }

/* Face-out book (`.fo`): the dark text cover; a cover photo or ISBN cover fills it when there is one (never tinted). */
.shv-cover { width: 116px; height: 174px; margin-right: 6px; display: flex; flex-direction: column; justify-content: space-between; padding: 15px 12px 12px 15px; border-radius: 2px 4px 4px 2px; overflow: hidden; background: var(--cover-paper); color: var(--cover-ink); --shv-inset: inset 3px 0 0 var(--cover-spine-light), inset 5px 0 2px var(--cover-spine-shade); }
.shv-cover .shv-ft1 { font-family: var(--read); font-size: 16px; line-height: 1.15; }
.shv-cover .shv-fb1 { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.8; }
/* Transparent until its picture arrives, so the text cover shows while it loads (and stays if the picture fails). */
.shv-cover-pic { position: absolute; inset: 0; }
.shv-cover-pic > img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Binder (`.binder`) and the Long note's notebook (new): note paper with the wall Note's status-2 edge. */
.shv-binder, .shv-notebook { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0 14px; background: var(--panel); --shv-inset: inset 0 0 0 1px var(--line); border-radius: 3px 3px 0 0; overflow: hidden; }
.shv-binder .shv-tag, .shv-notebook .shv-tag { font-size: 9.5px; font-weight: 600; color: var(--accent); margin-bottom: 8px; white-space: nowrap; }
/* A Source without a link names its kind (C-31): too wide for a narrow binder across, it runs down like the title. */
.shv-binder .shv-tag.is-kind { writing-mode: vertical-rl; letter-spacing: 0.04em; text-transform: uppercase; }
.shv-binder .shv-sb, .shv-notebook .shv-sb { writing-mode: vertical-rl; font-size: 9.5px; color: var(--ink-2); margin-top: 8px; white-space: nowrap; }
.shv-notebook { background: var(--note-paper); --shv-inset: inset 3px 0 0 var(--status-2), inset 0 0 0 1px var(--line); }
.shv-notebook .shv-tag { color: var(--ink-2); }

/* Video tile (`.sv`) and link tile (new): a 110 px picture, the link's kind and domain, the title. */
.shv-video, .shv-link { width: 196px; }
.shv-video .shv-pic, .shv-link .shv-pic { height: 110px; border-radius: 4px; background: var(--cover-paper); }
.shv-face .yt-thumb-wrap { position: absolute; inset: 0; }
.shv-face .yt-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shv-face .yt-play-badge { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--media-badge); color: var(--on-media); display: grid; place-items: center; font-size: 11px; pointer-events: none; }
.shv-dur { position: absolute; right: 6px; bottom: 7px; font-size: 10.5px; font-weight: 600; padding: 2px 5px; border-radius: 3px; background: var(--media-badge); color: var(--on-media); font-variant-numeric: tabular-nums; }
.shv-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--status-2); }
.shv-vk { display: block; padding: 8px 2px 0; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shv-vt { display: block; font-size: 13px; font-weight: 500; line-height: 1.25; padding: 8px 2px 10px; height: 44px; overflow: hidden; }
/* The reference clips the title at 44 px; two whole lines are kept instead, so a third never shows cut in half. */
.shv-vt > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.shv-link .shv-vt { padding-top: 2px; }
/* The generated link cover (LinkCover) at the tile's size: the domain small on top, the title in Newsreader below. */
.shv-face .link-cover { position: absolute; inset: 0; display: flex; flex-direction: column-reverse; justify-content: space-between; padding: 12px; background: var(--cover-paper); color: var(--cover-ink); }
.shv-face .link-cover b { font-family: var(--read); font-size: 15px; font-weight: 400; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.shv-face .link-cover span { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Index card (`.ic`) and quote card (`.ic.qq`, upright, C-16). */
.shv-card, .shv-quote { width: 154px; height: 172px; display: flex; flex-direction: column; justify-content: space-between; padding: 13px 13px 11px; background: var(--note-paper); --shv-inset: inset 0 0 0 1px var(--line); border-radius: 3px; }
.shv-it1 { font-family: var(--read); font-size: 14px; line-height: 1.32; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
.shv-ib1 { font-size: 11px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shv-quote { background: var(--quote-paper); --shv-inset: inset 0 0 0 1px var(--quote-rule); }
.shv-quote .shv-it1 { font-style: italic; font-size: 15px; }
.shv-quote .shv-ib1 { border-top-color: var(--quote-rule); }

/* Print (`.pr`): the photo at its own proportions (`photoDims`) on a white mat, its title under it. */
.shv-print { padding: 7px 7px 24px; background: var(--panel); --shv-inset: inset 0 0 0 1px var(--line); border-radius: 2px; }
.shv-print-pic { position: relative; overflow: hidden; border-radius: 1px; }
.shv-pl { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 10.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* An album's print (albums §B): two sheets peek out behind it, up and to the right (the wall's group `.stack`), and its
   caption keeps the photo count whole while the title gives way. */
.shv-print.is-album { margin: 6px 6px 0 0; --shv-inset: inset 0 0 0 1px var(--line), 3px -3px 0 -1px var(--panel), 3px -3px 0 0 var(--line), 6px -6px 0 -1px var(--panel), 6px -6px 0 0 var(--line); }
.shv-pl-album { display: flex; gap: 6px; }
.shv-pl-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.shv-pc { flex: none; margin-left: auto; font-variant-numeric: tabular-nums; }

/* Portrait tile (`.pt`): status-1 paper (with fill C above), the first card field small, the photo as a 56 px circle
   (new), the name. --ink-2 is 3.7:1 on status-1, so the kicker keeps the tile's text colour. */
.shv-portrait { width: 126px; height: 168px; display: flex; flex-direction: column; justify-content: space-between; padding: 13px 12px; border-radius: 4px; }
.shv-pk { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.shv-pnm { font-family: var(--read); font-size: 21px; line-height: 1.1; }
/* The photo circle; when its link fails twice PersonMark shows the initials instead, drawn as the wall's Person mark. */
.shv-portrait .person-mark { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--panel); display: grid; place-items: center; background: var(--surface-board); font-family: var(--read); font-size: 20px; color: var(--text-muted); }
.shv-portrait .person-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Postcard (`.pc`) and the Text-layout postcard (new): panel paper, a 108 px picture or none, the title, the first field. */
.shv-postcard, .shv-textcard { width: 168px; background: var(--panel); --shv-inset: inset 0 0 0 1px var(--line); border-radius: 4px; overflow: hidden; }
.shv-postcard .shv-pic { height: 108px; }
.shv-pct { display: block; padding: 8px 10px 0; font-family: var(--read); font-size: 15px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shv-pcb { display: block; padding: 2px 10px 10px; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shv-textcard { height: 150px; display: flex; flex-direction: column; justify-content: flex-end; }
.shv-textcard .shv-pk { padding: 12px 10px 0; margin-bottom: auto; color: var(--ink-2); }
.shv-textcard .shv-pct { white-space: normal; font-size: 18px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

/* ——— The screen (spec §4.1–§4.5, §7.1; reference `.row2`, `.banner`, `.desk`, `.bay-h`, `.loose`) ——— */

/* The second line: bay links on the left, Each shelf shows on the right (reference `.row2`, `.bays`, `.sort`), the
   reference's 18 px under the search line (whose own margin below is 20 px). */
.shv-row2 { margin-top: -2px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.shv-baylinks { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.shv-baylinks a { padding: 6px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); color: var(--ink); text-decoration: none; }
.shv-baylinks a span { color: var(--ink-2); }
.shv-baylinks a:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.shv-baylinks a.is-loose { box-shadow: none; border: 1px dashed var(--ink-3); background: none; color: var(--ink-2); }
.shv-sort { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.shv-sort select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }

/* The search banner, sticky under the header (reference `#banner`, `.banner`); the page colour around it hides what
   scrolls beneath. */
.shv-banner-slot { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
/* Phones: under the app's sticky header (the reference has none), not behind it. */
@media (max-width: 699.98px) { .shv-banner-slot { top: var(--m-bar); } }
.shv-banner { margin-top: 16px; box-shadow: 0 0 0 4px var(--paper); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 13.5px; }
.shv-banner b { color: var(--accent); font-weight: 600; }
.shv-banner span { color: var(--ink-2); }
.shv-banner button { margin-left: auto; padding: 4px 0; border: 0; background: none; font: inherit; font-size: 13px; color: var(--accent); cursor: pointer; }
.shv-banner button:hover { color: var(--ink); }

/* Eyebrows of the desk and the loose panel (reference `.eyebrow`). */
.shv-eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }

/* On the desk (reference `.desk`, `.dcard`). */
.shv-desk { margin-top: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px 20px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; transition: opacity var(--dur-standard) var(--ease-standard); }
.shv-desk-h { flex: 0 0 200px; }
.shv-desk-h h2 { margin: 6px 0 4px; font-family: var(--read); font-weight: 500; font-size: 20px; }
.shv-desk-h p { margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
.shv-desk-list { flex: 999 1 520px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.shv-dcard { display: flex; gap: 14px; align-items: center; min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); text-decoration: none; }
.shv-dcard:hover { border-color: var(--ink-3); }
/* The picture: the video's thumbnail (64 × 40), else a 40 × 56 paper (the book's cover paper, a PDF's note paper). */
.shv-dt { position: relative; flex: none; width: 40px; height: 56px; overflow: hidden; border-radius: 3px; background: var(--note-paper); box-shadow: inset 0 0 0 1px var(--line); }
.shv-dt.is-book { background: var(--cover-paper); }
.shv-dt.is-video { width: 64px; height: 40px; background: var(--cover-paper); }
.shv-dt .yt-thumb-wrap, .shv-dt .yt-thumb-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.shv-dt .yt-play-badge { display: none; }
.shv-db { flex: 1; min-width: 0; }
.shv-dk { display: block; font-size: 11.5px; color: var(--ink-2); }
.shv-dn { display: block; margin: 2px 0 8px; font-family: var(--read); font-size: 16px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shv-prog { display: block; height: 2px; background: var(--line); }
.shv-prog > i { display: block; height: 2px; background: var(--accent); }
.shv-dm { display: block; margin-top: 6px; font-size: 12px; color: var(--ink-2); }

/* A bay (reference `.bay`, `.bay-h`): the type upper-case, a rule, "3 shelves · 41 items". */
.shv-bay { padding-top: 40px; scroll-margin-top: 16px; }
.shv-bay-h { display: flex; align-items: baseline; gap: 14px; padding-bottom: 4px; }
.shv-bay-h h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.shv-bay-h h2:focus { outline: none; }
.shv-bay-h h2:focus-visible { outline: var(--focus-ring); outline-offset: 4px; }
.shv-rule { flex: 1; height: 1px; background: var(--line); }
.shv-bay-n { font-size: 12px; color: var(--ink-2); }

/* Not on a shelf (reference `.loose`, `.lcard`): each loose item as its wall card, 196 px wide, with Shelve… under it. */
.shv-loose { margin-top: 56px; border: 1px dashed var(--ink-3); border-radius: 12px; padding: 22px 24px 26px; display: flex; flex-wrap: wrap; gap: 20px 32px; scroll-margin-top: 16px; transition: opacity var(--dur-standard) var(--ease-standard); }
.shv-loose-h { flex: 0 0 200px; }
.shv-loose-h .shv-eyebrow { color: var(--ink-2); }
.shv-loose-h h2 { margin: 6px 0; font-family: var(--read); font-weight: 500; font-size: 22px; }
.shv-loose-h h2:focus { outline: none; }
.shv-loose-h h2:focus-visible { outline: var(--focus-ring); outline-offset: 4px; }
.shv-loose-h p { margin: 0; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.shv-loose-body { flex: 999 1 520px; min-width: 0; }
.shv-loose-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.shv-lcard { width: 196px; display: flex; flex-direction: column; gap: 8px; transition: opacity var(--dur-standard) var(--ease-standard); }
.shv-lcard > .mcard { grid-row-end: auto; }
.shv-loose-body > .shv-seeall { display: inline-block; margin-top: 14px; }

/* While a search is on (§7.1): the desk and a loose panel without a match fade to 40 %; inside a loose panel with a
   match, the matches are outlined as lit faces are and the rest dims to 20 %. */
.shv-desk[data-faded], .shv-loose[data-faded] { opacity: 0.4; }
.shv-lcard[data-lit] > .mcard { outline: 2px solid var(--accent); outline-offset: 3px; }
.shv-lcard[data-lit="thread"] > .mcard { outline-width: 3px; }
.shv-lcard[data-dim] { opacity: 0.2; }

/* ——— Wall | Shelves (spec §3, §8.6, C-1, C-32; reference `.seg`) ——— */

/* The switch at the end of the search line: two halves on the board colour, the shown one raised on the panel. */
.shv-seg { flex: none; display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--board); }
.shv-seg button { position: relative; height: 34px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); display: flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; cursor: pointer; }
.shv-seg button:hover { color: var(--ink); }
.shv-seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px color-mix(in srgb, var(--shade) 8%, transparent); font-weight: 500; }
.shv-seg button:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
/* While the chosen view's read is on its way: a 2 px accent line along the half's foot, drawn and undrawn in a loop. */
.shv-progress { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; border-radius: 1px; background: var(--accent); transform-origin: left center; animation: shv-progress 1100ms var(--ease-standard) infinite; }
@keyframes shv-progress { 0% { transform: scaleX(0.08); } 55% { transform: scaleX(1); } 100% { transform: scaleX(0.08); } }

/* A view, and the other view's placeholders over it while a slow read keeps the switch waiting: everything but the
   search line fades, and the placeholders stand under it (placed by LibraryViews). */
.shv-pane { position: relative; }
.shv-pane > :is(.library-wall, .library-shelves) > :not(.lsearch) { transition: opacity var(--dur-standard) var(--ease-standard); }
.shv-pane[data-slow] > :is(.library-wall, .library-shelves) > :not(.lsearch) { opacity: 0; pointer-events: none; }
.shv-pane-wait { position: absolute; left: 0; right: 0; top: 0; }
.shv-pane-wait .ph-search { display: none; }

/* Shelves' placeholders: bays of empty boards with grey face shapes in --surface-board, each shelf with its label lines. */
.shv-placeholder { --ph: var(--surface-board); }
.shv-ph-bay { padding-top: 40px; }
.shv-ph-bay-h { width: 120px; height: 12px; }
.shv-ph-shelf { display: flex; flex-wrap: wrap; gap: 0 32px; padding-top: 14px; }
.shv-ph-label { flex: 0 0 200px; padding-top: 40px; display: grid; gap: 8px; align-content: start; }
.shv-ph-name { height: 20px; }
.shv-ph-body { flex: 999 1 520px; min-width: 0; overflow: hidden; }
.shv-ph-row { display: flex; align-items: flex-end; gap: 6px; min-height: 216px; padding: 34px 4px 0; border-bottom: 2px solid var(--line); }
.shv-ph-face { flex: none; width: var(--ph-w); height: var(--ph-h); border-radius: 2px; background: var(--ph); }

/* The morph's overlay (spec §8.1): fixed over the page, above the stage and below the capture box and the page ghost,
   never hit, never read. Each clone stands in a frame that moves and fades from its top-left corner; the clone keeps
   its own look (a dimmed face stays dimmed) and none of its own transitions or animations. */
.shv-morph-layer { position: fixed; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
.shv-morph-layer > div { position: fixed; transform-origin: 0 0; will-change: transform, opacity; }
.shv-morph-layer > div * { transition: none !important; animation: none !important; }
.shv-morph-layer > div > * { position: relative; transform: none; }

@media (max-width: 699.98px) {
  /* Phones: the clones fly under the sticky header (z 40) and the Loci bar (z 42), as the page scrolls under that
     translucent chrome, and still over the page and the sticky banner (z 20). */
  .shv-morph-layer { z-index: 39; }
  .shv-desk-h, .shv-loose-h { flex-basis: 100%; }
  .shv-ph-label { flex-basis: 100%; padding-top: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .shv-desk, .shv-loose, .shv-lcard, .shv-pane > :is(.library-wall, .library-shelves) > :not(.lsearch) { transition: none; }
  .shv-progress { animation: none; }
  .shv-face[data-glow]::after, .shv-dcard[data-glow]::after { animation: none; opacity: 1; }
}
/* ---- shared.css ---- */
/* ---------- A share link's public page (3B-2c P1): the player without the workspace ---------- */

/* The page scrolls (follow-up 2): the first screen holds the quiet header and the player, and "Made with Studiolo"
   follows below it (mock-up docs/superpowers/specs/2026-10-15-followups-mockups/share-page.html). */
.xp-shared {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--paper);
}

/* One column for the whole page (Learn 1.5a §4): header, player, title line, "Made with Studiolo" and the foot share the
   same left and right edge, at most 1280px wide with real side margins (--xp-share-gutter: 64px from 1440, 44 from
   1024, 32 from 700, 20 below). The course share page reuses it. */
.xp-shared-col {
  --xp-share-gutter: 20px;
  --xp-share-gap: 72px;
  box-sizing: content-box;
  max-width: 1280px;
  margin-inline: auto;
  padding-inline: var(--xp-share-gutter);
}

@media (max-width: 639px) {
  .xp-shared-col {
    --xp-share-gap: 48px;
  }
}

@media (min-width: 700px) {
  .xp-shared-col {
    --xp-share-gutter: 32px;
  }
}

@media (min-width: 1024px) {
  .xp-shared-col {
    --xp-share-gutter: 44px;
  }
}

@media (min-width: 1440px) {
  .xp-shared-col {
    --xp-share-gutter: 64px;
  }
}

/* The slot under the title line for the add bar (Learn 1.5a §5.3); empty when the page has no bar. */
.xp-shared-slot {
  display: block;
}

/* The first screen fits the player as the workspace player does (E75): a fixed-height column with the header and the
   player (.xp-page, which takes what is left). It is the window less 64px, so the top of the section below (its rule
   and kicker) peeks at the foot of the window. The padding is the player's .main-stage padding without the rail, so
   the player measures --xp-chrome and its 16:9 stage the same way. A very short window keeps a usable minimum and the
   page scrolls instead. Its foot is the space between the title line and the section (72px, 48 on phones), so the
   section still begins 64px short of the window's foot. */
.xp-shared-first {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 64px);
  height: calc(100dvh - 64px);
  min-height: 320px;
  padding: 18px 0 var(--xp-share-gap);
}

/* With the add bar (Learn 1.5a §5.3, R14) the foot space moves below the bar: the first screen gives it up, so the player
   keeps its size and the bar sits under the player block on the first screen, then the 72px (48 on phones) before the
   section. */
.xp-shared-first.has-add {
  height: calc(100vh - 64px - var(--xp-share-gap));
  height: calc(100dvh - 64px - var(--xp-share-gap));
  padding-bottom: 0;
}

/* A shared Read lesson (Learn 1.5b Task 9): a page, not a stage, so the first screen is at least the window less the peek
   and grows with the page; the window scrolls, and "Made with Studiolo" follows the page's foot. */
.xp-shared-first.is-read,
.xp-shared-first.is-read.has-add {
  height: auto;
  min-height: calc(100vh - 64px);
  min-height: calc(100dvh - 64px);
}

/* A short screen (a phone held sideways) gives the player the whole window; the section's peek would leave a stamp-sized stage. */
@media (max-height: 500px) {
  .xp-shared-first,
  .xp-shared-first.has-add {
    height: 100vh;
    height: 100dvh;
  }
}

/* ---------- The add bar (Learn 1.5a §5.3; mock-ups ShareWide, SharePhone, CourseShare): one quiet row in the column ---------- */

.xp-add {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 24px 0 var(--xp-share-gap);
  padding: 14px 18px;
  border-radius: 3px;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);
}

.xp-add-text {
  min-width: 0;
}

.xp-add-lead {
  margin: 0;
  color: var(--ink);
  font-size: 14.5px;
}

.xp-add-detail {

}

.xp-add-more {
  margin: 4px 0 0;
  font-size: 13px;
}

.xp-add-error {

  font-size: 13px;
}

.xp-add-act {

  white-space: nowrap;
}

.xp-add-status {

  color: var(--ink-2);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;

/* Phones: the words above a full-width 44px button, as board 4. */
@media (max-width: 639px) {
  .xp-add {

    align-items: stretch;
    gap: 10px;
    margin-top: 18px;
    padding: 14px;
  }

  .xp-add-act {

   its player column scrolling on their own as in the workspace (courses.css .cv), inside a hairline frame so the two

.xp-shared-course > .cv {

  height: auto;
  min-height: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
}

/* The owner's breadcrumb header, with the rail's brand row in place of the crumb. */
.xp-shared-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.xp-shared-brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border-radius: 4px;
  color: var(--ink);
  text-decoration: none;
}

.xp-shared-brand:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 3px;
}

/* The marks stay on narrow screens, where the workspace's top bar hides its own. */
.xp-shared-brand .brand-mark,
.xp-made-kicker .brand-mark {
  display: grid;
}

/* The light/dark switch (3B-2c follow-up): the visitor's choice, saved like the workspace's (display cookie). */
.xp-shared-theme .theme-toggle-to-dark,
.xp-shared-theme .theme-toggle-to-light {
  justify-content: center;
}

.xp-shared-brand .brand {
  transition: color var(--dur-quick) var(--ease-standard);
}

.xp-shared-brand:hover .brand {
  color: var(--accent);
}

/* ---------- Made with Studiolo (follow-up 2): what Studiolo is, Join now and Sign in, three cues, the foot ---------- */

.xp-made {
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

/* The title card's kicker ("STUDIOLO EXPLAINER"), with a small mark. */
.xp-made-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.xp-made-kicker .brand-mark {
  width: 22px;
  height: 22px;
  flex-basis: 22px;
  border-radius: 5px;
  font-size: 14px;
  letter-spacing: 0;
}

.xp-made-body {
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  gap: 56px;
  align-items: start;
  padding: 44px 0 64px;
}

.xp-made h2 {
  margin: 0;
  font-family: var(--read);
  font-size: 38px;
  font-weight: 400;
  line-height: 1.12;
  letter-spacing: -0.01em;
  text-wrap: balance;
}

.xp-made-lead {
  max-width: 46ch;
  margin: 16px 0 0;
  color: var(--ink-2);
  font-family: var(--read);
  font-size: 17px;
  line-height: 1.55;
}

.xp-made-acts {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 26px;

/* The shell's .button and .button-quiet at the page's call-to-action size (40px, 14px text). */
.xp-made .button {
  min-height: 40px;
  padding: 8px 18px;
  font-size: 14px;
  text-decoration: none;
  transition: background var(--dur-quick) var(--ease-standard), box-shadow var(--dur-quick) var(--ease-standard);
}

.xp-made .button:hover {

}

.xp-made .button-quiet:hover {

}

.xp-made .button:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 2px;
}

.xp-made-note {
  margin: 14px 0 0;
  color: var(--ink-2);
  font-size: 12.5px;
}

/* The cue cards: the card anatomy (panel, 1px inset rule, 3px radius) with a picture on the board. */
.xp-made-cues {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin: 0;
  padding: 0;
  list-style: none;

.xp-made-cue {
  display: grid;
  align-content: start;
  gap: 12px;

  border-radius: 3px;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);

.xp-made-pic {
  display: block;
  width: 100%;
  height: auto;

  border-radius: 2px;

}

.xp-made-label {
  display: block;
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.xp-made-line {
  margin: 4px 0 0;
  color: var(--ink);
  font-family: var(--read);
  font-size: 17px;
  line-height: 1.35;
}

.xp-made-line em {
  color: var(--accent);
}

.xp-made-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 6px 16px;
  padding: 14px 0 32px;
  border-top: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 12.5px;
}

.xp-made-foot a {
  color: var(--ink-2);
  text-underline-offset: 3px;
}

.xp-made-foot a:hover {
  color: var(--ink);
}

/* The cue pictures' marks: the Graph's (.lk, .nd, .ctr, labels with a board halo), the Library's and the title
   card's, in role tokens. Own names (mw-*), so the Graph's live rules never reach them. */
.mw-lk { stroke: var(--ink-3); stroke-opacity: 0.55; stroke-width: 1; }
.mw-lk.mw-g { stroke: var(--ghost); stroke-opacity: 1; stroke-dasharray: 3 3; stroke-width: 1.1; }
.mw-nd.mw-s0 { fill: var(--paper); stroke: var(--ink-3); stroke-width: 1; }
.mw-nd.mw-s1 { fill: var(--status-1); stroke: var(--status-1); }
.mw-nd.mw-s2 { fill: var(--status-2); stroke: var(--status-2); }
.mw-nd.mw-g { fill: var(--ghost-soft); stroke: var(--ghost); stroke-width: 1.2; stroke-dasharray: 2.5 2.5; }
.mw-ctr { fill: var(--ink); stroke: var(--board); stroke-width: 2; }
.mw-lbl { fill: var(--ink); font-family: var(--read); font-size: 10.5px; text-anchor: middle; paint-order: stroke; stroke: var(--board); stroke-width: 4px; stroke-linejoin: round; }
.mw-lbl.mw-c { font-size: 12px; font-weight: 500; }
.mw-lbl.mw-g { fill: var(--ghost-ink); font-style: italic; }
.mw-panel { fill: var(--panel); stroke: var(--line); }
.mw-cover { fill: var(--cover-paper); }
.mw-cover-ink { fill: var(--cover-ink); font-family: var(--read); }
.mw-ink { fill: var(--ink); }
.mw-ink2 { fill: var(--ink-2); }
.mw-read { font-family: var(--read); }
.mw-ui { font-family: var(--ui); }
.mw-quote { fill: var(--quote-paper); stroke: var(--quote-rule); }
.mw-quote-bar { fill: var(--quote-rule); }
.mw-accent { fill: var(--accent); }
.mw-mark { fill: var(--ink); }
.mw-mark-s { fill: var(--panel); font-family: var(--read); }
.mw-cap { fill: var(--caption-bg); }
.mw-cap-ink { fill: var(--caption-ink); font-family: var(--ui); }

/* Under 1024px the player stacks (explainer.css) and the section is one column, the cues under the buttons. The
   first screen keeps its fixed height, so the transcript panel takes what is left, as the workspace player does. */
@media (max-width: 1023px) {

  }

  .xp-made-body {

    gap: 32px;
  }

/* Phones: a smaller heading, Join now and Sign in as equal 44px halves, and each cue a row (picture, then words). */
@media (max-width: 639px) {
  .xp-made {
    padding-top: 18px;
  }

  .xp-made-body {
    gap: 28px;
    padding: 26px 0 40px;
  }

  .xp-made h2 {
    font-size: 30px;
  }

  .xp-made-lead {
    font-size: 16px;
  }

  .xp-made-acts {

    grid-template-columns: 1fr 1fr;
  }

  .xp-made .button {
    min-height: 44px;
  }

  .xp-made-cues {
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }

  .xp-made-cue {
    grid-template-columns: 112px minmax(0, 1fr);
    align-items: center;
    gap: 14px;
    padding: 12px;
  }

    font-size: 16px;
  }

  .xp-made-foot {
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
