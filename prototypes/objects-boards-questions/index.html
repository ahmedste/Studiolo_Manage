<style>
/* studiolo main @ 7c0e8732 (28 Oct 2026): src/styles/{tokens,globals,shell,toasts,menus,library,shelves,shared,touch,phone,photo-viewer,photo-wall}.css, concatenated by hand for this prototype. */
/* Theme (Phase 2E, spec E1). Every theme-dependent colour is written once as light-dark(light, dark); color-scheme
   on <html> picks the side: `light dark` follows the OS (System, also the first paint with no cookie), and the root
   layout's data-theme pins Light or Dark. Light values are the agreed 2D palette; dark values are the agreed 2E
   mockup's (docs/superpowers/specs/2026-10-08-phase-2e-mockups/dark-theme.html). light-dark() takes colours only,
   so composite tokens (shadows) switch their colours inside one shared geometry. */
:root {
  color-scheme: light dark;
  --paper: light-dark(#f3f3ef, #131a20);
  --panel: light-dark(#fbfbf9, #1d272f);
  /* Lightened from #e7e7e1 in 2E (owner Q6) so muted text on the PDF desk reaches 4.5:1. */
  --board: light-dark(#ebebe6, #182128);
  --line: light-dark(#dbdbd3, #313d47);
  --ink: light-dark(#22303a, #e2e5e0);
  --ink-2: light-dark(#5d6c77, #9ba7b0);
  --ink-3: light-dark(#98a3ab, #6b7984);
  --status-1: light-dark(#c9d4f1, #4f64a3);
  --status-2: light-dark(#6e86d0, #7189d8);
  --status-3: light-dark(#1e3e9e, #a9bbf6);
  --accent: light-dark(#1e3e9e, #9db0f3);
  --ui: var(--font-instrument-sans), "Instrument Sans", system-ui, sans-serif;
  --read: var(--font-newsreader), "Newsreader", Georgia, serif;
  --focus-ring: 2px solid var(--accent);

  /* Motion (Phase 2D). Animate transform and opacity only. */
  --ease-standard: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-entrance: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1);
  --dur-instant: 80ms;
  --dur-quick: 130ms;
  --dur-standard: 220ms;
  --dur-move: 380ms;
  --dur-leave: 170ms;
  --dur-calm: 1250ms;
  /* Commonplace Shelves: the morph between the Wall and Shelves (shelves spec §8.2, the reference page's 560 ms). */
  --dur-morph: 560ms;
  --lift: 2px;
  --press-scale: 0.985;
  --enter-travel: 8px;

  /* Roles. Components use these names. */
  --surface-page: var(--paper);
  --surface-panel: var(--panel);
  --surface-board: var(--board);
  /* Floating layers (menus, quick view panel, reader) are one step lighter than panels in dark (2E). */
  --surface-float: light-dark(var(--panel), #232e37);
  --scrim: light-dark(rgba(34, 48, 58, 0.18), rgba(4, 8, 11, 0.45));
  /* A dialog's backdrop (mock-up `.backdrop`): a little deeper than the menus' scrim. */
  --scrim-dialog: light-dark(rgba(34, 48, 58, 0.28), rgba(4, 8, 11, 0.6));
  --scrim-blur: light-dark(rgba(243, 243, 239, 0.72), rgba(19, 26, 32, 0.8));
  --text: var(--ink);
  --text-muted: var(--ink-2);
  --text-decor: var(--ink-3);
  --rule: var(--line);
  /* Shadow colour for one-off shadows: color-mix(in srgb, var(--shade) N%, transparent) equals rgba(34,48,58,N%) in light. */
  --shade: light-dark(rgb(34, 48, 58), rgb(0, 0, 0));
  --shadow-pic: 0 1px 2px light-dark(rgba(34, 48, 58, 0.07), rgba(0, 0, 0, 0.32)), 0 8px 22px light-dark(rgba(34, 48, 58, 0.09), rgba(0, 0, 0, 0.26));
  --shadow-lift: 0 2px 4px light-dark(rgba(34, 48, 58, 0.08), rgba(0, 0, 0, 0.34)), 0 16px 36px light-dark(rgba(34, 48, 58, 0.15), rgba(0, 0, 0, 0.4));
  /* In dark a 1px light edge sets floating layers apart (2E); the mockup's 44px blur stays 48px (J2). */
  --shadow-float: 0 0 0 1px light-dark(transparent, rgba(255, 255, 255, 0.05)), 0 1px 2px light-dark(rgba(34, 48, 58, 0.06), transparent), 0 18px 48px light-dark(rgba(34, 48, 58, 0.16), rgba(0, 0, 0, 0.42));
  /* Graph marks (Phase 2D D16), for filter: drop-shadow(): a hovered dot and a hovered lane card. */
  --shadow-mark: 0 3px 5px light-dark(rgba(34, 48, 58, 0.22), rgba(0, 0, 0, 0.5));
  --shadow-lane: 0 4px 8px light-dark(rgba(34, 48, 58, 0.1), rgba(0, 0, 0, 0.35));
  /* The opened navigation rail over the page (Phase 2D D23). */
  --shadow-rail: 10px 0 30px light-dark(rgba(34, 48, 58, 0.08), rgba(0, 0, 0, 0.35));
  --accent-soft: light-dark(#e6ebf8, #263156);
  /* A hovered accent text (entity pill). */
  --accent-strong: light-dark(#142b73, #c3cff8);
  --warn: light-dark(#9a3b2e, #ec9c8d);
  --warn-soft: light-dark(#f6e4df, #3a2521);
  --ok: light-dark(#2f6b4a, #84c9a2);
  --quote-paper: light-dark(#faf8f2, #29271f);
  --quote-rule: light-dark(#eae5d9, #3f3a2e);
  --note-paper: light-dark(#faf9f5, #21282c);
  --hover-fill: light-dark(#ecece6, #2a353f);
  --ghost: light-dark(#7b8fd4, #8497dc);
  /* A suggested topic's fill and label (Phase 2D D22, graph-copilot mock-up .nd.gh and .kl.ghl). */
  --ghost-soft: light-dark(rgba(123, 143, 212, 0.08), rgba(132, 151, 220, 0.1));
  --ghost-ink: light-dark(#4a5fa8, #b3c1f0);
  /* The panel header's My Focus chip when on (graph-copilot mock-up .chip-btn.star). */
  --myfocus-ink: light-dark(#8a5a00, #e8c27a);
  --myfocus-paper: light-dark(#fbf3df, #33291a);
  --myfocus-rule: light-dark(#ecd9a8, #5a4824);
  /* A Lumen board's highlighter yellow (Lumen boards, the owner's design): the same in both themes, blended per theme. */
  --board-marker: #e8c27a;
  /* Something waiting for the learner's OK (the copilot's "Needs your OK", graph-copilot mock-up .req): the My Focus amber. */
  --attention-ink: var(--myfocus-ink);
  --attention-paper: var(--myfocus-paper);
  /* The "work" entity pill (a book or film named in a note). */
  --entity-work: light-dark(#1f6e43, #84c9a2);
  --entity-work-strong: light-dark(#154c2e, #a8dcbe);
  --entity-work-tint: light-dark(rgb(42, 122, 78), #84c9a2);
  /* Text and marks on ink or accent fills: ink fills invert to pale ink with slate text in dark (owner Q2). */
  --on-ink: light-dark(#ffffff, #131a20);
  --on-accent: light-dark(#ffffff, #131a20);
  /* Text on a --status-2 fill (a Shelves spine, shelves spec §9): the same deep blue in both themes. */
  --on-status-2: #0f1a3d;
  /* A shelf's 2 px edge under its faces (shelves spec §9): ink in light, the dark theme's --ink-3 in dark. */
  --shelf-edge: light-dark(var(--ink), #6b7984);
  /* A quiet button floating over the PDF page (the reading room's "Notes · n" on phones): see-through in light, where
     the white page behind it carries its dark label, and the float surface in dark, where its label is pale (2E). */
  --surface-over-page: light-dark(transparent, #232e37);
  /* Behind a picture that does not fill its frame, and empty picture slots. */
  --surface-mat: light-dark(#e4e4de, #0d1317);

  /* Content colours: the same in both themes. Photos, video, generated covers and PDF pages are never tinted. */
  --on-media: #ffffff;
  --media-badge: rgba(0, 0, 0, 0.68);
  /* Explainer captions: light grey with dark words in both themes (owner, October 14, 2026). */
  --caption-bg: rgba(236, 236, 233, 0.94);
  --caption-ink: #1f1f1d;
  --media-control: rgba(255, 255, 255, 0.92);
  /* The photo viewer (Phase 2): its zoom bar sits on the photo and stays light in both themes (the prototype's .qv-hud),
     and full screen (PH-D1) is a dark mat in both themes, with pale words that cast a shadow over the photo. */
  --media-control-ink: #22303a;
  --media-control-ink-2: #4a5866;
  --media-control-hover: rgba(34, 48, 58, 0.08);
  --media-control-rule: rgba(34, 48, 58, 0.15);
  --media-control-focus: #1e3e9e;
  --shadow-media-control: 0 2px 10px rgba(0, 0, 0, 0.12);
  --fs-mat: #15191c;
  --fs-ink: #e6e8e4;
  --fs-text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  --cover-paper: #202e38;
  --cover-ink: #edeff6;
  --cover-line: rgba(255, 255, 255, 0.07);
  --cover-spine-light: rgba(255, 255, 255, 0.11);
  --cover-spine-shade: rgba(0, 0, 0, 0.38);
  --page-paper: #ffffff;
  --page-ink: #1d262d;
  --page-ink-2: #6b757c;
  --page-select: #f6dc8f;
  --page-mark: #fbeec2;
  /* PDF Night (owner Q4): inverts the page and its thumbnails; figures keep their hues. */
  --page-night: invert(0.9) hue-rotate(180deg);
  /* Phones and iPads (mobile spec P0, tablet spec §4.2). Layout sizes only; colours and type stay the role tokens. */
  --m-bar: calc(52px + env(safe-area-inset-top, 0px));
  --m-tabs: calc(56px + env(safe-area-inset-bottom, 0px));
  --m-gutter: 16px;
  --m-hit: 44px;
  --m-peek: 132px;
  --m-sheet-radius: 14px;
  /* The on-screen keyboard's height, written by the keyboard helper (slice 3); 0 when there is none. */
  --m-kb: 0px;
  --t-rail: 58px;
  --t-panel: clamp(360px, 32vw, 420px);
  --t-sheet-w: 584px;
}

@media (pointer: coarse) { :root { --t-rail: 72px; } }

/* The phone shell (spec phone-loci-bar §4.2, §4.4): a 48 px top bar, and the foot the Loci bar takes (54 px bar, 8 px above
   and below it, and the safe area), so every page that clears --m-tabs clears it. Keyed on the server's marker as well as
   html's, so it holds from the first paint. */
@media (max-width: 699.98px) {
  :is(html[data-phone-shell], .app-shell[data-phone-shell]) {
    --m-bar: calc(48px + env(safe-area-inset-top, 0px));
    --m-tabs: calc(70px + env(safe-area-inset-bottom, 0px));
  }
}

:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-instant: 1ms;
    --dur-quick: 1ms;
    --dur-standard: 1ms;
    --dur-move: 1ms;
    --dur-leave: 1ms;
    --dur-calm: 1ms;
    --dur-morph: 1ms;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  /* viewport-fit=cover (P11): a phone on its side keeps the notch and the rounded corners clear on both sides. */
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
  background: var(--surface-page);
  color: var(--text);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.45;
  letter-spacing: 0;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font: inherit;
}

a {
  color: inherit;
}

:focus-visible {
  outline: var(--focus-ring);
  outline-offset: 2px;
}

html {
  background: var(--surface-page);
}

/* Appearance switch (Phase 2E, spec E3): a ~200 ms cross-fade of the whole page; none with reduced motion.
   Scoped to the class applyDisplay sets on <html> for the transition's duration. */
html.theme-switching::view-transition-old(root),
html.theme-switching::view-transition-new(root) {
  animation-duration: 200ms;
  animation-timing-function: var(--ease-standard);
}

@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*) {
    animation: none !important;
  }
}

::selection {
  background: var(--status-1);
  color: var(--ink);
}

.visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
/* ---- shell.css ---- */
/* U4: the rail's width, for the grid and for anything placed beside the rail: --t-rail closed (58px, 72px on touch
   screens), 196px when its button opens it, which it offers only with a fine pointer from 700px. */
:root {
  --rail-w: var(--t-rail);
}

@media (min-width: 700px) and (pointer: fine) {
  :root:has(.app-shell[data-rail="open"]) {
    --rail-w: 196px;
  }
}

.app-shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
  background: var(--paper);
  /* Opening moves the page aside rather than covering it (a recorded motion exception, as the rail's width was in J64/J65). */
  transition: grid-template-columns var(--dur-standard) var(--ease-standard);
}

.skip-link {
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 200;
  padding: 8px 12px;
  transform: translateY(-160%);
  background: var(--ink);
  color: var(--on-ink);
  text-decoration: none;
}

.skip-link:focus {
  transform: translateY(0);
}

.navigation-rail {
  position: relative;
  z-index: 20;
  width: var(--rail-w);
  height: 100dvh;
}

/* The icon rail (U4, owner October 17, 2026; replaces D23's hover flyout): 58px of icons, each a link with its tooltip,
   until the rail's own button opens it to 196px with names. Hover and focus no longer open it. */
.rail-in {
  position: absolute;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: var(--rail-w);
  padding: 14px 9px;
  overflow: hidden;
  border-right: 1px solid var(--line);
  background: var(--paper);
  transition: width var(--dur-standard) var(--ease-standard);
}

.rail-label {
  opacity: 0;
  transition: opacity var(--dur-quick) ease;
}

.app-shell[data-rail="open"] .rail-label {
  opacity: 1;
}

/* iPads and other touch screens from 700 px (tablet spec T-2): a 72 px rail with each name under its icon, the way the
   phone drawer names its destinations; nothing opens on hover. */
@media (min-width: 700px) and (pointer: coarse) {
  .app-shell { grid-template-columns: var(--t-rail) minmax(0, 1fr); }
  .navigation-rail, .rail-in { width: var(--t-rail); }
  .rail-in { padding: 12px 6px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .rail-in .brand-row { justify-content: center; padding: 0; }
  .rail-in .brand-row .brand { display: none; }
  .rail-in .navigation-link, .rail-in .capture-shortcut { flex-direction: column; justify-content: center; gap: 4px; width: 100%; height: 56px; padding: 0; }
  .rail-in .navigation-link .rail-label, .rail-in .capture-shortcut .rail-label {
    opacity: 1; font-size: 11.5px; font-weight: 550; line-height: 1.1; white-space: normal; text-align: center;
  }
  /* The theme toggle is named under its icon like the destinations (its label is also its accessible name). */
  .rail-in .account-trigger { height: 48px; justify-content: center; }
  .rail-in .account-name { display: none; }
  /* The rail is always named here, so it has no open button (U4 docks only with a mouse or trackpad). */
  .rail-in .rail-toggle { display: none; }
}
/* A short touch screen (a phone on its side): the rail drops its names and scrolls rather than clipping the account. */
@media (min-width: 700px) and (pointer: coarse) and (max-height: 599.98px) {
  .rail-in { overflow-y: auto; gap: 0; padding-top: 8px; }
  .rail-in .brand-row { height: 30px; margin-bottom: 4px; }
  .rail-in .navigation-link, .rail-in .capture-shortcut, .rail-in .theme-toggle, .rail-in .account-trigger { height: 44px; }
  .rail-in .navigation-link .rail-label, .rail-in .capture-shortcut .rail-label { display: none; }
}

/* U2: the mark and name are one link to Today. */
.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  margin: 0 0 14px;
  padding: 0 5px;
  border-radius: 4px;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}

.brand-row:focus-visible {
  outline: var(--focus-ring);
  outline-offset: -2px;
}

.brand-mark {
  display: grid;
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  place-items: center;
  border-radius: 7px;
  background: var(--ink);
  color: var(--on-ink);
  font-family: var(--read);
  font-size: 18px;
}

.brand {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0;
}

.capture-shortcut,
.navigation-link {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 36px;
  padding: 0 11px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  font: inherit;
  font-size: 13.5px;
  text-decoration: none;
  white-space: nowrap;
}

.capture-shortcut svg,
.navigation-link svg {
  flex: 0 0 auto;
}

.capture-shortcut {
  margin-bottom: 8px;
  color: var(--accent);
}

.capture-shortcut:hover,
.navigation-link:hover {
  background: var(--hover-fill);
  color: var(--ink);
}

.capture-shortcut:hover {
  color: var(--accent);
}

.capture-shortcut:focus-visible,
.navigation-link:focus-visible,
.account-trigger:focus-visible {
  outline: var(--focus-ring);
  outline-offset: -2px;
}

.primary-links,
.theme-links {
  display: grid;
  gap: 2px;
}

/* The rail's foot: the theme toggle, then the profile, whose menu holds Settings. */
.theme-links {
  margin-top: auto;
}

/* The rail's open/close button (U4): a rail row like the theme toggle below it. */
.rail-toggle {
  width: 100%;
  text-align: left;
}

/* A button in the rail's link column: the .navigation-link look, full width and left-aligned. Both theme variants render; CSS shows the one that switches away from the theme in effect (the server cannot know the OS theme). */
.theme-toggle {
  width: 100%;
  text-align: left;
}

.theme-toggle-to-light {
  display: none;
}

.theme-toggle-to-dark {
  display: flex;
}

.theme-toggle-to-dark,
.theme-toggle-to-light {
  align-items: center;
  gap: 12px;
}

:root[data-theme="dark"] .theme-toggle-to-dark {
  display: none;
}

:root[data-theme="dark"] .theme-toggle-to-light {
  display: flex;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .theme-toggle-to-dark {
    display: none;
  }

  :root:not([data-theme]) .theme-toggle-to-light {
    display: flex;
  }
}

.navigation-link[aria-current="page"] {
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink);
}

.account-menu {
  min-width: 0;
  margin-top: 8px;
}

.account-trigger {
  display: flex;
  align-items: center;
  width: 100%;
  min-width: 0;
  gap: 10px;
  padding: 5px 7px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  white-space: nowrap;
}

.account-trigger:hover,
.account-trigger[data-state="open"] {
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);
}

.account-avatar {
  display: grid;
  width: 26px;
  height: 26px;
  flex: 0 0 26px;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--board);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
}

.account-name {
  overflow: hidden;
  font-size: 13px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.account-menu-content {
  z-index: 40;
  min-width: 144px;
  width: 248px;
  max-width: calc(100vw - 18px);
  padding: 4px;
  border-radius: 4px;
  background: var(--surface-float);
  box-shadow: var(--shadow-float), inset 0 0 0 1px var(--rule);
}

.account-menu-item {
  display: flex;
  align-items: center;
  width: 100%;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 3px;
  color: var(--ink);
  font-size: 13px;
  text-decoration: none;
  cursor: pointer;
}

.account-menu-item[data-highlighted] {
  outline: none;
  background: var(--hover-fill);
}

.account-menu-item svg {
  flex: 0 0 auto;
  color: var(--ink-2);
}

.account-menu-error {
  margin: 4px 10px 6px;
  color: var(--warn);
  font-size: 12px;
  line-height: 1.35;
}

/* Appearance (Phase 2E; mockup dark-theme.html screen 6 `.appear`, `.tseg`). */
.appearance {
  margin: 4px 0;
  padding: 8px 10px 10px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.appearance-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 0 0 7px;
  color: var(--text-muted);
  font-size: 12px;
}

.appearance-head b {
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
}

.appearance-seg {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  padding: 3px;
  border-radius: 4px;
  background: var(--surface-page);
  box-shadow: inset 0 0 0 1px var(--rule);
}

.appearance-option {
  position: relative;
  z-index: 1;
  padding: 5px 4px;
  border-radius: 3px;
  color: var(--text-muted);
  font-size: 12.5px;
  text-align: center;
  cursor: pointer;
  outline: none;
}

.appearance-option[data-state="checked"] {
  color: var(--text);
  font-weight: 500;
}

.appearance-option[data-highlighted] {
  outline: var(--focus-ring);
  outline-offset: -1px;
}

.appearance-thumb {
  position: absolute;
  z-index: 0;
  top: 3px;
  bottom: 3px;
  left: 3px;
  width: calc((100% - 6px) / 3);
  border-radius: 3px;
  background: var(--surface-float);
  box-shadow: var(--shadow-pic), inset 0 0 0 1px var(--rule);
  transition: transform var(--dur-standard) var(--ease-standard);
}

.appearance-note {
  display: block;
  margin-top: 6px;
  color: var(--text-muted);
  font-size: 11.5px;
}

.main-stage {
  min-width: 0;
  height: 100dvh;
  padding: 36px 44px 52px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

.destination-header {
  margin: -4px 0 30px;
  border-bottom: 1px solid var(--line);
}

.destination-crumb {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  min-height: 16px;
  margin: 0 0 12px;
  color: var(--ink-2);
  font-size: 12.5px;
}

.destination-crumb strong {
  color: var(--ink);
  font-weight: 500;
}

.destination-tabs {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  overflow-x: auto;
  margin-bottom: -1px;
}

.destination-tab {
  flex: 0 0 auto;
  padding: 7px 12px 9px;
  border-bottom: 2px solid transparent;
  color: var(--ink-2);
  font-size: 13.5px;
  text-decoration: none;
  white-space: nowrap;
}

.destination-tab:hover {
  color: var(--ink);
}

.destination-tab[aria-current="page"] {
  border-bottom-color: var(--accent);
  color: var(--ink);
  font-weight: 500;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  gap: 8px;
  padding: 8px 14px;
  border: 0;
  border-radius: 2px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 500;
  cursor: pointer;
}

.button-quiet {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink);
}

/* A destructive action in a dialog (Stop sharing, 3B-2c O2): the quiet button in the danger colour of the menus' danger rows. */
.button-danger {
  box-shadow: inset 0 0 0 1px var(--warn);
  color: var(--warn);
}

.button-link {
  min-height: 0;
  padding: 8px 2px;
  background: transparent;
  color: var(--ink-2);
  font-weight: 400;
}

.button:disabled,
.button[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.56;
}

.field {
  display: grid;
  gap: 6px;
}

.field-label {
  font-size: 13px;
  font-weight: 500;
}

.field-control {
  width: 100%;
  min-height: 40px;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--panel);
  color: var(--ink);
}

.field-hint {
  margin: 0;
  color: var(--ink-2);
  font-size: 12px;
}

.notice {
  padding: 13px 15px;
  border-left: 2px solid var(--accent);
  background: var(--panel);
  color: var(--ink-2);
}

.notice strong {
  display: block;
  margin-bottom: 3px;
  color: var(--ink);
  font-weight: 600;
}

.workspace-status {
  margin: 0;
  padding: 36px 44px;
  color: var(--ink-2);
}

.workspace-panel,
.preferences-form {
  width: min(100%, 680px);
}

.workspace-panel {
  padding: 24px;
  border: 1px solid var(--line);
  background: var(--panel);
}

.workspace-kicker {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  text-transform: capitalize;
}

.workspace-panel h1,
.preferences-form h1 {
  margin: 0 0 8px;
  font-family: var(--read);
  font-size: 27px;
  font-weight: 500;
  line-height: 1.2;
}

.workspace-panel p,
.preferences-form-heading p {
  margin: 0;
  color: var(--ink-2);
}

.workspace-reference {
  margin-top: 12px !important;
  font-family: ui-monospace, monospace;
  font-size: 12px;
}

.preferences-form {
  display: grid;
  gap: 18px;
}

.preferences-form-heading {
  margin-bottom: 8px;
}

.preferences-conflict {
  display: grid;
  gap: 14px;
  padding: 18px;
  border: 1px solid var(--line);
  border-left: 2px solid var(--accent);
  background: var(--panel);
}

.preferences-conflict h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}

.preferences-conflict dl {
  display: grid;
  gap: 8px;
  margin: 0;
}

.preferences-conflict dl div {
  display: grid;
  grid-template-columns: 130px minmax(0, 1fr);
  gap: 12px;
}

.preferences-conflict dt,
.preferences-conflict dd {
  margin: 0;
  overflow-wrap: anywhere;
}

.preferences-conflict dt {
  color: var(--ink-2);
  font-size: 13px;
}

.preferences-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.specimen-intro {
  max-width: 64ch;
  margin-bottom: 28px;
}

.specimen-intro h1 {
  margin: 0 0 8px;
  font-family: var(--read);
  font-size: 30px;
  font-weight: 500;
  line-height: 1.2;
}

.specimen-intro p {
  margin: 0;
  color: var(--ink-2);
}

.specimen-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  margin-bottom: 28px;
}

.specimen-card {
  display: flex;
  min-height: 176px;
  flex-direction: column;
  gap: 8px;
  padding: 18px 18px 14px;
  background: var(--panel);
  box-shadow: inset 0 0 0 1px var(--line);
}

.specimen-card small {
  color: var(--ink-2);
  font-size: 11.5px;
}

.specimen-card h2 {
  margin: 0;
  font-family: var(--read);
  font-size: 19px;
  font-weight: 400;
  line-height: 1.25;
}

.specimen-card p {
  margin: 0;
  color: var(--ink-2);
  font-size: 13px;
}

.specimen-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.specimen-notice {
  margin-top: 24px;
}

@media (max-width: 980px) {
  .main-stage {
    padding: 28px 24px 40px;
  }

  .workspace-status { padding: 28px 24px; }

  .specimen-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* Phones, Split View and Slide Over (compact, under 700 px; mobile spec P1, P7, P10, P11, A1, A3). From 700 px every
   width keeps the rail (tablet spec T-1, T-D1). */
@media (max-width: 699.98px) {
  .app-shell { display: block; height: auto; min-height: 100dvh; overflow: visible; }

  /* The account in the phone drawer's foot. */
  .account-menu { position: static; margin: 0; }
  .account-trigger { width: var(--m-hit); height: var(--m-hit); padding: 0; justify-content: center; }
  .account-name { display: none; }

  .main-stage { height: auto; min-height: calc(100dvh - var(--m-bar)); overflow: visible; padding: 16px var(--m-gutter) calc(var(--m-tabs) + 28px); }
  .workspace-status { padding: 20px var(--m-gutter); }
  .specimen-grid { grid-template-columns: 1fr; }
  .preferences-conflict dl div { grid-template-columns: 1fr; gap: 2px; }


  /* A1: no grey tap flash; our own press state on touch-down. */
  html { -webkit-tap-highlight-color: transparent; }
  .button:active:not(:disabled), .destination-tab:active, .account-trigger:active {
    transform: scale(0.97); transition: transform 100ms ease-out;
  }
}
/* P9: every field at least 16 px on phones and touch screens, so iOS and iPadOS do not zoom on focus. An accessibility
   floor, so it outranks each form's own size (the copilot composer, Edit collection's rows). */
@media (max-width: 699.98px), (pointer: coarse) {
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), textarea, select { font-size: max(16px, 1em) !important; }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

.destination-crumb i { font-style: normal; font-size: 11px; color: var(--text-muted); }
.destination-crumb span { color: var(--ink-2); }

/* Analytics consent (PostHog spec §4), drawn as the sign-in redesign's cookie card (sign-in spec §4b, mock-up
   auth-states.html `.consent`, `.consent.wide`, `.consent.col`). The stage card floats over the workspace's main stage;
   the column card sits at the base of an auth page's form column (src/styles/auth.css gives that column room). */
.consent-notice { z-index: 40; display: flex; gap: 12px; align-items: flex-start; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; background: var(--surface-float); box-shadow: var(--shadow-float); color: var(--text); font-size: 13px; line-height: 1.45; }
.consent-notice-icon { display: grid; flex-shrink: 0; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
.consent-notice-text { flex: 1; min-width: 0; }
.consent-notice-text strong { display: block; margin-bottom: 1px; font-size: 13.5px; font-weight: 600; }
.consent-notice-text p { margin: 0; color: var(--text-muted); }
.consent-notice-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.consent-notice .consent-notice-actions .button:not(.button-link) { min-height: 32px; padding: 4px 14px; border-radius: 2px; font-size: 13px; }
.consent-notice .consent-notice-actions .button:not(.button-quiet):hover { background: var(--accent-strong); }
.consent-notice .consent-notice-actions .button-quiet:hover { box-shadow: inset 0 0 0 1px var(--text-decor); background: var(--hover-fill); }
.consent-notice .button:focus-visible, .consent-notice-link:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.consent-notice-link { margin-left: 4px; color: var(--text-muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
/* Over the workspace: bottom centre of the main stage (right of the rail, 58 or 196 px), one row. */
.consent-notice-stage { position: fixed; bottom: 48px; left: calc(var(--rail-w) + (100vw - var(--rail-w)) / 2); translate: -50% 0; width: min(640px, calc(100vw - var(--rail-w) - 32px)); align-items: center; }
.consent-notice-stage .consent-notice-text { padding-right: 6px; }
/* On the Graph with the Map/copilot panel open (src/components/graph/copilot-panel.tsx `.cpwrap`, 420 px plus the
   12 px lane graph.css keeps clear for it), the card centres in the map area, clear of the panel. */
@media (min-width: 980.02px) {
  body:has(.cpwrap:not(.is-folded):not(.is-reading)) .consent-notice-stage { left: calc(var(--rail-w) + (100vw - var(--rail-w) - var(--t-panel) - 12px) / 2); width: min(640px, calc(100vw - var(--rail-w) - var(--t-panel) - 12px - 32px)); }
}
/* On an auth page: the base of the form column, wrapping, the actions on their own row under the text. */
.consent-notice-column { position: absolute; bottom: 24px; left: clamp(40px, 7vw, 110px); flex-wrap: wrap; width: min(420px, calc(100% - 2 * clamp(40px, 7vw, 110px))); }
.consent-notice-column .consent-notice-actions { width: 100%; padding-left: 42px; }
/* Phone: full width at the bottom with 10 px margins; the two buttons share the row equally. Each card switches at its
   own page's breakpoint: the workspace and the auth layout both switch at max-width 699.98px (above; auth.css). On the
   workspace the card sits above the Loci bar. */
@media (max-width: 699.98px) {
  .consent-notice-stage { position: fixed; right: 10px; bottom: calc(var(--m-tabs) + 10px); left: 10px; flex-wrap: wrap; width: auto; translate: none; }
  .consent-notice-stage .consent-notice-actions { width: 100%; padding-left: 0; }
  .consent-notice-stage .consent-notice-actions .button { flex: 1; }
}
@media (max-width: 699.98px) {
  .consent-notice-column { position: fixed; right: 10px; bottom: 10px; left: 10px; flex-wrap: wrap; width: auto; translate: none; }
  .consent-notice-column .consent-notice-actions { width: 100%; padding-left: 0; }
  .consent-notice-column .consent-notice-actions .button { flex: 1; }
}
@media (prefers-reduced-motion: no-preference) {
  .consent-notice { animation: consent-in 380ms var(--ease-spring) both; }
  .consent-notice .button { transition: background var(--dur-quick), box-shadow var(--dur-quick); }
}
@keyframes consent-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.privacy-toggle { display: flex; gap: 8px; align-items: center; }
.privacy-note { margin: 0; font-size: 13px; color: var(--ink-2); }
.privacy-setting h2 { margin: 0 0 8px; font-family: var(--read); font-size: 20px; font-weight: 500; line-height: 1.2; }
.privacy-note a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

/* A destination's tabs with something at the row's right end (the Commonplace header's Select). */
.destination-tabrow { display: flex; align-items: flex-end; gap: 12px; }
.destination-tabrow .destination-tabs { flex: 1; min-width: 0; }
.destination-tail { flex: none; display: flex; align-items: flex-end; }
/* ---- toasts.css ---- */
/* Toaster (Phase 2D): ported from the agreed mockup library-wall-and-capture.html, on tokens. */
.vtoasts { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 110; display: grid; gap: 8px; justify-items: end; max-width: calc(100vw - 32px); pointer-events: none; }
.vtoasts.start { right: auto; left: calc(16px + env(safe-area-inset-left, 0px)); justify-items: start; }
/* In a page's own toast host (ToastHost): laid out where the host is, not fixed to the window. */
.vtoasts.in-host { position: static; max-width: 100%; }
.vtoast { pointer-events: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; width: 330px; max-width: 100%; background: var(--quote-paper); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--quote-rule); border-radius: 4px; padding: 14px 12px 13px 16px; animation: toast-in var(--dur-standard) var(--ease-entrance); }
.vtoast b { font-family: var(--read); font-weight: 400; font-size: 19px; line-height: 1.2; color: var(--text); }
.vtoast p { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--text-muted); }
.vtoast button { all: unset; cursor: pointer; color: var(--text-muted); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 3px; }
.vtoast button:hover { color: var(--text); }
.vtoast button:focus-visible { outline: var(--focus-ring); }
.vtoast-actions { grid-column: 1 / -1; display: flex; gap: 14px; margin-top: 4px; }
.vtoast .vtoast-action { font-size: 12.5px; line-height: 1.3; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; padding: 2px 0; }
.vtoast .vtoast-action:hover { color: var(--accent); }
.vtoast.pill { width: auto; grid-template-columns: auto; padding: 8px 14px; background: var(--ink); box-shadow: var(--shadow-float); }
.vtoast.pill span { color: var(--on-ink); font-size: 12.5px; }
.vtoast.out { animation: toast-out var(--dur-standard) var(--ease-exit) forwards; }
@keyframes toast-in { from { opacity: 0; transform: translateY(var(--enter-travel)); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(calc(var(--enter-travel) * 0.75)); } }
@media (prefers-reduced-motion: reduce) { .vtoast, .vtoast.out { animation: none; } .vtoast.out { opacity: 0; } }

/* Background card (Phase 3B-3 design 9.3, L3): the toast family's anatomy on --surface-float, in the toast column below
   the toasts. Fixed at the bottom right with the toasts lifted above it by its measured height (--jobs-dock-h), or in a
   page's toast host (the Graph's map corner) after the toast list. */
.vtoasts:not(.start):not(.in-host) { bottom: calc(16px + env(safe-area-inset-bottom, 0px) + var(--jobs-dock-h, 0px)); }
.jobs-dock { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 110; display: grid; justify-items: end; max-width: calc(100vw - 32px); pointer-events: none; }
.jobs-dock > * { pointer-events: auto; }
.jobs-dock.in-host { position: static; justify-items: start; max-width: 100%; order: 1; }
.map-toasts:has(> .jobs-dock) { display: flex; flex-direction: column; align-items: flex-start; }
.map-toasts:has(.vtoast) > .jobs-dock, .map-corner .map-waiting + .map-toasts > .jobs-dock { margin-top: 8px; }
.jobs-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; width: 330px; max-width: 100%; box-sizing: border-box; background: var(--surface-float); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--rule); border-radius: 4px; padding: 14px 12px 13px 16px; animation: toast-in var(--dur-standard) var(--ease-entrance); }
.jobs-card .jobs-title { font-family: var(--read); font-weight: 400; font-size: 19px; line-height: 1.2; color: var(--text); overflow-wrap: anywhere; }
.jobs-card .jobs-title em { font-style: italic; }
.jobs-card .jobs-line { margin: 0; font-size: 12.5px; color: var(--text-muted); }
.jobs-card > .jobs-line, .jobs-card > .jobs-actions, .jobs-card > .jobs-stop, .jobs-card > .jobs-rows { grid-column: 1 / -1; }
.jobs-tools { display: inline-flex; align-items: center; gap: 2px; }
.jobs-card button.jobs-fold, .jobs-card button.jobs-x, .jobs-card button.jobs-more { all: unset; cursor: pointer; display: inline-grid; place-items: center; min-width: 20px; min-height: 20px; color: var(--text-muted); font-size: 16px; line-height: 1; padding: 2px 4px; border-radius: 3px; }
.jobs-card button.jobs-fold:hover, .jobs-card button.jobs-x:hover, .jobs-card button.jobs-more:hover { color: var(--text); }
.jobs-card button.jobs-fold:focus-visible, .jobs-card button.jobs-x:focus-visible, .jobs-card button.jobs-more:focus-visible { outline: var(--focus-ring); }
.jobs-actions { display: flex; gap: 14px; margin-top: 4px; }
.jobs-card .jobs-action { all: unset; cursor: pointer; font-size: 12.5px; line-height: 1.3; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; padding: 2px 0; }
.jobs-card .jobs-action:focus-visible { outline: var(--focus-ring); border-radius: 2px; }
.jobs-rows { list-style: none; margin: 4px 0 0; padding: 0; display: grid; }
.jobs-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
.jobs-row-text { display: grid; gap: 1px; min-width: 0; }
.jobs-row-title { font-family: var(--read); font-size: 15px; line-height: 1.25; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobs-row-acts { display: inline-flex; align-items: center; gap: 8px; }
.jobs-row > .jobs-stop { grid-column: 1 / -1; }
.jobs-stop { display: grid; gap: 8px; margin-top: 6px; }
.jobs-stop-ask { color: var(--ink); font-size: 13px; }
.jobs-stop-acts { display: flex; flex-wrap: wrap; gap: 10px; }
.jobs-stop-acts .button { min-height: 0; padding: 6px 11px; font-size: 12.5px; border-radius: 3px; }
.jobs-stop .jobs-stop-error { margin: 0; color: var(--warn); font-size: 13px; }
.jobs-pill { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; box-sizing: border-box; background: var(--surface-float); color: var(--ink); border-radius: 18px; padding: 7px 12px 7px 14px; font-size: 12.5px; box-shadow: var(--shadow-float), inset 0 0 0 1px var(--rule); animation: toast-in var(--dur-standard) var(--ease-entrance); }
.jobs-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jobs-pill svg { flex-shrink: 0; color: var(--text-muted); }
.jobs-pill:focus-visible { outline: var(--focus-ring); }
@media (prefers-reduced-motion: reduce) { .jobs-card, .jobs-pill { animation: none; } }
/* ---- menus.css ---- */
/* Action menu (Phase 2D D5): ported from library-wall-and-capture.html `.cmenu`, `.mi`, `.msep`, on tokens. Shared by the card menu, item pages and the Graph. */
.cmenu { --menu-danger: var(--warn); z-index: 80; min-width: 200px; width: 232px; max-width: calc(100vw - 16px); max-height: var(--radix-dropdown-menu-content-available-height, var(--radix-context-menu-content-available-height, calc(100dvh - 16px))); overflow-y: auto; box-sizing: border-box; background: var(--surface-float); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--rule); border-radius: 4px; padding: 5px; transform-origin: var(--radix-context-menu-content-transform-origin, var(--radix-dropdown-menu-content-transform-origin, top left)); animation: menu-in var(--dur-quick) var(--ease-entrance); }
.cmenu .mi { display: flex; align-items: center; gap: 9px; width: 100%; box-sizing: border-box; padding: 5px 8px; border: 0; background: none; border-radius: 3px; font: inherit; font-size: 12.5px; color: var(--text); cursor: pointer; text-align: left; outline: none; user-select: none; }
.cmenu .mi[data-highlighted] { background: var(--hover-fill); }
.cmenu .mi:focus-visible, .cmenu .mi[data-highlighted]:focus-visible { box-shadow: inset 0 0 0 1px var(--text-decor); }
.cmenu .mi[data-disabled] { color: var(--text-muted); opacity: 0.6; cursor: default; }
.cmenu .mi .ic { width: 22px; height: 22px; border-radius: 2px; border: 1px solid var(--rule); background: var(--surface-page); display: grid; place-items: center; flex-shrink: 0; color: var(--text-muted); }
.cmenu .mi .ic svg { width: 13px; height: 13px; }
.cmenu .mi .lbl { flex: 1; min-width: 0; }
.cmenu .mi kbd { margin-left: auto; box-shadow: none; background: transparent; color: var(--text-muted); padding: 0; font: inherit; font-size: 11px; }
.cmenu .mi-sub::after { content: "›"; margin-left: auto; color: var(--text-muted); }
.cmenu .mi.danger, .cmenu .mi.danger .ic { color: var(--menu-danger); }
.cmenu .msep { height: 1px; background: var(--rule); margin: 4px 3px; }
/* A row with a line saying what it does (the copilot's Start fresh and Delete conversation, Task 22; board 3). */
.cmenu .mi.has-desc { align-items: flex-start; padding-top: 7px; padding-bottom: 7px; }
.cmenu .mi .mdesc { display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.4; color: var(--text-muted); white-space: normal; }
/* A menu's heading line (graph-copilot mock-up .mhead l.373): the ghost menu's "Suggested: <name>" (Phase 3A). */
.cmenu .mhead { font-size: 10px; font-weight: 600; color: var(--ink-2); padding: 5px 8px 4px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes menu-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .cmenu { animation: none; } }

/* Menus on phones and touch screens (mobile spec P6, P7): every row is a 44 px target; the menu stays anchored to its button. */
@media (max-width: 699.98px), (pointer: coarse) {
  .cmenu .mi, .account-menu-item { min-height: var(--m-hit); box-sizing: border-box; }
}

/* P8, T-3: keyboard hints ("Press C", "Ctrl+Enter saves", "esc to dismiss", "← → to browse", a menu row's key, the reopen
   pill's "/") are for keyboards: a screen that cannot hover hides them. The keys still work with a keyboard attached. */
@media (hover: none) { .kbd-hint { display: none !important; } }
/* ---- library.css ---- */
/* Library destination. Ported from project-docs/design/prototype/studiolo-design-concept.html
   (lines 180–181, 249–262, 739–805, 981–984, 1134–1385, 1572–1620, 1676–1677).
   Prototype --s1/--s2/--s3 map to --status-1/--status-2/--accent. Card status dots use the production
   STATUS_CLASS (s0 not started, s1 learning, s2 learned). Reminder rules are not ported (spec D15). */

.library-page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; min-width: 0; }
.library-wall { min-width: 0; }

/* Search line (739–742) */
.lsearch { display: flex; align-items: center; gap: 14px; margin: 0 0 20px; max-width: none; }
.lsearch input { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-family: var(--read); font-size: 26px; color: var(--ink); padding: 4px 0 10px; border-radius: 0; line-height: normal; }
.lsearch input::placeholder { color: var(--ink-2); }
.lsearch input:focus-visible { outline: none; border-bottom-color: var(--accent); }
.lsearch input::-webkit-search-cancel-button { cursor: pointer; }
.lsearch .n { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
/* At phone width the count drops below the line instead of squeezing it (the prototype does not specify this). */
@media (max-width: 560px) { .lsearch { flex-wrap: wrap; gap: 6px; } .lsearch input { flex-basis: 100%; font-size: 22px; } }

/* Shape chips (981–984) */
.colls { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 22px; }
.colls button { all: unset; font: inherit; font-size: 13px; padding: 6px 11px; border-radius: 2px; cursor: pointer; color: var(--ink-2); }
.colls button span { color: var(--ink-2); margin-left: 5px; font-size: 12px; }
.colls button.on { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
/* W-D8, CO-6: the types follow the collections after a quiet rule and its label, as the kicker type. */
.colls-divider { align-self: center; flex: none; margin: 0 2px 0 6px; padding-left: 10px; border-left: 1px solid var(--line); font-size: 10.5px; line-height: 20px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
/* CO-6: under an area, a collection with none of its items sits at the end, its preview at 60 %; its label keeps full contrast. */
.coll.is-out-of-area .prev { opacity: 0.6; }
.coll.is-out-of-area .lb b { color: var(--ink-2); }
.colls button:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
/* Step 4 (U15): the wall's row never wraps; the chips that do not fit sit under More ▾ (wall-chip-row.tsx). */
.library-wall .colls { flex-wrap: nowrap; white-space: nowrap; }

/* Active topic and collection filters */
.wall-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: -12px 0 18px; }
.wall-filter { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 4px 4px 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); background: var(--panel); }
.wall-filter button { all: unset; cursor: pointer; padding: 0 6px; color: var(--ink-2); font-size: 14px; line-height: 1; }
.wall-filter button:hover { color: var(--accent); }
.wall-filter button:focus-visible { outline: var(--focus-ring); outline-offset: 1px; }

/* Masonry wall (745) */
.mason { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); grid-auto-rows: 8px; column-gap: 20px; row-gap: 12px; align-items: start; position: relative; }

/* Cards (746–805) */
.mcard { background: var(--surface-panel); box-shadow: inset 0 0 0 1px var(--rule); cursor: pointer; position: relative; margin: 0; display: block; width: 100%; min-width: 0; box-sizing: border-box; border-radius: 2px; transition: box-shadow var(--dur-quick) var(--ease-standard), transform var(--dur-quick) var(--ease-standard); grid-row-end: span var(--masonry-span, 1); }
.mcard[hidden] { display: none; }
.mcard:hover, .mcard:focus-within { box-shadow: inset 0 0 0 1px var(--text-decor); }
.mcard .body { padding: 14px 15px 12px; }
/* Card titles are h2, h3 or h4 by context (ItemCard headingLevel); one class styles them all, over page heading rules such as `.doc h2`. */
.mcard .mcard-title { font-family: inherit; font-size: 14px; font-weight: 500; line-height: 1.35; letter-spacing: normal; text-transform: none; color: inherit; margin: 0 0 4px; overflow-wrap: anywhere; }
.mcard p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; overflow-wrap: anywhere; }
.mcard-link { color: inherit; text-decoration: none; }
/* The title link covers the card; the topic tag sits above it so activating the tag never opens the item. */
.mcard-link::after { content: ""; position: absolute; inset: 0; z-index: 0; }
.mcard-link:focus-visible { outline: none; }
.mcard:has(.mcard-link:focus-visible) { outline: var(--focus-ring); outline-offset: 2px; }
.mcard .ft { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px 10px; font-size: 11.5px; color: var(--ink-2); line-height: 1; border-top: 1px solid color-mix(in srgb, var(--rule) 50%, transparent); margin-top: auto; }
.mcard .ft-meta { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; }
.mcard .ft-meta .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; border: 1px solid var(--ink-3); background: var(--paper); }
.mcard .ft-meta .dot.s1 { background: var(--status-1); border-color: var(--status-1); }
.mcard .ft-meta .dot.s2 { background: var(--status-2); border-color: var(--status-2); }
.mcard .ft-shape { color: var(--ink-2); }
.mcard .topic-more { color: var(--ink-2); flex-shrink: 0; }
/* F3: the margin notes about the item, a quiet count after the topic or shape. */
.mcard .ft-notes { color: var(--ink-2); font-size: 11.5px; flex-shrink: 0; white-space: nowrap; }
.mcard .ft-notes::before { content: "·" / ""; margin-right: 6px; }
.mcard .mcard-kind { font-size: 11.5px; color: var(--ink-2); margin: 0 0 6px; }
.mcard .lk { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--ink-2); margin: 0 0 6px; }
.mcard .lk i { width: 13px; height: 13px; flex-shrink: 0; border-radius: 2px; background: var(--status-1); font-style: normal; }
.mcard .lk i.yt { background: var(--ink); position: relative; }
.mcard .lk i.yt::after { content: ""; position: absolute; left: 4.5px; top: 3px; border-left: 5px solid var(--on-ink); border-top: 3.5px solid transparent; border-bottom: 3.5px solid transparent; }
.mcard .why { margin-top: 6px; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; font-style: italic; }
.mcard .found-in-note { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

/* Quote card (770–779) */
.mcard.q { background: var(--quote-paper); box-shadow: inset 0 0 0 1px var(--quote-rule); border-radius: 3px; transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease; overflow: visible; }
.mcard.q:hover { transform: translateY(-2px); box-shadow: 0 8px 24px color-mix(in srgb, var(--shade) 7%, transparent), inset 0 0 0 1px color-mix(in srgb, var(--quote-rule), var(--ink) 8%); }
/* No positioned ancestor between the card and its stretched title link, so the link covers the whole card. */
.mcard.q .body { padding: 22px 18px 14px; }
.mcard.q .quote-glyph { position: absolute; right: 14px; top: 6px; font-family: var(--read); font-size: 52px; line-height: 1; color: var(--accent); opacity: 0.12; pointer-events: none; user-select: none; }
.mcard.q .qt { font-family: var(--read); font-size: 19px; line-height: 1.4; margin: 0 0 12px; color: var(--ink); font-style: italic; letter-spacing: -0.01em; }
.mcard.q .src { font-size: 12px; color: var(--ink-2); border-top: 1px solid color-mix(in srgb, var(--ink) 7%, transparent); padding-top: 9px; line-height: 1.45; margin: 0; }
.mcard.q .src b { color: var(--ink); font-weight: 500; }
.mcard.q .src em { font-style: italic; color: var(--ink-2); margin-left: 2px; }
.mcard.q .src .loc-tag { display: inline-block; padding: 0 5px; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; font-size: 11px; font-family: var(--ui); font-style: normal; margin-left: 6px; color: var(--ink-2); }
.mcard.q .src.is-locator-only .loc-tag { margin-left: 0; }
.mcard.q .ft { border-top-color: color-mix(in srgb, var(--rule) 35%, transparent); }

/* Note and Document cards (782–784) */
.mcard.note { background: var(--note-paper); border-left: 3px solid var(--status-2); }
.mcard.note .body { padding: 14px 15px 12px; }
.mcard.note .nt { font-family: var(--read); font-size: 15px; line-height: 1.52; margin: 0 0 6px; color: var(--ink); }
.mcard.note .nt.doc-excerpt { font-size: 14.5px; margin-top: 6px; }

/* Book cover card (787–795): the dark text cover is the card's picture in the frameless layout (Phase 2D). */
.mcard .cover { aspect-ratio: 2 / 3; background: var(--cover-paper) linear-gradient(var(--cover-line), var(--cover-line)) 8px 0 / 1px 100% no-repeat; color: var(--cover-ink); padding: 18px 16px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 4px 0 0 var(--cover-spine-light), inset 6px 0 2px var(--cover-spine-shade); }
.mcard .cover b { font-family: var(--read); font-size: 19px; font-weight: 400; line-height: 1.22; overflow-wrap: anywhere; }
.mcard .cover span { font-size: 11.5px; opacity: 0.75; }

/* Topic tag (1572–1583); a link raised above the card's stretched title link */
.topic-tag { position: relative; z-index: 1; cursor: pointer; color: var(--ink-2); font-size: 11.5px; letter-spacing: -0.005em; transition: color 0.15s ease; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; }
.topic-tag:hover { color: var(--accent); }
.topic-tag:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }

/* New card (1676–1677) */
@keyframes cardDropIn { from { opacity: 0; transform: translateY(-14px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
/* The drop-in plays on the inner layer (hit areas never move); the others glide by FLIP (wall-motion.ts). */
.card-new-drop > .ci { animation: cardDropIn var(--dur-move) var(--ease-spring) backwards; }
.card-new-drop { outline: 2px solid var(--accent); }
/* A card that stopped matching fades and shrinks before the wall removes it (D11). */
.mcard[data-leaving] { pointer-events: none; }
.mcard[data-leaving][data-frame][data-item-id] > .ci { opacity: 0; transform: scale(0.96); transition: opacity var(--dur-leave) var(--ease-exit), transform var(--dur-leave) var(--ease-exit); }

/* Chips (180–181, 249–262) */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 18px; }
.chip { all: unset; font-size: 12.5px; padding: 4px 10px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.chip:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.chip.q { box-shadow: none; border: 1px dashed var(--ink-3); }

/* Entity pills (1591–1618), used by the links lists */
.entity-pill { all: unset; display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px; border-radius: 3px; font-size: 13px; font-family: var(--ui); background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--accent); cursor: pointer; font-weight: 500; transition: all 0.15s ease; vertical-align: baseline; overflow-wrap: anywhere; }
.entity-pill:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-strong); }
.entity-pill.work { background: color-mix(in srgb, var(--entity-work-tint) 8%, transparent); color: var(--entity-work); }
.entity-pill.work:hover { background: color-mix(in srgb, var(--entity-work-tint) 16%, transparent); color: var(--entity-work-strong); }
.entity-pill:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }

/* Wall states */
.library-notice { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; padding: 8px 12px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--ink); }
.library-notice-error { border-color: var(--accent); }
.library-notice a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.library-notice .library-notice-actions { margin-left: auto; display: flex; gap: 6px; }
.wall-empty { font-family: var(--read); font-size: 17px; color: var(--ink-2); margin: 28px 0 0; }
.wall-more { display: flex; justify-content: center; margin: 24px 0 8px; }
.wall-sentinel { height: 1px; }

/* Capture box (Phase 2D D7, D8, D19, D21; mock-ups library-wall-and-capture.html `.capc`, files-in-2d.html `.capbox`).
   The grid cell `.cap-card` is a square that never changes size, so nothing reflows; it is the placeholder that keeps the
   box's place. The `.cap-box` inside it floats: closed it fills the cell; open it grows to `--cap-w` × `--cap-h` (set from
   `captureSpan`), its height capped at 70% of the window. Width and height are the motion rules' one exception. */
.mcard.cap-card { display: block; width: 100%; aspect-ratio: 1 / 1; margin: 0; padding: 0; position: relative; background: none; box-shadow: none; border-radius: 3px; vertical-align: top; box-sizing: border-box; }
.mcard.cap-card:hover, .mcard.cap-card:focus-within { box-shadow: none; }
.mcard.cap-card.expanded, .mcard.cap-card:has(> .cap-box[data-phase="closing"]) { z-index: 30; }
.cap-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-panel); box-shadow: inset 0 0 0 1px var(--rule); border-radius: 3px; }
.mcard.cap-card:hover .cap-box:not(.is-open) { box-shadow: inset 0 0 0 1px var(--text-decor); }
.cap-box[data-phase="growing"], .cap-box[data-phase="open"], .cap-box[data-phase="closing"] { background: var(--surface-float); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--rule); }
.cap-box[data-phase="growing"] { width: var(--cap-w); height: min(var(--cap-h), 70vh); overflow: hidden; transition: width var(--dur-move) var(--ease-entrance), height var(--dur-move) var(--ease-entrance); }
/* Once grown the box keeps its span, never taller than 70% of the window (spec D21); what does not fit scrolls inside it. */
.cap-box[data-phase="open"] { width: var(--cap-w); height: min(var(--cap-h), 70vh); }
.cap-box[data-phase="closing"] { overflow: hidden; transition: width var(--dur-move) var(--ease-entrance), height var(--dur-move) var(--ease-entrance); }
.cap-idle-prompt { all: unset; display: flex; flex-direction: column; justify-content: space-between; height: 100%; width: 100%; padding: 16px; box-sizing: border-box; border-radius: 3px; cursor: pointer; text-align: left; }
.cap-idle-prompt:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.cap-box.is-open .cap-idle-prompt { display: none; }
.cap-idle-main { display: flex; flex-direction: column; }
.cap-idle-main .prompt-text { font-family: var(--read); font-size: 17px; line-height: 1.45; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.cap-idle-main .prompt-text.has-draft { color: var(--text); }
.cap-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--text-muted); }
.cap-foot kbd { font-family: inherit; font-size: 10.5px; padding: 0 5px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--rule); color: var(--text-muted); }
.cap-expanded-content { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; box-sizing: border-box; padding: 16px 18px 14px; cursor: default; animation: capContentIn var(--dur-standard) var(--ease-standard) 120ms both; }
.cap-scroll { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.cap-dest { margin: 6px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
@keyframes capContentIn { from { opacity: 0; } to { opacity: 1; } }
/* D8: once there is text, the save hint slides out under the box. It is decoration; the actions row says the same. */
.cap-save-hint { position: absolute; left: 0; right: 0; top: 100%; margin-top: 8px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; color: var(--on-ink); background: var(--text); padding: 6px 8px; border-radius: 3px; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity var(--dur-standard) var(--ease-standard), transform var(--dur-move) var(--ease-entrance); }
.cap-save-hint.is-shown { opacity: 1; transform: none; }
/* Focus mode (D7, D19): the wall steps back while the box is open; the cards only dim, so nothing moves. */
.library-wall .mason > .mcard:not(.cap-card) { transition: transform var(--dur-quick) var(--ease-standard), opacity var(--dur-move) var(--ease-standard); }
.library-wall .lsearch, .library-wall .colls, .library-wall .wall-filters { transition: opacity var(--dur-move) var(--ease-standard); }
.library-wall[data-capturing] .mason > .mcard:not(.cap-card) { opacity: 0.32; filter: saturate(0.6); }
.library-wall[data-capturing] .lsearch, .library-wall[data-capturing] .colls, .library-wall[data-capturing] .wall-filters { opacity: 0.4; }
.mason[data-columns="1"] .cap-box[data-phase="open"], .mason[data-columns="2"] .cap-box[data-phase="open"] { width: 100%; }
.cap-head-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.cap-head-actions { display: flex; align-items: center; gap: 6px; }
.cap-eyebrow { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); }
.cap-badge-quiet { font-size: 11px; color: var(--ink-2); background: transparent; border: 1px solid var(--rule); border-radius: 12px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 5px; line-height: 1.2; }
.cap-badge-quiet .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); opacity: 0.55; }
.cap-icon { all: unset; cursor: pointer; width: 26px; height: 24px; display: grid; place-items: center; border-radius: 3px; font-size: 14px; line-height: 1; color: var(--text-muted); }
.cap-icon:hover { background: var(--hover-fill); color: var(--text); }
.cap-icon:focus-visible { outline: var(--focus-ring); outline-offset: 2px; }
.cap-editor-wrap { flex: 1; position: relative; display: flex; flex-direction: column; margin: 8px 0 6px; min-height: 96px; }
.cap-input { flex: 1; width: 100%; border: 0; background: transparent; font-family: var(--read); font-size: 18px; line-height: 1.5; color: var(--ink); padding: 4px 0; resize: none; outline: none; box-sizing: border-box; }
.cap-input::placeholder { color: var(--text-muted); }
.cap-input[readonly] { color: var(--ink-2); }
/* The caret is the focus mark in the writing field, as in the mock-ups; the box itself is the focused surface. */
.cap-input:focus-visible, .ws-text:focus-visible { outline: none; }
.cap-detect-banner { display: grid; gap: 8px; padding: 8px 0 4px; border-top: 1px solid var(--rule); }
.cap-looks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.cap-guess { font-size: 12px; color: var(--ink); }
/* Separate photos or One group (D30; files-in-2d.html `.seg`). */
.cap-seg { display: inline-flex; background: var(--surface-board); border-radius: 7px; padding: 2px; }
.cap-seg button { all: unset; cursor: pointer; font-size: 11.5px; padding: 2px 9px; border-radius: 5px; color: var(--text); }
.cap-seg button[aria-pressed="true"] { background: var(--surface-panel); color: var(--text); box-shadow: var(--shadow-pic); }
.cap-seg button:focus-visible { outline: var(--focus-ring); outline-offset: 1px; }
.cap-seg button:disabled { cursor: default; }
.cap-guess b { font-weight: 600; }
.cap-detect-banner .chips { margin: 0; }
.cap-org { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; position: relative; }
.cap-org-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 4px 3px 9px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); max-width: 100%; }
.cap-org-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap-org-chip button { all: unset; cursor: pointer; padding: 0 5px; color: var(--ink-2); }
.cap-org-chip button:focus-visible { outline: var(--focus-ring); }
.cap-org-chip.is-warning { box-shadow: inset 0 0 0 1px var(--accent); }
.cap-add { all: unset; cursor: pointer; font-size: 12px; color: var(--accent); padding: 3px 6px; border-radius: 2px; }
.cap-add:focus-visible { outline: var(--focus-ring); }
.cap-lock { border: 0; margin: 0; padding: 0; min-width: 0; display: grid; gap: 8px; }
.cap-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; padding: 8px 0; }
.cap-fields .cap-field-wide { grid-column: 1 / -1; }
.cap-fields label { display: grid; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.cap-fields input, .cap-fields select { width: 100%; border: 1px solid var(--line); background: var(--paper); padding: 6px 8px; font: inherit; font-size: 13px; font-weight: 400; color: var(--ink); border-radius: 2px; box-sizing: border-box; }
.cap-fields input:focus-visible, .cap-fields select:focus-visible { outline: var(--focus-ring); outline-offset: 0; }
.cap-source-chosen { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--ink); }
.cap-source-chosen b { font-weight: 500; overflow-wrap: anywhere; }
@media (max-width: 560px) { .cap-fields { grid-template-columns: 1fr; } }

/* Slash menu (1311–1378) */
.cap-slash-menu { position: absolute; top: 38px; left: 0; width: 240px; background: var(--surface-float); border-radius: 4px; box-shadow: 0 12px 30px color-mix(in srgb, var(--shade) 14%, transparent), 0 2px 6px color-mix(in srgb, var(--shade) 4%, transparent), inset 0 0 0 1px var(--line); padding: 5px; z-index: 31; font-family: var(--ui); animation: slashMenuIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes slashMenuIn { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.slash-menu-header { font-size: 10px; font-weight: 600; color: var(--ink-2); padding: 5px 8px 3px; letter-spacing: 0.06em; text-transform: uppercase; }
.slash-item { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 3px; cursor: pointer; transition: background 0.12s ease; user-select: none; }
.slash-item:hover, .slash-item.active { background: var(--hover-fill); }
.slash-icon { width: 22px; height: 22px; border-radius: 2px; border: 1px solid var(--line); background: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--ink); flex-shrink: 0; }
.slash-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.slash-label { font-size: 12.5px; font-weight: 500; color: var(--ink); line-height: 1.2; }
.slash-desc { font-size: 10.5px; color: var(--ink-2); line-height: 1.2; }

/* Actions row (1380–1404). Hints use --ink-2 rather than the prototype's --ink-3 for text contrast, as Graph does. */
.cap-actions-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--rule); padding-top: 10px; margin-top: auto; gap: 10px; flex-wrap: wrap; }
.cap-hint-quiet { font-size: 11.5px; color: var(--ink-2); font-weight: 400; }
.cap-hint-quiet kbd { font-family: inherit; background: transparent; border: 1px solid var(--rule); padding: 0 4px; border-radius: 2px; font-size: 10px; color: var(--ink-2); }
.cap-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.cap-esc { font-size: 11px; color: var(--ink-2); }
.cap-error { margin: 8px 0 0; font-size: 12.5px; color: var(--ink); border-left: 2px solid var(--accent); padding-left: 8px; }
.cap-error a { color: var(--accent); }

/* Pickers shared by the composer, rails and dialogs */
.library-picker { position: absolute; z-index: 32; top: calc(100% + 4px); left: 0; width: min(320px, 100%); min-width: 240px; background: var(--surface-float); border-radius: 4px; box-shadow: 0 12px 30px color-mix(in srgb, var(--shade) 14%, transparent), inset 0 0 0 1px var(--line); padding: 6px; }
.library-picker input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--paper); padding: 6px 8px; font: inherit; font-size: 13px; color: var(--ink); border-radius: 2px; }
.library-picker ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 240px; overflow-y: auto; }
.library-picker li button { all: unset; display: grid; gap: 1px; width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 3px; cursor: pointer; font-size: 13px; color: var(--ink); }
.library-picker li button:hover:not(:disabled), .library-picker li button:focus-visible { background: var(--hover-fill); outline: none; }
.library-picker li button:disabled { cursor: not-allowed; color: var(--ink-2); }
.library-picker .picker-path, .library-picker .picker-reason { font-size: 11px; color: var(--ink-2); overflow-wrap: anywhere; }
.library-picker .picker-status { font-size: 12px; color: var(--ink-2); padding: 6px 8px 2px; margin: 0; }

.picker-anchor { position: relative; display: inline-block; }
.library-picker.is-inline { position: static; width: 100%; min-width: 0; box-shadow: inset 0 0 0 1px var(--line); }
.cap-reason { font-size: 11.5px; color: var(--ink); }

/* Topic status mark used by rails (prototype 61–65) */
.library-page .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .card-new-drop > .ci, .cap-expanded-content, .cap-slash-menu { animation: none; }
  .cap-box, .cap-save-hint, .library-wall .mason > .mcard:not(.cap-card), .library-wall .lsearch, .library-wall .colls, .library-wall .wall-filters { transition: none; }
  .mcard, .mcard.q { transition: none; }
  .mcard.q:hover { transform: none; }
}

/* Detail frame and shape pages (Task 19), ported from prototype lines 881–888 (link card), 990–1048 (frame, doc,
   properties rail, Note, Quote, Person, book) and 1619–1631 (entity links). `--s1/--s2/--s3` map to
   `--status-1/--status-2/--accent`. The 980px stacking rule is at the end of this block. */
.library-detail-view { width: 100%; max-width: 1440px; margin-inline: auto; }
.doc { max-width: 64ch; }
.doc h1 { font-family: var(--read); font-size: 38px; font-weight: 400; line-height: 1.1; margin: 0 0 12px; letter-spacing: -0.005em; overflow-wrap: anywhere; }
.doc .lead { font-size: 16px; line-height: 1.55; color: var(--ink-2); margin: 0 0 22px; }
.doc h2 { font-family: var(--read); font-size: 24px; font-weight: 400; margin: 26px 0 8px; line-height: 1.2; }
.doc p { font-size: 16px; line-height: 1.6; margin: 0 0 14px; }
.doc blockquote { margin: 18px 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--accent); font-family: var(--read); font-size: 19px; line-height: 1.4; }
.doc blockquote small { display: block; font-family: var(--ui); font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.props { position: sticky; top: 16px; font-size: 13px; }
.prop { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.prop:last-child { border-bottom: 1px solid var(--line); }
.prop > span { color: var(--ink-2); }
.prop b { font-weight: 400; color: var(--ink); line-height: 1.45; }
.props .h { margin-bottom: 6px; }
.props .row { margin-top: 14px; }
.note-meta-line { font-size: 12.5px; color: var(--ink-2); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.quote-src-box { background: var(--panel); padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line); margin: 0 0 24px; }
.quote-src-box .loc { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.shelf-tabs { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.shelf-tabs button { all: unset; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink-2); padding: 4px 6px; }
.shelf-tabs button.on, .shelf-tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); }
.shelf-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.book-spine-lg { aspect-ratio: 2 / 3; background: var(--cover-paper); color: var(--cover-ink); padding: 24px 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 2px 4px 14px color-mix(in srgb, var(--shade) 12%, transparent); }
.book-spine-lg b { font-family: var(--read); font-size: 22px; font-weight: 400; line-height: 1.2; overflow-wrap: anywhere; }
.book-spine-lg span { font-size: 12px; opacity: 0.75; }
.chapters-list { list-style: none; margin: 16px 0 0; padding: 0; }
.chapters-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.chapters-list li:last-child { border-bottom: 1px solid var(--line); }
.entity-link { all: unset; cursor: pointer; color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: transparent; transition: color 0.15s ease, text-decoration-color 0.15s ease; overflow-wrap: anywhere; }
.entity-link:hover { color: var(--accent); text-decoration-color: var(--accent); }
.entity-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Item pages: breadcrumb, badges, rail values, editors (Task 19). */
/* The prototype pulls a view's breadcrumb up under the tabs (`.view>.crumb{margin:-18px 0 16px}`). The pull sits on the view,
   so a notice shown above the breadcrumb moves up with it instead of being overlapped. */
.library-detail-view .crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 16px; min-height: 16px; }
.library-detail-view .crumb a { color: var(--ink-2); text-decoration: none; }
.library-detail-view .crumb a:hover { color: var(--accent); }
.library-detail-view .crumb i { font-style: normal; color: var(--text-muted); font-size: 11px; }
.library-detail-view .crumb b { color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
.library-detail-view .small { font-size: 13px; color: var(--ink-2); }
.library-detail-view .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* The prototype's later Library badge rule (lines 666–667) overrides its first one (lines 66–68). */
.library-detail-view .badge { font-size: 11.5px; padding: 2px 8px; border-radius: 2px; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface-panel); white-space: nowrap; }
.library-detail-view .badge.ok { color: var(--accent); border-color: var(--status-1); background: var(--accent-soft); font-weight: 500; }
.library-detail-view .badge-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.props .prop-value { color: var(--ink); line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.props .rail-actions { margin-top: 14px; }
.btn-open-graph { font-size: 12.5px; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.btn-open-graph:hover { text-decoration: underline; }

.inline-edit-wrap { min-width: 0; }
.inline-edit { all: unset; display: block; box-sizing: border-box; width: 100%; field-sizing: content; min-height: 1.4em; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; border-bottom: 1px dashed transparent; }
.inline-edit:hover { border-bottom-color: var(--line); }
.inline-edit:focus { border-bottom-color: var(--accent); }
.inline-edit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.inline-edit::placeholder { color: var(--ink-2); opacity: 1; }
.doc .inline-edit.lead { font-size: 16px; line-height: 1.55; color: var(--ink-2); margin: 0 0 22px; }
/* `p.` keeps these above `.doc p` (16px, 14px bottom margin), which otherwise wins on specificity inside an article. */
p.library-save-state { min-height: 16px; margin: 2px 0 0; font-size: 12px; color: var(--ink-2); }
.library-field-error { margin: 6px 0 0; font-size: 12.5px; color: var(--ink); border-left: 2px solid var(--accent); padding-left: 8px; }
.library-notice.urgent { box-shadow: inset 3px 0 0 var(--accent), inset 0 0 0 1px var(--line); }
.library-notice-close { all: unset; margin-left: auto; cursor: pointer; color: var(--ink-2); padding: 0 4px; }
.library-gone { padding: 32px 0; }

.markdown-body { font-size: 16px; line-height: 1.6; }
.doc .ph { all: unset; display: block; cursor: text; color: var(--ink-2); font-size: 15px; margin-top: 6px; }
.doc .ph:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.md-editor { margin: 6px 0 0; }
.md-editor .md-input { display: block; width: 100%; box-sizing: border-box; min-height: 320px; font-family: var(--read); font-size: 16px; line-height: 1.6; padding: 12px 14px; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); color: var(--ink); resize: vertical; }
.md-editor .md-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.md-editor .slash, .ws-body .slash { background: var(--paper); border: 1px solid var(--line); box-shadow: 0 6px 20px color-mix(in srgb, var(--shade) 7%, transparent); padding: 6px; margin-top: 8px; max-width: 360px; }
.md-editor .slash div, .ws-body .slash div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 7px 10px; font-size: 13px; border-radius: 2px; line-height: 1.4; cursor: pointer; }
.md-editor .slash div.on, .ws-body .slash div.on { background: var(--panel); }
.md-editor .slash b, .ws-body .slash b { font-weight: 500; }
.md-editor .slash span, .ws-body .slash span { color: var(--ink-2); }
.md-editor .md-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.md-editor .md-hint { font-size: 12px; color: var(--ink-2); margin-left: auto; }
.md-discard { margin: 10px 0; padding: 10px 12px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; }
.md-discard p { margin: 0 0 6px; }

@media (max-width: 980px) {
  .library-detail-view .props { position: static; }
}
.conversation-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.doc h1.inline-heading { margin: 0; }

.quote-src-label { font-size: 12px; color: var(--ink-2); }
.quote-src-title { font-weight: 500; font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; }
.quote-src-actions { margin-top: 10px; }
/* A Quote without a Source (D29): no attribution box, only its locator and a quiet "Add a source" (Task 35). */
.quote-src-none { margin: 0 0 24px; }
.quote-src-none > .row { font-size: 13px; color: var(--ink-2); gap: 12px; }
.quote-src-picker { max-width: 360px; }
.quote-src-picker > .button-link { margin-top: 4px; }
.person-shelf-empty { grid-column: 1 / -1; }
.props .rail-input { font-size: 13px; color: var(--ink); }
.props .rail-select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 3px 6px; max-width: 100%; }
.locator-editor { display: grid; gap: 4px; }
.item-field .row { gap: 4px; margin-top: 4px; }
/* F8: a Web link field: the link chip (title or domain, no favicon), its domain, then Edit and Clear. */
.url-field .web-link-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 0; }
.url-field .web-link-domain { font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
.url-field .row { gap: 4px; margin-top: 4px; }
.rail-picker { margin-top: 6px; }

.library-detail-view a.button { text-decoration: none; }
.doc h1.inline-heading .inline-edit { min-height: 0; }
.props .library-save-state { min-height: 0; margin: 0; }

/* Rail parts: tags, collections, About, Notes about (Task 21). */
.tag-list { list-style: none; margin: 0 0 4px; padding: 0; display: grid; gap: 4px; }
.tag-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 6px; min-width: 0; }
.tag-main { min-width: 0; }
.topic-btn { color: var(--ink); font-weight: 500; text-decoration: underline; text-decoration-color: transparent; overflow-wrap: anywhere; transition: color 0.15s ease, text-decoration-color 0.15s ease; }
.topic-btn:hover { color: var(--accent); text-decoration-color: var(--accent); }
.tag-remove { all: unset; cursor: pointer; color: var(--ink-2); min-width: 24px; min-height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.tag-remove:hover { color: var(--accent); }
.tag-remove:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rail-options { list-style: none; margin: 0 0 4px; padding: 0; max-height: 240px; overflow-y: auto; border: 1px solid var(--line); background: var(--panel); }
