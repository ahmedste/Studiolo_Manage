<style>
/* Layout: Commonplace › Objects. Types down the side, the chosen type's view (or one object's page) in the stage, Edit type as a side drawer that updates the stage live. Tokens are Studiolo's own (src/styles/tokens.css), as in the other prototypes. */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --status-1: #c9d4f1; --status-2: #6e86d0; --status-3: #1e3e9e; --accent: #1e3e9e;
  --accent-soft: #e6ebf8; --accent-strong: #142b73;
  --float: #fbfbf9; --hover: #ecece6; --mat: #e4e4de; --scrim: rgba(243, 243, 239, .74);
  --quote-paper: #faf8f2; --quote-rule: #eae5d9; --note-paper: #faf9f5;
  --warn: #9a3b2e; --warn-soft: #f6e4df; --ok: #2f6b4a; --ok-soft: #e2efe7;
  --work: #7a5a2e; --work-soft: #f3ecdf; --pick: #b7791f; --decision-rule: #c9b48a;
  --on-media: #ffffff; --media-badge: rgba(0, 0, 0, .56);
  --c0-bg: #e3e9f8; --c0-fg: #23408f; --c1-bg: #e0efe5; --c1-fg: #2d6544;
  --c2-bg: #f7ecd6; --c2-fg: #85571a; --c3-bg: #f6e2e0; --c3-fg: #93392f;
  --c4-bg: #ece5f5; --c4-fg: #5b3f8a; --c5-bg: #e6e9eb; --c5-fg: #44535e;
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, .07), 0 8px 22px rgba(34, 48, 58, .09);
  --shadow-float: 0 0 0 1px rgba(34, 48, 58, .04), 0 1px 2px rgba(34, 48, 58, .06), 0 18px 48px rgba(34, 48, 58, .16);
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur-q: 130ms; --dur-s: 220ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
    --accent-soft: #263156; --accent-strong: #c3cff8;
    --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim: rgba(19, 26, 32, .82);
    --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
    --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329;
    --work: #d9b57c; --work-soft: #352b1c; --pick: #e8c27a; --decision-rule: #7d6a45;
    --c0-bg: #263156; --c0-fg: #b7c6f7; --c1-bg: #1f3329; --c1-fg: #94d0ad;
    --c2-bg: #352b1c; --c2-fg: #e3c38d; --c3-bg: #3a2521; --c3-fg: #eea597;
    --c4-bg: #2e2640; --c4-fg: #c7b2ec; --c5-bg: #2a353f; --c5-fg: #b3bec6;
    --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
    --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
  --accent-soft: #263156; --accent-strong: #c3cff8;
  --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim: rgba(19, 26, 32, .82);
  --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
  --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329;
  --work: #d9b57c; --work-soft: #352b1c; --pick: #e8c27a; --decision-rule: #7d6a45;
  --c0-bg: #263156; --c0-fg: #b7c6f7; --c1-bg: #1f3329; --c1-fg: #94d0ad;
  --c2-bg: #352b1c; --c2-fg: #e3c38d; --c3-bg: #3a2521; --c3-fg: #eea597;
  --c4-bg: #2e2640; --c4-fg: #c7b2ec; --c5-bg: #2a353f; --c5-fg: #b3bec6;
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
  --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-q: 1ms; --dur-s: 1ms; } }

[hidden] { display: none !important; }
html, body { height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; max-height: 100vh; overflow: auto; padding-block: 22px; padding-right: 18px; border-right: 1px solid var(--line); display: grid; gap: 16px; }
.crumb { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.crumb b { color: var(--ink); font-weight: 600; }
.fsw { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--board); border-radius: 8px; padding: 3px; gap: 2px; }
.fsw button { border: 0; background: transparent; border-radius: 6px; padding: 6px 4px; font-size: 13px; color: var(--ink-2); }
.fsw button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-pic); font-weight: 500; }
.who { font-size: 12px; color: var(--ink-2); }
.types { display: grid; gap: 1px; }
.tbtn { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; border: 0; background: transparent; padding: 7px 8px; border-radius: 6px; text-align: left; color: var(--ink-2); }
.tbtn:hover { background: var(--hover); }
.tbtn[aria-current="true"] { background: var(--accent-soft); color: var(--accent-strong); }
.tbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.tbtn[aria-current="true"] span { color: var(--accent-strong); font-weight: 500; }
.tbtn b { font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.tbtn em { font-style: normal; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); }
.ico { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.addtype { justify-self: start; border: 1px dashed var(--line); background: transparent; border-radius: 6px; padding: 6px 10px; color: var(--ink-2); font-size: 13px; }
.addtype:hover { border-color: var(--ink-3); color: var(--ink); }
.sidenote { font-size: 11px; color: var(--ink-3); line-height: 1.45; }

.stage { min-width: 0; padding-block: 24px 80px; padding-left: 32px; }
.wrap { max-width: 1080px; display: grid; gap: 20px; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.pri { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.on { background: var(--accent-soft); border-color: var(--status-2); color: var(--accent-strong); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.ghost { border: 0; background: transparent; color: var(--ink-2); padding: 4px 6px; border-radius: 5px; }
.ghost:hover { background: var(--hover); color: var(--ink); }

.thead { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.thead .l { display: flex; gap: 14px; align-items: center; min-width: 0; }
.tico { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; flex: none; }
.tico .ico { width: 22px; height: 22px; }
.thead h1 { font: 500 30px/1.1 var(--read); }
.meta { font-size: 13px; color: var(--ink-2); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }

.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; font-size: 13px; background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--accent-strong); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 12px 9px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tab[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.tab small { color: var(--ink-3); font-size: 11px; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 20px; white-space: nowrap; border: 0; }
.c0 { background: var(--c0-bg); color: var(--c0-fg); } .c1 { background: var(--c1-bg); color: var(--c1-fg); }
.c2 { background: var(--c2-bg); color: var(--c2-fg); } .c3 { background: var(--c3-bg); color: var(--c3-fg); }
.c4 { background: var(--c4-bg); color: var(--c4-fg); } .c5 { background: var(--c5-bg); color: var(--c5-fg); }
.rchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 0 7px; font-size: 13px; line-height: 22px; color: var(--ink); max-width: 100%; }
.rchip:hover { border-color: var(--status-2); color: var(--accent-strong); }
.rchip .ico { width: 13px; height: 13px; color: var(--ink-3); flex: none; }
.rchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.add { border: 1px dashed var(--line); background: transparent; color: var(--ink-3); border-radius: 5px; padding: 0 7px; line-height: 20px; font-size: 12px; }
.add:hover { color: var(--ink); border-color: var(--ink-3); }
.tp { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px 1px 8px; font-size: 12px; background: var(--panel); }
.tdot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--status-2); }
.tdot.s1 { background: var(--status-1); } .tdot.s2 { background: var(--status-3); border-color: var(--status-3); }
.dots { display: inline-flex; gap: 2px; }
.dots button { border: 0; background: transparent; padding: 0 1px; color: var(--ink-3); font-size: 13px; line-height: 1; }
.dots button.f { color: var(--pick); }
.tick { border: 1px solid var(--line); background: var(--panel); width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 12px; padding: 0; color: var(--paper); }
.tick.y { background: var(--ok); border-color: var(--ok); }

/* gallery */
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 22px 18px; }
.card { border: 0; background: transparent; padding: 0; text-align: left; display: grid; gap: 8px; align-content: start; }
.card .cb { display: grid; gap: 1px; min-width: 0; }
.card b { font-weight: 500; font-size: 14px; }
.card small { font-size: 12px; color: var(--ink-2); }
.card:hover b { color: var(--accent); }
.pic { aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden; box-shadow: var(--shadow-pic); background: var(--mat); max-width: 100%; }
.pic svg { width: 100%; height: 100%; display: block; }
.por { aspect-ratio: 4 / 3; border-radius: 4px; background: var(--board); display: grid; place-items: center; max-width: 100%; }
.face { border-radius: 50%; display: grid; place-items: center; color: #fff; font: 500 30px/1 var(--read); letter-spacing: .02em; }
.tile { aspect-ratio: 4 / 3; border-radius: 4px; background: var(--quote-paper); border: 1px solid var(--quote-rule); padding: 14px; display: grid; align-content: space-between; gap: 8px; max-width: 100%; overflow: hidden; }
.tile .ico { color: var(--ink-3); }
.tile .tt { font: italic 400 17px/1.25 var(--read); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .sc { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

/* table */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
th { font-size: 12px; color: var(--ink-2); text-align: left; font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th i { font-style: normal; color: var(--ink-3); font-size: 11px; margin-right: 5px; font-variant-numeric: tabular-nums; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 260px; }
tr:last-child td { border-bottom: 0; }
td.tt button { border: 0; background: transparent; padding: 0; text-align: left; font-weight: 500; color: var(--ink); }
td.tt button:hover { color: var(--accent); text-decoration: underline; }
td .muted, .muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.bcol { background: var(--board); border-radius: 8px; padding: 10px; display: grid; gap: 8px; align-content: start; min-height: 220px; transition: box-shadow var(--dur-q) var(--ease); }
.bcol.over { box-shadow: inset 0 0 0 2px var(--status-2); }
.bcol h4 { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 500; padding: 2px 2px 4px; }
.bcol h4 b { font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.bcard { background: var(--panel); border-radius: 6px; padding: 9px 10px; box-shadow: var(--shadow-pic); display: grid; gap: 3px; cursor: grab; border: 0; text-align: left; }
.bcard b { font-weight: 500; font-size: 13px; }
.bcard small { color: var(--ink-2); font-size: 12px; }
.bcard .thumb { aspect-ratio: 16 / 9; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
.bcard .thumb svg { width: 100%; height: 100%; display: block; }

/* timeline */
.tl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.tlin { min-width: 680px; padding: 8px 0 14px; }
.tlrow { display: grid; grid-template-columns: 210px minmax(0, 1fr); align-items: center; min-height: 34px; }
.tlrow .lab { padding: 0 14px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tlrow .lab button { border: 0; background: transparent; padding: 0; color: var(--ink); }
.tlrow .lab button:hover { color: var(--accent); }
.track { position: relative; height: 34px; margin-right: 24px; }
.axis { height: 26px; border-bottom: 1px solid var(--line); }
.tick-l { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-bottom: 5px; white-space: nowrap; }
.grid-l { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); opacity: .6; }
.bar { position: absolute; top: 11px; height: 12px; border-radius: 6px; background: var(--status-2); min-width: 12px; }
.bar.open { -webkit-mask-image: linear-gradient(90deg, #000 72%, transparent); mask-image: linear-gradient(90deg, #000 72%, transparent); }
.pt { position: absolute; top: 10px; width: 14px; height: 14px; border-radius: 50%; transform: translateX(-50%); border: 2px solid var(--panel); }
.tlleg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); padding: 0 14px 6px; }

/* object page */
.back { border: 0; background: transparent; color: var(--ink-2); padding: 0; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; justify-self: start; }
.back:hover { color: var(--ink); }
.phead { display: flex; gap: 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.phead .l { display: flex; gap: 18px; align-items: center; min-width: 0; flex: 1 1 360px; }
.phead .tx { display: grid; gap: 6px; min-width: 0; }
.tchip { justify-self: start; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--accent-strong); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 2px 10px 2px 7px; }
.tchip .ico { width: 14px; height: 14px; }
.ptitle { font: 500 clamp(28px, 4vw, 40px)/1.08 var(--read); outline: none; border-radius: 4px; }
.ptitle:focus { box-shadow: 0 0 0 2px var(--accent-soft); }
.ptitle:empty::before { content: attr(data-ph); color: var(--ink-3); }
.sub { color: var(--ink-2); font-size: 15px; }

.hero { position: relative; aspect-ratio: 16 / 8; max-height: 480px; width: 100%; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-pic); background: var(--mat); }
.hero svg { width: 100%; height: 100%; display: block; }
.hero .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--media-badge); color: var(--on-media); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.hero .nav.p { left: 12px; } .hero .nav.n { right: 12px; }
.hero .cnt { position: absolute; right: 12px; bottom: 12px; background: var(--media-badge); color: var(--on-media); font-size: 12px; padding: 2px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.strip { display: flex; gap: 6px; overflow-x: auto; }
.strip button { flex: none; width: 72px; aspect-ratio: 4 / 3; padding: 0; border: 2px solid transparent; border-radius: 4px; overflow: hidden; background: var(--mat); }
.strip button[aria-pressed="true"] { border-color: var(--ink); }
.strip svg { width: 100%; height: 100%; display: block; }
.dochero { background: var(--quote-paper); border: 1px solid var(--quote-rule); border-radius: 4px; padding: 30px 28px 26px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.dochero .court { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.dochero .t { font: italic 400 clamp(22px, 3vw, 30px)/1.2 var(--read); max-width: 30ch; }
.dochero .cit { font: 400 15px/1.4 var(--read); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.dochero hr { width: 48px; border: 0; border-top: 1px solid var(--decision-rule); margin: 2px 0; }
.bigface { flex: none; }

.cols { display: grid; gap: 36px; }
.cols.two { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.colm, .cola { display: grid; gap: 30px; align-content: start; min-width: 0; }
.blk { display: grid; gap: 10px; min-width: 0; position: relative; }
.blk > h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.blk > h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.prose { font: 400 18px/1.6 var(--read); max-width: 65ch; outline: none; border-radius: 4px; padding: 2px 4px; margin: -2px -4px; }
.prose:hover { background: var(--hover); }
.prose:focus { background: var(--panel); box-shadow: 0 0 0 2px var(--accent-soft); }
.prose:empty::before { content: attr(data-ph); color: var(--ink-3); }
.facts { margin: 0; display: grid; }
.fr { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.fr:first-child { border-top: 1px solid var(--line); }
.fr dt { color: var(--ink-2); font-size: 13px; }
.fr dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ed { outline: none; border-radius: 3px; padding: 1px 3px; margin: -1px -3px; display: inline-block; min-width: 40px; }
.ed:hover { background: var(--hover); }
.ed:focus { background: var(--panel); box-shadow: 0 0 0 2px var(--accent-soft); }
.ed:empty::before { content: attr(data-ph); color: var(--ink-3); }

const hasPics = (t, o) => t.tex || (t.fields.some(f => f.t === "pics") && o.pics > 0);

}

/* ---------- layout ---------- */
function ensure(t) {
  const L = t.layout, want = ["facts"];
  t.fields.filter(f => f.t === "long").forEach(f => want.push("sec:" + f.id));
  t.fields.filter(f => f.t === "rel" && f.o.cards).forEach(f => want.push("rel:" + f.id));
  if (t.fields.some(f => f.t === "pics")) want.push("pics");
  invFor(t.id).forEach(x => want.push(`inv:${x.t.id}.${x.f.id}`));
  if (t.fields.some(f => f.t === "topics")) want.push("topics");
  want.push("mentions");
  L.blocks = L.blocks.filter(b => want.includes(b.k));
  for (const k of want) {
    if (L.blocks.some(b => b.k === k)) continue;
    const at = L.blocks.findIndex(b => b.k === "topics" || b.k === "mentions");
    const blk = { k, on: !(k === "pics" && L.hero === "pics") };
    at < 0 || k === "topics" || k === "mentions" ? L.blocks.push(blk) : L.blocks.splice(at, 0, blk);
  }
  const ok = heroOptions(t);
  if (!ok.includes(L.hero)) L.hero = "none";
}
function heroOptions(t) {
  const o = [];
  if (t.fields.some(f => f.t === "pics")) o.push("pics", "picture");
  else if (t.tex) o.push("picture");
  if (t.base === "person") o.push("portrait");

}
const factFields = t => t.fields.filter(f => !["long", "topics", "pics"].includes(f.t) && !(f.t === "rel" && f.o.cards));

const dots = (o, f) => `<span class="dots">${[1, 2, 3, 4, 5].map(n => `<button class="${(o.v[f.id] || 0) >= n ? "f" : ""}" data-act="rate" data-o="${o.id}" data-f="${f.id}" data-n="${n}" aria-label="${n} of 5">${(o.v[f.id] || 0) >= n ? "★" : "☆"}</button>`).join("")}</span>`;

/* ---------- object page ---------- */

    case "addfield": addField(t, d.k); break;

    case "fcfg": S.open = S.open === d.f ? null : d.f; renderDrawer(); break;
    case "base": t.base = d.k; if (d.k === "person" && t.layout.hero === "none") t.layout.hero = "portrait"; ensure(t); renderAll(); break;
    case "sens": t.sens = d.k; renderAll(); break;
    case "newtype": S.modal = { step: "ask", text: "" }; renderModal(); break;
    case "sugg": S.modal.text = d.v; S.modal.draft = draftFor(d.v); S.modal.step = "draft"; renderModal(); break;
    case "redraft": S.modal = { step: "ask", text: S.modal.text }; renderModal(); break;
    case "closemodal": S.modal = null; renderModal(); break;
    case "closemodal-bg": if (e.target === a) { S.modal = null; renderModal(); } break;
    case "keeptype": {
      const d0 = S.modal.draft, id = "u" + Date.now();
      const nt = ty({ ...d0, id });
      if (nt.fields.some(f => f.t === "rel" && !T(f.o.to))) nt.fields = nt.fields.filter(f => f.t !== "rel" || T(f.o.to));
      D().types.push(nt); ensure(nt);
      S.modal = null; S.type = id; S.obj = null; S.drawer = true; S.catalog = false;
      renderAll(); toast(`Kept ${nt.name}. Change anything in Edit type.`); break;
    }
  }
});
document.addEventListener("submit", e => {
  if (e.target.dataset.form === "draft") {
    e.preventDefault();
    const v = $("#ntext").value.trim();
    if (!v) { toast("Write what you want to keep, for example “Hearings I attend”."); return; }
    S.modal = { step: "draft", text: v, draft: draftFor(v) }; renderModal();
  }
});
document.addEventListener("input", e => {
  const el = e.target, t = T(S.type);
  if (el.id === "popq") { S.pop.q = el.value; const pos = el.selectionStart; drawPop(); const n = $("#popq"); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (el.dataset.tf) { t[el.dataset.tf] = el.value || (el.dataset.tf === "name" ? "Untitled" : "Item"); renderSide(); renderMain(); return; }
  if (el.dataset.fname) { const f = F(t, el.dataset.fname); f.name = el.value; renderMain(); return; }
  if (el.dataset.cfg === "inv" || el.dataset.cfg === "unit") { F(t, el.dataset.f).o[el.dataset.cfg] = el.value; renderMain(); }
});
document.addEventListener("change", e => {
  const el = e.target, t = T(S.type);
  if (el.dataset.oncard) { const id = el.dataset.oncard; t.card = el.checked ? [...t.card, id] : t.card.filter(x => x !== id); renderMain(); return; }
  if (!el.dataset.cfg) return;
  const f = F(t, el.dataset.f), k = el.dataset.cfg;
  if (k === "opts") {
    const vals = [...new Set(el.value.split(",").map(s => s.trim()).filter(Boolean))];
    const old = Object.fromEntries(f.o.opts.map(x => [x.v, x.c]));
    f.o.opts = vals.map((v, i) => ({ v, c: old[v] ?? i % 6 }));
    objsOf(t.id).forEach(o => { if (o.v[f.id]) o.v[f.id] = arr(o.v[f.id]).filter(v => vals.includes(v)); });
  } else if (k === "many") f.o.many = el.checked;
  else if (k === "cards") f.o.cards = el.checked;
  else if (k === "to") { f.o.to = el.value; objsOf(t.id).forEach(o => delete o.v[f.id]); }
  ensure(t); renderDrawer(); renderMain();
});
document.addEventListener("focusout", e => {
  const el = e.target;
  if (el.isContentEditable && (el.dataset.f || el.dataset.title)) saveEdit(el);
});
document.addEventListener("keydown", e => {
  const el = e.target;
  if ((e.key === "Enter" || e.key === " ") && el.getAttribute?.("role") === "button" && el.dataset.act) { e.preventDefault(); el.click(); return; }
  if (e.key === "Enter" && el.isContentEditable && !el.classList.contains("prose")) { e.preventDefault(); el.blur(); }
  if (e.key === "Escape") { if (S.pop) closePop(); else if (S.modal) { S.modal = null; renderModal(); } else if (S.arrange) { S.arrange = false; renderMain(); } else if (S.drawer) { S.drawer = false; renderAll(); } }
});
document.addEventListener("paste", e => {
  if (e.target.isContentEditable) { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain")); }
});
window.addEventListener("scroll", e => { if (S.pop && !e.target.closest?.("#pop")) closePop(); }, true);

/* drag cards between board columns */
document.addEventListener("dragstart", e => { const c = e.target.closest?.("[data-drag]"); if (!c) return; S.drag = c.dataset.drag; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", S.drag); });
document.addEventListener("dragover", e => { const col = e.target.closest?.(".bcol"); if (!col || !S.drag) return; e.preventDefault(); document.querySelectorAll(".bcol.over").forEach(c => c !== col && c.classList.remove("over")); col.classList.add("over"); });
document.addEventListener("drop", e => {
  const col = e.target.closest?.(".bcol"); if (!col || !S.drag) return; e.preventDefault();
  const o = O(S.drag), f = col.dataset.f, v = col.dataset.drop;
  o.v[f] = v ? [v] : [];
  S.drag = null; renderMain(); renderSide();
  toast(v ? `${o.title} → ${v}` : `Cleared ${o.title}`);
});
document.addEventListener("dragend", () => { setTimeout(() => S.drag = null, 0); document.querySelectorAll(".bcol.over").forEach(c => c.classList.remove("over")); });

D().types.forEach(ensure);
renderAll();
</script>
