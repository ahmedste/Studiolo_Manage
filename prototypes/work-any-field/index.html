<meta charset="utf-8">
<title>Work in Any Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: the app shell (58 px rail + main stage) with Work drawn by one engine for any field. Tokens are Studiolo's own (src/styles/tokens.css). */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --status-1: #c9d4f1; --status-2: #6e86d0; --status-3: #1e3e9e; --accent: #1e3e9e;
  --accent-soft: #e6ebf8; --accent-strong: #142b73;
  --float: #fbfbf9; --hover: #ecece6; --mat: #e4e4de; --scrim: rgba(243, 243, 239, .74);
  --quote-paper: #faf8f2; --quote-rule: #eae5d9; --note-paper: #faf9f5;
  --warn: #9a3b2e; --warn-soft: #f6e4df; --ok: #2f6b4a; --ok-soft: #e2efe7;
  --pick: #b7791f; --pick-soft: #fbf3df;
  --work: #7a5a2e; --work-soft: #f3ecdf;
  --decision-paper: #f6f3ea; --decision-rule: #c9b48a;
  --on-media: #ffffff; --media-badge: rgba(0, 0, 0, .64);
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, .07), 0 8px 22px rgba(34, 48, 58, .09);
  --shadow-lift: 0 2px 4px rgba(34, 48, 58, .08), 0 16px 36px rgba(34, 48, 58, .15);
  --shadow-float: 0 0 0 1px transparent, 0 1px 2px rgba(34, 48, 58, .06), 0 18px 48px rgba(34, 48, 58, .16);
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur-q: 130ms; --dur-s: 220ms; --dur-m: 380ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
    --accent-soft: #263156; --accent-strong: #c3cff8;
    --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim: rgba(19, 26, 32, .82);
    --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
    --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a;
    --work: #d9b57c; --work-soft: #352b1c; --decision-paper: #27251e; --decision-rule: #7d6a45;
    --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
    --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
  --accent-soft: #263156; --accent-strong: #c3cff8;
  --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim: rgba(19, 26, 32, .82);
  --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
  --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a;
  --work: #d9b57c; --work-soft: #352b1c; --decision-paper: #27251e; --decision-rule: #7d6a45;
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
  --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-q: 1ms; --dur-s: 1ms; --dur-m: 1ms; } }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.rail { position: fixed; inset: 0 auto 0 0; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); border-right: 1px solid var(--line); background: var(--paper); z-index: 20; }
.rail .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 500 17px var(--read); margin-bottom: 20px; }
.rail button { all: unset; width: 40px; height: 36px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-2); cursor: pointer; position: relative; }
.rail button:hover { background: var(--hover); color: var(--ink); }
.rail button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.rail button:focus-visible { outline: 2px solid var(--accent); }
.rail button .tip { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); background: var(--ink); color: var(--paper); font-size: 12px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--dur-q); }
.rail button:hover .tip, .rail button:focus-visible .tip { opacity: 1; }
.rail .newdot { position: absolute; right: 4px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--work); }
.rail .grow { flex: 1; }
.rail .me { width: 26px; height: 26px; border-radius: 50%; background: var(--board); font-size: 11px; font-weight: 500; display: grid; place-items: center; }
.rail svg { width: 18px; height: 18px; }
.stage { margin-left: 58px; min-width: 0; padding-block: 32px 140px; padding-left: max(44px, env(safe-area-inset-left, 0px)); padding-right: max(44px, env(safe-area-inset-right, 0px)); max-width: 1440px; }
.dest-head { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; color: var(--ink-2); margin: 0 0 14px; flex-wrap: wrap; }
.dest-head b { color: var(--ink); font-weight: 500; }
.dest-head button { all: unset; cursor: pointer; color: var(--ink); font-weight: 500; }
.dest-head button:hover { text-decoration: underline; }
.dest-head .sep { color: var(--ink-3); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 26px; overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; cursor: pointer; padding: 7px 12px 9px; font-size: 13.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; border-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.tabs .n { color: var(--ink-3); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* ---------- atoms ---------- */
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 4px; font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:focus-visible { outline: 2px solid var(--accent); }
.btn.line { box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.btn.line:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--paper); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.tiny { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.quiet { color: var(--ink-2); font-weight: 400; }
.btn.link { height: auto; padding: 0; color: var(--accent); font-weight: 500; }
.btn.link:hover { background: none; text-decoration: underline; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.seg { display: inline-flex; background: var(--board); padding: 3px; border-radius: 8px; gap: 2px; }
.seg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(34, 48, 58, .08); }
.seg button:focus-visible { outline: 2px solid var(--accent); }
.new { display: inline-block; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--work); background: var(--work-soft); padding: 1px 5px; border-radius: 3px; vertical-align: 2px; margin-left: 6px; }
.kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0; font-weight: 500; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sdot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ink-3); display: inline-block; flex: none; }
.sdot.s1 { background: var(--status-1); border-color: var(--status-1); }
.sdot.s2 { background: var(--status-3); border-color: var(--status-3); }
.tchip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 8px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--ink); white-space: nowrap; }
.tchip:hover { background: var(--hover); }
.tchip.gap { box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn); background: transparent; border-style: dashed; }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; }
.state { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.state.open { background: var(--board); color: var(--ink-2); }
.state.exploring { background: var(--accent-soft); color: var(--accent-strong); }
.state.decided { background: var(--ok-soft); color: var(--ok); }
.state.parked { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.src { font-size: 11.5px; color: var(--ink-2); }
.src b { font-weight: 500; color: var(--ink); }
.cite { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--accent); white-space: nowrap; }
.cite:hover { text-decoration: underline; }
.cite img, .cite .sw { width: 18px; height: 18px; border-radius: 3px; object-fit: cover; flex: none; background: var(--mat); }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; flex-wrap: wrap; }
.section-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.section-h .muted { font-size: 12.5px; }


/* ---------- field switch, chain ---------- */
.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.topbar .grow { flex: 1; }
.fieldseg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--board); flex-wrap: wrap; }
.fieldseg button { all: unset; cursor: pointer; display: inline-flex; flex-direction: column; padding: 6px 14px 7px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); line-height: 1.2; }
.fieldseg button small { font-size: 11px; font-weight: 400; color: var(--ink-3); }
.fieldseg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(34, 48, 58, .1), 0 0 0 1px var(--line); }
.fieldseg button:focus-visible { outline: 2px solid var(--accent); }
.adtoggle { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 17px; font-size: 13px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.adtoggle .sw { width: 28px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background var(--dur-s); }
.adtoggle .sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); transition: transform var(--dur-s) var(--ease); }
.adtoggle[aria-pressed="true"] .sw { background: var(--work); }
.adtoggle[aria-pressed="true"] .sw::after { transform: translateX(12px); }
.adtoggle:focus-visible { outline: 2px solid var(--accent); }
.adapt .ad { background: var(--work-soft); color: var(--work); box-shadow: 0 1.5px 0 var(--work); border-radius: 2px; padding: 0 2px; }
.adapt .adbox { outline: 1.5px dashed var(--work); outline-offset: 3px; border-radius: 4px; }
.adlegend { display: none; font-size: 12.5px; color: var(--work); margin: -8px 0 16px; }
.adapt .adlegend { display: block; }
.persona { font: 400 15px/1.4 var(--read); color: var(--ink-2); margin: 0 0 16px; }
.chain { display: grid; grid-template-columns: 92px repeat(10, minmax(84px, 1fr)); border-radius: 8px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 26px; overflow-x: auto; }
.chain > div { padding: 8px 8px; font-size: 12px; border-left: 1px solid var(--line); min-width: 0; }
.chain > div:nth-child(11n + 1) { border-left: 0; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; }
.chain .u { color: var(--ink-2); }
.chain .f { font-weight: 500; border-top: 1px solid var(--line); }
.chain .f.lab { border-top: 1px solid var(--line); }
.chain .on { background: var(--accent-soft); }
.chainwrap { overflow-x: auto; margin-bottom: 26px; }
.chainwrap .chain { margin-bottom: 0; min-width: 960px; }

/* ---------- work header ---------- */
.wk-head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
.wk-head .cv { width: 96px; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--mat); flex: none; display: grid; place-items: center; box-shadow: var(--shadow-pic); }
.wk-head .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.wk-head .cv.txt { background: var(--cover-paper); color: var(--cover-ink); font: 400 28px var(--read); }
.wk-head .tt { flex: 1; min-width: 240px; }
.wk-head h1 { font: 400 28px/1.15 var(--read); margin: 2px 0 8px; }
.wk-head .sub { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.stagerow { display: flex; gap: 3px; max-width: 420px; margin-top: 10px; }
.stagerow span { flex: 1; min-width: 0; font-size: 10.5px; color: var(--ink-3); border-top: 3px solid var(--line); padding-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stagerow span.done { border-color: var(--status-2); }
.stagerow span.now { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.factsrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); border-top: 1px solid var(--line); margin-bottom: 18px; }
.factsrow div { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.factsrow dt { font-size: 11px; color: var(--ink-2); }
.factsrow dd { margin: 0; font-size: 13px; }
.sens { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 6px; margin-bottom: 18px; font-size: 12.5px; background: var(--warn-soft); color: var(--ink); }
.sens b { color: var(--warn); font-weight: 600; white-space: nowrap; }
.sens.conf { background: var(--accent-soft); }
.sens.conf b { color: var(--accent-strong); }

/* ---------- question ---------- */
.qhead { margin-bottom: 20px; }
.qhead h2 { font: 400 26px/1.25 var(--read); margin: 6px 0 10px; max-width: 34ch; }
.slot { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.qgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; align-items: start; }
.qmain { display: flex; flex-direction: column; gap: 30px; min-width: 0; }
.sec h3 { margin: 2px 0 4px; font: 400 20px/1.25 var(--read); }
.sec .lede { margin: 0 0 12px; font-size: 12.5px; color: var(--ink-2); max-width: 70ch; }
.topicline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 10px; }
.topicline .path { color: var(--ink-2); font-size: 12px; }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.rules li { padding-left: 14px; border-left: 2px solid var(--line); }
.rules q { font: 400 15.5px/1.45 var(--read); quotes: none; display: block; }
.rules .src { margin-top: 3px; display: block; }
.knows { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.knows li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 7px 10px; border-radius: 5px; font-size: 13.5px; }
.knows li:nth-child(odd) { background: var(--panel); }
.knows .k { font-size: 11.5px; color: var(--ink-2); }
.knows .k.rv { color: var(--warn); }
.knows .src { display: block; margin-top: 2px; }
.test { border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); overflow: hidden; }
.tline { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 54px 108px; gap: 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
.tline:first-child { border-top: 0; }
.tline.hd { font-size: 11px; color: var(--ink-3); letter-spacing: .05em; text-transform: uppercase; font-weight: 600; padding-block: 8px; background: var(--paper); }
.tline .rule { font-weight: 500; }
.tline .rule .src { display: block; font-weight: 400; margin-top: 2px; }
.tline .fact { color: var(--ink-2); font-size: 13px; }
.tline .pts { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
.tline.nopts { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 108px; }
.verdict { all: unset; cursor: pointer; justify-self: end; display: inline-flex; align-items: center; justify-content: center; gap: 5px; width: 98px; height: 26px; border-radius: 13px; font-size: 12px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--line); background: var(--paper); color: var(--ink-2); }
.verdict.met { background: var(--ok-soft); color: var(--ok); box-shadow: none; }
.verdict.not { background: var(--board); color: var(--ink-2); box-shadow: none; }
.verdict.unclear { background: var(--pick-soft); color: var(--pick); box-shadow: none; }
.verdict:focus-visible { outline: 2px solid var(--accent); }
.tsum { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--accent-soft); color: var(--accent-strong); font-size: 13.5px; flex-wrap: wrap; }
.tsum b { font: 400 22px/1 var(--read); font-variant-numeric: tabular-nums; }
.ev { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.evc { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 12px 13px; border-radius: 6px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.evc:hover { box-shadow: inset 0 0 0 1px var(--ink-3); }
.evc:focus-visible { outline: 2px solid var(--accent); }
.evc .th { margin: -12px -13px 4px; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px 6px 0 0; background: var(--mat); position: relative; }
.evc .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.evc .th .box { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); border-radius: 2px; }
.evc .top { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.stance { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 3px; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.stance.for { background: var(--ok-soft); color: var(--ok); }
.stance.against { background: var(--warn-soft); color: var(--warn); }
.stance.context { background: var(--board); color: var(--ink-2); }
.evc .kind { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evc .t { font-size: 13.5px; font-weight: 500; line-height: 1.3; }
