<title>Commonplace Boards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Commonplace Boards: the Commonplace Photos prototype (approved header, wall, viewer, shelves, Loci) with Boards built in.
   Everything above the "boards" section is that prototype unchanged except for small hooks marked BOARDS. */
/* Layout: the app's shell (58 px rail + main stage) with Commonplace's wall, shelves, quick view, and the proposed Photos mode, Sort mode and Loci map. Tokens are Studiolo's own (src/styles/tokens.css). */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --status-1: #c9d4f1; --status-2: #6e86d0; --status-3: #1e3e9e; --accent: #1e3e9e;
  --accent-soft: #e6ebf8; --accent-strong: #142b73;
  --float: #fbfbf9; --hover: #ecece6; --mat: #e4e4de; --scrim-blur: rgba(243, 243, 239, .74);
  --quote-paper: #faf8f2; --quote-rule: #eae5d9; --note-paper: #faf9f5;
  --warn: #9a3b2e; --warn-soft: #f6e4df; --ok: #2f6b4a;
  --pick: #b7791f; --pick-soft: #fbf3df;
  --cover-paper: #202e38; --cover-ink: #edeff6;
  --on-media: #ffffff; --media-badge: rgba(0, 0, 0, .68); --media-control: rgba(255, 255, 255, .92);
  --fs-mat: #15191c; --fs-ink: #e6e8e4;
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, .07), 0 8px 22px rgba(34, 48, 58, .09);
  --shadow-lift: 0 2px 4px rgba(34, 48, 58, .08), 0 16px 36px rgba(34, 48, 58, .15);
  --shadow-float: 0 0 0 1px transparent, 0 1px 2px rgba(34, 48, 58, .06), 0 18px 48px rgba(34, 48, 58, .16);
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --ease-in: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-q: 130ms; --dur-s: 220ms; --dur-m: 380ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
    --accent-soft: #263156; --accent-strong: #c3cff8;
    --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim-blur: rgba(19, 26, 32, .82);
    --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
    --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --pick: #e8c27a; --pick-soft: #33291a;
    --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
    --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
  --accent-soft: #263156; --accent-strong: #c3cff8;
  --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim-blur: rgba(19, 26, 32, .82);
  --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
  --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --pick: #e8c27a; --pick-soft: #33291a;
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
  --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-q: 1ms; --dur-s: 1ms; --dur-m: 1ms; } }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: flex; min-height: 100%; }
.rail { position: fixed; inset: 0 auto 0 0; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); border-right: 1px solid var(--line); background: var(--paper); z-index: 20; }
.rail .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 500 17px var(--read); margin-bottom: 20px; }
.rail button { all: unset; width: 40px; height: 36px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-2); cursor: pointer; position: relative; }
.rail button:hover { background: var(--hover); color: var(--ink); }
.rail button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.rail button:focus-visible { outline: 2px solid var(--accent); }
.rail .grow { flex: 1; }
.rail .me { width: 26px; height: 26px; border-radius: 50%; background: var(--board); font-size: 11px; font-weight: 500; display: grid; place-items: center; }
.rail svg { width: 18px; height: 18px; }
.stage { flex: 1; min-width: 0; margin-left: 58px; padding: 32px 44px 120px; padding-left: max(44px, env(safe-area-inset-left, 0px)); padding-right: max(44px, env(safe-area-inset-right, 0px)); }
.dest-head { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 14px; }
.dest-head b { color: var(--ink); font-weight: 500; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; cursor: pointer; padding: 7px 12px 9px; font-size: 13.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; border-color: var(--accent); }
.tabs button:hover { color: var(--ink); }

/* ---------- toolbar ---------- */
.toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.search { flex: 1 1 320px; min-width: 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; font: 26px/1.2 var(--read); padding: 4px 0 10px; color: var(--ink); }
.search::placeholder { color: var(--ink-2); opacity: .9; }
.search:focus { outline: none; border-color: var(--accent); }
.count { font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 4px; font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:focus-visible { outline: 2px solid var(--accent); }
.btn.line { box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.btn.primary { background: var(--accent); color: var(--paper); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.on { background: var(--accent-soft); color: var(--accent-strong); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.danger { color: var(--warn); }
.seg { display: inline-flex; background: var(--board); padding: 3px; border-radius: 8px; gap: 2px; }
.seg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 6px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(34, 48, 58, .08); }
.seg button:focus-visible { outline: 2px solid var(--accent); }
.seg svg { width: 14px; height: 14px; }

.chips { display: flex; align-items: center; gap: 4px; margin-bottom: 22px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.chip { all: unset; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 4px; font-size: 13.5px; color: var(--ink-2); white-space: nowrap; }
.chip:hover { color: var(--ink); background: var(--hover); }
.chip[aria-pressed="true"] { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.chip:focus-visible { outline: 2px solid var(--accent); }
.chip .n { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip .dot { width: 7px; height: 7px; border-radius: 2px; background: var(--status-2); }
.chips .sep { flex: none; width: 1px; height: 20px; background: var(--line); margin: 0 8px; }
.chips .lab { flex: none; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-right: 4px; }
.new { display: inline-block; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 3px; vertical-align: 1px; }

/* ---------- command row, types (redesigned header) ---------- */
.tabrow { display: flex; align-items: flex-end; gap: 12px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.tabrow .tabs { border-bottom: 0; margin-bottom: 0; flex: 1; min-width: 0; }
.selbtn { all: unset; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px 0 10px; margin-bottom: 4px; border-radius: 6px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.selbtn svg { width: 15px; height: 15px; }
.selbtn:hover { background: var(--hover); color: var(--ink); }
.selbtn:focus-visible { outline: 2px solid var(--accent); }
.selbtn.on { background: var(--accent); color: var(--paper); }
.cmd { display: flex; align-items: center; margin-bottom: 16px; }
.searchbox { flex: 1 1 100%; min-width: 0; display: flex; align-items: center; height: 50px; padding-right: 7px; border-radius: 10px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow var(--dur-q) var(--ease); }
.searchbox:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px var(--accent-soft); }
.searchbox .scope { all: unset; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 50px; padding: 0 14px 0 16px; border-right: 1px solid var(--line); border-radius: 10px 0 0 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.searchbox .scope:hover { background: var(--hover); color: var(--ink); }
.searchbox .scope:focus-visible { outline: 2px solid var(--accent); }
.searchbox .scope.on { color: var(--accent-strong); font-weight: 500; }
.adot { width: 8px; height: 8px; border-radius: 50%; background: var(--status-3); flex: none; }
.car { font-size: 10px; opacity: .7; }
.sfield { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; color: var(--ink-3); cursor: text; }
.sfield svg { width: 16px; height: 16px; flex: none; }
.sfield input { flex: 1; min-width: 0; height: 44px; border: 0; padding: 0; background: transparent; font: 19px/1.2 var(--read); color: var(--ink); }
.sfield input:focus { outline: none; }
.sfield input::placeholder { color: var(--ink-2); }
.sfield input::-webkit-search-cancel-button { display: none; }
.slash { margin-right: 12px; }
.sb-div { flex: none; width: 1px; height: 26px; background: var(--line); }
.sb-btn { all: unset; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; margin: 0 4px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.sb-btn:hover { background: var(--hover); color: var(--ink); }
.sb-btn:focus-visible, .sb-view button:focus-visible, .sb-seg button:focus-visible { outline: 2px solid var(--accent); }
.sb-view { flex: none; display: inline-flex; align-items: center; height: 34px; margin: 0 6px; border-radius: 17px; background: var(--accent-soft); color: var(--accent-strong); max-width: 260px; }
.sb-view button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 4px 0 13px; font-size: 13px; font-weight: 500; min-width: 0; }
.sb-view .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-view .x { padding: 0 12px 0 6px; font-size: 11px; opacity: .75; }
.sb-seg { flex: none; display: inline-flex; gap: 2px; padding: 3px; margin-left: 2px; border-radius: 9px; background: var(--board); }
.sb-seg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.sb-seg button:hover { color: var(--ink); }
.sb-seg button svg { width: 15px; height: 15px; }
.sb-seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(34, 48, 58, .1), 0 0 0 1px var(--line); }
.sclear { all: unset; cursor: pointer; margin-right: 10px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); font-size: 12px; }
.sclear:hover { background: var(--hover); color: var(--ink); }
.cgrow { flex: 1; }
.vmark { width: 8px; height: 10px; background: currentColor; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); opacity: .6; flex: none; }
.viewbtn { height: 34px; border-radius: 17px; }
.viewbtn button { height: 34px; }
.typebar { display: flex; align-items: center; gap: 4px; margin: 0 0 12px; padding: 2px; overflow-x: auto; scrollbar-width: none; }
.ttab { all: unset; cursor: pointer; flex: none; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 12px; border-radius: 17px; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.ttab svg { width: 15px; height: 15px; }
.ttab:hover { background: var(--hover); color: var(--ink); }
.ttab:focus-visible, .coll:focus-visible { outline: 2px solid var(--accent); }
.ttab[aria-current="true"] { background: var(--ink); color: var(--paper); }
.ttab .n { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ttab[aria-current="true"] .n { color: inherit; opacity: .6; }
.subcolls { flex: none; display: inline-flex; align-items: center; gap: 2px; margin: 0 8px 0 0; padding-right: 10px; border-right: 1px solid var(--line); }
.subcolls:last-child { border-right: 0; }
.chev { color: var(--ink-3); margin: 0 4px 0 6px; font-size: 16px; }
.coll { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.coll:hover { background: var(--hover); color: var(--ink); }
.coll[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); }
.coll .n { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.pbar .count { font-size: 12.5px; color: var(--ink-3); margin-right: 2px; }
.shelfq { flex: none; width: 210px; }
.quote.shelfq q { font-size: 15px; }
.notecard.shelfq { font-size: 14px; }
.notecard.shelfq h3 { font-size: 16px; }

/* ---------- mixed wall (today's cards) ---------- */
.mason { position: relative; display: flex; gap: 20px; align-items: flex-start; }
.mason .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.mcard { position: relative; border-radius: 6px; }
.mcard.focus-ring { outline: 2px solid var(--accent); outline-offset: 4px; }
.mcard .pic { position: relative; border-radius: 6px; overflow: hidden; background: var(--mat); box-shadow: var(--shadow-pic); transition: transform var(--dur-s) var(--ease), box-shadow var(--dur-s) var(--ease); }
.mcard .pic img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity var(--dur-m) var(--ease); }
.mcard .pic img.in { opacity: 1; }
.mcard:hover .pic { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.mcard .stack::before { content: ""; position: absolute; left: 6px; right: 6px; top: -6px; height: 10px; border-radius: 6px 6px 0 0; background: var(--line); }
.mcard .badge { position: absolute; right: 8px; bottom: 8px; background: var(--media-badge); color: var(--on-media); font-size: 11.5px; padding: 1px 6px; border-radius: 3px; }
.cap { padding: 10px 2px 0; display: flex; flex-direction: column; gap: 3px; }
.kicker { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 0; }
.mtitle { font-size: 13.5px; font-weight: 500; margin: 0; line-height: 1.3; color: var(--ink); }
.mtitle a, .mtitle button { all: unset; cursor: pointer; }
.mtitle button::after { content: ""; position: absolute; inset: 0; }
.mdesc { font-size: 12px; color: var(--ink-2); margin: 0; }
.mfoot { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
.tdot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); display: inline-block; flex: none; }
.tdot.s1 { background: var(--status-1); border-color: var(--status-1); }
.tdot.s2 { background: var(--status-2); border-color: var(--status-2); }
.paper { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); border-radius: 6px; padding: 16px; }
.quote { background: var(--quote-paper); box-shadow: inset 0 0 0 1px var(--quote-rule); border-radius: 6px; padding: 18px 18px 12px; position: relative; }
.quote::before { content: "\201C"; position: absolute; right: 14px; top: 2px; font: 44px/1 var(--read); color: var(--line); }
.quote q { display: block; font: italic 19px/1.4 var(--read); quotes: none; margin-bottom: 14px; }
.quote .src { font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--quote-rule); padding-top: 10px; }
.notecard { background: var(--note-paper); box-shadow: inset 0 0 0 1px var(--line); border-radius: 6px; padding: 16px; font: 16px/1.5 var(--read); }
.notecard h3 { font: 500 19px/1.3 var(--read); margin: 0 0 8px; }
.notecard p { margin: 0; color: var(--ink); }
.cover { background: var(--cover-paper); color: var(--cover-ink); border-radius: 4px 6px 6px 4px; padding: 22px 18px; aspect-ratio: 2 / 2.7; display: flex; flex-direction: column; justify-content: space-between; font: 22px/1.2 var(--read); box-shadow: var(--shadow-pic); }
.cover small { font: 12px var(--ui); opacity: .7; }
.video { background: var(--cover-paper); color: var(--cover-ink); border-radius: 6px; aspect-ratio: 16 / 9; position: relative; padding: 14px; display: flex; align-items: flex-end; font: 18px/1.25 var(--read); box-shadow: var(--shadow-pic); }
.video .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--status-2); }
.video .dur { position: absolute; right: 8px; bottom: 9px; background: var(--media-badge); color: #fff; font: 11.5px var(--ui); padding: 1px 6px; border-radius: 3px; }
.capture { min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; font: 17px var(--read); color: var(--ink-2); }
.capture small { font: 12px var(--ui); display: flex; justify-content: space-between; }
kbd { font: 11px var(--ui); padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink-2); }

/* ---------- photos mode ---------- */
.pbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 20px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pbar .seg { padding: 2px; }
.pbar .seg button { height: 26px; font-size: 12.5px; padding: 0 10px; }
.pbar .seg .n { color: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.pbar .seg.icons button { padding: 0 7px; }
.pbar .seg.icons svg { width: 15px; height: 15px; }
.pbar .vr { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.pbar .grow { flex: 1; }
.pbar .star { color: var(--pick); }
.fbtn { display: inline-flex; align-items: center; height: 30px; border-radius: 15px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.fbtn button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.fbtn button:hover { color: var(--ink); }
.fbtn button:focus-visible { outline: 2px solid var(--accent); }
.fbtn.on { background: var(--accent-soft); box-shadow: none; }
.fbtn.on button { color: var(--accent-strong); }
.fbtn .x { padding: 0 10px 0 0; font-size: 11px; }
.rainbow { background: conic-gradient(#b23a2c, #c99a52, #7c8452, #2f7563, #3f6f87, #6a5a8c, #b23a2c); }
.dgrid { display: grid; grid-template-columns: 70px 190px; gap: 10px 12px; align-items: center; font-size: 13px; color: var(--ink-2); }
.pop select { height: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); padding: 0 6px; font-size: 13px; color: var(--ink); width: 100%; }
.pop input[type=range] { width: 100%; accent-color: var(--accent); }
.pop .seg button { height: 28px; font-size: 12.5px; }
.swatch { width: 18px; height: 18px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); flex: none; }
.chip.active-filter { background: var(--accent-soft); color: var(--accent-strong); }
.chip.active-filter .x { opacity: .7; margin-left: 2px; }
.chip.view::before { content: ""; width: 8px; height: 10px; background: currentColor; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); opacity: .6; }
.chip.picks .star { color: var(--pick); }
.chip.unsorted[aria-pressed="false"] .n { color: var(--warn); font-weight: 600; }
.pop { position: absolute; z-index: 60; background: var(--float); border-radius: 12px; box-shadow: var(--shadow-float), inset 0 0 0 1px var(--line); padding: 14px; min-width: 240px; max-width: calc(100vw - 32px); }
.pop h4 { margin: 0 0 10px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.swgrid { display: grid; grid-template-columns: repeat(5, 32px); gap: 8px; }
.swgrid button { all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14); }
.swgrid button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.swgrid button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pop .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
.pop input[type=color] { width: 36px; height: 26px; border: 0; padding: 0; background: none; }
.pop input[type=text] { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; background: var(--paper); }
.pop .list { display: flex; flex-direction: column; max-height: 300px; overflow: auto; margin: 0 -6px; }

.pop .list .sub { padding-left: 22px; }
.pop .list .area { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 8px 8px 2px; }
.pop .list .chk { width: 14px; height: 14px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--ink-3); display: grid; place-items: center; font-size: 10px; flex: none; }
.pop .list .chk.on { background: var(--accent); box-shadow: none; color: var(--paper); }

.pwall { position: relative; user-select: none; }
.group-h { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.group-h:first-child { margin-top: 0; }
.group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.group-h .n { color: var(--ink-3); letter-spacing: 0; text-transform: none; }
.group-h .sw { display: inline-flex; gap: 3px; }
.rows .row { display: flex; gap: 8px; margin-bottom: 8px; }
.pgrid { display: grid; gap: 8px; }
.pmason { display: flex; gap: 12px; align-items: flex-start; }
.pmason .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.ph { position: relative; margin: 0; flex: none; }
.ph .pp { position: relative; overflow: hidden; border-radius: 4px; cursor: zoom-in; transition: transform var(--dur-s) var(--ease), box-shadow var(--dur-s) var(--ease); }
.ph .pp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: blur(6px); transition: opacity var(--dur-m) var(--ease), filter var(--dur-m) var(--ease); }
.ph .pp img.in { opacity: 1; filter: none; }

.ph.focused .pp { outline: 2px solid var(--accent); outline-offset: 3px; }
.ph figcaption { padding: 6px 1px 2px; font-size: 12.5px; line-height: 1.3; }

.ph figcaption span { color: var(--ink-2); font-size: 11.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.caps-hover figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px; color: var(--on-media); background: linear-gradient(transparent, rgba(0, 0, 0, .62)); border-radius: 0 0 4px 4px; opacity: 0; transition: opacity var(--dur-s) var(--ease); pointer-events: none; }
.caps-hover figcaption span { color: rgba(255, 255, 255, .8); }
.caps-hover .ph:hover figcaption { opacity: 1; }
.caps-hide figcaption { display: none; }
.star-btn { all: unset; position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--media-control); color: #8a6a2c; font-size: 14px; opacity: 0; transition: opacity var(--dur-q); cursor: pointer; z-index: 2; }
.ph:hover .star-btn, .star-btn.on, .star-btn:focus-visible { opacity: 1; }
.star-btn.on { color: #b7791f; }
.check { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--media-control); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .25); display: grid; place-items: center; color: transparent; font-size: 13px; z-index: 3; pointer-events: none; }
.selecting .check { display: grid; }
.check { display: none; }
.sel .check { background: var(--accent); color: #fff; box-shadow: none; }
.sel .pp, .sel .pic { outline: 3px solid var(--accent); outline-offset: 2px; }
.src-tag { position: absolute; left: 6px; bottom: 6px; font-size: 10.5px; padding: 1px 6px; border-radius: 3px; background: var(--media-badge); color: var(--on-media); z-index: 1; }
.pwall img, .mason img { -webkit-user-drag: none; user-select: none; }
.lasso { position: absolute; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); pointer-events: none; z-index: 5; }
.empty { padding: 60px 0; text-align: center; color: var(--ink-2); font: 18px var(--read); }

.bulk { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 16px; border-radius: 10px; background: var(--float); box-shadow: var(--shadow-float), inset 0 0 0 1px var(--line); max-width: calc(100vw - 32px); overflow-x: auto; }
.bulk .n { font-weight: 500; margin-right: 8px; white-space: nowrap; }

/* ---------- shelves ---------- */
.shelf-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
.shelf-chips .chip { box-shadow: inset 0 0 0 1px var(--line); border-radius: 15px; }
.shelf-chips .chip.dashed { box-shadow: none; outline: 1px dashed var(--ink-3); outline-offset: -1px; }
.desk { display: flex; gap: 20px; padding: 18px 22px; background: var(--panel); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); margin-bottom: 34px; flex-wrap: wrap; }
.desk .intro { flex: 0 0 200px; }
.desk .intro p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.desk h3 { margin: 0; font: 400 22px var(--read); }
.desk .k { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); font-weight: 500; }
.desk .slots { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; min-width: 0; }
.desk .slot { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); background: var(--paper); min-width: 0; }
.desk .slot .th { width: 46px; height: 56px; flex: none; border-radius: 2px; background: var(--cover-paper); }
.desk .slot div { min-width: 0; }
.desk .slot small { font-size: 11.5px; color: var(--ink-2); }
.desk .slot b { display: block; font: 400 16px var(--read); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-h { display: flex; align-items: center; gap: 14px; margin: 34px 0 20px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }
.sec-h::after { content: ""; flex: 1; height: 1px; background: var(--line); order: 1; }
.sec-h .n { order: 2; letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 12.5px; }
.shelf { display: grid; grid-template-columns: 200px 1fr; gap: 32px; margin-bottom: 40px; align-items: end; }
.shelf .meta .k { font-size: 11.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.shelf .meta h3 { font: 400 23px var(--read); margin: 4px 0 6px; }
.shelf .meta p { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.shelf .meta .acts { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-size: 13.5px; display: inline-flex; gap: 4px; align-items: center; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); }
.board { position: relative; display: flex; align-items: flex-end; gap: 6px; overflow-x: auto; padding: 14px 4px 0; border-bottom: 2px solid var(--ink); scrollbar-width: thin; min-width: 0; }
.board::after { content: ""; position: absolute; }
.print { flex: none; background: #fff; padding: 6px 6px 22px; box-shadow: var(--shadow-pic); position: relative; cursor: zoom-in; border: 0; font: inherit; text-align: left; }
.print img { display: block; object-fit: cover; }
.print span { position: absolute; left: 7px; right: 7px; bottom: 5px; font-size: 10.5px; color: #4a5560; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.print:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.print .pk { position: absolute; top: 9px; right: 9px; color: #b7791f; font-size: 12px; text-shadow: 0 0 3px rgba(0, 0, 0, .4); }
.shelf.unsorted .board { border-bottom-style: dashed; }
.spine-v { flex: none; width: 196px; }

/* ---------- quick view ---------- */
.qv { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: 1fr 380px; gap: 0; background: var(--scrim-blur); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); animation: fadeIn var(--dur-s) var(--ease); }
@keyframes fadeIn { from { opacity: 0; } }
.qv-stage { position: relative; overflow: hidden; touch-action: none; margin: 24px 0 24px 24px; display: flex; flex-direction: column; min-width: 0; }
.qv-view { position: relative; flex: 1; overflow: hidden; border-radius: 8px; }
.qv-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; box-shadow: var(--shadow-float); }
.qv-world img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.qv-view.can-pan { cursor: grab; }
.qv-view.panning { cursor: grabbing; }
.qv-view.drawing { cursor: crosshair; }
.region { position: absolute; border: calc(2px * var(--inv, 1)) solid #fff; box-shadow: 0 0 0 calc(1px * var(--inv, 1)) rgba(0, 0, 0, .55); border-radius: calc(2px * var(--inv, 1)); }
.region b { position: absolute; left: calc(-2px * var(--inv, 1)); top: calc(-2px * var(--inv, 1)); transform: translateY(-100%) scale(var(--inv, 1)); transform-origin: 0 100%; background: #fff; color: #111; font: 600 11px var(--ui); padding: 1px 6px; border-radius: 3px 3px 3px 0; white-space: nowrap; }
.region.hot { border-color: #f6dc8f; }
.region.hot b { background: #f6dc8f; }
.region.draft { border-style: dashed; }
.qv-hud { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; align-items: center; z-index: 4; padding: 4px; border-radius: 8px; background: var(--media-control); box-shadow: 0 2px 10px rgba(0, 0, 0, .12); color: #22303a; }
.qv-hud button { all: unset; cursor: pointer; height: 28px; min-width: 28px; padding: 0 6px; display: grid; place-items: center; border-radius: 5px; font-size: 12.5px; font-weight: 500; }
.qv-hud button:hover { background: rgba(34, 48, 58, .08); }
.qv-hud button[aria-pressed="true"] { background: #22303a; color: #fff; }
.qv-hud button:focus-visible { outline: 2px solid #1e3e9e; }
.qv-hud .ro { min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; font-size: 12px; color: #4a5866; }
.qv-hud .sep { width: 1px; height: 18px; background: rgba(34, 48, 58, .15); }
.qv-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--media-control); color: #22303a; display: grid; place-items: center; opacity: 0; transition: opacity var(--dur-q); z-index: 4; box-shadow: 0 2px 10px rgba(0, 0, 0, .15); }
.qv-stage:hover .qv-nav, .qv-nav:focus-visible { opacity: 1; }
.qv-nav.prev { left: 10px; } .qv-nav.next { right: 10px; }
.qv-strip { display: flex; gap: 6px; padding: 12px 0 0; overflow-x: auto; scrollbar-width: none; flex: none; }
.qv-strip button { all: unset; cursor: pointer; flex: none; width: 54px; height: 40px; border-radius: 3px; overflow: hidden; opacity: .55; transition: opacity var(--dur-q); background: var(--mat); }
.qv-strip button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.qv-strip button[aria-current="true"] { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
.qv-strip button:hover { opacity: 1; }
.qv-tip { position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); background: var(--media-badge); color: #fff; font-size: 12.5px; padding: 6px 12px; border-radius: 6px; z-index: 5; pointer-events: none; white-space: nowrap; }
.qv-panel { margin: 24px; background: var(--float); border-radius: 12px; box-shadow: var(--shadow-float), inset 0 0 0 1px var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.qv-ptop { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 0; }
.qv-ptop .k { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.icon-btn { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); }
.icon-btn.on { color: var(--pick); }
.qv-body { padding: 8px 20px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
.qv-body h2 { font: 400 26px/1.15 var(--read); margin: 0; text-wrap: balance; }
.qv-body .capt { margin: 0; font-size: 14px; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 12.5px; align-items: center; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; min-width: 0; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; background: var(--panel); }
.pill button { all: unset; cursor: pointer; color: var(--ink-3); font-size: 11px; }
.pill button:hover { color: var(--ink); }
.addbtn { all: unset; cursor: pointer; font-size: 12px; color: var(--ink-2); padding: 0 4px; }
.addbtn:hover { color: var(--accent); }
.palette { display: flex; height: 22px; border-radius: 4px; overflow: hidden; width: 100%; box-shadow: inset 0 0 0 1px var(--line); }
.palette button { all: unset; cursor: pointer; height: 100%; min-width: 10px; }
.palette button:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.palette button:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.subh { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 500; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.notes { display: flex; flex-direction: column; gap: 8px; }
.notes .note { display: flex; gap: 8px; font-size: 13.5px; padding: 8px 10px; border-radius: 6px; background: var(--note-paper); box-shadow: inset 0 0 0 1px var(--line); }
.notes .note .num { flex: none; width: 20px; height: 20px; border-radius: 4px; background: var(--ink); color: var(--paper); font-size: 11px; font-weight: 600; display: grid; place-items: center; }
.notes .note small { display: block; color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.composer { border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.composer label { font-size: 11.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.composer textarea { border: 0; background: transparent; resize: none; font: 15px/1.4 var(--read); min-height: 48px; color: var(--ink); }
.composer textarea:focus { outline: none; }
.composer .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ink-3); }
.qv-foot { border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 6px; flex-wrap: wrap; }
.keys { font-size: 11.5px; color: var(--ink-3); line-height: 1.8; }
.qv.fs { grid-template-columns: 1fr; background: var(--fs-mat); backdrop-filter: none; }
.qv.fs .qv-panel { display: none; }
.qv.fs .qv-stage { margin: 0; }
.qv.fs .qv-view { border-radius: 0; }
.qv.fs .qv-world { box-shadow: none; }
.qv.fs .qv-strip { position: absolute; left: 0; right: 0; bottom: 0; justify-content: center; padding: 10px; background: linear-gradient(transparent, rgba(0, 0, 0, .5)); opacity: 0; transition: opacity var(--dur-s); }
.qv.fs .qv-stage:hover .qv-strip { opacity: 1; }
.fs-info { display: none; }
.qv.fs .fs-info { display: block; position: absolute; left: 16px; top: 14px; color: var(--fs-ink); font-size: 13px; z-index: 4; text-shadow: 0 1px 3px rgba(0, 0, 0, .5); }
.qv.fs .fs-info b { font: 400 18px var(--read); display: block; }

/* ---------- sort mode ---------- */
.sm { position: fixed; inset: 0; z-index: 55; background: var(--paper); display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr); animation: fadeIn var(--dur-s) var(--ease); }
.sm-stage { position: relative; display: flex; flex-direction: column; padding: 24px; min-width: 0; min-height: 0; }
.sm-img { flex: 1; min-height: 0; position: relative; }
.sm-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.sm-strip { display: flex; gap: 6px; padding-top: 14px; overflow-x: auto; }
.sm-strip div { flex: none; width: 60px; height: 44px; border-radius: 3px; overflow: hidden; opacity: .45; position: relative; }
.sm-strip div.cur { opacity: 1; outline: 2px solid var(--accent); outline-offset: 1px; }
.sm-strip div.done::after { content: "\2713"; position: absolute; right: 2px; bottom: 1px; color: #fff; font-size: 11px; background: var(--ok); border-radius: 50%; width: 15px; height: 15px; display: grid; place-items: center; }
.sm-strip img { width: 100%; height: 100%; object-fit: cover; }
.sm-panel { border-left: 1px solid var(--line); background: var(--panel); padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.sm-panel h2 { margin: 0; font: 400 24px/1.2 var(--read); }
.sm-prog { height: 4px; border-radius: 2px; background: var(--board); overflow: hidden; }
.sm-prog i { display: block; height: 100%; background: var(--accent); transition: width var(--dur-m) var(--ease); }
.keychips { display: flex; flex-wrap: wrap; gap: 6px; }
.keychip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px 0 4px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); background: var(--paper); font-size: 13px; }
.keychip kbd { min-width: 18px; text-align: center; }
.keychip.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); color: var(--accent-strong); }
.keychip:focus-visible { outline: 2px solid var(--accent); }
.sm-sec h4 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; display: flex; justify-content: space-between; }
.sm-done { text-align: center; padding: 40px 0; }
.sm-done h2 { margin-bottom: 8px; }

/* ---------- loci ---------- */
.loci { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.loci-map { background: var(--board); border-radius: 10px; position: relative; overflow: hidden; }
.loci-map svg { display: block; width: 100%; height: auto; }
.loci-crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; flex-wrap: wrap; }
.loci-crumbs button { all: unset; cursor: pointer; color: var(--accent); }
.loci-crumbs button:hover { text-decoration: underline; }
.hl-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-strong); font-size: 13px; margin-bottom: 12px; flex-wrap: wrap; }
.node { cursor: pointer; }
.node text { font: 13px var(--ui); fill: var(--ink); paint-order: stroke; stroke: var(--board); stroke-width: 4px; }
.node.center text { font: 400 20px var(--read); }
.node.dim { opacity: .28; }

/* ================= render: wall ================= */
function renderWall() {
  const wall = document.getElementById("wall"); if (!wall) return;
  if (inPhotosMode()) return renderPhotoWall(wall);
  const items = wallItems();
  if (!items.length) { wall.innerHTML = `<p class="empty">Nothing here matches ${esc(filterLabel())}.<br><button class="linkbtn" data-act="resetpf" style="font:14px var(--ui);margin-top:10px">Clear filters</button></p>`; return; }
  const W = wall.clientWidth || main.clientWidth - 88;
  const cols = Math.max(1, Math.floor((W + 20) / 280));
  const groups = groupItems(items, S.mix.group);
  wall.innerHTML = groups.map((g, i) => `${g.key !== null ? `<h3 class="group-h">${esc(g.label)} <span class="n">${g.items.length}</span></h3>` : ""}<div class="mason ${S.sel.on ? "selecting" : ""}" data-g="${i}">${Array.from({ length: cols }, () => '<div class="col"></div>').join("")}</div>`).join("");
  groups.forEach((g, i) => {
    const colEls = [...wall.querySelectorAll(`.mason[data-g="${i}"] .col`)];
    const list = i === 0 && S.type === "all" && !anyFilter() && S.mix.group === "none" ? [{ type: "capture" }, ...g.items] : g.items;
    list.forEach(x => { const shortest = colEls.reduce((a, b) => b.offsetHeight < a.offsetHeight ? b : a); shortest.insertAdjacentHTML("beforeend", cardHTML(x)); });
  });
  hookImages(wall);
}
function cardHTML(x) {
  const topic = (x.topics || [])[0]; const more = (x.topics || []).length - 1;
  const foot = topic ? `<div class="mfoot"><span class="tdot s${T[topic].status}"></span>${esc(T[topic].name)}${more > 0 ? ` <span>+${more}</span>` : ""}</div>` : "";
  const selc = S.sel.ids.has(x.id) ? "sel" : "";
  if (x.type === "board") return bWallCard(x, selc); // BOARDS
  if (x.type === "capture") return `<div class="mcard paper capture"><span>Capture a thought, quote or link…</span><small><span>Note · Quote · Link</span><span>Press <kbd>C</kbd></span></small></div>`;
  if (x.type === "photo") {
    const r = ratioOf(x), bucket = r > 1.4 ? 3 / 2 : r < .9 ? 3 / 4 : 4 / 3; // today: three crop buckets
    const albumN = x.album && collapseAlbums() ? PHOTOS.filter(p => p.album === x.album).length : 0;
    const title = albumN ? ALBUMS[x.album] : x.title;
    return `<article class="mcard ${selc}" data-id="${x.id}" ${albumN ? `data-album="${x.album}"` : ""}>
      <div class="pic ${albumN ? "stack" : ""}" style="aspect-ratio:${bucket};background:${x.palette[0].hex}"><img data-src="${thumb(x)}" alt="${esc(x.title)}">${albumN ? `<span class="badge">${albumN} photos</span>` : ""}<span class="check">✓</span></div>
      <div class="cap"><p class="kicker">${esc(kindName(x.kind))}</p><h2 class="mtitle"><button data-act="open" data-id="${x.id}">${esc(title)}</button></h2>${x.caption ? `<p class="mdesc">${esc(x.caption)}</p>` : ""}${foot}</div></article>`;
  }
  const wrap = (inner, kicker = "") => `<article class="mcard ${selc}" data-id="${x.id}">${inner}${kicker}</article>`;
  if (x.type === "question") return wrap(`<div class="notecard"><p class="kicker" style="color:var(--pick);margin-bottom:6px">? Question</p><p>${esc(x.text)}</p></div><div class="cap">${foot}</div>`);
  if (x.type === "quote") return wrap(`<div class="quote"><q>${esc(x.text)}</q><div class="src">${esc(x.src)}</div></div><div class="cap">${foot}</div>`);
  if (x.type === "note") return wrap(`<div class="notecard"><p>${esc(x.text)}</p></div><div class="cap">${foot}</div>`);
  if (x.type === "longnote") return wrap(`<div class="notecard"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p></div><div class="cap"><p class="kicker">Notes</p>${foot}</div>`);
  if (x.type === "book") return wrap(`<div class="cover">${esc(x.title)}<small>${esc(x.creator)}</small></div><div class="cap"><p class="kicker">Books</p><h2 class="mtitle">${esc(x.title)}</h2><p class="mdesc">${esc(x.creator)} · Reading</p>${foot}</div>`);
  if (x.type === "video") return wrap(`<div class="video">${esc(x.title)}<span class="dur">${x.dur}</span>${x.prog ? `<span class="prog" style="width:${x.prog * 100}%"></span>` : ""}</div><div class="cap"><p class="kicker">Lectures</p><h2 class="mtitle">${esc(x.title)}</h2><p class="mdesc">${esc(x.creator)}</p>${foot}</div>`);
  if (x.type === "link") return wrap(`<div class="paper"><p class="kicker">${esc(x.site)}</p><h3 style="font:400 19px/1.3 var(--read);margin:6px 0">${esc(x.title)}</h3><p class="mdesc">${esc(x.desc)}</p></div><div class="cap"><p class="kicker">Links</p>${foot}</div>`);
  return "";
}
function hookImages(root) {
  root.querySelectorAll("img[data-src]").forEach(img => {
    const src = img.dataset.src; img.removeAttribute("data-src");
    const done = () => { img.classList.add("in"); loaded.add(src); };
    img.onload = done;
    if (loaded.has(src)) { img.src = src; if (img.complete) done(); }
    else setTimeout(() => { img.src = src; }, 120 + Math.random() * 650); // shows each photo's own colour while it loads
  });
}
function renderPhotoWall(wall) {
  const list = sortPhotos(photoFilter());
  if (!list.length) { wall.innerHTML = `<p class="empty">No photos match ${esc(filterLabel())}.<br><button class="linkbtn" data-act="resetpf" style="font:14px var(--ui);margin-top:10px">Clear filters</button></p>`; return; }
  const groups = groupPhotos(list);
  const W = Math.floor(wall.clientWidth || (main.clientWidth - 88));
  const caps = S.ph.caps, size = S.ph.size;
  let html = `<div class="pwall caps-${caps} ${S.sel.on ? "selecting" : ""}" id="pwall">`;
  for (const g of groups) {
    if (g.key !== null) html += `<h3 class="group-h">${g.extra ? `<span class="swatch" style="background:${g.extra};width:12px;height:12px"></span>` : ""}${esc(g.label)} <span class="n">${g.items.length}</span></h3>`;
    html += layoutHTML(g.items, W, size, caps);
  }
  wall.innerHTML = html + "</div>";
  hookImages(wall);
  if (S.focus) wall.querySelector(`.ph[data-id="${S.focus}"]`)?.classList.add("focused");
}
function phHTML(p, w, h, caps) {
  const meta = [kindName(p.kind), p.topics[0] ? T[p.topics[0]].name : "No topic yet"].join(" · ");
  return `<figure class="ph ${S.sel.ids.has(p.id) ? "sel" : ""}" data-id="${p.id}" style="width:${w}px">
    <div class="pp" style="height:${h}px;background:${p.palette[0].hex}" data-act="open" data-id="${p.id}" role="button" tabindex="0" aria-label="${esc(p.title)}">
      <img data-src="${thumb(p)}" alt="">${p.source ? `<span class="src-tag">${esc(p.source.site)}</span>` : ""}<span class="check">✓</span>
    </div>
    <button class="star-btn ${p.picked ? "on" : ""}" data-act="pick" data-id="${p.id}" aria-label="${p.picked ? "Unpick" : "Pick"} ${esc(p.title)}" aria-pressed="${p.picked}">${p.picked ? "★" : "☆"}</button>
    ${caps !== "hide" ? `<figcaption><b>${esc(p.title)}</b><span>${esc(meta)}</span></figcaption>` : ""}
  </figure>`;
}
function layoutHTML(items, W, size, caps) {
  const capH = caps === "show" ? 40 : 0;
  if (S.ph.layout === "grid") {
    const cols = Math.max(2, Math.floor((W + 8) / (size + 8))); const cw = Math.floor((W - 8 * (cols - 1)) / cols);
    return `<div class="pgrid" style="grid-template-columns:repeat(${cols},${cw}px)">${items.map(p => phHTML(p, cw, cw, caps)).join("")}</div>`;
  }
  if (S.ph.layout === "masonry") {
    const cols = Math.max(2, Math.floor((W + 12) / (size + 12))); const cw = Math.floor((W - 12 * (cols - 1)) / cols);
    const colH = new Array(cols).fill(0), colHtml = new Array(cols).fill("");
    for (const p of items) { const r = Math.min(3, Math.max(1 / 3, ratioOf(p))); const h = Math.round(cw / r); const i = colH.indexOf(Math.min(...colH)); colHtml[i] += phHTML(p, cw, h, caps); colH[i] += h + capH + 12; }
    return `<div class="pmason">${colHtml.map(c => `<div class="col">${c}</div>`).join("")}</div>`;
  }
  // Rows: justified, every photo whole, edges line up (Eagle / Flickr style).
  const gap = 8, target = size; let out = "", row = [], sum = 0;
  const flush = (last) => {
    if (!row.length) return;
    const avail = W - gap * (row.length - 1);
    let h = avail / sum; if (last && h > target * 1.25) h = target;
    h = Math.min(h, target * 2.2);
    out += `<div class="row">${row.map(p => phHTML(p, Math.floor(h * Math.min(3, Math.max(1 / 3, ratioOf(p)))), Math.round(h), caps)).join("")}</div>`;
    row = []; sum = 0;
  };
  for (const p of items) { row.push(p); sum += Math.min(3, Math.max(1 / 3, ratioOf(p))); if (sum * target + gap * (row.length - 1) >= W) flush(false); }
  flush(true);
  return `<div class="rows">${out}</div>`;
}

/* ================= render: shelves ================= */
function shelvesHTML() {
  const printOf = p => { const portrait = p.h > p.w; const w0 = portrait ? 112 : 158; let w = w0, h = w0 * p.h / p.w; if (h > 150) { h = 150; w = 150 * p.w / p.h; } return `<button class="print" data-act="open" data-id="${p.id}" aria-label="${esc(p.title)}"><img src="${thumb(p)}" alt="" style="width:${Math.round(w)}px;height:${Math.round(h)}px;background:${p.palette[0].hex}" loading="lazy"><span>${esc(p.title)}</span>${p.picked ? '<i class="pk">★</i>' : ""}</button>`; };
  const shelf = (k, name, sub, inner, extra = "", cls = "") => `<div class="shelf ${cls}"><div class="meta"><span class="k"><span class="swatch" style="width:9px;height:9px;border-radius:2px;background:var(--status-2)"></span>${k}</span><h3>${name}</h3><p>${sub}</p><div class="acts">${extra}</div></div><div class="board">${inner}</div></div>`;

  const show = t => S.type === "all" || S.type === t;

  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  let html = "";
  if (S.type === "all" || S.type === "photo") {
    const unsorted = PHOTOS.filter(p => !p.topics.length);
    html += `<div class="desk"><div class="intro"><span class="k">On the desk</span><h3>Open right now</h3><p>What you are reading, watching or sorting. It goes back on its shelf when you mark it done.</p></div>
    <div class="slots"><div class="slot"><div class="th"></div><div><small>Reading · Books</small><b>Islamic Architecture: Form, Function and Meaning</b><small>Page 112</small></div></div>
    <div class="slot"><div class="th" style="width:70px;height:40px"></div><div><small>Watching · Lectures</small><b>The Great Mosque of Córdoba</b><small>Resume at 10:30</small></div></div>
    ${unsorted.length ? `<div class="slot" style="cursor:pointer" data-act="sortmode"><img src="${thumb(unsorted[0])}" alt="" style="width:46px;height:56px;object-fit:cover;border-radius:2px;flex:none"><div><small>Sorting · Photos <span class="new">new</span></small><b>${unsorted.length} unsorted photos</b><small>Sort them with the keyboard</small></div></div>` : ""}</div></div>`;
  }
  if (show("note")) {
    const notes = pool("note"), quotes = notes.filter(x => x.type === "quote"), refl = notes.filter(x => x.coll === "reflections"), loose = notes.filter(x => x.type !== "quote" && !x.coll);
    const qcard = x => `<div class="quote shelfq"><q>${esc(x.text)}</q><div class="src">${esc(x.src)}</div></div>`;
    const ncard = x => `<div class="notecard shelfq">${x.title ? `<h3>${esc(x.title)}</h3>` : ""}<p>${esc(x.text)}</p></div>`;
    html += `<h2 class="sec-h">Notes <span class="n">${plural(notes.length, "note", "notes")}</span></h2>`;
    if (refl.length) html += shelf("Notes", "Reflections", plural(refl.length, "note", "notes"), refl.map(ncard).join(""), openShelf);
    if (quotes.length) html += shelf("Notes · Quote style", "Quotes", plural(quotes.length, "quote", "quotes"), quotes.map(qcard).join(""), openShelf);
    if (loose.length) html += shelf("Notes", "Not on a shelf", plural(loose.length, "note", "notes"), loose.map(ncard).join(""), "", "unsorted");
  }
  if (show("source")) {
    const src = pool("source");
    const face = x => x.type === "video" ? `<div style="flex:none;width:196px"><div class="video" style="font-size:14px">${esc(x.title)}<span class="dur">${x.dur}</span>${x.prog ? `<span class="prog" style="width:${x.prog * 100}%"></span>` : ""}</div><p class="mdesc" style="padding:6px 0 4px">${esc(x.title)}</p></div>`
      : x.type === "book" ? `<div class="cover" style="flex:none;width:118px;font-size:14px;padding:12px 10px">${esc(x.title)}<small>${esc(x.creator)}</small></div>`
      : `<div class="paper" style="flex:none;width:210px"><p class="kicker">${esc(x.site)}</p><p style="font:400 16px/1.3 var(--read);margin:6px 0 0">${esc(x.title)}</p></div>`;
    html += `<h2 class="sec-h">Sources <span class="n">${plural(src.length, "source", "sources")}</span></h2>`;
    COLLS.filter(c => c.type === "source").forEach(c => { const items = src.filter(x => x.coll === c.id); if (items.length) html += shelf("Sources", c.name, plural(items.length, "item", "items"), items.map(face).join(""), openShelf); });

  const centreId = L.focus === "root" ? null : L.focus;
  const kids = TOPICS.filter(t => t.parent === (centreId || null));
  const crumbs = centreId ? ancestors(centreId).reverse() : [];
  const hl = L.hl, isHot = id => !hl || descendants(id).some(d => hl.ids.has(d));
  const W = 820, H = 560, cx = 285, cy = 280;
  const R = Math.min(140, Math.max(105, 80 + 12 * kids.length));
  const short = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;
  const nodeR = t => t.status === 2 ? "var(--status-2)" : t.status === 1 ? "var(--status-1)" : "none";
  let svg = "";
  const kp = centreId ? keyPicture(centreId) : null;
  kids.forEach((t, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / kids.length, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    svg += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1.5" class="${isHot(t.id) ? "" : "dim"}"/>`;
  });
  kids.forEach((t, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / kids.length, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    const n = photosUnder(t.id).length, hot = hl && isHot(t.id);
    const lx = Math.cos(a) >= -.2 ? x + 14 : x - 14, anchor = Math.cos(a) >= -.2 ? "start" : "end";
    svg += `<g class="node ${isHot(t.id) ? "" : "dim"}" tabindex="0" role="button" aria-label="${esc(t.name)}" data-act="lfocus" data-t="${t.id}">
      ${hot ? `<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="var(--accent)" stroke-width="2.5"/>` : ""}
      <circle class="dotc" cx="${x}" cy="${y}" r="7" fill="${nodeR(t)}" stroke="${t.status ? "none" : "var(--ink-3)"}" stroke-width="1.5"/>
      <text x="${lx}" y="${y + 4}" text-anchor="${anchor}"><title>${esc(t.name)}</title>${esc(short(t.name, 20))}${n ? ` · ${n}` : ""}</text>${bBadge(t.id, x, y)}</g>`;
  });
  if (centreId) {
    const cr = L.centrePic && kp ? 34 : 14;
    svg += `<g class="node center"><defs><clipPath id="cclip"><circle cx="${cx}" cy="${cy}" r="${cr}"/></clipPath></defs>
      ${L.centrePic && kp ? `<image href="${thumb(kp.p)}" x="${cx - cr}" y="${cy - cr}" width="${cr * 2}" height="${cr * 2}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cclip)"/><circle cx="${cx}" cy="${cy}" r="${cr}" fill="none" stroke="var(--status-3)" stroke-width="3"/>` : `<circle class="dotc" cx="${cx}" cy="${cy}" r="${cr}" fill="var(--status-3)"/>`}
      <text x="${cx}" y="${cy + cr + 26}" text-anchor="middle">${esc(f.name)}</text></g>`;
    // In your Commonplace lane
    const lane = photosUnder(centreId).slice(0, 7);
    if (lane.length) {
      svg += `<text x="612" y="${cy - lane.length * 20 - 10}" style="font:11px var(--ui);letter-spacing:.08em;fill:var(--ink-2)">IN YOUR COMMONPLACE</text>`;
      lane.forEach((p, i) => { const y = cy - lane.length * 20 + i * 40; svg += `<g class="lane-card" data-act="open" data-id="${p.id}" data-open-from="${p.id}" tabindex="0" role="button" aria-label="${esc(p.title)}"><rect class="bg" x="612" y="${y}" width="196" height="34" rx="4"/><clipPath id="lc${i}"><rect x="614" y="${y + 2}" width="30" height="30" rx="3"/></clipPath><image href="${thumb(p)}" x="614" y="${y + 2}" width="30" height="30" preserveAspectRatio="xMidYMid slice" clip-path="url(#lc${i})"/><text x="652" y="${y + 21}">${esc(short(p.title, 22))}</text></g>`; });
      const more = photosUnder(centreId).length - lane.length; if (more > 0) svg += `<text x="652" y="${cy - lane.length * 20 + lane.length * 40 + 16}" style="font:12px var(--ui);fill:var(--accent);cursor:pointer" data-act="seeall" data-t="${centreId}">+ ${more} more</text>`;
    }
  } else {
    svg += `<text x="${cx}" y="${cy + 5}" text-anchor="middle" style="font:400 18px var(--read);fill:var(--ink-2)">Everything you know</text>`;
  }
  const insp = centreId ? inspectorHTML(centreId) : `<div class="inspector"><span class="k">Overview</span><h2>Your areas</h2><p style="margin:0;color:var(--ink-2);font-size:13px">Choose an area to see its topics, its key picture and the photos you have collected for it.</p></div>`;
  main.innerHTML = `<div class="dest-head"><b>Loci</b><span>/</span><span>Map</span></div>
    <div class="tabs" role="tablist">${["Palace", "Map", "List", "Overview"].map(t => `<button role="tab" aria-selected="${t === "Map"}" ${t !== "Map" ? `data-act="toast" data-msg="Only the Map is in this prototype. In the Palace, an open room would draw these photos as small prints."` : ""}>${t}</button>`).join("")}</div>
    ${hl ? `<div class="hl-bar"><span>Showing topics that hold <b>${hl.n}</b> ${TYPES.find(t => t.id === hl.type).many} matching <b>${esc(hl.label)}</b></span><span style="flex:1"></span><button class="btn small" data-act="backtophotos">Back to Commonplace</button><button class="btn small" data-act="clearhl">Clear</button></div>` : ""}
    <div class="loci-crumbs"><button data-act="lfocus" data-t="root">Overview</button>${crumbs.map(c => ` / <button data-act="lfocus" data-t="${c}">${esc(T[c].name)}</button>`).join("")}
      <span style="flex:1"></span><label style="display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)"><input type="checkbox" id="centrepic" ${L.centrePic ? "checked" : ""}> Key picture in the centre <span class="new">new</span></label></div>
    <div class="loci"><div class="loci-map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of ${esc(f?.name || "your areas")}">${svg}</svg></div>${insp}</div>`;
  updateCount();
}
function inspectorHTML(tid) {
  const t = T[tid], kp = keyPicture(tid), ph = photosUnder(tid), pal = topicPalette(tid);

    <span class="status"><span class="tdot s${t.status}"></span>${status} · ${ph.length} photo${ph.length === 1 ? "" : "s"}</span>
    ${kp ? `<button class="keypic" data-act="open" data-id="${kp.p.id}" data-open-from="${kp.p.id}" aria-label="Open ${esc(kp.p.title)}"><img src="${thumb(kp.p)}" alt=""><span>${kp.why}</span></button>` : `<div class="keypic" style="display:grid;place-items:center;color:var(--ink-3);font-size:13px;cursor:default">No photos on this topic yet</div>`}
    ${mood.length ? `<div><div class="kicker" style="font-size:11px;margin-bottom:6px">Mood <span class="new">new</span></div><div class="mood">${mood.map(p => `<button data-act="open" data-id="${p.id}" data-open-from="${p.id}" aria-label="${esc(p.title)}"><img src="${thumb(p)}" alt=""></button>`).join("")}</div></div>` : ""}
    ${pal.length ? `<div><div class="kicker" style="font-size:11px;margin-bottom:6px">Colours of this topic</div><div class="palette">${pal.map(x => `<button style="flex:${x.share};background:${x.c.hex}" data-act="topiccolour" data-t="${tid}" data-c="${x.c.id}" title="${x.c.name}: open these photos" aria-label="${x.c.name} photos"></button>`).join("")}</div><p class="keys" style="margin:6px 0 0">From the photos' own colours. Nodes keep their status colours.</p></div>` : ""}
    ${ph.length ? `<button class="btn line" data-act="seeall" data-t="${tid}">See all ${ph.length} photos →</button>` : ""}
    ${bLociHTML(tid)}

/* ================= popovers ================= */
let popEl = null;
function closePop() { popEl?.remove(); popEl = null; }
function openPop(anchor, html, onClick) {
  closePop(); popEl = document.createElement("div"); popEl.className = "pop"; popEl.setAttribute("role", "dialog"); popEl.innerHTML = html; document.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect(), pw = popEl.offsetWidth, ph = popEl.offsetHeight;
  let left = Math.min(window.innerWidth - pw - 16, Math.max(16, r.left)), top = r.bottom + 6; if (top + ph > window.innerHeight - 10) top = Math.max(10, r.top - ph - 6);
  popEl.style.left = left + "px"; popEl.style.top = top + window.scrollY + "px"; popEl.style.position = "absolute";
  popEl.addEventListener("click", e => { const b = e.target.closest("[data-pv]"); if (b) { e.stopPropagation(); onClick(b.dataset.pv, b, e); } });
  (popEl.querySelector("input,button") || popEl).focus?.();
}
function topicListHTML(checked = [], withSearch = true) {
  const rows = []; const walk = (id, depth) => TOPICS.filter(t => t.parent === id).forEach(t => { if (!t.parent) rows.push(`<div class="area">${esc(t.name)}</div>`); else rows.push(`<button data-pv="${t.id}" class="${depth > 1 ? "sub" : ""}"><span class="chk ${checked.includes(t.id) ? "on" : ""}">${checked.includes(t.id) ? "✓" : ""}</span>${esc(t.name)}</button>`); walk(t.id, depth + 1); });
  walk(null, 0);
  return `${withSearch ? `<input type="text" placeholder="Find a topic" id="tsearch" aria-label="Find a topic" style="margin-bottom:8px">` : ""}<div class="list" id="tlist">${rows.join("")}</div>`;
}
function hookTopicSearch() { const s = document.getElementById("tsearch"); s?.addEventListener("input", () => { const q = s.value.toLowerCase(); document.querySelectorAll("#tlist button").forEach(b => b.hidden = !b.textContent.toLowerCase().includes(q)); }); s?.focus(); }

/* ================= actions ================= */
function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 2600); }
function savePrefs() { store.set("prefs", S.ph); }

function enterPhotos(f) { S.dest = "commonplace"; S.view = "wall"; S.type = "photo"; S.pf = { ...FDEF, ...f }; render(); window.scrollTo(0, 0); }
function togglePick(id) { const p = BY[id]; p.picked = !p.picked; toast(p.picked ? `Picked “${p.title}”.` : `Unpicked “${p.title}”.`); }
function selectedIds() { return [...S.sel.ids].flatMap(id => BY[id]?.type === "photo" && BY[id].album && collapseAlbums() && document.querySelector(`[data-album="${BY[id].album}"]`) ? PHOTOS.filter(p => p.album === BY[id].album).map(p => p.id) : [id]); }
function renderBulk() {
  document.querySelector(".bulk")?.remove(); if (!S.sel.on || S.dest !== "commonplace") return;
  const n = selectedIds().length; const el = document.createElement("div"); el.className = "bulk"; el.setAttribute("role", "toolbar"); el.setAttribute("aria-label", "Selection");
  el.innerHTML = n ? `<span class="n">${n} selected</span><button class="btn small" data-act="bulktopic">Add topics…</button><button class="btn small" data-act="bulkkind">Set kind…</button><button class="btn small" data-act="bulkpick">★ Pick</button><button class="btn small" data-act="bulksort">Sort these</button><button class="btn small danger" data-act="bulkdelete">Delete…</button><button class="btn small" data-act="selnone">Clear</button>`
    : `<span class="n">Select photos</span><span style="font-size:12.5px;color:var(--ink-2);padding-right:10px">Click, Shift-click a range, or drag a box on the wall.</span>`;

}
function showOnLoci() {
  const list = itemFilter(); const ids = new Set(list.flatMap(p => p.topics.flatMap(ancestors)));
  S.loci.hl = { ids, label: anyFilter() || S.type !== "all" ? filterLabel() : "everything", n: list.length, type: S.type, area: S.area, f: { ...S.pf } }; S.loci.focus = "a1"; S.dest = "loci"; S.sel.on = false; render(); window.scrollTo(0, 0);
}

document.addEventListener("click", e => {
  if (popEl && !popEl.contains(e.target) && !e.target.closest("[data-act$=pop],[data-act=qvtopic],[data-act=qvkind],[data-act=qvmenu],[data-act=saveview],[data-act=bulktopic],[data-act=bulkkind],[data-act=bulkdelete],[data-act=smpicker]")) closePop();
  const card = S.sel.on && S.dest === "commonplace" && !S.qv && e.target.closest("#wall article.mcard[data-id]");
  if (card && !e.target.closest("[data-act]")) { toggleSel(card.dataset.id, e.shiftKey); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  // selection mode intercepts card clicks
  if (S.sel.on && (a === "open") && S.dest === "commonplace") { e.preventDefault(); toggleSel(id, e.shiftKey); return; }
  switch (a) {
    case "dest": S.dest = b.dataset.dest; if (S.dest === "commonplace") S.loci.hl = null; S.sel.on = false; render(); renderBulk(); window.scrollTo(0, 0); break;
    case "theme": { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; break; }

    case "stylepop": openPop(b, listPopHTML("Style", "style", STYLES), v => { const [k, val] = v.split(":"); S.pf[k] = val || null; S.pf.view = null; closePop(); render(); }); break;
    case "clear": if (b.dataset.k === "more") { S.pf.shape = null; S.pf.light = null; } else S.pf[b.dataset.k] = null; S.pf.view = null; render(); break;

    case "topicpop": openPop(b, `<h4>Topic</h4>${topicListHTML(S.pf.topic ? [S.pf.topic] : [])}`, v => { S.pf.topic = S.pf.topic === v ? null : v; S.pf.view = null; closePop(); render(); }); hookTopicSearch(); break;
    case "saveview": openSaveView(b); break;

<script>
"use strict";
/* ================= LOCI: the app's own Palace and Map, with Boards =================
   The Palace is Studiolo's PalaceEngine and the Map is Studiolo's GraphMap, both bundled from studiolo main @ 6f8d396
   (see loci/README.md). This script only feeds them the prototype's data and draws the chrome around them with the app's
   own class names (palace.css, graph.css). A board is a Commonplace item: a square in its area's Commonplace stack,
   tagged on its place. Opened, its cards orbit it, each tied to the topics it is about, and its arrows run between them;
   Lumens made from it hang off it. On the Map it sits in the "In your Commonplace" lane, and a Lumen made from it is
   "From board" in the Lumens lane, with ▶ on the board's card. Everything else (key picture, mood, colours) is the photo
   roadmap's Phase 7 inspector, unchanged. */
(() => {
  const LP = window.LociPalace, BX = window.BX, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const STATUS = ["not_started", "learning", "learned"];
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const RELS = [
    { id: "r1", topicAId: "t1b", topicBId: "t3", explanation: "Light through a roof of columns" },
    { id: "r2", topicAId: "t4a", topicBId: "t2b", explanation: "Brick screens shade a wall" },
    { id: "r3", topicAId: "s2", topicBId: "e2", explanation: "Precast panels are both structure and skin" },
  ];
  const L = S.loci; L.tab ||= "palace"; L.extra ??= null; L.trail ||= []; L.focus = L.focus || "t2";
  if (L.focus === "a1" && !L.trail.length) L.focus = "t2";
  let engine = null, mapMounted = false;

  /* ---------- data: the map, the rooms, the lanes ---------- */
  const relations = () => [...RELS, ...BX.U.links.map((k, i) => { const [a, b] = k.split("|"); return { id: "u" + i, topicAId: a, topicBId: b, explanation: "From an arrow on your board", version: 1 }; })];
  const graph = () => ({ topics: TOPICS.map((t, i) => ({ id: t.id, parentId: t.parent, name: t.name, description: "", status: STATUS[t.status ?? 0], wantToLearn: t.id === "t2", sortOrder: i, version: 1 })), relations: relations() });
  let scene = LP.buildScene(graph());
  const kindLabel = x => x.type === "photo" ? "Photo" : x.type === "board" ? "Board" : x.type === "quote" ? "Quote" : x.type === "question" ? "Question" : ["note", "longnote"].includes(x.type) ? "Note" : x.type === "video" ? "Lecture" : x.type === "book" ? "Book" : "Link";
  const stamp = x => new Date((x.added || Date.parse(x.date)) || 0).toISOString();
  function roomOf(areaId) {
    const inArea = x => (x.topics || []).some(t => areaOf(t) === areaId);
    const items = ALL_ITEMS().filter(inArea).sort((a, b) => (b.added || 0) - (a.added || 0))
      .map(x => ({ id: x.id, title: titleOf(x), kindLabel: kindLabel(x), createdAt: stamp(x), topicIds: x.topics.filter(t => T[t]), opens: "quick" }));
    const lumens = Object.values(BX.LUMENS).filter(l => !l.course && l.state !== "making").map(l => ({ id: l.id, kind: "lumen", title: l.title, createdAt: l.fromBoard ? new Date().toISOString() : "2026-10-19T00:00:00Z", anchor: l.fromBoard ? { kind: "item", itemId: l.fromBoard } : { kind: "topic", topicId: l.topics[0] }, partTopicIds: [], partCount: 0, parts: [] }))
      .concat(Object.values(BX.COURSES).map(c => ({ id: c.id, kind: "course", title: c.title, createdAt: "2026-10-12T00:00:00Z", anchor: { kind: "topic", topicId: c.topics[0] }, partTopicIds: c.parts.map(p => (BX.LUMENS[p].topics || [])[0]).filter(Boolean), partCount: c.parts.length, parts: c.parts.map(p => ({ title: BX.LUMENS[p].title, topicId: (BX.LUMENS[p].topics || [])[0] || null, explainerId: p, finished: true })) })))
      .filter(l => { const tid = l.anchor.kind === "topic" ? l.anchor.topicId : BY[l.anchor.itemId]?.topics?.[0]; return tid && areaOf(tid) === areaId; })
      .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    return { areaId, items, itemTotal: items.length, lumens, lumenTotal: lumens.length };
  }
  const nodeArea = id => scene.byId.get(id)?.areaId || null;

  /* ---------- an open board in the Palace: its cards orbit it, its arrows run between them ---------- */
  function boardExtras(openId, room) {
    const ref = openId && LP.parseExtraId(openId); if (!ref || ref.kind !== "item" || BY[ref.id]?.type !== "board") return LP.NO_EXTRAS;
    const b = BY[ref.id], areaId = room.areaId, nodes = [], links = [], idOf = {}, have = new Set([openId]);
    const base = (id, name, kind, radius) => ({ id, kind, name, level: 3, status: "not_started", focus: false, parentId: null, areaId, weight: 0, radius, slot: { kind: "near", anchorId: openId } });
    for (const c of b.cards.filter(BX.isContent)) {
      const x = BX.item(c.ref); if (!x) continue;
      if (x.type === "topic") { links.push({ a: openId, b: x.topic.id, kind: "serves", why: null }); continue; }
      let id;
      if (x.type === "lumen") id = `lumen:${x.id}`; else if (x.type === "course") id = `course:${x.id}`;
      else if (BY[c.ref]) id = `item:${c.ref}`; else if (x.type === "detail") id = `item:${x.photo.id}`; else continue;
      idOf[c.id] = id; if (have.has(id)) continue; have.add(id);

      nodes.push({ ...base(id, BX.nameOf(x), id.split(":")[0], id.startsWith("item") ? 4 + .55 * Math.min(4, tps.length) : id.startsWith("course") ? 6.6 : 5.6), slot: { kind: "near", anchorId: tps[0] || openId } });
      links.push({ a: id, b: openId, kind: "holds", why: null });
      tps.forEach(t => links.push({ a: id, b: t, kind: "serves", why: null }));
    }
    for (const a of b.arrows) { const A = idOf[a.a], B = idOf[a.b]; if (A && B && A !== B) links.push({ a: A, b: B, kind: "related", why: [a.verb, a.why].filter(Boolean).join(": ") || null }); }
    Object.values(BX.LUMENS).filter(l => l.fromBoard === b.id && l.state !== "making").forEach(l => { const id = `lumen:${l.id}`; if (have.has(id)) return; have.add(id); nodes.push(base(id, l.title, "lumen", 5.6)); links.push({ a: id, b: openId, kind: "serves", why: null }); });
    return { nodes, links };
  }
  function current() {
    const ref = L.extra ? LP.parseExtraId(L.extra) : null;
    const areaId = ref?.kind === "stack" ? ref.areaId : L.extra ? L.extraArea : (L.focus ? nodeArea(L.focus) : null);
    const room = areaId ? roomOf(areaId) : null, openId = L.extra || L.focus || null;
    const extras = room ? LP.combineExtras(LP.roomExtras(scene, room, { openId, roomAreaId: areaId }), boardExtras(openId, room)) : LP.NO_EXTRAS;
    return { ref, areaId, room, openId, extras };
  }
  function memberOf(room, id) {
    const r = LP.parseExtraId(id); if (!r || !room) return null;
    if (r.kind === "item") return room.items.find(i => i.id === r.id) || null;
    if (r.kind === "lumen" || r.kind === "course") return room.lumens.find(l => l.id === r.id && l.kind === r.kind) || null;
    return null;
  }

  /* ---------- opening and going back (the app's openThing and goBack, without the copilot) ---------- */
  function openThing(id) {
    const ref = LP.parseExtraId(id);
    if (ref && ref.kind !== "ghost") {
      const cur = current();
      const area = ref.kind === "stack" ? ref.areaId : (cur.areaId || nodeArea((BY[ref.id]?.topics || [])[0]));
      L.extra = id; L.extraArea = area; L.trail = LP.pushTrail(L.trail, id); if (area) L.focus = L.focus && nodeArea(L.focus) === area ? L.focus : area;
      if (ref.kind === "lumen" && BX.LUMENS[ref.id]) BX.play(ref.id);
    } else if (scene.byId.has(id)) { L.extra = null; L.trail = LP.pushTrail(L.trail, id); L.focus = id; }
    refresh();
  }
  function goBack() {
    const { trail, openId } = LP.backTrail(L.trail); L.trail = trail;
    const ref = openId ? LP.parseExtraId(openId) : null;
