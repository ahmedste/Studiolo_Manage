    refresh();
  }
  function goHome() { L.trail = []; L.extra = null; L.focus = null; refresh(); }

  /* ---------- the page ---------- */
  window.renderLoci = function renderLoci() {
    if (engine) { engine.destroy(); engine = null; } mapMounted = false;
    scene = LP.buildScene(graph());
    const hl = L.hl;
    main.innerHTML = `<div class="dest-head"><b>Loci</b><span>/</span><span>${L.tab === "map" ? "Map" : "Palace"}</span></div>
      <div class="tabs" role="tablist">${[["palace", "Palace"], ["map", "Map"], ["list", "List"], ["overview", "Overview"]].map(([k, t]) => `<button role="tab" aria-selected="${L.tab === k}" data-act="lx-tab" data-t="${k}">${t}</button>`).join("")}</div>
      ${hl ? `<div class="hl-bar"><span>Glowing on the map: topics that hold <b>${hl.n}</b> ${TYPES.find(t => t.id === hl.type).many} matching <b>${esc(hl.label)}</b></span><span style="flex:1"></span><button class="btn small" data-act="backtophotos">Back to Commonplace</button><button class="btn small" data-act="clearhl">Clear</button></div>` : ""}
      <div class="lx">
        <div class="lx-stage loci-appmap" id="lx-stage">${L.tab === "map" ? `<div class="loci-appmap-fill" id="mapView"></div>` : `<div class="palace lx-palace" data-view="palace"><canvas class="palace-canvas" id="palace-canvas" tabindex="0" aria-label="Your whole map in 3D"></canvas></div>`}
          <div id="lx-chrome"></div><div class="lx-slot" id="lx-slot"></div></div>
        <aside class="lx-side" id="lx-side"></aside>
      </div>`;
    if (L.tab === "map") mountMap(); else mountPalace();
    paintChrome(); paintSide();
  };
  function slotOpen() { return !!(L.tab === "palace" && L.extra); }
  function viewOf() { const narrow = innerWidth < 980; return { panel: narrow ? "none" : "side", sheetHeight: 0, slowTurn: false, reduced: matchMedia("(prefers-reduced-motion: reduce)").matches, cover: !narrow && slotOpen() ? 352 : 0 }; }
  function mountPalace() {
    const cv = $("#palace-canvas"), c = current();
    engine = new LP.PalaceEngine(cv, { scene, extras: c.extras, placesKey: "boards-proto", storage: null, view: viewOf(), openId: c.openId, trail: L.trail, onOpen: openThing, onBack: goBack, onInteract: () => $(".palace-hint")?.classList.add("is-gone"), probe: true });
  }
  function laneFor(topicId) {
    const card = x => { const pic = x.type === "photo" ? x : x.type === "board" ? null : null, cover = x.type === "board" ? (x.cards.map(c => BY[c.ref]).find(y => y?.type === "photo")) : pic;
      return { id: x.id, shape: x.type === "board" ? "board" : x.type === "photo" ? "image" : x.type === "quote" ? "quote" : ["note", "longnote", "question"].includes(x.type) ? "note" : "source", kind: x.type === "board" ? "board" : x.type === "photo" ? "image" : x.type === "quote" ? "quote" : ["note", "longnote", "question"].includes(x.type) ? "note" : "source", title: titleOf(x), excerpt: "", createdAt: stamp(x), onWall: true, marginNoteCount: 0, foundInNote: null, source: null, quote: null, object: null, topic: null, topicCount: (x.topics || []).length, media: x.type === "board" && ["b-court", "b-qibla"].includes(x.id) ? { kind: "link", thumb: { url: `bimg/${x.id}-t.png` }, width: 640, height: 480 } : cover ? { kind: "link", thumb: { url: `img/${cover.id}-t.jpg` }, width: 640, height: 480 } : null, group: null, notePage: null, noteSeconds: null }; };
    const items = ALL_ITEMS().filter(x => (x.topics || []).includes(topicId)).sort((a, b) => (b.type === "board") - (a.type === "board") || (b.added || 0) - (a.added || 0));
    return items.length ? { topicId, items: items.map(card), total: items.length } : null;
  }
  function explainersFor(topicId) {
    const ls = Object.values(BX.LUMENS).filter(l => !l.course && l.state !== "making" && (l.topics || []).includes(topicId));
    if (!ls.length) return null;
    const itemCounts = {}; ls.forEach(l => { if (l.fromBoard) itemCounts[l.fromBoard] = (itemCounts[l.fromBoard] || 0) + 1; });
    return { topicId, total: ls.length, itemCounts, childCounts: {}, latest: ls.map(l => ({ id: l.id, title: l.title, status: "finished", failure: null, lengthMs: l.min * 60000, itemId: l.fromBoard || null, intro: { title: l.title, subtitle: null } })) };
  }
  // The app's TopicExplainers (topic-gateway.ts): what the Map's "Made from this item" peek lists.
  function topicExplainersFor(topicId) {
    const ls = Object.values(BX.LUMENS).filter(l => !l.course && l.state !== "making" && (l.topics || []).includes(topicId));
    if (!ls.length) return null;
    const row = l => ({ id: l.id, title: l.title, request: "", status: "finished", failure: null, createdAt: new Date().toISOString(), anchor: l.fromBoard ? { kind: "item", itemId: l.fromBoard } : { kind: "topic", topicId }, intro: { title: l.title, subtitle: null }, board: null, lengthMs: l.min * 60000, view: l.watched ? { positionMs: 0, watched: true, lastViewedAt: new Date().toISOString() } : null, shareUrl: null, itemId: l.fromBoard || null, childId: null });
    const from = [...new Set(ls.filter(l => l.fromBoard).map(l => l.fromBoard))].map(id => ({ itemId: id, itemTitle: BX.nameOf(id), explainers: ls.filter(l => l.fromBoard === id).map(row) }));
    const x = explainersFor(topicId);
    return { topicId, forTopic: ls.filter(l => !l.fromBoard).map(row), fromItems: from, fromSubtopics: [], total: ls.length, subtopicTotal: 0, latest: ls.slice(0, 3).map(row), itemCounts: x.itemCounts, childCounts: {} };
  }
  // The peek's Play is a plain link (#lumen-<id>) where the app has no Graph player: play it here.
  document.addEventListener("click", e => { const a = e.target.closest?.('a[href^="#lumen-"]'); if (!a) return; e.preventDefault(); a.closest(".graph-xpeek")?.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true })); BX.play(a.getAttribute("href").slice(7)); }, true);
  function mapState() {
    const f = L.focus && T[L.focus] ? L.focus : null, glow = new Set(L.hl ? [...L.hl.ids] : []);
    return { topics: graph().topics, relations: relations(), focusId: f, selectedId: f, lane: f ? laneFor(f) : null, explainers: f ? explainersFor(f) : null, ghosts: [], pending: {}, reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches, coveredBottom: 0, topicExplainers: f ? topicExplainersFor(f) : null, popIds: new Set(), glowIds: glow, litItemId: null, topicName: id => T[id]?.name };
  }
  function mountMap() {
    const el = $("#mapView"); if (!el || !window.LociAppMap) return;
    LociAppMap.mount(el, { ...mapState(), on: {
      activate: it => { if (T[it.id]) { L.focus = it.id; L.trail = LP.pushTrail(L.trail, it.id); L.extra = null; refresh(); } else if (it.id === "centre" || it.kind === "centre") { L.focus = T[L.focus]?.parent || null; refresh(); } },
      add: () => toast("Adding topics works as it does in the app."), more: () => enterPhotos({ topic: L.focus }),
      openItem: it => openEntry(it.itemId), relation: () => toast("A related link: its explanation shows in the app's panel."),
      ghost: () => { }, openExplainer: it => BX.play(it.explainerId),
    } });
    mapMounted = true;
  }
  function openEntry(id) { const x = BY[id]; if (!x) return; if (x.type === "board") return BX.openBoard(id); if (x.type === "photo") return openQV(id, [id]); toast(`${kindLabel(x)}: “${titleOf(x).slice(0, 60)}” opens in the reader, as in the app.`); }
  function refresh() {
    const c = current();
    if (engine) { engine.setView(viewOf()); engine.setExtras(c.extras); engine.setTrail(L.trail); engine.setOpen(c.openId); }
    if (mapMounted) LociAppMap.update(mapState());
    paintChrome(); paintSide();
  }
  window.lociRelink = () => { scene = LP.buildScene(graph()); if (engine) engine.setScene(scene); refresh(); };

  /* ---------- the chrome: the app's trail, bottom row and slot card ---------- */
  function nameOfId(id) { const n = scene.byId.get(id); if (n) return n.name; const r = LP.parseExtraId(id); if (!r) return ""; if (r.kind === "stack") return r.which === "commonplace" ? "Commonplace" : "Learn"; if (r.kind === "item") return titleOf(BY[r.id] || {}); return (BX.LUMENS[r.id] || BX.COURSES[r.id] || {}).title || ""; }
  function paintChrome() {
    const host = $("#lx-chrome"); if (!host) return;
    const crumbs = L.trail.slice(-3), more = L.trail.length > 3;
    host.innerHTML = L.tab === "palace" ? `
      ${L.trail.length ? `<nav aria-label="Where you are" class="palace-float palace-trail"><button aria-label="Back" class="back" data-act="lx-back">←</button><button data-act="lx-home">All areas</button>${more ? `<span class="sep">›</span><span class="more">…</span>` : ""}${crumbs.map((id, i) => `<span class="sep">›</span>${i === crumbs.length - 1 ? `<b aria-current="location">${esc(nameOfId(id))}</b>` : `<button data-act="lx-open" data-id="${esc(id)}">${esc(nameOfId(id))}</button>`}`).join("")}</nav>` : ""}
      <p aria-hidden="true" class="palace-float palace-hint${L.trail.length ? " is-gone" : ""}">Drag to turn · Scroll in to open an area, out to go back · Click to open</p>
      <div class="palace-row"><div class="gtop"><div aria-label="Status legend" class="legend" role="group"><span class="state s0">Not started</span><span class="state s1">Learning</span><span class="state s2">Learned</span><span class="state palace-mark-item">Commonplace</span><span class="state palace-mark-lumen">Lumen</span></div><span class="graph-controls-spacer"></span><div class="gzoom-controls"><button aria-label="Zoom out" class="gzoom-button" data-act="lx-zout">−</button><button aria-label="Zoom in" class="gzoom-button" data-act="lx-zin">＋</button><button class="gzoom-button gzoom-reset" data-act="lx-reset">Whole palace</button></div></div></div>`
      : `<div class="palace-row"><div class="gtop"><div aria-label="Status legend" class="legend" role="group"><span class="state s0">Not started</span><span class="state s1">Learning</span><span class="state s2">Learned</span></div><span class="graph-controls-spacer"></span><div class="gzoom-controls"><button aria-label="Zoom out" class="gzoom-button" data-act="lx-mzout">−</button><button aria-label="Zoom in" class="gzoom-button" data-act="lx-mzin">＋</button><button class="gzoom-button gzoom-reset" data-act="lx-mfit">Fit</button></div></div></div>`;
    paintSlot();
  }
  const row = (cls, title, why, act, id) => `<li><button data-act="${act}" data-id="${esc(id)}"><i aria-hidden="true" class="palace-kind ${cls}"></i><span>${esc(title)}${why ? `<span class="why">${esc(why)}</span>` : ""}</span></button></li>`;
  const memberLine = m => "anchor" in m ? (m.kind === "course" ? `Course · ${plural(m.partCount, "part")}` : "Lumen") : `${m.kindLabel} · on ${plural(m.topicIds.length, "topic")}`;
  function slotCard(kicker, title, meta, body, foot) {
    return `<section class="dsheet palace-slot-card" aria-label="${esc(kicker)} details"><div class="dsheet-head"><div><span class="cp-kicker">${esc(kicker)}</span><h2>${esc(title)}</h2><p class="meta">${esc(meta)}</p></div><button aria-label="Close" class="icb" data-act="lx-back">×</button></div><div class="dsheet-body gin">${body}</div><div class="palace-slot-foot">${foot}</div></section>`;
  }
  function paintSlot() {
    const host = $("#lx-slot"); if (!host) return;
    if (!slotOpen()) { host.innerHTML = ""; return; }
    const c = current(), ref = c.ref, room = c.room; let html = "";
    if (ref?.kind === "stack" && room) {
      const ms = LP.latestMembers(room, ref.which), total = ref.which === "commonplace" ? room.itemTotal : room.lumenTotal;
      html = slotCard(T[ref.areaId].name, ref.which === "commonplace" ? "Commonplace" : "Lumens and courses", `The newest ${ms.length} of ${total}`, `<ul class="palace-rows">${ms.map(m => row("anchor" in m ? m.kind : "item", m.title, memberLine(m), "lx-open", "anchor" in m ? `${m.kind}:${m.id}` : `item:${m.id}`)).join("")}</ul>`,
        ref.which === "commonplace" ? `<a class="more" href="#" data-act="lx-seeall" data-id="${ref.areaId}">See all ${total} in your Commonplace →</a>` : `<a class="more" href="#" data-act="toast" data-msg="Learn isn't part of this prototype.">See all ${total} in Learn →</a>`);
    } else if (ref) {
      const m = memberOf(room, L.extra);
      if (m && !("anchor" in m)) html = itemCard(m); else if (m) html = lumenCard(m, room);
    }
    host.innerHTML = html;
  }
  const topicRows = ids => { const shown = ids.filter(id => scene.byId.has(id)); return shown.length ? `<ul class="palace-rows">${shown.map(id => row("topic", scene.byId.get(id).name, "", "lx-open", id)).join("")}</ul>` : `<p class="empty">Not on your map.</p>`; };
  function itemCard(m) {
    const x = BY[m.id], onB = BX.boardsWith(m.id);
    if (x.type === "board") {
      const cs = x.cards.filter(BX.isContent).map(c => BX.item(c.ref)).filter(Boolean), reach = [...new Set(cs.flatMap(y => y.topics || []))].filter(t => scene.byId.has(t) && !x.topics.includes(t));
      const madeL = Object.values(BX.LUMENS).filter(l => l.fromBoard === x.id && l.state !== "making");
      const arrows = x.arrows.map(a => BX.sentence(x, a)).filter(s => s.a && s.b);
      const counts = {}; cs.forEach(y => { const k = kindLabel(y.type === "detail" ? { type: "photo" } : y.type === "lumen" ? { type: "x" } : y); counts[y.type === "lumen" ? "Lumen" : y.type === "course" ? "Course" : y.type === "topic" ? "Topic" : k] = (counts[y.type === "lumen" ? "Lumen" : y.type === "course" ? "Course" : y.type === "topic" ? "Topic" : k] || 0) + 1; });
      return slotCard("Commonplace · Board", x.title, `${cs.length} ${cs.length === 1 ? "entry" : "entries"} · ${plural(x.arrows.length, "arrow")} · reaches ${plural(reach.length + x.topics.length, "topic")}`,
        `<button class="palace-cover lx-bcover" data-act="b-open" data-id="${x.id}" aria-label="Open the board"><span class="pic bpv" style="aspect-ratio:4/3">${BX.previewInner(x)}</span></button>
         ${x.goal ? `<section><h3>Goal</h3><p class="lx-goal">${esc(x.goal)}</p></section>` : ""}
         <section><h3>Lives at</h3>${topicRows(x.topics)}</section>
         ${reach.length ? `<section><h3>Reaches, through what's on it</h3>${topicRows(reach)}</section>` : ""}
         <section><h3>On it</h3><p class="lx-counts">${Object.entries(counts).map(([k, n]) => `${n} ${k.toLowerCase()}${n > 1 && !k.endsWith("s") ? "s" : ""}`).join(" · ")}</p></section>
         ${arrows.length ? `<section><h3>Its arrows (${arrows.length})</h3><ul class="lx-sent">${arrows.slice(0, 5).map(s => `<li>${esc(s.a.length > 34 ? s.a.slice(0, 33) + "…" : s.a)} <span class="v">${esc(s.verb || "→")}</span> ${esc(s.b.length > 34 ? s.b.slice(0, 33) + "…" : s.b)}${s.why ? `<em> · ${esc(s.why)}</em>` : ""}</li>`).join("")}</ul></section>` : ""}
         <section><h3>Lumens made from it</h3>${madeL.length ? `<ul class="palace-rows">${madeL.map(l => row("lumen", l.title, `Lumen · ${l.slides.length} slides`, "lx-open", `lumen:${l.id}`)).join("")}</ul>` : `<p class="empty">None yet. Make a Lumen on the board.</p>`}</section>`,
        `<button class="palace-btn is-primary" data-act="b-open" data-id="${x.id}">Open board</button><a class="more" href="#" data-act="lx-cp" data-id="${x.id}">Open in your Commonplace →</a>`);
    }
    const pic = x.type === "photo" ? `<button class="palace-cover" data-act="lx-entry" data-id="${x.id}" aria-label="Open ${esc(x.title)}"><img src="${thumb(x)}" alt=""></button>` : "";
    return slotCard(`Commonplace · ${m.kindLabel}`, m.title, memberLine(m), `<section>${pic}<h3>Tagged on</h3>${topicRows(m.topicIds)}</section>
      ${onB.length ? `<section><h3>On ${plural(onB.length, "board")}</h3><ul class="palace-rows">${onB.map(b => row("item", b.title, "Board", "lx-open", `item:${b.id}`)).join("")}</ul></section>` : ""}`,
      `<button class="palace-btn is-primary" data-act="lx-entry" data-id="${x.id}">Open</button><a class="more" href="#" data-act="lx-cp" data-id="${x.id}">Open in your Commonplace →</a>`);
  }
  function lumenCard(m, room) {
    const made = m.anchor.kind === "item" ? room.items.find(i => i.id === m.anchor.itemId) : null;
    const body = `<section><h3>Made from</h3>${m.anchor.kind === "topic" ? topicRows([m.anchor.topicId]) : made ? `<ul class="palace-rows">${row("item", made.title, memberLine(made), "lx-open", `item:${made.id}`)}</ul>` : `<p class="empty">Something in your Commonplace.</p>`}</section>
      ${m.kind === "course" ? `<section><h3>Parts (${m.partCount})</h3><ol class="palace-parts">${m.parts.map((p, i) => `<li><span class="n">${i + 1}</span><span class="t">${esc(p.title)}${p.topicId && scene.byId.has(p.topicId) ? `<span class="why">${esc(scene.byId.get(p.topicId).name)}</span>` : ""}</span><button class="palace-link" data-act="b-play" data-id="${p.explainerId}">▶ Play</button></li>`).join("")}</ol></section>` : ""}`;
    return slotCard(m.kind === "course" ? "Course" : "Lumen", m.title, memberLine(m), body, m.kind === "course" ? `<a class="more" href="#" data-act="toast" data-msg="Learn isn't part of this prototype.">Open course in Learn →</a>` : `<button class="palace-btn is-primary" data-act="b-play" data-id="${m.id}">▶ Play</button><a class="more" href="#" data-act="toast" data-msg="Learn isn't part of this prototype.">Open in Learn →</a>`);
  }

  /* ---------- the side panel: the photo roadmap's Phase 7 inspector, with Boards ---------- */
  function paintSide() {
    const el = $("#lx-side"); if (!el) return;
    const tid = L.focus && T[L.focus] ? L.focus : null;
    el.innerHTML = tid ? inspectorHTML(tid) : `<div class="inspector"><span class="k">Overview</span><h2>Your whole map</h2><p style="margin:0;color:var(--ink-2);font-size:13px">${scene.areaIds.length} areas · ${scene.nodes.length - scene.areaIds.length} topics. Open an area to see its room: its topics, its Commonplace stack and its Lumens. A board sits in the Commonplace stack of the area it lives in.</p></div>`;
  }

  /* ---------- clicks ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]"); if (!t) return; const a = t.dataset.act; if (!a.startsWith("lx-")) return; e.preventDefault();
    switch (a) {
      case "lx-tab": if (t.dataset.t === "list" || t.dataset.t === "overview") { toast(`${t.textContent} works as it does in the app.`); break; } L.tab = t.dataset.t; renderLoci(); break;
      case "lx-back": goBack(); break;
      case "lx-home": goHome(); break;
      case "lx-open": openThing(t.dataset.id); break;
      case "lx-zin": engine?.zoom(.8); break; case "lx-zout": engine?.zoom(1.25); break; case "lx-reset": goHome(); engine?.home(); break;
      case "lx-mzin": LociAppMap.zoom(1); break; case "lx-mzout": LociAppMap.zoom(-1); break; case "lx-mfit": LociAppMap.fit(); break;
      case "lx-seeall": enterPhotos({}); S.type = "all"; S.area = t.dataset.id; render(); break;
      case "lx-cp": { const x = BY[t.dataset.id]; S.dest = "commonplace"; S.view = "wall"; S.type = x.type === "board" ? "board" : typeOf(x); S.pf = { ...FDEF }; S.q = titleOf(x).slice(0, 24); render(); window.scrollTo(0, 0); break; }
      case "lx-entry": openEntry(t.dataset.id); break;
    }
  });
  // The side panel's own links (Phase 7 inspector and Boards): topics open in the Palace or focus the Map.
  document.addEventListener("click", e => { const t = e.target.closest('[data-act="lfocus"]'); if (!t || S.dest !== "loci") return; e.stopImmediatePropagation(); const id = t.dataset.t; if (id === "root") goHome(); else openThing(id); }, true);
  // Opening a board in Loci from the board page: the Palace, with the board open in its area.
  window.lociOpenBoard = id => { const b = BY[id], pl = b.topics[0]; S.dest = "loci"; L.tab = "palace"; L.hl = null; L.focus = pl; L.extra = `item:${id}`; L.extraArea = areaOf(pl); L.trail = [areaOf(pl), pl, `item:${id}`]; render(); window.scrollTo(0, 0); };
  addEventListener("resize", () => { if (engine) engine.setView(viewOf()); });
  bootCP();
})();
</script>
