<title>Studiolo Boards</title>
<meta name="description" content="Boards in Studiolo: an infinite thinking canvas that lives on the Loci map, holds your real Commonplace items, Lumens and courses, and turns your arrows into a Lumen.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<!-- Boards prototype. Source: src/boards.css, src/boards.js; pictures from ../commonplace-photos/img. -->
<style>/* Boards (prototype). Tokens are Studiolo's own (src/styles/tokens.css), as in ../commonplace-photos.
   Layout: the app's shell (58 px rail + main stage). The board is a top bar, an infinite stage (pan, zoom, dot grid),
   a tool palette, an Add drawer (left), an inspector (right), a selection toolbar, zoom and a minimap. */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --status-1: #c9d4f1; --status-2: #6e86d0; --status-3: #1e3e9e; --accent: #1e3e9e;
  --accent-soft: #e6ebf8; --accent-strong: #142b73; --on-accent: #ffffff;
  --float: #fbfbf9; --hover: #ecece6; --mat: #e4e4de;
  --quote-paper: #faf8f2; --quote-rule: #e3dccb; --note-paper: #fffdf7;
  --warn: #9a3b2e; --warn-soft: #f6e4df; --ok: #2f6b4a; --ok-soft: #e1efe6;
  --pick: #b7791f; --pick-soft: #fbf3df;
  --cover-paper: #202e38; --cover-ink: #edeff6; --cover-ink-2: #a9b4bd;
  --dot: #cfcfc6; --wire: #6b7a85; --frame: rgba(34, 48, 58, .035);
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, .07), 0 8px 22px rgba(34, 48, 58, .09);
  --shadow-lift: 0 2px 4px rgba(34, 48, 58, .08), 0 16px 36px rgba(34, 48, 58, .16);
  --shadow-float: 0 1px 2px rgba(34, 48, 58, .06), 0 18px 48px rgba(34, 48, 58, .16);
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur-q: 130ms; --dur-s: 220ms; --dur-m: 380ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #172027; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
    --accent-soft: #263156; --accent-strong: #c3cff8; --on-accent: #131a20;
    --float: #232e37; --hover: #2a353f; --mat: #0d1317;
    --quote-paper: #27251e; --quote-rule: #4a4334; --note-paper: #222a2f;
    --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a;
    --cover-paper: #0e1418; --cover-ink: #e6e9ee; --cover-ink-2: #8f9ba4;
    --dot: #2b3741; --wire: #8d9aa4; --frame: rgba(255, 255, 255, .03);
    --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
    --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #172027; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
  --accent-soft: #263156; --accent-strong: #c3cff8; --on-accent: #131a20;
  --float: #232e37; --hover: #2a353f; --mat: #0d1317;
  --quote-paper: #27251e; --quote-rule: #4a4334; --note-paper: #222a2f;
  --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a;
  --cover-paper: #0e1418; --cover-ink: #e6e9ee; --cover-ink-2: #8f9ba4;
  --dot: #2b3741; --wire: #8d9aa4; --frame: rgba(255, 255, 255, .03);
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
  --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-q: 1ms; --dur-s: 1ms; --dur-m: 1ms; } }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.kick { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- shell ---------- */
#bx-app, .app { height: 100%; }
.app { display: flex; }
.rail { position: fixed; inset: 0 auto 0 0; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0; border-right: 1px solid var(--line); background: var(--paper); z-index: 30; }
.rail .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 500 17px var(--read); margin-bottom: 20px; }
.rail button { all: unset; width: 40px; height: 36px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-2); cursor: pointer; }
.rail button svg { width: 19px; height: 19px; }
.rail button:hover { background: var(--hover); color: var(--ink); }
.rail button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.rail button:focus-visible { outline: 2px solid var(--accent); }
.rail .grow { flex: 1; }
.rail .me { width: 26px; height: 26px; border-radius: 50%; background: var(--mat); font-size: 11px; font-weight: 500; display: grid; place-items: center; }
#main { flex: 1; margin-left: 58px; min-width: 0; height: 100%; position: relative; }
@media (max-width: 699px) { .rail { display: none; } #main { margin-left: 0; } }

/* ---------- buttons ---------- */
.btn { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 3px; font-size: 13px; font-weight: 500; color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--ink); color: var(--paper); box-shadow: none; }
.btn.primary:hover { background: var(--accent-strong); }
.btn.quiet { background: transparent; box-shadow: none; color: var(--ink-2); }
.btn.quiet:hover { background: var(--hover); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--status-2); }
.btn svg { width: 15px; height: 15px; flex: none; }
.icon-btn { all: unset; box-sizing: border-box; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 3px; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); }
.icon-btn svg { width: 17px; height: 17px; }
.chip { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 14px; font-size: 12.5px; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; }
.chip:hover { color: var(--ink); background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.chip:focus-visible { outline: 2px solid var(--accent); }

/* ---------- board frame ---------- */
.bd { position: absolute; inset: 0; display: flex; flex-direction: column; }
.bd-top { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 18px; border-bottom: 1px solid var(--line); background: var(--paper); z-index: 12; min-height: 58px; }
.bd-id { min-width: 0; flex: 1; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 12px; color: var(--ink-2); line-height: 1.3; }
.crumbs button { all: unset; cursor: pointer; border-radius: 2px; }
.crumbs button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.crumbs button:focus-visible { outline: 2px solid var(--accent); }
.crumbs .sep { color: var(--ink-3); }
.bd-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.bd-title h1 { margin: 0; font: 500 19px/1.25 var(--read); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; outline: none; border-radius: 2px; }
.bd-title h1[contenteditable="true"] { box-shadow: 0 0 0 2px var(--accent-soft); white-space: normal; }
.bd-title .kick { flex: none; }
.bd-acts { display: flex; align-items: center; gap: 6px; flex: none; }
@media (max-width: 860px) { .bd-acts .lbl { display: none; } .bd-acts .btn { padding: 0 9px; } }
@media (max-width: 520px) { .crumbs .mid { display: none; } .bd-top { padding-left: 12px; gap: 8px; } }

.stage { flex: 1; position: relative; overflow: hidden; overflow: clip; user-select: none; -webkit-user-select: none; background-color: var(--board); background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.3px); touch-action: none; outline: none; }
.stage.panning, .stage.space { cursor: grab; }
.stage.panning:active { cursor: grabbing; }
.stage[data-tool="note"], .stage[data-tool="question"], .stage[data-tool="frame"] { cursor: crosshair; }
.stage[data-tool="arrow"] .card { cursor: alias; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#wires path { fill: none; vector-effect: non-scaling-stroke; }
#wires .w { stroke: var(--wire); stroke-width: 1.5; }
#wires .w.sel { stroke: var(--accent); stroke-width: 2.2; }
#wires .w-hit { stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
#wires .w-part { stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 2 4; }
#wires .w-loci { stroke: var(--status-2); stroke-width: 1.2; stroke-dasharray: 5 4; }
#wires .w-made { stroke: var(--status-2); stroke-width: 1.4; stroke-dasharray: 6 4; }
#wires .w-temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
#wires .ah { fill: var(--wire); }
#wires .ah-sel { fill: var(--accent); }
#wires .ah-temp { fill: var(--accent); }

/* arrow labels */
.alabel { all: unset; width: max-content; position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 1px; max-width: 190px; padding: 2px 8px 3px; border-radius: 11px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 11.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; text-align: center; white-space: nowrap; z-index: 2; }
.alabel .why { font: italic 400 12.5px/1.3 var(--read); color: var(--ink); white-space: normal; width: max-content; max-width: 180px; }
.alabel:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3); }
.alabel.sel { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent-strong); }
.alabel.empty { color: var(--ink-3); font-weight: 400; }
.alabel:focus-visible { outline: 2px solid var(--accent); }

/* frames */
.frame { position: absolute; border-radius: 6px; background: var(--frame); box-shadow: inset 0 0 0 1px var(--line); }
.frame.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.frame .fl { position: absolute; left: 0; bottom: 100%; padding: 0 2px 5px; font: 500 15px/1.2 var(--read); color: var(--ink-2); white-space: nowrap; transform-origin: 0 100%; cursor: grab; outline: none; }
.frame .fl[contenteditable="true"] { color: var(--ink); box-shadow: 0 2px 0 var(--accent); cursor: text; }
.frame .fr { position: absolute; right: -5px; bottom: -5px; width: 14px; height: 14px; cursor: nwse-resize; border-radius: 2px; }
.frame.sel .fr { background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--accent); }
.world.far .frame .fl { transform: scale(var(--inv)); }

/* cards */
.card { position: absolute; border-radius: 4px; background: var(--panel); box-shadow: var(--shadow-pic); cursor: grab; transition: box-shadow var(--dur-q) ease; }
.card:hover { box-shadow: var(--shadow-pic), 0 0 0 1px var(--ink-3); }
.card.sel { box-shadow: var(--shadow-lift), 0 0 0 2px var(--accent); }
.card.lifted { box-shadow: var(--shadow-lift); }
.card.wire-from { box-shadow: var(--shadow-pic), 0 0 0 2px var(--status-2); }
.card.wire-over { box-shadow: var(--shadow-lift), 0 0 0 2px var(--accent); }
.card.flash { animation: flash 1.2s var(--ease); }
@keyframes flash { 0%, 40% { box-shadow: var(--shadow-lift), 0 0 0 4px var(--status-2); } 100% { box-shadow: var(--shadow-pic); } }
.card .hd { position: absolute; right: -7px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--panel); box-shadow: inset 0 0 0 1.5px var(--accent); opacity: 0; cursor: crosshair; transition: opacity var(--dur-q) ease; z-index: 3; transform: scale(var(--hs, 1)); }
.card .hd::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); }
.card:hover .hd, .card.sel .hd { opacity: 1; }
@media (hover: none) { .card.sel .hd { opacity: 1; width: 22px; height: 22px; margin-top: -11px; right: -11px; } .card.sel .hd::after { inset: 7px; } }
.card .src { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-3); letter-spacing: .02em; }
.card .src .on { margin-left: auto; }
.card .bdg { display: inline-flex; align-items: center; gap: 3px; }
.card button.in { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 3px; font-size: 11.5px; font-weight: 500; color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; }
.card button.in:hover { background: var(--hover); }
.card button.in:focus-visible { outline: 2px solid var(--accent); }
.world.far .card .src, .world.far .card .cap span, .world.far .card button.in, .world.far .alabel .why { display: none; }

.k-photo { padding: 0; overflow: visible; }
.k-photo .pic { border-radius: 4px 4px 0 0; overflow: hidden; }
.k-photo .pic img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.k-photo .cap { padding: 7px 10px 8px; display: grid; gap: 1px; }
.k-photo .cap b { font-size: 12.5px; font-weight: 500; line-height: 1.3; }
.k-photo .cap span { font-size: 11px; color: var(--ink-2); }
.k-photo .pn { position: absolute; top: 8px; left: 8px; height: 20px; padding: 0 7px; border-radius: 10px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 10.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }

.k-note { background: var(--note-paper); padding: 12px 14px 10px; display: grid; gap: 8px; }
.txt { margin: 0; font: 400 15.5px/1.42 var(--read); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; outline: none; border-radius: 2px; min-height: 1.4em; }
.txt[contenteditable="true"] { cursor: text; box-shadow: 0 0 0 2px var(--accent-soft); background: var(--panel); user-select: text; -webkit-user-select: text; }
.txt:empty::before { content: attr(data-ph); color: var(--ink-3); }
.k-quote { background: var(--quote-paper); padding: 14px 16px 10px; display: grid; gap: 8px; border-left: 3px solid var(--quote-rule); border-radius: 2px 4px 4px 2px; }
.k-quote .txt { font-size: 17px; font-style: italic; }
.k-quote cite { font-style: normal; font-size: 11.5px; color: var(--ink-2); }
.k-question { padding: 12px 14px 10px; display: grid; gap: 8px; background: var(--panel); box-shadow: var(--shadow-pic), inset 0 0 0 1px var(--line); }
.k-question .qh { display: flex; align-items: center; gap: 7px; }
.k-question .qm { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--read); color: var(--pick); background: var(--pick-soft); flex: none; }
.k-question .qh .kick { color: var(--pick); }
.k-question .ans { font-size: 11.5px; color: var(--ok); display: flex; align-items: center; gap: 5px; }
.k-goal { padding: 14px 16px 12px; display: grid; gap: 7px; background: var(--accent-soft); box-shadow: var(--shadow-pic), inset 3px 0 0 var(--accent); }
.k-goal .kick { color: var(--accent-strong); display: flex; align-items: center; gap: 6px; }
.k-goal .txt { font-size: 17px; line-height: 1.38; }
.k-goal .gfoot { font-size: 11px; color: var(--ink-2); }
.k-link { padding: 12px 14px 10px; display: grid; gap: 5px; }
.k-link .site { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); }
.k-link .site i { width: 14px; height: 14px; border-radius: 3px; background: var(--mat); display: inline-grid; place-items: center; font: normal 600 8.5px var(--ui); color: var(--ink-2); }
.k-link b { font: 500 16px/1.3 var(--read); }
.k-link p { margin: 0; font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.k-video .vid { aspect-ratio: 16 / 9; background: var(--cover-paper); color: var(--cover-ink); border-radius: 4px 4px 0 0; display: grid; place-items: center; position: relative; }
.k-video .vid .pl { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, .16); display: grid; place-items: center; }
.k-video .vid .dur { position: absolute; right: 7px; bottom: 6px; font-size: 10.5px; background: rgba(0, 0, 0, .6); padding: 1px 5px; border-radius: 2px; }
.k-video .cap, .k-book .cap, .k-course .cap, .k-board .cap { padding: 8px 10px 9px; display: grid; gap: 4px; }
.k-video .cap b, .k-board .cap b, .k-course .cap b { font: 500 15px/1.3 var(--read); }
.k-video .cap .row, .k-course .cap .row, .k-lumen .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 2px; }
.k-moment, .k-slide { padding: 10px 12px; display: grid; gap: 5px; border-radius: 4px; }
.k-moment .t, .k-slide .t { font-size: 11px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.k-moment b, .k-slide b { font: 500 14.5px/1.3 var(--read); }
.k-slide { background: var(--cover-paper); color: var(--cover-ink); }
.k-slide .t { color: var(--cover-ink-2); }
.k-slide .sim { aspect-ratio: 16 / 9; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, .06); }
.k-slide .sim img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.k-book .cover { margin: 10px 10px 0; aspect-ratio: 3 / 4; background: var(--cover-paper); color: var(--cover-ink); border-radius: 2px 4px 4px 2px; padding: 14px 12px; font: 500 15px/1.25 var(--read); display: flex; flex-direction: column; justify-content: space-between; box-shadow: inset 4px 0 0 rgba(255, 255, 255, .08); }
.k-book .cover small { font: 400 11px var(--ui); color: var(--cover-ink-2); }
.k-lumen { background: var(--cover-paper); color: var(--cover-ink); padding: 12px 13px 11px; display: grid; gap: 8px; }
.k-lumen .kick { color: var(--cover-ink-2); display: flex; gap: 6px; align-items: center; }
.k-lumen .kick .dot { width: 6px; height: 6px; border-radius: 50%; background: #e8c27a; }
.k-lumen b { font: 500 17px/1.25 var(--read); }
.k-lumen .lsub { font-size: 11.5px; color: var(--cover-ink-2); }
.k-lumen .thumbs { display: flex; gap: 3px; height: 30px; }
.k-lumen .thumbs span { flex: 1; border-radius: 2px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.k-lumen .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .9; }
.k-lumen button.in { color: var(--cover-ink); background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
.k-lumen button.in:hover { background: rgba(255, 255, 255, .16); }
.k-lumen .src { color: var(--cover-ink-2); }
.k-lumen .prog { height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.k-lumen .prog i { display: block; height: 100%; background: #e8c27a; transition: width var(--dur-m) var(--ease); }
.k-lumen.making b { opacity: .82; }
.k-course { box-shadow: var(--shadow-pic), 4px 4px 0 -1px var(--panel), 4px 4px 0 0 var(--line), 8px 8px 0 -1px var(--panel), 8px 8px 0 0 var(--line); }
.k-course.sel { box-shadow: var(--shadow-lift), 0 0 0 2px var(--accent), 4px 4px 0 -1px var(--panel), 4px 4px 0 1px var(--accent); }
.k-course .band { height: 6px; border-radius: 4px 4px 0 0; background: linear-gradient(90deg, var(--status-3) var(--p, 40%), var(--status-1) var(--p, 40%)); }
.k-course .parts { display: grid; gap: 2px; margin: 4px 0 2px; padding: 0; list-style: none; font-size: 12px; color: var(--ink-2); }
.k-course .parts li { display: flex; gap: 6px; }
.k-course .parts li.done { color: var(--ink); }
.k-course .parts li i { font-style: normal; width: 12px; color: var(--ok); }
.k-topic { padding: 10px 14px 10px 12px; display: flex; align-items: center; gap: 10px; border-radius: 22px; }
.k-topic .ring { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 3px var(--status-1); }
.k-topic .ring.s1 { box-shadow: inset 0 0 0 3px var(--status-2); }
.k-topic .ring.s2 { background: var(--status-3); box-shadow: none; }
.k-topic b { font: 500 15px/1.2 var(--read); display: block; }
.k-topic span { font-size: 11px; color: var(--ink-2); }
.k-board .pv { margin: 8px 8px 0; border-radius: 3px; background: var(--board); overflow: hidden; display: block; }
.k-board .pv svg { display: block; width: 100%; height: auto; }
.k-loci { padding: 12px 14px 12px; display: grid; gap: 9px; background: var(--panel); box-shadow: var(--shadow-pic), inset 0 0 0 1.5px var(--status-2); border-radius: 6px; }
.k-loci .kick { color: var(--accent-strong); display: flex; align-items: center; gap: 6px; }
.k-loci .kick i { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: normal 600 9px var(--ui); }
.k-loci p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--ink); }
.k-loci .yours { font: 400 15px/1.42 var(--read); padding: 8px 10px; background: var(--note-paper); border-radius: 3px; box-shadow: inset 0 0 0 1px var(--line); }
.k-loci .theirs { font: 400 15px/1.42 var(--read); padding: 8px 10px; background: var(--accent-soft); border-radius: 3px; }
.stage textarea, .stage input { user-select: text; -webkit-user-select: text; }
.k-loci textarea { width: 100%; min-height: 64px; resize: vertical; padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; background: var(--note-paper); font: 400 15px/1.42 var(--read); user-select: text; cursor: text; }
.k-loci textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.k-loci .row { display: flex; flex-wrap: wrap; gap: 6px; }

/* recall: covered text */
.recall .cv { position: relative; }
.recall .cv > .txt, .recall .cv > .why-c { filter: blur(6px); opacity: .55; user-select: none; }
.recall .cv::after { content: "Say it, then tap"; position: absolute; inset: 0; display: grid; place-items: center; font: 500 11.5px var(--ui); color: var(--ink-2); pointer-events: none; }
.recall .k-lumen.cv::after { color: var(--cover-ink-2); }
.recall .alabel.cv { color: transparent; background: var(--hover); min-width: 70px; }
.recall .alabel.cv .why { filter: blur(5px); }
.recall .alabel.cv::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-weight: 600; }
.rmark { display: flex; gap: 6px; padding-top: 4px; }
.rmark button { all: unset; box-sizing: border-box; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 11.5px; font-weight: 500; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); color: var(--ink); }
.rmark button.y { box-shadow: inset 0 0 0 1px var(--ok); color: var(--ok); }
.rmark button.n { box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn); }
.card .rres { position: absolute; top: -9px; right: 10px; height: 18px; padding: 0 7px; border-radius: 9px; font-size: 10.5px; font-weight: 600; display: inline-flex; align-items: center; }
.card .rres.y { background: var(--ok-soft); color: var(--ok); }
.card .rres.n { background: var(--warn-soft); color: var(--warn); }

/* marquee */
.marquee { position: absolute; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); pointer-events: none; z-index: 4; }

/* palette */
.palette { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: grid; gap: 2px; padding: 5px; border-radius: 8px; background: var(--float); box-shadow: var(--shadow-float); z-index: 8; }
.palette button { all: unset; box-sizing: border-box; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-2); cursor: pointer; position: relative; }
.palette button svg { width: 19px; height: 19px; }
.palette button:hover { background: var(--hover); color: var(--ink); }
.palette button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.palette button:focus-visible { outline: 2px solid var(--accent); }
.palette .add { background: var(--accent); color: var(--on-accent); }
.palette .add:hover { background: var(--accent-strong); color: var(--on-accent); }
.palette .add[aria-pressed="true"] { background: var(--accent-strong); color: var(--on-accent); }
.palette hr { border: 0; border-top: 1px solid var(--line); margin: 3px 4px; }
.palette .tip { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); white-space: nowrap; padding: 4px 8px; border-radius: 3px; background: var(--ink); color: var(--paper); font-size: 12px; pointer-events: none; opacity: 0; transition: opacity var(--dur-q) ease; }
.palette .tip kbd { font: inherit; opacity: .65; margin-left: 6px; }
.palette button:hover .tip { opacity: 1; transition-delay: .35s; }
.stage.dr-open .palette { left: 354px; }
@media (max-width: 699px) {
  .palette, .stage.dr-open .palette { left: 50%; top: auto; bottom: 12px; transform: translateX(-50%); grid-auto-flow: column; }
  .palette hr { border-top: 0; border-left: 1px solid var(--line); margin: 4px 2px; }
  .palette .tip { display: none; }
  .palette button { width: 40px; height: 40px; }
}

/* zoom + minimap */
.zoombar { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 6px; background: var(--float); box-shadow: var(--shadow-float); z-index: 8; }
.zoombar button { all: unset; box-sizing: border-box; min-width: 30px; height: 30px; padding: 0 6px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-2); font-size: 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.zoombar button:hover { background: var(--hover); color: var(--ink); }
.zoombar button:focus-visible { outline: 2px solid var(--accent); }
.zoombar .ro { min-width: 50px; font-size: 12px; }
.minimap { position: absolute; right: 14px; bottom: 56px; width: 180px; height: 112px; border-radius: 6px; background: var(--float); box-shadow: var(--shadow-float); overflow: hidden; z-index: 8; cursor: pointer; }
.minimap svg { display: block; width: 100%; height: 100%; }
.minimap .vp { fill: color-mix(in srgb, var(--accent) 10%, transparent); stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
@media (max-width: 699px) { .minimap { display: none; } .zoombar { bottom: auto; top: 50px; right: 10px; } }

/* selection toolbar */
.seltb { position: absolute; z-index: 9; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 7px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow-float); transform: translate(-50%, -100%); white-space: nowrap; }
.seltb button { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 4px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--paper); }
.seltb button:hover { background: rgba(255, 255, 255, .14); }
.seltb button.hi { background: var(--paper); color: var(--ink); }
.seltb button.hi:hover { background: var(--hover); }
.seltb button:focus-visible { outline: 2px solid var(--status-1); }
.seltb button svg { width: 15px; height: 15px; }
.seltb .n { padding: 0 8px 0 6px; font-size: 12px; opacity: .7; }
.seltb .sep { width: 1px; height: 18px; background: rgba(255, 255, 255, .2); margin: 0 2px; }
:root[data-theme="dark"] .seltb button:not(.hi):hover { background: rgba(0, 0, 0, .1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seltb button:not(.hi):hover { background: rgba(0, 0, 0, .1); } }
@media (max-width: 699px) { .seltb .lbl-x { display: none; } }

/* popover (arrow words) */
.pop { position: absolute; z-index: 15; width: 300px; max-width: calc(100vw - 24px); padding: 12px; border-radius: 8px; background: var(--float); box-shadow: var(--shadow-float); display: grid; gap: 10px; }
.pop h4 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pop .verbs { display: flex; flex-wrap: wrap; gap: 5px; }
.pop .verbs .chip { height: 26px; font-size: 12px; padding: 0 9px; }
.pop input, .pop textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); font: 400 15px/1.35 var(--read); }
.pop input:focus, .pop textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.pop .hint { margin: 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }
.pop .row { display: flex; gap: 6px; justify-content: space-between; align-items: center; }

/* drawers: Add (left), inspector (right) */
.drawer { user-select: text; -webkit-user-select: text; position: absolute; top: 0; bottom: 0; z-index: 11; width: 340px; max-width: 100%; background: var(--paper); box-shadow: var(--shadow-float); display: flex; flex-direction: column; transition: transform var(--dur-s) var(--ease); }
.drawer.left { left: 0; border-right: 1px solid var(--line); transform: translateX(-104%); }
.drawer.right { right: 0; width: 380px; border-left: 1px solid var(--line); transform: translateX(104%); }
.drawer.open { transform: none; }
.drawer .dh { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px 16px; border-bottom: 1px solid var(--line); }
.drawer .dh h2 { margin: 0; font: 500 18px/1.2 var(--read); flex: 1; min-width: 0; }
.drawer .db { flex: 1; overflow: auto; padding: 12px 16px 24px; overscroll-behavior: contain; }
@media (max-width: 699px) {
  .drawer.left, .drawer.right { top: auto; left: 0; right: 0; width: 100%; height: 72%; border: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; transform: translateY(104%); }
  .drawer.open { transform: none; }
}
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; }
.tabs button { all: unset; cursor: pointer; padding: 9px 8px 8px; font-size: 13px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }
.tabs button:focus-visible { outline: 2px solid var(--accent); }
.search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 4px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.search input { all: unset; flex: 1; min-width: 0; font-size: 13.5px; }
.search svg { width: 15px; height: 15px; color: var(--ink-3); flex: none; }
.search:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent); }
.scope { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
.list { display: grid; gap: 2px; margin-top: 8px; }
.list h3 { margin: 14px 0 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.row-it { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 6px; border-radius: 4px; cursor: grab; touch-action: pan-y; }
.row-it:hover { background: var(--hover); }
.row-it:focus-visible { outline: 2px solid var(--accent); }
.row-it .th { width: 44px; height: 44px; border-radius: 3px; overflow: hidden; display: grid; place-items: center; background: var(--mat); font: 500 15px var(--read); color: var(--ink-2); }
.row-it .th img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.row-it .th.dark { background: var(--cover-paper); color: var(--cover-ink); }
.row-it .th.note { background: var(--note-paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 11px; padding: 4px; line-height: 1.2; overflow: hidden; text-align: left; place-items: start; }
.row-it .th.q { background: var(--pick-soft); color: var(--pick); }
.row-it .th.tp { background: transparent; }
.row-it b { display: block; font-size: 13px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-it small { display: block; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-it .tag { font-size: 10.5px; color: var(--ok); white-space: nowrap; }
.paste { display: flex; gap: 6px; margin-top: 10px; }
.paste input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px dashed var(--ink-3); border-radius: 3px; background: transparent; font-size: 13px; }
.paste input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.dnote { margin: 12px 0 0; font-size: 12px; color: var(--ink-2); line-height: 1.45; }
.ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -50%) rotate(-2deg); padding: 8px 12px; border-radius: 4px; background: var(--panel); box-shadow: var(--shadow-lift); font-size: 12.5px; font-weight: 500; max-width: 220px; display: flex; align-items: center; gap: 8px; }
.ghost img { width: 36px; height: 36px; object-fit: cover; border-radius: 2px; }

/* inspector */
.insp { display: grid; gap: 16px; }
.insp .big { border-radius: 4px; overflow: hidden; background: var(--mat); }
.insp .big img { display: block; width: 100%; height: auto; }
.insp .lead { margin: 0; font: 400 16px/1.5 var(--read); color: var(--ink); }
.insp .meta { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.insp textarea { width: 100%; min-height: 110px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--note-paper); font: 400 16px/1.5 var(--read); }
.insp textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.insp .same { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-strong); font-size: 12.5px; line-height: 1.45; }
.insp .same svg { width: 16px; height: 16px; flex: none; margin-top: 1px; }
.insp h3 { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.insp .tps { display: flex; flex-wrap: wrap; gap: 6px; }
.insp .tp { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; }
.insp .tp i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--status-2); }
.insp .tp i.s2 { background: var(--status-3); box-shadow: none; }
.insp .tp i.s0 { box-shadow: inset 0 0 0 2px var(--status-1); }
.insp .ons { display: grid; gap: 4px; }
.insp .ons button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; font-size: 13px; }
.insp .ons button:hover { background: var(--hover); }
.insp .ons button svg { width: 15px; height: 15px; color: var(--ink-2); }
.insp .ons .here { margin-left: auto; font-size: 11px; color: var(--ink-3); }
.insp .sent { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.insp .sent li { font: 400 15px/1.4 var(--read); padding-left: 14px; position: relative; }
.insp .sent li::before { content: "→"; position: absolute; left: 0; color: var(--ink-3); font: 12px var(--ui); top: 3px; }
.insp .sent li em { font-style: italic; color: var(--ink-2); }
.insp .sent li .v { font: 500 12px var(--ui); color: var(--accent-strong); background: var(--accent-soft); padding: 1px 6px; border-radius: 8px; margin: 0 2px; }
.insp .slist { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; counter-reset: s; }
.insp .slist li { display: flex; gap: 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.insp .slist li::before { counter-increment: s; content: counter(s); width: 18px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.insp .acts { display: flex; flex-wrap: wrap; gap: 6px; }

/* recall banner */
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 10; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-radius: 8px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow-float); font-size: 13px; max-width: calc(100% - 24px); }
.banner b { font-weight: 600; }
.banner .ct { font-variant-numeric: tabular-nums; opacity: .75; white-space: nowrap; }
.banner .btn { height: 28px; background: var(--paper); color: var(--ink); box-shadow: none; }
@media (max-width: 699px) { .banner { top: 54px; font-size: 12px; } .banner .long { display: none; } }

/* modal sheet */
#layer:empty { display: none; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(19, 26, 32, .38); display: grid; place-items: center; padding: 16px; animation: fade var(--dur-s) var(--ease); }
@keyframes fade { from { opacity: 0; } }
.sheet { width: min(720px, 100%); max-height: calc(100% - 16px); overflow: auto; border-radius: 10px; background: var(--paper); box-shadow: var(--shadow-float); display: flex; flex-direction: column; }
.sheet .sh { display: flex; align-items: flex-start; gap: 10px; padding: 18px 18px 12px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 1; }
.sheet .sh h2 { margin: 0; font: 500 22px/1.2 var(--read); }
.sheet .sh p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.sheet .sb { padding: 16px 22px 8px; display: grid; gap: 18px; }
.sheet .sf { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; padding: 14px 22px 18px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--paper); }
.sheet .sf .note { margin-right: auto; font-size: 12px; color: var(--ink-2); }
.opt { display: grid; gap: 7px; }
.opt > span { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.seg { display: inline-flex; flex-wrap: wrap; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); overflow: hidden; width: max-content; max-width: 100%; }
.seg button { all: unset; box-sizing: border-box; cursor: pointer; padding: 7px 12px; font-size: 13px; color: var(--ink-2); box-shadow: inset -1px 0 0 var(--line); }
.seg button:last-child { box-shadow: none; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.feeds { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.feed { padding: 10px 12px; border-radius: 5px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 3px; }
.feed b { font-size: 12.5px; font-weight: 600; }
.feed span { font-size: 12px; color: var(--ink-2); line-height: 1.4; }
.feed.goal { background: var(--accent-soft); box-shadow: none; }
.feed.q { background: var(--pick-soft); box-shadow: none; }
.outline { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); overflow: hidden; }
.outline .sec { padding: 9px 14px 5px; font: 500 14px var(--read); color: var(--ink-2); background: var(--paper); border-top: 1px solid var(--line); }
.outline .sec:first-child { border-top: 0; }
.outline .it { display: grid; grid-template-columns: 22px 40px minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); }
.outline .it.dim { opacity: .5; }
.outline .it .n { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.outline .it .th { width: 40px; height: 30px; border-radius: 2px; overflow: hidden; background: var(--mat); display: grid; place-items: center; font: 500 13px var(--read); color: var(--ink-2); }
.outline .it .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.outline .it .th.dark { background: var(--cover-paper); color: var(--cover-ink); }
.outline .it .th.q { background: var(--pick-soft); color: var(--pick); }
.outline .it b { font-size: 13px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.outline .it small { font-size: 11.5px; color: var(--ink-2); display: block; }
.outline .it small .v { color: var(--accent-strong); font-weight: 500; }

/* player */
.player { width: min(1040px, 100%); max-height: calc(100% - 8px); border-radius: 10px; background: var(--cover-paper); color: var(--cover-ink); box-shadow: var(--shadow-float); display: flex; flex-direction: column; overflow: hidden; }
.player .ph { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px 18px; }
.player .ph b { font: 500 17px var(--read); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .ph .icon-btn { color: var(--cover-ink-2); }

.slide .s-pair .verb { align-self: center; padding: 6px 10px; margin: 0 -14px; z-index: 1; border-radius: 14px; background: #1e3e9e; color: #fff; font: 600 clamp(10px, 1.2vw, 13px) var(--ui); white-space: nowrap; }
.slide .s-pair .cap { padding: 10px 4% 12px; font: 400 clamp(13px, 1.6vw, 18px)/1.4 var(--read); color: #3e4d58; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.tst { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; border-radius: 6px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow-float); font-size: 13px; max-width: calc(100vw - 24px); animation: up var(--dur-s) var(--ease); }

/* prototype bar */

  /* ---------- view ---------- */

  function bboxOf(cards) {

    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    cards.forEach((c) => { const r = rectOf(c); x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y - (c.kind === "frame" ? 26 : 0)); x2 = Math.max(x2, r.x + r.w); y2 = Math.max(y2, r.y + r.h); });
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }
  function fit(anim = true, cards) {

    const R = st.getBoundingClientRect(); const bb = bboxOf(cards || board().cards);
    const padL = innerWidth < 700 ? 16 : 70, padR = innerWidth < 700 ? 16 : 30, padT = innerWidth < 700 ? 60 : 30, padB = innerWidth < 700 ? 80 : 30;
    const z = clamp(Math.min((R.width - padL - padR) / bb.w, (R.height - padT - padB) / bb.h), 0.15, cards ? 1.1 : 1);
    const v = V();
    const tx = padL + (R.width - padL - padR - bb.w * z) / 2 - bb.x * z, ty = padT + (R.height - padT - padB - bb.h * z) / 2 - bb.y * z;

  /* ---------- minimap + board previews ---------- */

    const ox = (W - (bb.w + pad * 2) * sc) / 2 - (bb.x - pad) * sc, oy = (H - (bb.h + pad * 2) * sc) / 2 - (bb.y - pad) * sc;

    DB.links.forEach((k) => { const [p, q] = k.split("|"); const a = pos[p], b = pos[q]; if (a && b) s += `<path class="link" d="M${a.x},${a.y} Q0,0 ${b.x},${b.y}"/>`; });

    sugs.forEach((g) => { const a = pos[g.ta], b = pos[g.tb]; if (a && b) s += `<path class="link sug" d="M${a.x},${a.y} Q0,0 ${b.x},${b.y}"/>`; });
    TOPICS.forEach((x) => {
      const p = pos[x.id]; const isArea = x.parent === "you"; const r = x.id === "you" ? 16 : isArea ? 11 : 9;
      const cls = ["nd", x.id === "you" ? "you" : isArea ? "area" : "s" + (x.st ?? 0), x.id === sel ? "on" : ""].join(" ");
      const anchor = p.x < -20 ? "end" : p.x > 20 ? "start" : "middle"; const dx = anchor === "end" ? -r - 6 : anchor === "start" ? r + 6 : 0; const dy = anchor === "middle" ? (p.y < 0 ? -r - 8 : r + 16) : 4;
      const bs = boardsAt(x.id);
      s += `<g class="${cls}" data-act="loci-sel" data-t="${x.id}" tabindex="0" role="button" aria-label="${esc(x.name)}"><circle class="r" cx="${p.x}" cy="${p.y}" r="${r}"/><text x="${p.x + dx}" y="${p.y + dy}" text-anchor="${anchor}">${esc(x.id === "you" ? "You" : x.name)}</text>
        ${bs.length ? `<g class="bb"><rect x="${p.x - 8}" y="${p.y + r + 3}" width="16" height="12" rx="2"/><text x="${p.x}" y="${p.y + r + 12.5}" text-anchor="middle">${bs.length}</text></g>` : ""}</g>`;
    });
    s += "</svg>";
    const here = Object.values(DB.items).filter((b) => b.type === "board" && (b.place === sel || under(b.place, sel)));
    const mine = sugs.filter((g) => [g.ta, g.tb].some((x) => under(x, sel) || under(sel, x)) || here.some((b) => b.id === g.board.id));
    const qs = [...new Set(here.flatMap((b) => b.cards.map((c) => item(c.ref)).filter((x) => x?.type === "question")))];
    const goalB = here.find((b) => b.place === sel && b.goal);
    const added = DB.links.filter((k) => k.split("|").some((x) => x === sel));
    main.innerHTML = `<div class="pg">
      <div class="pg-head"><div><h1>Loci</h1><p>Your map. A board lives at a place on it; the small square on a topic counts its boards.</p></div></div>
      <div class="loci">
        <div class="map">${s}</div>
        <aside class="tp-panel">
          <div><p class="path">${chain(sel).slice(0, -1).map((x) => esc(x.name)).join(" › ") || "&nbsp;"}</p><h2>${esc(t.id === "you" ? "You" : t.name)}</h2>${t.st != null ? `<span class="stl"><i></i>${ST[t.st]}</span>` : ""}</div>
          ${goalB ? `<div><h3>Why you're learning it</h3><div class="reads">Loci reads: <b>${esc(goalB.goal)}</b><br>From the goal on “${esc(goalB.title)}”. Change it there.</div></div>` : ""}
          <div><h3>Boards ${sel === "you" ? "everywhere" : "here"}<button class="btn sm" data-act="new-board" data-t="${sel}">${I.plus} New board</button></h3>
            <div class="btiles">${here.map((b) => `<button class="btile" data-act="open-board" data-id="${b.id}"><span class="pv">${boardSVG(b, 170, 100)}</span><b>${esc(b.title)}</b><small>${b.cards.length} cards · ${b.arrows.length} arrows${b.place !== sel ? " · " + esc(T[b.place].name) : ""}</small></button>`).join("") || `<button class="btile new" data-act="new-board" data-t="${sel}">${I.plus}<span>Start a board here</span></button>`}</div></div>
          <div><h3>From your boards</h3><div class="sugs">
            ${mine.map((g) => `<div class="sug"><span>Your arrow <em>“${esc(short(titleOf(g.A), 34))}” ${esc(g.a.verb || "→")} “${esc(short(titleOf(g.B), 34))}”</em> connects <b>${esc(T[g.ta].name)}</b> and <b>${esc(T[g.tb].name)}</b>. They aren't linked on your map.</span><div class="row"><button class="btn sm primary" data-act="add-link" data-k="${g.k}">Link them on the map</button><button class="btn sm quiet" data-act="dismiss-link" data-k="${g.k}">Not now</button></div></div>`).join("")}
            ${added.map((k) => `<div class="sug done">Linked on your map: <b>${k.split("|").map((x) => esc(T[x].name)).join(" ↔ ")}</b>. Lumens and chat in one now mention the other.</div>`).join("")}
            ${!mine.length && !added.length ? `<p class="dnote" style="margin:0">Nothing new. When an arrow on a board joins two topics your map doesn't link, it shows here.</p>` : ""}
          </div></div>
          ${qs.length ? `<div><h3>Open questions from your boards</h3><ul class="qs">${qs.map((q) => `<li><span>${esc(q.text)}</span><button class="btn sm" data-act="explain-q" data-id="${q.id}">Explain…</button></li>`).join("")}</ul></div>` : ""}
        </aside>
      </div></div>`;
  }

  /* ================================================================ COMMONPLACE */
  function renderCommonplace() {
    const types = { all: null, notes: ["note", "quote", "question"], sources: ["link", "video", "book"], photos: ["photo"], boards: ["board"] };
    const order = Object.values(DB.items).filter((x) => !["lumen", "course"].includes(x.type) && (!types[U.cpType] || types[U.cpType].includes(x.type)));
    const rank = (x) => (x.id === U.edited ? -2 : x.type === "board" ? -1 : 0);
    order.sort((a, b) => rank(a) - rank(b));
    const card = (x) => {
      const on = boardsWith(x.id).length;
      const ob = on ? `<span class="ob">${I.board.replace("<svg", '<svg width="12" height="12"')} On ${on} board${on > 1 ? "s" : ""}</span>` : "";
      const ed = x.id === U.edited ? " edited" : "";
      if (x.type === "photo") return `<button class="wc${ed}" data-act="cp-open" data-id="${x.id}"><img src="${IMG[x.img].src}" alt="" style="aspect-ratio:${IMG[x.img].w}/${IMG[x.img].h};background:${IMG[x.img].pal}"><span class="wb"><b>${esc(x.title)}</b>${ob}</span></button>`;
      if (x.type === "board") return `<button class="wc board" data-act="open-board" data-id="${x.id}"><span class="pv">${boardSVG(x, 240, 150)}</span><span class="wb"><span class="k">Board · ${x.cards.length} cards</span><b style="font:500 16px/1.3 var(--read)">${esc(x.title)}</b><span style="font-size:11.5px;color:var(--ink-2)">${esc(T[x.place].name)}</span>${ob}</span></button>`;
      if (x.type === "note" || x.type === "quote" || x.type === "question") return `<button class="wc ${x.type === "question" ? "q" : x.type}${ed}" data-act="cp-open" data-id="${x.id}"><span class="wb"><span class="k">${typeWord(x)}${x.id === U.edited ? " · just changed on a board" : ""}</span><p>${esc(x.text)}</p>${x.src ? `<span style="font-size:11.5px;color:var(--ink-2)">${esc(x.src)}</span>` : ""}${ob}</span></button>`;
      if (x.type === "video" || x.type === "book") return `<button class="wc dark" data-act="cp-open" data-id="${x.id}"><span class="wb"><span class="k">${typeWord(x)}</span><b style="font:500 16px/1.3 var(--read)">${esc(x.title)}</b><span style="font-size:11.5px;color:var(--cover-ink-2)">${esc(x.creator)}</span>${ob}</span></button>`;
      return `<button class="wc" data-act="cp-open" data-id="${x.id}"><span class="wb"><span class="k">${esc(x.site)}</span><b style="font:500 16px/1.3 var(--read)">${esc(x.title)}</b>${x.desc ? `<span style="font-size:12px;color:var(--ink-2)">${esc(x.desc)}</span>` : ""}${ob}</span></button>`;
    };
    main.innerHTML = `<div class="pg"><div class="pg-head"><div><h1>Commonplace</h1><p>One library. A board is one kind of item in it, and what you place on a board stays here too.</p></div><span class="grow"></span><button class="btn" data-act="new-board" data-t="climate">${I.plus} New board</button></div>
      <div class="cp-bar">${[["all", "All"], ["notes", "Notes"], ["sources", "Sources"], ["photos", "Photos"], ["boards", "Boards"]].map(([k, l]) => `<button class="chip" data-act="cp-type" data-v="${k}" aria-pressed="${U.cpType === k}">${l}</button>`).join("")}</div>
      <div class="wall">${order.map(card).join("") || '<p class="empty">Nothing here yet.</p>'}</div>
      <aside class="drawer right${U.insp ? " open" : ""}" id="cp-insp" aria-label="Details" style="position:fixed"></aside></div>`;
    renderInsp();
  }

  /* ================================================================ navigation */
  function openBoard(id) {
    if (!DB.items[id]) return;
    DB.cur = id; U.sel.clear(); U.insp = null; U.wire = null; U.recall = false; U.rv = {}; U.screen = "board"; save(); closeLayer(); render();
  }
  function newBoard(place) {
    const id = uid("b");
    DB.items[id] = { id, type: "board", title: "Untitled board", place, date: TODAY, goal: "", cards: [{ id: uid("g"), kind: "goal", x: 40, y: 30, w: 330 }], arrows: [] };
    DB.views[id] = { x: 0, y: 0, z: 1, fit: true };
    save(); openBoard(id); U.drawer = true; renderDrawer(); syncTools();
    setTimeout(() => { const g = board().cards[0]; startEdit(g.id); }, 80);
    toast(`New board in ${T[place].name}. Start with what you want to understand.`);
  }

  /* ================================================================ clicks */
  document.addEventListener("click", (e) => {
    if (e.target.matches("[data-scrim]")) { closeLayer(); return; }
    const t = e.target.closest("[data-act]"); if (!t) return;
    const a = t.dataset.act; const b = board();
    switch (a) {
      case "nyi": toast(t.dataset.msg); break;
      case "theme": { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; break; }
      case "screen": U.screen = t.dataset.s; U.insp = null; render(); renderGuide(); break;
      case "guide": U.guide = !U.guide; DB.firstGuide = false; save(); renderPbar(); renderGuide(); break;
      case "reset": if (confirm("Reset the prototype to its starting board?")) { DB = seed(); DB.firstGuide = false; hist.length = 0; U.sel.clear(); U.insp = null; U.recall = false; U.rv = {}; U.edited = null; U.screen = "board"; save(); render(); } break;
      case "tool": setTool(t.dataset.t); break;
      case "drawer": U.drawer = !U.drawer; if (U.drawer && innerWidth < 700) U.insp = null; renderDrawer(); renderInsp(); syncTools(); break;
      case "dtab": U.dtab = t.dataset.t; U.dq = ""; renderDrawer(); break;
      case "dscope": U.dscope = t.dataset.v; renderDrawer(); break;
      case "zin": zoomAt(1.25); break;
      case "zout": zoomAt(1 / 1.25); break;
      case "fit": fit(); break;
      case "inspect": inspect(t.dataset.c); break;
      case "insp-close": U.insp = null; renderInsp(); break;
      case "cp-open": U.insp = t.dataset.id; renderInsp(); break;
      case "cp-type": U.cpType = t.dataset.v; renderCommonplace(); break;
      case "unpack": unpack(t.dataset.c); break;
      case "play": play(t.dataset.id, t.dataset.at || 0); break;
      case "connect": U.tool = "arrow"; U.arrowOnce = true; U.wire = { from: t.dataset.c }; syncTools(); drawWorld(); toast("Tap the card it connects to. Esc to stop."); break;
      case "ask": askLoci(); break;
      case "rm-sel": removeSel(); break;
      case "rm-card": mutate(() => { b.cards = b.cards.filter((c) => c.id !== t.dataset.c); U.sel.delete(t.dataset.c); }); break;
      case "edit": startEdit(t.dataset.c); break;
      case "rename-frame": editFrameLabel(t.dataset.c); break;
      case "frame-sel": {
        const cs = [...U.sel].map((id) => cardOf(id)).filter((c) => c && c.kind !== "frame"); if (!cs.length) break;
        const bb = bboxOf(cs); const id = uid("f");
        mutate(() => { b.cards.unshift({ id, kind: "frame", label: "New frame", x: Math.round(bb.x - 30), y: Math.round(bb.y - 30), w: Math.round(bb.w + 60), h: Math.round(bb.h + 60) }); U.sel = new Set([id]); });
        setTimeout(() => editFrameLabel(id), 30); break;
      }
      case "make": openMake(t.dataset.scope); break;
      case "do-make": break;
      case "close-layer": closeLayer(); break;
      case "recall": U.recall = !U.recall; U.rv = {}; U.sel.clear(); closePop(); $("#bd")?.classList.toggle("recall", U.recall); $(`[data-act="recall"].btn`)?.setAttribute("aria-pressed", String(U.recall)); drawWorld(); break;
      case "rmark": { U.rv[t.dataset.c] = t.dataset.v; drawWorld(); break; }
      case "loci-compare": case "loci-skip": {
        const c = cardOf(t.dataset.c); const ta = $(`[data-loci="${c.id}"]`); const yours = a === "loci-compare" ? (ta?.value || "").trim() : "";
        if (a === "loci-compare" && !yours) { ta?.focus(); toast("Write yours first, even a rough one. That's the part that helps."); break; }
        mutate(() => { c.yours = yours; c.state = "told"; }); break;
      }
      case "loci-keep": {
        const c = cardOf(t.dataset.c); const text = t.dataset.w === "mine" ? c.yours : c.text; const itid = uid("n");
        mutate(() => { DB.items[itid] = { id: itid, type: "note", text, topics: [b.place], date: TODAY, by: t.dataset.w === "loci" ? "Loci" : undefined }; const nc = { id: uid("c"), ref: itid, x: c.x, y: c.y, w: 250, flash: true }; b.cards.push(nc); c.about.slice(0, 3).forEach((id) => b.arrows.push({ id: uid("a"), a: nc.id, b: id, verb: "explains", why: "" })); b.cards = b.cards.filter((k) => k.id !== c.id); U.sel = new Set([nc.id]); }, "Kept as a note in Commonplace, connected to the cards it's about.");
        break;
      }
      case "loci-topic": { const c = cardOf(t.dataset.c); const ref = "topic:" + c.topic; const id = uid("c"); const sp = freeSpot(c.x, c.y + (SZ[c.id]?.h || 200) + 30, 230, 60); mutate(() => { b.cards.push({ id, ref, x: Math.round(sp.x), y: Math.round(sp.y), w: 230, flash: true }); c.topic = null; }, `Placed ${T[ref.slice(6)].name} from your map.`); break; }
      case "explain-q": { const q = DB.items[t.dataset.id]; toast(`Making a Lumen to answer: “${short(q.text, 50)}”`); if (U.screen === "board") { const qc = b.cards.find((c) => c.ref === q.id); if (qc) { U.sel = new Set([qc.id]); const o = { order: b.arrows.filter((x) => x.b === qc.id).map((x) => cardOf(x.a)).filter(isContent), qs: [qc], secs: [], into: () => null }; o.secs = [{ name: "", cards: o.order }]; setTimeout(() => doMake({ shape: "lumen", len: "short", scope: "sel", title: q.text }, o), 300); } } break; }
      case "open-board": openBoard(t.dataset.id); break;
      case "loci-at": U.lociSel = t.dataset.t; U.screen = "loci"; U.insp = null; render(); break;
      case "loci-sel": U.lociSel = t.dataset.t; renderLoci(); break;
      case "new-board": newBoard(t.dataset.t === "you" ? "climate" : t.dataset.t); break;
      case "add-link": DB.links.push(t.dataset.k); save(); renderLoci(); toast("Linked on your map."); break;
      case "dismiss-link": DB.dismissed.push(t.dataset.k); save(); renderLoci(); break;
    }
  });
  document.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.matches?.("g[data-act], [role='button'][data-act]")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });
  addEventListener("resize", () => { if (U.screen === "board") applyView(); renderGuide(); });

  render();
  if (DB.firstGuide) { U.guide = true; renderPbar(); setTimeout(renderGuide, 60); }
})();
</script>
