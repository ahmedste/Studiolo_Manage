<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131a20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Studiolo on iPad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<!--APP-CSS-->
</head>
<body>
<div id="app" class="loci-appmap">
  <div class="m-status" aria-hidden="true"><span class="ip-clock">9:41<em>Sat 31 Oct</em></span><i><svg viewBox="0 0 18 13"><path d="M9 12.5 .9 4.4a11.5 11.5 0 0 1 16.2 0z" opacity=".95"/></svg><b class="ip-batt">100%</b><svg viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="8" rx="2"/><rect x="23.5" y="4" width="1.8" height="4" rx="1" opacity=".4"/></svg></i></div>
  <nav class="ip-side" id="side" aria-label="Sidebar"></nav>
  <header class="m-tb m-mat" id="tb"></header>
  <main class="m-stage" id="stage"></main>
  <aside class="ip-insp" id="insp" aria-label="Inspector"><div class="ip-insp-edge" id="inspEdge" role="separator" aria-orientation="vertical" aria-label="Resize the inspector" tabindex="0"></div><div class="ip-insp-host" id="inspHost"></div><button class="ip-insp-grab" id="inspGrab" type="button" aria-label="Change the inspector’s height"></button></aside>
  <div class="m-dock" id="dock"></div>
  <div class="ip-pip" id="pip" hidden></div>
  <section class="m-sheet m-chat" id="chat" aria-label="Loci" aria-hidden="true"></section>
  <div class="ip-side-scrim" id="sideScrim"></div>
  <div class="m-scrim" id="scrim"></div>
  <nav class="m-drawer" id="drawer" aria-label="Primary" aria-hidden="true"></nav>
  <section class="m-sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"></section>
  <section class="r-room" id="room" aria-hidden="true"></section>
  <section class="v-viewer" id="viewer" aria-hidden="true"></section>
  <section class="m-player" id="player" aria-label="Player" aria-hidden="true"></section>
  <div id="pop"></div>
  <div class="ip-drop" id="drop" aria-hidden="true"><div><b>Drop to save in your Commonplace</b><span id="dropWhere"></span></div></div>
  <div class="ip-hud" id="hud" role="dialog" aria-label="Keyboard shortcuts" aria-hidden="true"></div>
  <div class="m-toast" id="toast" role="status" aria-live="polite"></div>
  <div class="m-home-ind" aria-hidden="true"></div>
</div>
<!--APP-JS-->
</body>
</html>
