<title>Studiolo Graph 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen app. Header with the Graph tabs, then a full-bleed canvas stage with floating search,
   legend and zoom controls, and the topic inspector docked right (bottom sheet on phones).
   Tokens are Studiolo's own (src/styles/tokens.css, light and dark). */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --status-1: #c9d4f1; --status-2: #6e86d0; --status-3: #1e3e9e;
  --accent: #1e3e9e; --accent-soft: #e6ebf8;
  --shadow-float: 0 1px 2px rgba(34,48,58,.06), 0 18px 48px rgba(34,48,58,.16);
  --grain-opacity: .2;
  --ui: "Instrument Sans", system-ui, -apple-system, sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6;
    --accent: #9db0f3; --accent-soft: #263156;
    --shadow-float: 0 0 0 1px rgba(255,255,255,.05), 0 18px 48px rgba(0,0,0,.42);
    --grain-opacity: .12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6;
  --accent: #9db0f3; --accent-soft: #263156;
  --shadow-float: 0 0 0 1px rgba(255,255,255,.05), 0 18px 48px rgba(0,0,0,.42);
  --grain-opacity: .12;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.45; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; }

/* Header */
.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); position: relative; z-index: 3; }
.top h1 { font-family: var(--read); font-weight: 500; font-size: 22px; margin: 0; letter-spacing: -.005em; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--board); border-radius: 9px; }
.tabs button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--ink-2); cursor: not-allowed; }
.tabs button[aria-current="page"] { background: var(--panel); color: var(--ink); font-weight: 600; cursor: default; box-shadow: 0 1px 2px rgba(34,48,58,.08); }
.summary { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 4px 9px; border-radius: 99px; white-space: nowrap; }

/* Stage */
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--paper); }
canvas#g { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
canvas#g.dragging { cursor: grabbing; }
canvas#g.over { cursor: pointer; }
.grain { position: absolute; inset: 0; pointer-events: none; opacity: var(--grain-opacity); mix-blend-mode: overlay; }

.float { position: absolute; z-index: 2; }
.search { top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); width: min(300px, calc(100% - 32px)); }
.search input { width: 100%; box-sizing: border-box; padding: 9px 12px 9px 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow-float); font-size: 13.5px; }
.search input::placeholder { color: var(--ink-2); }
.search svg { position: absolute; left: 11px; top: 11px; width: 14px; height: 14px; stroke: var(--ink-2); fill: none; stroke-width: 1.6; }
.results { list-style: none; margin: 6px 0 0; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-float); max-height: 280px; overflow: auto; }
.results li { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
.results li[aria-selected="true"], .results li:hover { background: var(--accent-soft); }
.results small { margin-left: auto; color: var(--ink-2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }

.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; }
.dot.s0 { background: var(--paper); border: 1px solid var(--ink-3); }
.dot.s1 { background: var(--status-1); }
.dot.s2 { background: var(--status-2); }
.dot.lib { border-radius: 2px; background: var(--ink-3); }

.legend { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-float); font-size: 12px; color: var(--ink-2); max-width: calc(100% - 32px); box-sizing: border-box; }
.legend .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend .row span { display: inline-flex; align-items: center; gap: 6px; }
.legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); }
.legend input { accent-color: var(--accent); margin: 0; }
.legend .sep { height: 1px; background: var(--line); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 600; }
.fps { font-variant-numeric: tabular-nums; color: var(--ink-2); }

.zoom { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-float); overflow: hidden; transition: right .38s var(--ease); }
.zoom button { border: 0; background: none; padding: 7px 11px; cursor: pointer; font-size: 14px; color: var(--ink); min-width: 36px; }
.zoom button + button { border-left: 1px solid var(--line); }
.zoom button:hover { background: var(--board); }
.zoom .reset { font-size: 12.5px; }

.hint { left: 50%; transform: translateX(-50%); top: 18px; font-size: 12px; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); padding: 5px 12px; border-radius: 99px; white-space: nowrap; transition: opacity .6s var(--ease); pointer-events: none; }
.hint.gone { opacity: 0; }

/* Inspector */
.insp { top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-float); display: flex; flex-direction: column; overflow: hidden; transform: translateX(0); transition: transform .38s var(--ease), opacity .25s var(--ease); }
.insp.closed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.insp header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
.insp .eyebrow { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); margin: 0 30px 4px 0; font-weight: 600; }
.insp h2 { font-family: var(--read); font-weight: 500; font-size: 25px; line-height: 1.15; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.insp .meta { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); }
.insp .close { position: absolute; top: 12px; right: 12px; border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-size: 18px; line-height: 1; }
.insp .close:hover { background: var(--board); }
.insp .body { overflow: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px; background: var(--board); border-radius: 9px; }
.seg button { border: 0; background: none; padding: 6px 4px; border-radius: 7px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-checked="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(34,48,58,.08); }
.insp h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.insp ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.insp li button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; margin-left: -8px; border-radius: 7px; cursor: pointer; display: flex; align-items: flex-start; gap: 8px; font-size: 13.5px; }
.insp li button:hover { background: var(--board); }
.insp li .dot { margin-top: 5px; }
.insp li .why { display: block; color: var(--ink-2); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.insp li .type { margin-left: auto; padding-left: 8px; color: var(--ink-2); font-size: 11.5px; white-space: nowrap; }
.insp .empty { color: var(--ink-2); font-size: 13px; margin: 0; }
.insp footer { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn:hover { background: var(--board); }
.insp footer small { color: var(--ink-2); font-size: 11.5px; line-height: 1.35; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 720px) {
  .top h1 { font-size: 19px; }
  .summary { order: 4; width: 100%; }
  .insp { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 52%; border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .insp.closed { transform: translateY(calc(100% + 24px)); }
  .insp h2 { font-size: 21px; }
  .legend .opt-wide { display: none; }
  .hint { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .insp, .zoom, .hint { transition: none; }
}
</style>

<div class="app">
  <header class="top">
    <h1>Graph</h1>
    <nav class="tabs" aria-label="Graph views">
      <button type="button" title="Opens in the app" aria-disabled="true">Map</button>
      <button type="button" title="Opens in the app" aria-disabled="true">List</button>
      <button type="button" title="Opens in the app" aria-disabled="true">Overview</button>
      <button type="button" aria-current="page">3D</button>
    </nav>
    <span class="summary" id="summary"></span>
    <span class="pill" id="datasetPill">Prototype · sample graph</span>
  </header>

  <main class="stage" id="stage">
    <canvas id="g" tabindex="0" role="img" aria-label="Your whole topic graph in 3D"></canvas>
    <div class="grain" id="grain"></div>

    <div class="float search" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Find a topic" autocomplete="off" aria-label="Find a topic" aria-controls="results" aria-expanded="false" role="combobox">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>

    <div class="float hint" id="hint">Drag to turn · Scroll or pinch to zoom · Click a topic</div>

    <div class="float legend" id="legend">
      <div class="row">
        <span><i class="dot s0"></i>Not started</span>
        <span><i class="dot s1"></i>Learning</span>
        <span><i class="dot s2"></i>Learned</span>
        <span class="opt-wide"><i class="dot lib"></i>Library item</span>
      </div>
      <div class="sep"></div>
      <div class="row">
        <label><input type="checkbox" id="optLib" checked>Library items</label>
        <label><input type="checkbox" id="optRotate" checked>Slow turn</label>
      </div>
      <div class="row">
        <button type="button" class="linkbtn" id="optScale">Try 2,000 topics</button>
        <span class="fps" id="fps"></span>
      </div>
    </div>

    <div class="float zoom" id="zoom">
      <button type="button" id="zOut" aria-label="Zoom out">−</button>
      <button type="button" id="zIn" aria-label="Zoom in">+</button>
      <button type="button" id="zReset" class="reset">Whole graph</button>
    </div>

    <aside class="float insp closed" id="insp" aria-label="Topic details" aria-hidden="true">
      <header>
        <p class="eyebrow" id="iEyebrow"></p>
        <h2 id="iName"></h2>
        <p class="meta" id="iMeta"></p>
        <button type="button" class="close" id="iClose" aria-label="Close details">×</button>
      </header>
      <div class="body" id="iBody"></div>
      <footer>
        <button type="button" class="btn" id="iMap">Open in Map</button>
        <small>In the app this opens the radial Map on this topic.</small>
      </footer>
    </aside>

    <p class="sr" id="live" aria-live="polite"></p>
  </main>
</div>

<script>
/* ---------- Data: the sample graph from project-docs/design/prototype/studiolo-design-concept.html ---------- */
const T = (n, s, c) => ({ n, s, c });
const AREAS = [
 {n:'History & Theory',t:[T('Ancient & Classical',0),T('Islamic architecture',3,[T('Plan types & ritual',3),T('Geometry & ornament',1),T('Regional schools',1),T('The contemporary mosque',2)]),T('Gothic, Renaissance & Baroque',0),T('Modernism',2),T('Postmodern & Contemporary',1),T('Vernacular & regional',1),T('Theory & criticism',1)]},
 {n:'Culture & Context',t:[T('Culture and architecture',1),T('Climate-responsive design',2),T('Site and place',1),T('Heritage & conservation',0)]},
 {n:'Design & Composition',t:[T('Ordering principles',2),T('Massing & hierarchy',3),T('Space, sequence & threshold',1),T('Proportion, scale & rhythm',1),T('Typologies',3,[T('Residential',2),T('Religious',3),T('Retail & mixed use',2),T('Civic & cultural',1)])]},
 {n:'Envelope & Facade',t:[T('Facade systems',3,[T('Curtain wall',2),T('Unitised',2),T('Precast',3),T('Rainscreen',1),T('Masonry',1)]),T('Facade performance',1),T('Detailing & interfaces',3),T('Facade procurement',2)]},
 {n:'Structures',t:[T('Structural principles',2),T('Concrete & precast',2),T('Steel',1),T('Timber & hybrid',0),T('Tall buildings',1)]},
 {n:'Materials & Construction',t:[T('Material selection',2),T('Methods & sequencing',3),T('Detailing',3),T('Embodied carbon',1),T('Site coordination',3)]},
 {n:'Environment & Services',t:[T('Passive design',1),T('Daylight & shading',1),T('MEP fundamentals',1),T('Energy modelling',0),T('Certification',1)]},
 {n:'Urbanism & Landscape',t:[T('Urban design principles',1),T('Streets & public realm',0),T('Masterplanning',1),T('Landscape',0)]},
 {n:'Practice & Delivery',t:[T('Stages & deliverables',3),T('Contracts & procurement',2),T('Coordination & BIM',3),T('Client & stakeholders',3),T('Leadership & teams',2),T('Codes & authorities',3)]},
 {n:'Digital & Computation',t:[T('BIM',3),T('Parametric design',1),T('AI in practice',2),T('Scripting & automation',1)]},
 {n:'Representation',t:[T('Drawing & sketching',2),T('Rendering & visualization',2),T('Writing & presenting',1)]},
 {n:'Building Physics',t:[T('Thermal envelope',2),T('Acoustics & sound',1),T('Moisture & air tightness',1)]},
 {n:'Interior Architecture',t:[T('Spatial ergonomics',2),T('FF&E specification',1),T('Architectural lighting',2)]},
 {n:'Real Estate & Finance',t:[T('Feasibility & pro forma',1),T('Development economics',1),T('Asset management',0)]},
 {n:'Construction Law',t:[T('Standard contracts',2),T('Dispute resolution',1),T('Planning codes',1)]},
 {n:'Landscape & Ecology',t:[T('Biodiversity & soil',1),T('Stormwater management',2),T('Hardscaping details',1)]},
 {n:'Safety & Accessibility',t:[T('Fire engineering',2),T('Universal access',3),T('Egress & evacuation',2)]},
 {n:'Generative Computation',t:[T('Algorithmic modeling',2),T('Generative optimization',1),T('Performance simulation',1)]}
];
const RELS = [
 ['Islamic architecture','Typologies','A mosque is read here first as a plan type; the typology work and the history work share the same buildings.'],
 ['Islamic architecture','Daylight & shading','Courtyard, screen and dome are climate devices as much as forms. The mashrabiya sits in both.'],
 ['Islamic architecture','Vernacular & regional','Gulf building culture is an Islamic tradition read locally; course 4 of the path lives between the two.'],
 ['Facade systems','Detailing & interfaces','Every system choice is decided at its joints. Precast in particular.'],
 ['Facade systems','Concrete & precast','The precast panel is both a facade system and a structural element.'],
 ['Daylight & shading','Passive design','Shading is the first passive move in this climate.'],
 ['Typologies','Space, sequence & threshold','Type sets the sequence; threshold is where the type is felt.']
];
const LIB = {
 'Islamic architecture':[['Great Mosque of Kairouan','building'],['Hillenbrand, Islamic Architecture','book'],['Sultan Hassan walkthrough','lecture'],['The mausoleum at Sultan Hassan','note'],['What I took from Sultan Hassan','doc'],['Qibla orientation note','note'],['Capstone Studio: Design Synthesis','studio'],['Why the iwan replaced the hall','chat'],['Form, ritual, geometry','course']],
 'Facade systems':[['Precast panel mock-up photos','photo'],['Kinetic facades, ten years on','link'],['Precast joints on the mihrab','chat']],
 'Typologies':[['Capstone Studio: Design Synthesis','studio'],['Great Mosque of Kairouan','building'],['Bait Ur Rouf Mosque','link'],['Prayer hall structural mock-up','photo']],
 'Daylight & shading':[['Light in architecture is not merely illumination','quote'],['Fathy, Natural Energy and Vernacular Architecture','book']],
 'Space, sequence & threshold':[['The eye never quite finds the end of the field','quote'],['Bait Ur Rouf Mosque','link'],['What I took from Sultan Hassan','doc']],
 'Detailing & interfaces':[['Precast mihrab panel joints','chat'],['Capstone Studio: Design Synthesis','studio']],
 'Climate-responsive design':[['Hassan Fathy','person'],['We have to design for the climate, not against it.','quote'],['Fathy, Natural Energy and Vernacular Architecture','book']]
};
const STATUS = ['Not started', 'Learning', 'Learned'];
const KIND_R = { 1: 13, 2: 8.5, 3: 6, 4: 6, lib: 4.2 };

/* ---------- Graph model ---------- */
let G = null;
function newGraph() { return { nodes: [], links: [], byId: new Map() }; }
function addNode(g, o) {
  const n = Object.assign({ id: 'n' + g.nodes.length, children: [], rels: [], libs: [], tagged: [], x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0 }, o);
  n.r = n.kind === 'lib' ? KIND_R.lib : KIND_R[Math.min(n.level, 4)];
  n.w = n.kind === 'area' ? 2.2 : n.kind === 'lib' ? .6 : 1;
  g.nodes.push(n); g.byId.set(n.id, n);
  if (n.parent) n.parent.children.push(n);
  return n;
}
function addLink(g, a, b, type, why) {
  const l = { a, b, type, why, i: g.links.length };
  g.links.push(l);
  if (type === 'rl') { a.rels.push({ other: b, why }); b.rels.push({ other: a, why }); }
  if (type === 'lib') { a.libs.push(b); b.tagged.push(a); }
  return l;
}
function buildSample() {
  const g = newGraph(), byName = {};
  const st = s => (s >= 2 ? 2 : s); // the prototype's 4-step sample scale folds onto the app's three statuses
  AREAS.forEach((a, i) => {
    const avg = a.t.reduce((x, k) => x + st(k.s), 0) / a.t.length;
    const area = addNode(g, { name: a.n, kind: 'area', level: 1, status: avg >= 1.5 ? 2 : avg >= .6 ? 1 : 0, area: i, parent: null });
    byName[a.n] = area;
    a.t.forEach(t => {
      const tn = addNode(g, { name: t.n, kind: 'topic', level: 2, status: st(t.s), area: i, parent: area });
      byName[t.n] = tn; addLink(g, area, tn, 'lk');
      (t.c || []).forEach(c => {
        const cn = addNode(g, { name: c.n, kind: 'topic', level: 3, status: st(c.s), area: i, parent: tn });
        byName[c.n] = cn; addLink(g, tn, cn, 'lk');
      });
    });
  });
  RELS.forEach(([a, b, why]) => addLink(g, byName[a], byName[b], 'rl', why));
  const libByName = {};
  Object.entries(LIB).forEach(([topic, items]) => items.forEach(([name, type]) => {
    const host = byName[topic];
    let ln = libByName[name];
    if (!ln) ln = libByName[name] = addNode(g, { name, kind: 'lib', level: 4, libType: type, status: 0, area: host.area, parent: null, anchor: host });
    addLink(g, host, ln, 'lib');
  }));
  g.label = 'Prototype · sample graph';
  return g;
}
/* A synthetic account at the per-account limits (D14): 2,000 topics, 4,000 links. */
function buildScale() {
  const g = newGraph();
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const areaNames = AREAS.map(a => a.n).concat(['Sustainability', 'Research Methods']);
  const areas = areaNames.map((n, i) => addNode(g, { name: n, kind: 'area', level: 1, status: Math.floor(rnd() * 3), area: i, parent: null }));
  const pick = () => { const r = rnd(); return r < .5 ? 0 : r < .8 ? 1 : 2; };
  const pool = [];
  areas.forEach(a => { for (let k = 0; k < 28; k++) { const t = addNode(g, { name: `${a.name} ${k + 1}`, kind: 'topic', level: 2, status: pick(), area: a.area, parent: a }); addLink(g, a, t, 'lk'); pool.push(t); } });
  while (g.nodes.length < 2000) {
    const p = pool[Math.floor(rnd() * pool.length)];
    if (p.level >= 5) continue;

function drawLabels(order, focusing, bg, dt) {
  const big = G.nodes.length > 500;
  const kLa = reduced ? 1 : 1 - Math.exp(-dt * 9);
  const cands = [];
  for (const p of order) {
    const n = p.n;
    let pri = -1;
    if (n.rv > .75) {
      if (n === focus) pri = 5; else if (n === hover) pri = 4;
      else if (focusing && neigh.has(n)) pri = 3;
      else if (n.kind === 'area' && p.depth < (focusing ? .5 : .92)) pri = focusing ? 1 : 2;
      else if (!focusing && !big && n.level === 2 && p.depth < .28 && p.sr > 7) pri = 0;
    }
    if (pri >= 0 || n.la > .02) cands.push([pri, p]);
  }
  cands.sort((a, b) => b[0] - a[0] || a[1].zz - b[1].zz);
  const placed = [];
  const hit = b => placed.some(q => b[0] < q[0] + q[2] && b[0] + b[2] > q[0] && b[1] < q[1] + q[3] && b[1] + b[3] > q[1]);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const hasLS = 'letterSpacing' in ctx;
  for (const [pri, p] of cands) {
    const n = p.n, isArea = n.kind === 'area';
    const near = Math.max(.88, Math.min(1.14, 1.16 - p.depth * .4));
    let size, font, text, ls = '0px';
    if (pri === 5) { size = 19; font = `500 ${size}px ${READ_FONT}`; text = n.name; }
    else if (isArea) { size = Math.max(11, 11.5 * near); font = `650 ${size.toFixed(1)}px ${UI_FONT}`; text = n.name.toUpperCase(); ls = '0.08em'; }
    else { size = Math.max(11.5, (pri >= 3 ? 13.5 : 12.5) * near); font = `${pri === 4 ? 600 : 500} ${size.toFixed(1)}px ${UI_FONT}`; text = n.name; }
    if (text.length > 34 && pri < 4) text = text.slice(0, 32).trimEnd() + '…';
    ctx.font = font; if (hasLS) ctx.letterSpacing = ls;
    const key = font + ls + text;
    let w = labelW.get(key); if (w === undefined) { w = ctx.measureText(text).width; labelW.set(key, w); }
    const r = Math.max(p.sr * (1 + .18 * n.hv), 2);
    const gap = pri === 5 ? 16 : 7;
    let cy = p.y + r + gap + size / 2;
    let box = [p.x - w / 2 - 5, cy - size / 2 - 3, w + 10, size + 6];
    let want = pri >= 0;
    if (want && hit(box)) {
      cy = p.y - r - gap - size / 2; box[1] = cy - size / 2 - 3;
      if (hit(box) && pri < 4) want = false;
    }
    n.la += ((want ? 1 : 0) - n.la) * kLa;
    if (n.la < .02) continue;
    if (want) placed.push(box);
    const tone = pri === 5 ? C.ink : pri >= 3 ? lerpA(C.ink, C['ink-2'], .25) : isArea ? C['ink-2'] : C['ink-3'];
    let fade = pri >= 3 ? 0 : isArea ? (focusing ? .45 : .05) + p.depth * .4 : .2 + p.depth * .4;
    const a = n.la * clamp01((n.rv - .75) / .25);
    // A soft paper backing keeps text off the lines without a hard box.
    ctx.fillStyle = rgb(bg, .72 * a);
    roundRect(box[0], box[1], box[2], box[3], 5); ctx.fill();
    ctx.fillStyle = rgb(lerpA(tone, bg, fade), a);
    ctx.fillText(text, p.x, cy + (pri === 5 ? 1 : .5));
  }
  if (hasLS) ctx.letterSpacing = '0px';
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- Camera flights ---------- */
let flight = null;
function flyTo(to, opts = {}) {
  Object.assign(goal, to);
  if (opts.yaw !== undefined) goal.yaw = opts.yaw;
  if (opts.pitch !== undefined) goal.pitch = opts.pitch;
  if (reduced) { Object.assign(cam, goal); flight = null; return; }
  const from = { tx: cam.tx, ty: cam.ty, tz: cam.tz, dist: cam.dist, cx: cam.cx, cy: cam.cy, yaw: cam.yaw, pitch: cam.pitch };
  const travel = Math.hypot(to.tx - from.tx, to.ty - from.ty, to.tz - from.tz);
  const dur = opts.dur || Math.min(1500, 700 + travel * 1.4);
  const hop = opts.hop ?? Math.min(travel * .6, R0 * .9);
  flight = { from, t0: performance.now(), dur, hop, yaw: opts.yaw, pitch: opts.pitch };
}

/* ---------- Loop ---------- */
let last = performance.now(), frames = 0, fpsT = last;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (alpha > .015) {
    tick(G, alpha); if (G.nodes.length < 500) tick(G, alpha);
    alpha *= G.nodes.length > 500 ? .975 : .982;
    R0 = sceneRadius(G); overviewDist = R0 * 2.75;
    if (focus) { goal.tx = focus.x; goal.ty = focus.y; goal.tz = focus.z; }
    else if (!userZoomed) goal.dist = overviewDist;
  }
  const idle = !dragging && !flight && now - lastInteract > 2500;
  if (autoRotate && idle) goal.yaw += (focus ? .035 : .07) * dt;
  if (!dragging && (Math.abs(vel.yaw) > 1e-4 || Math.abs(vel.pitch) > 1e-4)) {
    goal.yaw += vel.yaw; goal.pitch = clampPitch(goal.pitch + vel.pitch);
    vel.yaw *= .92; vel.pitch *= .92;
  }
  const kMove = reduced ? 1 : 1 - Math.exp(-dt * 5.5), kTurn = reduced ? 1 : 1 - Math.exp(-dt * 14);
  if (flight) {
    // An eased flight toward the live goal; the camera pulls back mid-way by `hop`, so long moves read as a jump.
    const f = flight.from, t = clamp01((now - flight.t0) / flight.dur), e = ease.inOut(t);
    for (const k of ['tx', 'ty', 'tz', 'cx', 'cy']) cam[k] = f[k] + (goal[k] - f[k]) * e;
    cam.dist = f.dist + (goal.dist - f.dist) * e + flight.hop * Math.sin(Math.PI * e);
    if (flight.yaw !== undefined) cam.yaw = goal.yaw = f.yaw + (flight.yaw - f.yaw) * e;
    if (flight.pitch !== undefined) cam.pitch = goal.pitch = f.pitch + (flight.pitch - f.pitch) * e;
    if (t >= 1) flight = null;
  } else {
    for (const k of ['tx', 'ty', 'tz', 'dist', 'cx', 'cy']) cam[k] += (goal[k] - cam[k]) * kMove;
  }
  if (!flight || flight.yaw === undefined) cam.yaw += (goal.yaw - cam.yaw) * kTurn;
  if (!flight || flight.pitch === undefined) cam.pitch += (goal.pitch - cam.pitch) * kTurn;
  drawFrame(now, dt);
  frames++;
  if (now - fpsT > 1000) { if (G.nodes.length > 500) document.getElementById('fps').textContent = `${Math.round(frames * 1000 / (now - fpsT))} fps`; frames = 0; fpsT = now; }
  requestAnimationFrame(loop);
}
const clampPitch = p => Math.max(-1.35, Math.min(1.35, p));

/* ---------- Input ---------- */
const pointers = new Map();
let dragging = false, drag = null, pinch = 0, userZoomed = false;
function pick(x, y) {
  let best = null, bz = Infinity;
  for (let i = 0; i < G.nodes.length; i++) {
    const p = P[i]; if (!p || !p.vis) continue;
    const r = Math.max(p.sr, 5) + 3;
    if ((p.x - x) ** 2 + (p.y - y) ** 2 <= r * r && p.zz < bz) { best = p.n; bz = p.zz; }
  }
  return best;
}
function local(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function interacted() { lastInteract = performance.now(); document.getElementById('hint').classList.add('gone'); }
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const [x, y] = local(e);
  pointers.set(e.pointerId, { x, y });
  if (pointers.size === 1) { drag = { x, y, moved: 0 }; vel = { yaw: 0, pitch: 0 }; }
  if (flight) { flight.yaw = flight.pitch = undefined; } // the viewer takes over turning mid-flight
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); }
  interacted();
});
canvas.addEventListener('pointermove', e => {
  const [x, y] = local(e);
  if (!pointers.has(e.pointerId)) {
    if (e.pointerType === 'mouse') { hover = pick(x, y); canvas.classList.toggle('over', !!hover); }
    return;
  }
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x, y });
  if (pointers.size === 1 && drag) {
    const dx = x - prev.x, dy = y - prev.y;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    if (drag.moved > 5) { dragging = true; canvas.classList.add('dragging'); hover = null; }
    if (dragging) {
      goal.yaw += dx * .006; goal.pitch = clampPitch(goal.pitch + dy * .006);
      vel = { yaw: dx * .006 * .5, pitch: dy * .006 * .5 };
    }
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) zoomBy(pinch / d);
    pinch = d; dragging = true; drag = null;
  }
  interacted();
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (drag && drag.moved <= 5) {
      const [x, y] = local(e);
      const n = pick(x, y);
      setFocus(n && n === focus ? focus : n);
    }
    dragging = false; drag = null; pinch = 0; canvas.classList.remove('dragging');
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => { if (!pointers.size) { hover = null; canvas.classList.remove('over'); } });
canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(Math.exp(e.deltaY * .0012)); interacted(); }, { passive: false });
function zoomBy(f) { userZoomed = true; goal.dist = Math.max(120, Math.min(overviewDist * 2.2, goal.dist * f)); }
canvas.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft') goal.yaw -= .15; else if (k === 'ArrowRight') goal.yaw += .15;
  else if (k === 'ArrowUp') goal.pitch = clampPitch(goal.pitch - .15); else if (k === 'ArrowDown') goal.pitch = clampPitch(goal.pitch + .15);
  else if (k === '+' || k === '=') zoomBy(.85); else if (k === '-') zoomBy(1.18);
  else if (k === 'Escape') setFocus(null); else return;
  e.preventDefault(); interacted();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement !== canvas && document.activeElement !== q && focus) setFocus(null);
});
document.getElementById('zIn').addEventListener('click', () => { zoomBy(.8); interacted(); });
document.getElementById('zOut').addEventListener('click', () => { zoomBy(1.25); interacted(); });
document.getElementById('zReset').addEventListener('click', () => { userZoomed = false; setFocus(null); goal.pitch = -.32; interacted(); });

const optLib = document.getElementById('optLib');
optLib.addEventListener('change', () => { showLib = optLib.checked; if (!showLib && focus && focus.kind === 'lib') setFocus(null); });
const optRotate = document.getElementById('optRotate');
optRotate.checked = autoRotate;
optRotate.addEventListener('change', () => { autoRotate = optRotate.checked; });
document.getElementById('optScale').addEventListener('click', e => {
  const toScale = G.nodes.length < 500;
  load(toScale ? buildScale() : buildSample());
  e.target.textContent = toScale ? 'Back to the sample graph' : 'Try 2,000 topics';
  document.getElementById('fps').textContent = '';
  optLib.disabled = toScale;
});

/* ---------- Search ---------- */
const q = document.getElementById('q'), results = document.getElementById('results');
let hits = [], sel = 0;
function renderResults() {
  if (!hits.length) { results.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
  results.innerHTML = hits.map((n, i) => `<li role="option" id="r${i}" aria-selected="${i === sel}" data-go="${n.id}"><i class="dot ${n.kind === 'lib' ? 'lib' : 's' + n.status}"></i>${esc(n.name)}<small>${esc(n.kind === 'lib' ? 'Library' : pathOf(n).slice(-1)[0] || 'Area')}</small></li>`).join('');
  results.hidden = false; q.setAttribute('aria-expanded', 'true'); q.setAttribute('aria-activedescendant', 'r' + sel);
}
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase(); sel = 0;
  if (!s) { hits = []; return renderResults(); }
  const pool = G.nodes.filter(n => showLib || n.kind !== 'lib');
  hits = pool.filter(n => n.name.toLowerCase().startsWith(s)).concat(pool.filter(n => !n.name.toLowerCase().startsWith(s) && n.name.toLowerCase().includes(s))).slice(0, 8);
  renderResults();
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && hits.length) { sel = (sel + 1) % hits.length; renderResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && hits.length) { sel = (sel - 1 + hits.length) % hits.length; renderResults(); e.preventDefault(); }
  else if (e.key === 'Enter' && hits[sel]) { choose(hits[sel]); }
  else if (e.key === 'Escape') { q.value = ''; hits = []; renderResults(); canvas.focus(); }
});
results.addEventListener('mousedown', e => { const li = e.target.closest('[data-go]'); if (li) { e.preventDefault(); choose(G.byId.get(li.dataset.go)); } });
q.addEventListener('blur', () => setTimeout(() => { hits = []; renderResults(); }, 120));
function choose(n) { q.value = ''; hits = []; renderResults(); setFocus(n); interacted(); }

/* ---------- Boot ---------- */
function load(g) {
  G = g; focus = null; hover = null; neigh = new Set(); focusLinks = []; userZoomed = false; flight = null;
  insp.classList.add('closed'); insp.setAttribute('aria-hidden', 'true');
  initPositions(G);
  alpha = 1;
  // Fewer warm-up ticks than a static view needs: the shape finishes settling while the entry plays.
  const pre = reduced ? 420 : G.nodes.length > 500 ? 30 : 45;
  for (let i = 0; i < pre; i++) { tick(G, alpha); alpha *= .985; }
  if (reduced) alpha = 0;
  R0 = sceneRadius(G); overviewDist = R0 * 2.75;
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const big = G.nodes.length > 500;
  G.nodes.forEach(n => {
    n.em = 1; n.hv = 0; n.la = 0; n.rv = 0;
    const lvl = n.kind === 'lib' ? 4 : n.level;
    n.delay = big ? (lvl - 1) * 260 + rnd() * 600
      : n.kind === 'area' ? 150 + n.area * 45
      : 150 + (lvl - 1) * 380 + n.area * 30 + rnd() * 180;
  });
  introAt = performance.now();
  const c = viewCentre();
  const home = { tx: 0, ty: 0, tz: 0, dist: overviewDist, cx: c[0], cy: c[1] };
  if (reduced) { Object.assign(goal, home, { yaw: .7, pitch: -.32 }); Object.assign(cam, goal); }
  else {
    // The camera swings in from above while the graph grows: one orchestrated entry of about three seconds.
    Object.assign(cam, home, { dist: overviewDist * 1.9, yaw: -.6, pitch: -.85 });
    flyTo(home, { dur: 3000, hop: 0, yaw: .7, pitch: -.32 });
  }
  updateSummary();
}
readTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
resize();
load(buildSample());
const start = location.hash.slice(1);
if (start && G.byId.get(start)) setTimeout(() => setFocus(G.byId.get(start)), 2400);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => labelW.clear());
setTimeout(() => document.getElementById('hint').classList.add('gone'), 6000);
requestAnimationFrame(loop);
</script>
