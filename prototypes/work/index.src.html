<meta charset="utf-8">
<title>Studiolo Work</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: the app's shell (58 px rail + main stage) with a proposed fifth destination, Work, and its touchpoints on
   Today, Learn, Commonplace and Loci. Tokens are Studiolo's own (src/styles/tokens.css), as in the photos prototype. */
:root {
  --paper: #f3f3ef; --panel: #fbfbf9; --board: #ebebe6; --line: #dbdbd3;
  --ink: #22303a; --ink-2: #5d6c77; --ink-3: #98a3ab;
  --status-1: #c9d4f1; --status-2: #6e86d0; --status-3: #1e3e9e; --accent: #1e3e9e;
  --accent-soft: #e6ebf8; --accent-strong: #142b73;
  --float: #fbfbf9; --hover: #ecece6; --mat: #e4e4de; --scrim: rgba(243, 243, 239, .74);
  --quote-paper: #faf8f2; --quote-rule: #eae5d9; --note-paper: #faf9f5;
  --warn: #9a3b2e; --warn-soft: #f6e4df; --ok: #2f6b4a; --ok-soft: #e2efe7;
  --pick: #b7791f; --pick-soft: #fbf3df;
  --work: #7a5a2e; --work-soft: #f3ecdf;
  --decision-paper: #f6f3ea; --decision-rule: #c9b48a;
  --on-media: #ffffff; --media-badge: rgba(0, 0, 0, .64);
  --shadow-pic: 0 1px 2px rgba(34, 48, 58, .07), 0 8px 22px rgba(34, 48, 58, .09);
  --shadow-lift: 0 2px 4px rgba(34, 48, 58, .08), 0 16px 36px rgba(34, 48, 58, .15);
  --shadow-float: 0 0 0 1px transparent, 0 1px 2px rgba(34, 48, 58, .06), 0 18px 48px rgba(34, 48, 58, .16);
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur-q: 130ms; --dur-s: 220ms; --dur-m: 380ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
    --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
    --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
    --accent-soft: #263156; --accent-strong: #c3cff8;
    --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim: rgba(19, 26, 32, .82);
    --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
    --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a;
    --work: #d9b57c; --work-soft: #352b1c; --decision-paper: #27251e; --decision-rule: #7d6a45;
    --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
    --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
    --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a20; --panel: #1d272f; --board: #182128; --line: #313d47;
  --ink: #e2e5e0; --ink-2: #9ba7b0; --ink-3: #6b7984;
  --status-1: #4f64a3; --status-2: #7189d8; --status-3: #a9bbf6; --accent: #9db0f3;
  --accent-soft: #263156; --accent-strong: #c3cff8;
  --float: #232e37; --hover: #2a353f; --mat: #0d1317; --scrim: rgba(19, 26, 32, .82);
  --quote-paper: #29271f; --quote-rule: #3f3a2e; --note-paper: #21282c;
  --warn: #ec9c8d; --warn-soft: #3a2521; --ok: #84c9a2; --ok-soft: #1f3329; --pick: #e8c27a; --pick-soft: #33291a;
  --work: #d9b57c; --work-soft: #352b1c; --decision-paper: #27251e; --decision-rule: #7d6a45;
  --shadow-pic: 0 1px 2px rgba(0, 0, 0, .32), 0 8px 22px rgba(0, 0, 0, .26);
  --shadow-lift: 0 2px 4px rgba(0, 0, 0, .34), 0 16px 36px rgba(0, 0, 0, .4);
  --shadow-float: 0 0 0 1px rgba(255, 255, 255, .05), 0 18px 48px rgba(0, 0, 0, .42);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-q: 1ms; --dur-s: 1ms; --dur-m: 1ms; } }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { text-wrap: balance; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.rail { position: fixed; inset: 0 auto 0 0; width: 58px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); border-right: 1px solid var(--line); background: var(--paper); z-index: 20; }
.rail .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 500 17px var(--read); margin-bottom: 20px; }
.rail button { all: unset; width: 40px; height: 36px; display: grid; place-items: center; border-radius: 4px; color: var(--ink-2); cursor: pointer; position: relative; }
.rail button:hover { background: var(--hover); color: var(--ink); }
.rail button[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.rail button:focus-visible { outline: 2px solid var(--accent); }
.rail button .tip { position: absolute; left: 48px; top: 50%; transform: translateY(-50%); background: var(--ink); color: var(--paper); font-size: 12px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--dur-q); }
.rail button:hover .tip, .rail button:focus-visible .tip { opacity: 1; }
.rail .newdot { position: absolute; right: 4px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--work); }
.rail .grow { flex: 1; }
.rail .me { width: 26px; height: 26px; border-radius: 50%; background: var(--board); font-size: 11px; font-weight: 500; display: grid; place-items: center; }
.rail svg { width: 18px; height: 18px; }
.stage { margin-left: 58px; min-width: 0; padding-block: 32px 140px; padding-left: max(44px, env(safe-area-inset-left, 0px)); padding-right: max(44px, env(safe-area-inset-right, 0px)); max-width: 1440px; }
.dest-head { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; color: var(--ink-2); margin: 0 0 14px; flex-wrap: wrap; }
.dest-head b { color: var(--ink); font-weight: 500; }
.dest-head button { all: unset; cursor: pointer; color: var(--ink); font-weight: 500; }
.dest-head button:hover { text-decoration: underline; }
.dest-head .sep { color: var(--ink-3); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 26px; overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; cursor: pointer; padding: 7px 12px 9px; font-size: 13.5px; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 500; border-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.tabs .n { color: var(--ink-3); font-size: 12px; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* ---------- atoms ---------- */
.btn { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 13px; border-radius: 4px; font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:focus-visible { outline: 2px solid var(--accent); }
.btn.line { box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); }
.btn.line:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--paper); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn.tiny { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.quiet { color: var(--ink-2); font-weight: 400; }
.btn.link { height: auto; padding: 0; color: var(--accent); font-weight: 500; }
.btn.link:hover { background: none; text-decoration: underline; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.seg { display: inline-flex; background: var(--board); padding: 3px; border-radius: 8px; gap: 2px; }
.seg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(34, 48, 58, .08); }
.seg button:focus-visible { outline: 2px solid var(--accent); }
.new { display: inline-block; font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--work); background: var(--work-soft); padding: 1px 5px; border-radius: 3px; vertical-align: 2px; margin-left: 6px; }
.kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin: 0; font-weight: 500; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sdot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--ink-3); display: inline-block; flex: none; }
.sdot.s1 { background: var(--status-1); border-color: var(--status-1); }
.sdot.s2 { background: var(--status-3); border-color: var(--status-3); }
.tchip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 8px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-size: 12px; color: var(--ink); white-space: nowrap; }
.tchip:hover { background: var(--hover); }
.tchip.gap { box-shadow: inset 0 0 0 1px var(--warn); color: var(--warn); background: transparent; border-style: dashed; }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; }
.state { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 3px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.state.open { background: var(--board); color: var(--ink-2); }
.state.exploring { background: var(--accent-soft); color: var(--accent-strong); }
.state.decided { background: var(--ok-soft); color: var(--ok); }
.state.parked { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.src { font-size: 11.5px; color: var(--ink-2); }
.src b { font-weight: 500; color: var(--ink); }
.cite { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--accent); white-space: nowrap; }
.cite:hover { text-decoration: underline; }
.cite img, .cite .sw { width: 18px; height: 18px; border-radius: 3px; object-fit: cover; flex: none; background: var(--mat); }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; flex-wrap: wrap; }
.section-h h3 { margin: 0; font-size: 14px; font-weight: 600; }
.section-h .muted { font-size: 12.5px; }

/* ---------- Work home ---------- */
.w-hero { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 40px; align-items: start; margin-bottom: 36px; }
.w-ask h1 { font: 400 30px/1.2 var(--read); margin: 0 0 14px; letter-spacing: -.005em; }
.askbox { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 7px 0 18px; border-radius: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.askbox:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 4px var(--accent-soft); }
.askbox input { flex: 1; min-width: 0; border: 0; background: transparent; font: 19px/1.2 var(--read); height: 44px; }
.askbox input:focus { outline: none; }
.askbox input::placeholder { color: var(--ink-2); }
.ask-hint { font-size: 12.5px; color: var(--ink-2); margin: 10px 2px 0; }
.ask-hint button { all: unset; cursor: pointer; color: var(--accent); }
.ask-hint button:hover { text-decoration: underline; }
.next-card { background: var(--panel); border-left: 3px solid var(--accent); padding: 18px 20px 18px 22px; box-shadow: inset 0 0 0 1px var(--line); border-radius: 0 6px 6px 0; }
.next-card .kicker { margin-bottom: 6px; }
.next-card h3 { font: 400 21px/1.3 var(--read); margin: 0 0 8px; }
.next-card .meta { font-size: 12.5px; color: var(--ink-2); margin: 0 0 14px; }
.next-card .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; margin-bottom: 40px; }
.pcard { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.pcard .cover { position: relative; aspect-ratio: 16 / 10; border-radius: 6px; overflow: hidden; background: var(--mat); box-shadow: var(--shadow-pic); transition: transform var(--dur-s) var(--ease), box-shadow var(--dur-s) var(--ease); }
.pcard .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pcard:hover .cover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.pcard:focus-visible .cover { outline: 2px solid var(--accent); outline-offset: 3px; }
.pcard .cover .badge { position: absolute; left: 10px; top: 10px; background: var(--media-badge); color: var(--on-media); font-size: 11.5px; padding: 2px 7px; border-radius: 3px; }
.pcard h3 { font: 400 19px/1.25 var(--read); margin: 0; }
.pcard .meta { font-size: 12.5px; color: var(--ink-2); }
.stages { display: flex; gap: 3px; }
.stages i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.stages i.done { background: var(--status-2); }
.stages i.now { background: var(--accent); }
.pcard.newp .cover { display: grid; place-items: center; background: transparent; box-shadow: inset 0 0 0 1px var(--line); border: 1px dashed var(--ink-3); color: var(--ink-2); font-size: 13.5px; }
.loopwrap { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 36px; align-items: center; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); border-radius: 8px; padding: 24px 28px; margin-bottom: 36px; }
.loopwrap h2 { font: 400 22px/1.25 var(--read); margin: 0 0 8px; }
.loopwrap p { margin: 0 0 12px; color: var(--ink-2); max-width: 62ch; }
.loop-svg { width: 100%; height: auto; display: block; }
.loop-svg .node circle { fill: var(--paper); stroke: var(--line); stroke-width: 1.2; }
.loop-svg .node.work circle { stroke: var(--work); stroke-width: 1.6; }
.loop-svg .node text { fill: var(--ink); font: 500 13px var(--ui); text-anchor: middle; }
.loop-svg .node .sub { fill: var(--ink-2); font: 400 10.5px var(--ui); }
.loop-svg .edge path { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }
.loop-svg .edge.nw path { stroke: var(--work); stroke-width: 1.6; }
.loop-svg .spoke { fill: none; stroke: var(--status-2); stroke-width: 1; stroke-dasharray: 2 4; opacity: .7; }
.loop-svg .edge text { fill: var(--ink-2); font: 400 13px var(--ui); }
.loop-svg .edge.nw text { fill: var(--work); font-weight: 500; }
.loop-svg .edge { cursor: pointer; }
.loop-svg .edge path.hit, .loop-svg .edge:hover path.hit, .loop-svg .edge.on path.hit { stroke: transparent; stroke-width: 16; }
.loop-svg .edge:focus-visible { outline: none; }
.loop-svg .edge:focus-visible text { text-decoration: underline; }
.loop-svg .edge:hover path, .loop-svg .edge.on path { stroke-width: 2.6; }
.loop-svg .edge.on text { fill: var(--ink); }
.loop-svg .core circle { fill: var(--accent-soft); stroke: none; }
.loop-svg .core text { fill: var(--accent-strong); font: 500 12px var(--ui); text-anchor: middle; }
.loop-svg .core .sub { font: 400 10px var(--ui); fill: var(--accent-strong); opacity: .8; }
.loop-svg marker path { fill: var(--ink-3); }
.loop-svg marker.nw path { fill: var(--work); }
.edge-note { min-height: 92px; padding: 14px 16px; border-radius: 6px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; }
.edge-note b { font-weight: 600; }
.edge-note .where { color: var(--ink-2); font-size: 12.5px; margin-top: 4px; }
.loopstats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; }
.loopstats div { display: flex; flex-direction: column; }
.loopstats b { font: 400 24px/1 var(--read); font-variant-numeric: tabular-nums; }
.loopstats span { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.projectish { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); background: var(--panel); flex-wrap: wrap; }
.projectish p { margin: 0; flex: 1; min-width: 220px; font-size: 13px; }

/* ---------- project ---------- */
.p-head { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 22px; flex-wrap: wrap; }
.p-head .cv { width: 112px; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--mat); flex: none; box-shadow: var(--shadow-pic); }
.p-head .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.p-head .tt { flex: 1; min-width: 240px; }
.p-head h1 { font: 400 30px/1.15 var(--read); margin: 2px 0 8px; }
.p-head .sub { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.p-head .stages { max-width: 320px; margin-top: 10px; }
.p-head .stagelbl { display: flex; max-width: 320px; font-size: 10.5px; color: var(--ink-3); margin-top: 5px; }
.p-head .stagelbl span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-head .stagelbl span.now { color: var(--accent); font-weight: 600; }
.p-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.ov { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
.ov-main { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.brief p { font: 400 17px/1.55 var(--read); margin: 0; max-width: 68ch; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.facts div { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.facts dt { font-size: 11.5px; color: var(--ink-2); margin-bottom: 2px; }
.facts dd { margin: 0; font-size: 13.5px; }
.side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.sidebox { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); border-radius: 6px; padding: 16px 18px; }
.sidebox h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sidebox h4 .btn { font-weight: 500; }
.loopmini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.loopmini button { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 5px; background: var(--paper); }
.loopmini button:hover { background: var(--hover); }
.loopmini b { font: 400 22px/1 var(--read); font-variant-numeric: tabular-nums; }
.loopmini span { font-size: 11.5px; color: var(--ink-2); }
.loopmini .lbl { font-size: 12px; color: var(--ink); font-weight: 500; }
.uselist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.uselist li { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
.uselist li:last-child { border-bottom: 0; }
.uselist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uselist .ct { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.uselist .gapline { color: var(--warn); }

/* questions */
.qlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.qrow { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 6px; border-bottom: 1px solid var(--line); }
.qrow:hover { background: var(--hover); }
.qrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.qrow h3 { font: 400 17.5px/1.35 var(--read); margin: 0 0 6px; }
.qrow .meta { font-size: 12px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.qrow .counts { font-size: 12px; color: var(--ink-3); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--float); box-shadow: var(--shadow-float); z-index: 40; display: flex; flex-direction: column; padding: calc(20px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) 22px; animation: slidein var(--dur-m) var(--ease); }

.draft { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px 28px; }
.draft .full { grid-column: 1 / -1; }
.draft h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; }

.draft label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.draft input[type=checkbox] { accent-color: var(--accent); margin-top: 3px; }
.dref { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
.dref .th { width: 44px; height: 34px; border-radius: 4px; overflow: hidden; background: var(--mat); }

.because { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

/* quick view (commonplace) */
